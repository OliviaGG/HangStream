<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Roboto+Mono:wght@500;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* Stack pinned to bottom — newest event slides in from the bottom and
   pushes older entries up. Max 3 rows by design; a 4th arrival evicts
   the oldest off the top. No auto-fade — items live until pushed off. */
#stack {
  position: fixed;
  left: 0; right: 0; bottom: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0 12px;
  pointer-events: none;
}

.row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  min-height: 56px;
  background: linear-gradient(135deg, rgba(20,22,30,0.92) 0%, rgba(12,14,20,0.92) 100%);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
  overflow: hidden;
  /* Entrance: slide up + fade */
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.3s ease, transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.row.show { opacity: 1; transform: translateY(0); }
.row.eviction {
  /* When a 4th row arrives, the topmost row briefly slides up + fades. */
  opacity: 0;
  transform: translateY(-20px);
  transition: opacity 0.32s ease, transform 0.32s ease;
}

/* hero_badge cosmetic backdrop — full-row painted layer behind content. */
.row .hero {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.85;
  background-size: cover;
  background-position: center;
  mix-blend-mode: screen;
}
.row > *:not(.hero) { position: relative; z-index: 1; }

/* Game icon (left) — letter fallback always rendered, img overlays on top
   and removes itself via onerror if the icon URL fails to load. */
.row .game-icon {
  width: 32px; height: 32px;
  flex-shrink: 0;
  border-radius: 8px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.row .game-icon-letter {
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0;
}
.row .game-icon-img {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}

/* Profile pic — initial-letter avatar always rendered; <img> overlays on top
   and removes itself if the URL fails (broken/expired TikTok signed URLs etc). */
.row .pfp-wrap {
  width: 40px; height: 40px;
  flex-shrink: 0;
  border-radius: 50%;
  position: relative;
}
.row .pfp {
  width: 100%; height: 100%;
  border-radius: 50%;
  background: #2A2A2A;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Orbitron', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: #fff;
}
.row .pfp-img {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}

/* Middle text block */
.row .info {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  overflow: hidden;
}
.row .name {
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row .verb {
  font-family: 'Roboto Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.5px;
  color: rgba(255,255,255,0.7);
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row .verb .accent {
  color: #FF6600;
  font-weight: 700;
}

/* Right side: value + total wins badge */
.row .right {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}
.row .value {
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 16px;
  color: #FF6600;
  text-shadow: 0 0 10px rgba(255,102,0,0.45);
  line-height: 1;
}
.row .value-label {
  font-family: 'Roboto Mono', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  color: rgba(255,255,255,0.55);
  text-transform: uppercase;
  line-height: 1;
}
.row .total-wins {
  font-family: 'Roboto Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  color: #FFD93D;
  background: rgba(255,217,61,0.12);
  border: 1px solid rgba(255,217,61,0.3);
  border-radius: 999px;
  padding: 1px 6px;
  margin-top: 2px;
  white-space: nowrap;
}

/* Event-type accents on the left edge bar. */
.row.win      { border-left: 3px solid #6BCB77; }
.row.jackpot  { border-left: 3px solid #FFD93D; }
.row.daily    { border-left: 3px solid #4D96FF; }
.row.streak   { border-left: 3px solid #FF5DA2; }
.row.jackpot .value { color: #FFD93D; text-shadow: 0 0 12px rgba(255,217,61,0.55); }
.row.daily   .value { color: #4D96FF; text-shadow: 0 0 12px rgba(77,150,255,0.55); }
.row.streak  .value { color: #FF5DA2; text-shadow: 0 0 12px rgba(255,93,162,0.55); }
</style>
</head>
<body>

<div id="stack"></div>

<link rel="stylesheet" href="/css/cosmetics-fx.css?v=3">
<script src="/js/pfp-cosmetics.js?v=15"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
  // Game-icon URL map. Most games serve /icon.png at their root, proxied via
  // chat-relay's game proxy as /game/<gameId>/icon.png. Falls back to a
  // letter avatar if the image fails to load.
  const GAME_ICONS = {
    searchle:     '/game/searchle/icon.png',
    wordle:       '/game/wordle/icon.png',
    word500:      '/game/word500/icon.png',
    word5000:     '/game/word5000/icon.png',
    sproutle:     '/game/sproutle/icon.png',
    erectangled:  '/game/sproutle/icon.png',
    rectangled:   '/game/rectangled/icon.png',
    spellingbee:  '/game/spellingbee/icon.png',
    betweenly:    '/game/betweenly/icon.png',
    betwixt:      '/game/betwixt/icon.png',
    figural:      '/game/figural/icon.png',
    pixeletters:  '/game/pixeletters/icon.png',
    wordmine:     '/game/wordmine/icon.png',
    unwordle:     '/game/unwordle/icon.png',
    wikiword:     '/game/wikiword/icon.png',
    wikisearchle: '/game/wikisearchle/icon.png',
    triangled:    '/game/triangled/icon.png',
    wikirectangled: '/game/wikirectangled/icon.png',
    synapse:      '/portal/img/game-synapse.png',
    junkdrawer:   '/portal/img/game-junkdrawer.png',
  };
  const PLATFORM_COLORS = { tiktok: '#FF0050', youtube: '#FF0000', discord: '#5865F2', web: '#666' };

  const MAX_ROWS = 6;
  const stack = document.getElementById('stack');

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function fmtNumber(n) {
    if (n == null) return '';
    if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 10_000)   return Math.round(n / 1000) + 'K';
    if (n >= 1000)     return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(n);
  }

  function verbLine(payload) {
    const game = `<span class="accent">${escapeHtml(payload.gameName || payload.game)}</span>`;
    switch (payload.eventType) {
      case 'jackpot': return `won the ${game} jackpot`;
      case 'win':     return `won ${game}`;
      case 'daily':   return `cleared ${game} daily`;
      case 'streak':  return `${game} streak`;
      default:        return escapeHtml(payload.eventType || '');
    }
  }

  function buildRow(payload) {
    const user = payload.user || {};
    const initial = (user.displayName || '?').charAt(0).toUpperCase();
    const platform = (user.platform || '').toLowerCase();
    const platformColor = PLATFORM_COLORS[platform] || '#444';
    const iconUrl = GAME_ICONS[payload.game] || '';

    const valueHtml = (payload.value != null)
      ? `<div class="value">${escapeHtml(payload.valueLabel === 'coins' || payload.valueLabel === 'pts' ? fmtNumber(payload.value) : payload.valueLabel)}</div>` +
        (payload.valueLabel && (payload.valueLabel === 'coins' || payload.valueLabel === 'pts')
          ? `<div class="value-label">${escapeHtml(payload.valueLabel)}</div>` : '')
      : '';
    const totalWinsHtml = (typeof payload.totalWins === 'number' && payload.totalWins > 0)
      ? `<div class="total-wins">${escapeHtml(fmtNumber(payload.totalWins))} wins</div>`
      : '';

    // Pfp: initial-letter background ALWAYS rendered; image overlays on top
    // via <img>, falls back to the initial letter if the URL fails to load.
    // Same pattern for the game icon — letter fallback if icon URL 404s.
    const pfpImg = user.profilePic
      ? `<img class="pfp-img" src="${escapeHtml(user.profilePic)}" alt="" onerror="this.remove()">`
      : '';
    const gameIconImg = iconUrl
      ? `<img class="game-icon-img" src="${iconUrl}" alt="" onerror="this.remove()">`
      : '';
    const gameLetter = (payload.gameName || payload.game || '?').charAt(0).toUpperCase();

    const row = document.createElement('div');
    row.className = 'row ' + (payload.eventType || '');
    row.innerHTML =
      `<div class="hero" data-hero></div>` +
      `<div class="game-icon"><span class="game-icon-letter">${escapeHtml(gameLetter)}</span>${gameIconImg}</div>` +
      `<div class="pfp-wrap" data-pfp-wrap>` +
        `<div class="pfp" data-pfp style="background:${platformColor};">${escapeHtml(initial)}${pfpImg}</div>` +
      `</div>` +
      `<div class="info">` +
        `<div class="name" data-name>${escapeHtml(user.displayName || 'Someone')}</div>` +
        `<div class="verb">${verbLine(payload)}</div>` +
      `</div>` +
      `<div class="right">${valueHtml}${totalWinsHtml}</div>`;

    applyCosmetics(row, user.cosmetics);
    return row;
  }

  function applyCosmetics(row, cosmetics) {
    if (!cosmetics) return;
    const pfpWrap = row.querySelector('[data-pfp-wrap]');
    const nameEl = row.querySelector('[data-name]');
    const heroEl = row.querySelector('[data-hero]');

    const nameColor = cosmetics.name_color && cosmetics.name_color.color;
    if (nameColor && nameEl) nameEl.style.color = nameColor;
    // name_glow ships a textShadow, never a `color` key.
    const nameGlow = cosmetics.name_glow && cosmetics.name_glow.textShadow;
    if (nameGlow && nameEl) nameEl.style.textShadow = nameGlow;

    // profile_border / profile_glow. This surface read a `color` key the
    // catalog has never emitted, so rings and glows rendered as nothing.
    const pfpEl = row.querySelector('[data-pfp]');
    if (window.PfpCosmetics && pfpWrap) {
      window.PfpCosmetics.apply(pfpEl, pfpWrap, cosmetics);
    }

    // hero_badge — full-row backdrop. Accepts:
    //   { url } for an image, or { color } for a tinted gradient fallback.
    const hero = cosmetics.hero_badge;
    if (hero && heroEl) {
      if (hero.url) {
        heroEl.style.backgroundImage = `url("${hero.url}")`;
      } else if (hero.color) {
        heroEl.style.background = `linear-gradient(120deg, ${hero.color}55 0%, transparent 75%)`;
      }
      if (hero.animation) heroEl.style.animation = hero.animation;
    }
  }

  function appendRow(payload) {
    const row = buildRow(payload);
    stack.appendChild(row);

    // Evict oldest if we exceed MAX_ROWS.
    if (stack.children.length > MAX_ROWS) {
      const oldest = stack.firstElementChild;
      if (oldest) {
        oldest.classList.add('eviction');
        setTimeout(() => oldest.remove(), 360);
      }
    }

    requestAnimationFrame(() => row.classList.add('show'));
  }

  // ── Socket wiring ────────────────────────────────────────
  if (typeof io === 'function') {
    const socket = io({ transports: ['websocket'] });
    socket.on('connect', () => socket.emit('join-activity-overlay'));
    socket.on('activity-event', appendRow);
  }

  // ── Smoke test (URL-only) ────────────────────────────────
  window.__activityTest = function () {
    const discordPfp = 'https://cdn.discordapp.com/embed/avatars/0.png';
    const brokenPfp  = 'https://example.invalid/broken.png';
    appendRow({ ts: Date.now(), game: 'wikisearchle', gameName: 'WikiContexto', eventType: 'win',     value: 1240, valueLabel: 'pts',  totalWins: 12, user: { displayName: 'PixelQueen',   platform: 'tiktok',  profilePic: discordPfp } });
    setTimeout(() => appendRow({ ts: Date.now(), game: 'searchle',     gameName: 'Subtextle',     eventType: 'jackpot', value: 24500, valueLabel: 'coins', totalWins: 47,  user: { displayName: 'StreamSurfer', platform: 'youtube', profilePic: brokenPfp } }), 700);
    setTimeout(() => appendRow({ ts: Date.now(), game: 'wikisearchle', gameName: 'WikiContexto', eventType: 'streak',  value: 5,     valueLabel: '×5',   totalWins: null, user: { displayName: 'StreakKing',   platform: 'tiktok',  profilePic: null } }), 1500);
    setTimeout(() => appendRow({ ts: Date.now(), game: 'wordle',       gameName: 'Wordle',       eventType: 'daily',   value: null,  valueLabel: null,   totalWins: 3,    user: { displayName: 'DailyDan',     platform: 'discord', profilePic: discordPfp } }), 2400);
  };
})();
</script>
  <script src="/js/hangstream-brand.js" defer></script>
</body>
</html>
