<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2000, initial-scale=1">
<title>WiKirecTangled - Vertical Ad</title>
<style>
  @import url('/fonts/ad-fonts.css');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --tone-a: #ee7a2c;
    --tone-b: #c95f1d;
    --tone-c: #f49a55;
    --tone-d: #d96a1f;
    --glow-a: rgba(238,122,44,0.6);
  }

  html, body {
    width: 2000px;
    height: 2000px;
    overflow: hidden;
    background: linear-gradient(180deg, #0a1628 0%, #0f1f3d 25%, #0c1a33 50%, #081224 75%, #0a1628 100%);
    font-family: 'Outfit', 'Segoe UI', Arial, sans-serif;
    transition: background 1.5s ease, background-size 1.5s ease;
  }

  .ripple-layer {
    position: fixed;
    top: 0; left: 0;
    width: 2000px; height: 2000px;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .ripple-layer canvas {
    width: 2000px;
    height: 2000px;
  }

  .ad-strip {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 2000px;
    overflow: hidden;
    z-index: 5;
  }

  .scroll-inner {
    display: flex;
    flex-direction: column;
    animation: scrollUp 200s linear infinite;
    will-change: transform;
  }

  @keyframes scrollUp {
    0%   { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }

  .scroll-inner > div {
    background: transparent !important;
  }

  .v-letter,
  .v-word {
    width: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-transform: uppercase;
    line-height: 1;
    text-shadow:
      0 2px 8px rgba(0, 0, 0, 0.55),
      0 0 20px rgba(255, 255, 255, 0.08);
  }

  .v-letter {
    font-size: 58px;
    font-weight: 900;
    padding: 6px 0;
    transition: color 1.5s ease, text-shadow 1.5s ease;
  }

  .v-letter.www { opacity: 0.35; }
  .v-letter.dot { font-size: 40px; padding: 2px 0; opacity: 0.35; }
  .v-letter.tld { font-size: 42px; }

  .v-word {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    letter-spacing: 1.4px;
    padding: 16px 0;
    transition: color 1.5s ease, text-shadow 1.5s ease;
  }
  .v-word.big { font-size: 26px; }
  .v-word.small { font-size: 21px; }
  .v-word.tiny { font-size: 18px; letter-spacing: 1px; padding: 12px 0; }

  .tone-a { color: var(--tone-a); text-shadow: 0 0 18px var(--glow-a), 0 2px 8px rgba(0,0,0,0.55); }
  .tone-b { color: var(--tone-b); text-shadow: 0 0 18px var(--glow-a), 0 2px 8px rgba(0,0,0,0.55); }
  .tone-c { color: var(--tone-c); text-shadow: 0 0 18px var(--glow-a), 0 2px 8px rgba(0,0,0,0.55); }
  .tone-d { color: var(--tone-d); text-shadow: 0 0 18px var(--glow-a), 0 2px 8px rgba(0,0,0,0.55); }

  .ad-logo-row {
    width: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 0;
  }

  .ad-logo-row img {
    width: 80px;
    height: 80px;
    border-radius: 22px;
    object-fit: cover;
    filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.28));
    transition: filter 1.5s ease;
  }

  .spacer { height: 80px; }

  .diag-section {
    width: 100px;
    height: 300px;
    position: relative;
    overflow: hidden;
  }

  .diag-ribbon {
    position: absolute;
    left: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 86px;
    min-height: 58px;
    padding: 9px 8px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 18px;
    background: rgba(7, 18, 34, 0.45);
    box-shadow:
      0 12px 24px rgba(0, 0, 0, 0.28),
      inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    font-family: 'Fredoka', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    line-height: 1;
    text-transform: uppercase;
    text-align: center;
    transform-origin: center;
    transition: color 1.5s ease, text-shadow 1.5s ease;
  }

  .diag-ribbon.short { font-size: 18px; letter-spacing: 0.3px; }
  .diag-ribbon.medium { font-size: 17px; letter-spacing: 0.4px; }

  .diag-ribbon.tone-a { color: var(--tone-a); text-shadow: 0 0 14px var(--glow-a), 0 2px 8px rgba(0,0,0,0.55); }
  .diag-ribbon.tone-b { color: var(--tone-b); text-shadow: 0 0 14px var(--glow-a), 0 2px 8px rgba(0,0,0,0.55); }
  .diag-ribbon.tone-c { color: var(--tone-c); text-shadow: 0 0 14px var(--glow-a), 0 2px 8px rgba(0,0,0,0.55); }
  .diag-ribbon.tone-d { color: var(--tone-d); text-shadow: 0 0 14px var(--glow-a), 0 2px 8px rgba(0,0,0,0.55); }

  .r1 { top: 28px; transform: translateX(-50%) rotate(-18deg); }
  .r2 { top: 130px; transform: translateX(-50%) rotate(16deg); }
  .r3 { top: 208px; transform: translateX(-50%) rotate(-14deg); }

  @keyframes ov-gradient-flow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Mirrored from /css/cosmetics-fx.css — this overlay does not link that
     stylesheet, so any cfx-* name a cosmetic hands us must resolve here.
     Keep cfx-drift's offsets in step with the tile sizes in cosmetics.js. */
  @keyframes cfx-drift {
    0%   { background-position: 0px 0px, 0px 0px, 0px 0px, 0px 0px; }
    100% { background-position: -440px 220px, -280px 140px, -180px 90px, -120px 60px; }
  }

  @keyframes cfx-breath {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.3); }
  }

  .hero-flash {
    position: fixed;
    top: 0; left: 0;
    width: 2000px; height: 2000px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease;
    z-index: 10;
    mix-blend-mode: soft-light;
  }
  .hero-flash.active { opacity: 0.35; transition: opacity 0.5s ease; }

<script src="/socket.io/socket.io.js"></script>
<script>
(function() {
  'use strict';

  const DEFAULT_THEME = {
    toneA: '#7d9dcc', toneB: '#6e8ab7', toneC: '#94aed4', toneD: '#8a9ec8',
    glowA: 'rgba(125,157,204,0.6)',
    ripple: [14, 30, 55]
  };

  const DEFAULT_BG = 'linear-gradient(180deg, #0a1628 0%, #0f1f3d 25%, #0c1a33 50%, #081224 75%, #0a1628 100%)';

  const root = document.documentElement;
  const body = document.body;
  let currentRipple = [...DEFAULT_THEME.ripple];
  let targetRipple = [...DEFAULT_THEME.ripple];

  function extractColor(str) {
    const hexes = str.match(/#([0-9a-fA-F]{6})/g);
    if (hexes) {
      let best = null, bestBright = 0;
      for (const hex of hexes) {
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);
        const bright = r + g + b;
        if (bright > bestBright && bright > 40) { best = [r, g, b]; bestBright = bright; }
      }
      if (best) return best;
    }
    const rgbMatch = str.match(/rgba?\(\s*(\d+),\s*(\d+),\s*(\d+)/);
    if (rgbMatch) return [+rgbMatch[1], +rgbMatch[2], +rgbMatch[3]];
    return null;
  }

  function normalizeColor(r, g, b) {
    const peak = Math.max(r, g, b);
    if (peak <= 0) return [128, 128, 128];
    const scale = 255 / peak;
    return [Math.round(r * scale), Math.round(g * scale), Math.round(b * scale)];
  }

  function tonesFromColor(r, g, b) {
    const hex = (v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
    const toneA = '#' + hex(r * 0.85) + hex(g * 0.85) + hex(b * 0.85);
    const toneB = '#' + hex(r * 0.70) + hex(g * 0.70) + hex(b * 0.70);
    const toneC = '#' + hex(r * 0.95) + hex(g * 0.95) + hex(b * 0.95);
    const toneD = '#' + hex(r * 0.75) + hex(g * 0.75) + hex(b * 0.75);
    const glowA = `rgba(${Math.round(r * 0.85)},${Math.round(g * 0.85)},${Math.round(b * 0.85)},0.6)`;
    const ripple = [Math.round(r * 0.15), Math.round(g * 0.15), Math.round(b * 0.15)];
    return { toneA, toneB, toneC, toneD, glowA, ripple };
  }

  function applyTones(tones) {
    root.style.setProperty('--tone-a', tones.toneA);
    root.style.setProperty('--tone-b', tones.toneB);
    root.style.setProperty('--tone-c', tones.toneC);
    root.style.setProperty('--tone-d', tones.toneD);
    root.style.setProperty('--glow-a', tones.glowA);
    targetRipple = tones.ripple;
  }

  function resetToDefault() {
    body.style.background = DEFAULT_BG;
    body.style.backgroundSize = '';
    body.style.animation = '';
    applyTones(DEFAULT_THEME);
  }

  function applyWinnerBadge(cosmetics) {
    if (!cosmetics) { resetToDefault(); return; }
  
    // Cosmetics may be flat (cosmetics.hero_badge) or wrapped (cosmetics.equipped.hero_badge).
    // Unwrap once so the rest of the function can read a single flat object.
    const cos = cosmetics.equipped || cosmetics;
    const badge = cos.hero_badge;
    const nameColor = cos.name_color;
    const nameGlow = cos.name_glow;
  
    // If none of the three supported cosmetics are present, go back to default.
    if (!badge && !nameColor && !nameGlow) { resetToDefault(); return; }
  
    // Start from a clean baseline so partial cosmetics don't inherit stale state.
    body.style.background = DEFAULT_BG;
    body.style.backgroundSize = '';
    body.style.animation = '';
    applyTones(DEFAULT_THEME);
  
    // ── 1. Hero badge → body background ─────────────────────────────────
    let badgeBg = null;
    if (badge) {
      badgeBg = badge.background || badge.css?.background;
      if (badgeBg) {
        body.style.background = badgeBg;
        const bgSize = badge.backgroundSize || badge.css?.backgroundSize;
        if (bgSize) body.style.backgroundSize = bgSize;
        const anim = badge.animation || badge.css?.animation;
        if (anim) body.style.animation = anim;
      }
    }
  
    // ── 2. Name color → URL letter tones ────────────────────────────────
    // name_color is authoritative for the URL letters. Only fall back to
    // extracting from the hero_badge gradient when name_color is absent.
    let tonesSource = null;
    if (nameColor && nameColor.color) {
      tonesSource = extractColor(nameColor.color);
    }
    if (!tonesSource && badgeBg) {
      tonesSource = extractColor(badgeBg);
    }
    if (tonesSource) {
      const norm = normalizeColor(tonesSource[0], tonesSource[1], tonesSource[2]);
      const tones = tonesFromColor(norm[0], norm[1], norm[2]);
      applyTones(tones);
    }
  
    // ── 3. Name glow → URL letter glow color ────────────────────────────
    // name_glow.textShadow is a CSS text-shadow declaration. We extract the
    // dominant color from it and use it as --glow-a so the existing blur/
    // offset structure is preserved but the glow color matches the winner.
    if (nameGlow && nameGlow.textShadow) {
      const glowRgb = extractColor(nameGlow.textShadow);
      if (glowRgb) {
        root.style.setProperty('--glow-a', 'rgba(' + glowRgb[0] + ',' + glowRgb[1] + ',' + glowRgb[2] + ',0.6)');
      }
    }
  
    // ── 4. Brief flash — only when we have a hero badge to flash ───────
    if (badgeBg) {
      const flash = document.getElementById('hero-flash');
      if (flash) {
        flash.style.background = badgeBg;
        const bgSize = badge.backgroundSize || badge.css?.backgroundSize;
        if (bgSize) flash.style.backgroundSize = bgSize;
        flash.classList.add('active');
        setTimeout(() => flash.classList.remove('active'), 4000);
      }
    }
  }

  const canvas = document.getElementById('ripple-canvas');
  const ctx = canvas.getContext('2d');
  const W = 2000, H = 2000;

  function drawRipple(t) {
    for (let i = 0; i < 3; i++) {
      currentRipple[i] += (targetRipple[i] - currentRipple[i]) * 0.01;
    }
    const r = currentRipple[0], g = currentRipple[1], b = currentRipple[2];

    ctx.clearRect(0, 0, W, H);

    const blobs = [
      { cx: 400, cy: 400, rx: 350, ry: 320, speed: 0.0004, phase: 0 },
      { cx: 1000, cy: 1000, rx: 320, ry: 380, speed: 0.0003, phase: 1.5 },
      { cx: 300, cy: 1500, rx: 380, ry: 340, speed: 0.00035, phase: 3.0 },
      { cx: 1600, cy: 400, rx: 300, ry: 350, speed: 0.00025, phase: 4.5 },
      { cx: 700, cy: 1700, rx: 340, ry: 300, speed: 0.00032, phase: 2.2 },
      { cx: 1500, cy: 1400, rx: 360, ry: 330, speed: 0.00028, phase: 5.0 },
    ];

    for (const bl of blobs) {
      const ox = Math.sin(t * bl.speed + bl.phase) * 80;
      const oy = Math.cos(t * bl.speed * 0.7 + bl.phase) * 60;
      const x = bl.cx + ox;
      const y = bl.cy + oy;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, bl.rx);
      grad.addColorStop(0, `rgba(${r + 15}, ${g + 15}, ${b + 15}, 0.06)`);
      grad.addColorStop(0.5, `rgba(${r + 8}, ${g + 8}, ${b + 8}, 0.03)`);
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(x, y, bl.rx, bl.ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(drawRipple);
  }
  requestAnimationFrame(drawRipple);

  resetToDefault();

  const socket = io({ transports: ['websocket'] });
  // Streamer-scoped: when wrapper passes ?streamer=<h>, join the per-streamer
  // win room so this overlay only reacts to that streamer's wins (cosmetics,
  // names, avatars stay scoped to their session).
  var _adStreamer = (function() {
    try { return (new URLSearchParams(location.search).get('streamer') || '').trim().toLowerCase() || ''; }
    catch (_) { return ''; }
  })();
  socket.on('connect', () => _adStreamer
    ? socket.emit('join-streamer-win-overlay', _adStreamer)
    : socket.emit('join-win-overlay'));

  socket.on('game-win', (data) => {
    if (data.winner?.cosmetics) {
      applyWinnerBadge(data.winner.cosmetics);
    } else {
      resetToDefault();
    }
  });
})();
</script>
