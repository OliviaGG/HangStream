<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jackpot Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f14;
    --surface: #1a1a24;
    --border: #2a2a3a;
    --text: #e0e0e0;
    --text-dim: #888;
    --blue: #4a9eff;
    --blue-hover: #3a8eef;
    --red: #e94560;
    --red-hover: #d93550;
    --green: #4fc34f;
    --radius: 10px;
    --radius-sm: 6px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .header .back {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 14px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    transition: all 0.2s;
  }

  .header .back:hover {
    color: var(--text);
    border-color: var(--text-dim);
  }

  .header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
    padding: 24px 28px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: box-shadow 0.25s, opacity 0.3s;
  }

  .card:hover {
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
  }

  .card.offline {
    opacity: 0.5;
  }

  .card-accent {
    height: 4px;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 18px 12px;
  }

  .card-emoji {
    font-size: 22px;
    line-height: 1;
  }

  .card-name {
    font-size: 16px;
    font-weight: 600;
    flex: 1;
  }

  /* ── Badge ── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  .badge.online {
    background: rgba(79, 195, 79, 0.15);
    color: var(--green);
  }

  .badge.online .dot {
    background: var(--green);
  }

  .badge.offline-badge {
    background: rgba(136, 136, 136, 0.15);
    color: var(--text-dim);
  }

  .badge.offline-badge .dot {
    background: var(--text-dim);
  }

  .card-body {
    padding: 0 18px 18px;
  }

  /* ── Toggle row ── */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .toggle-label {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 500;
  }

  /* ── CSS-only toggle switch ── */
  .switch {
    position: relative;
    width: 44px;
    height: 24px;
  }

  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
    position: absolute;
  }

  .switch .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #3a3a4a;
    border-radius: 24px;
    transition: background 0.25s;
  }

  .switch .slider::before {
    content: '';
    position: absolute;
    width: 18px;
    height: 18px;
    left: 3px;
    bottom: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.25s;
  }

  .switch input:checked + .slider {
    background: var(--green);
  }

  .switch input:checked + .slider::before {
    transform: translateX(20px);
  }

  /* ── Current jackpot ── */
  .jackpot-display {
    text-align: center;
    padding: 12px 0 16px;
  }

  .jackpot-display .label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 4px;
    font-weight: 500;
  }

  .jackpot-display .value {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
  }

  /* ── Formula grid ── */
  .formula-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
    font-weight: 500;
  }

  .field input {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }

  .field input::-webkit-inner-spin-button,
  .field input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .field input:focus {
    outline: none;
    border-color: var(--blue);
  }

  /* ── Buttons ── */
  .btn-row {
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    padding: 9px 0;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
  }

  .btn-save {
    background: var(--blue);
    color: #fff;
  }

  .btn-save:hover {
    background: var(--blue-hover);
  }

  .btn-save:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn-reset {
    background: transparent;
    color: var(--red);
    border: 1px solid var(--red);
  }

  .btn-reset:hover {
    background: rgba(233, 69, 96, 0.1);
  }

  .btn-reset:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ── Status message ── */
  .status-msg {
    margin-top: 10px;
    font-size: 12px;
    text-align: center;
    min-height: 18px;
    font-weight: 500;
    transition: opacity 0.3s;
  }

  .status-msg.success { color: var(--green); }
  .status-msg.error   { color: var(--red);   }

  /* ── Words Section ── */
  .words-section {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 28px 0;
  }

  .words-section h2 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--text);
  }

  .words-tables {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 8px;
  }

  .words-table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .words-table-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 10px 14px 8px;
    border-bottom: 1px solid var(--border);
  }

  .words-table-title.daily-title { color: var(--blue); }
  .words-table-title.weekly-title { color: #ffab00; }

  .words-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .words-table th {
    text-align: left;
    padding: 6px 14px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }

  .words-table td {
    padding: 5px 14px;
    border-bottom: 1px solid rgba(42, 42, 58, 0.5);
  }

  .words-table tr:last-child td {
    border-bottom: none;
  }

  .words-table .game-name {
    color: var(--text-dim);
    font-weight: 500;
  }

  .words-table .game-name.sp {
    padding-left: 20px;
    font-size: 12px;
  }

  .words-table .word-val {
    font-weight: 700;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .words-table .date-val {
    color: var(--text-dim);
    font-size: 11px;
  }

  /* ── Responsive ── */
  @media (max-width: 760px) {
    .grid {
      grid-template-columns: 1fr;
      padding: 16px;
      gap: 16px;
    }
    .header {
      padding: 16px;
    }
    .header h1 {
      font-size: 18px;
    }
    .words-section {
      padding: 16px 16px 0;
    }
    .words-tables {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<div class="header">
  <a href="/" class="back">&larr; Back</a>
  <h1>Jackpot Admin</h1>
</div>

<div class="words-section">
  <h2>Current Game Words</h2>
  <div class="words-tables">
    <div class="words-table-wrap">
      <div class="words-table-title daily-title">Daily Words</div>
      <table class="words-table">
        <thead><tr><th>Game</th><th>Word</th><th>Date</th></tr></thead>
        <tbody id="daily-words-body"><tr><td colspan="3" style="color:var(--text-dim)">Loading...</td></tr></tbody>
      </table>
    </div>
    <div class="words-table-wrap">
      <div class="words-table-title weekly-title">Weekly Words</div>
      <table class="words-table">
        <thead><tr><th>Game</th><th>Word</th><th>Week</th></tr></thead>
        <tbody id="weekly-words-body"><tr><td colspan="3" style="color:var(--text-dim)">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
var GAMES = [
  { id: 'wordle',       name: 'Wordle',        emoji: '\uD83C\uDFAF', color: '#6aaa64' },
  { id: 'word500',      name: 'Word 500',      emoji: '\uD83D\uDD24', color: '#4fc34f' },
  { id: 'betwixt',    name: 'Betwixt',     emoji: '\uD83D\uDCD0', color: '#7b68ee' },
  { id: 'pixeletters',  name: 'PixeLetters',   emoji: '\uD83E\uDDE9', color: '#ff6b9d' },
  { id: 'searchle',     name: 'Searchle',      emoji: '\uD83D\uDD0D', color: '#4a9eff' },
  { id: 'spellingbee',  name: 'Spelling Bee',  emoji: '\uD83D\uDC1D', color: '#ffab00' },
  { id: 'rectangled',   name: 'RecTangled',    emoji: '\u2B1B',       color: '#e94560' },
  { id: 'figural',      name: 'Figural',       emoji: '\u25C6',       color: '#00e5ff' },
  { id: 'unwordle',     name: 'UnWordle',      emoji: '\uD83D\uDD04', color: '#ff6b6b' },
];

// Track which input fields the user is currently editing (to avoid overwriting)
var activeInputs = {};
// Track per-game online state
var gameState = {};

GAMES.forEach(function(g) {
  gameState[g.id] = { online: false, settings: null };
});

function perGuessLabel(gameId) {
  return (gameId === 'spellingbee' || gameId === 'rectangled') ? 'Per Word' : 'Per Guess';
}

function buildCard(game) {
  var card = document.createElement('div');
  card.className = 'card offline';
  card.id = 'card-' + game.id;

  card.innerHTML =
    '<div class="card-accent" style="background:' + game.color + '"></div>' +
    '<div class="card-header">' +
      '<span class="card-emoji">' + game.emoji + '</span>' +
      '<span class="card-name">' + game.name + '</span>' +
      '<span class="badge offline-badge" id="badge-' + game.id + '">' +
        '<span class="dot"></span>Offline' +
      '</span>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="toggle-row">' +
        '<span class="toggle-label">Jackpot Enabled</span>' +
        '<label class="switch">' +
          '<input type="checkbox" id="enabled-' + game.id + '">' +
          '<span class="slider"></span>' +
        '</label>' +
      '</div>' +
      '<div class="toggle-row">' +
        '<span class="toggle-label">Daily Enabled</span>' +
        '<label class="switch">' +
          '<input type="checkbox" id="dailyEnabled-' + game.id + '">' +
          '<span class="slider"></span>' +
        '</label>' +
      '</div>' +
      '<div class="jackpot-display">' +
        '<div class="label">Current Jackpot</div>' +
        '<div class="value" id="current-' + game.id + '" style="color:' + game.color + '">--</div>' +
      '</div>' +
      '<div class="formula-grid">' +
        '<div class="field">' +
          '<label>Base</label>' +
          '<input type="number" id="base-' + game.id + '" step="any" placeholder="0"' +
          ' onfocus="markActive(\'' + game.id + '\',\'base\')"' +
          ' onblur="markInactive(\'' + game.id + '\',\'base\')">' +
        '</div>' +
        '<div class="field">' +
          '<label>' + perGuessLabel(game.id) + '</label>' +
          '<input type="number" id="perGuess-' + game.id + '" step="any" placeholder="0"' +
          ' onfocus="markActive(\'' + game.id + '\',\'perGuess\')"' +
          ' onblur="markInactive(\'' + game.id + '\',\'perGuess\')">' +
        '</div>' +
        '<div class="field">' +
          '<label>Per Second</label>' +
          '<input type="number" id="perSecond-' + game.id + '" step="any" placeholder="0"' +
          ' onfocus="markActive(\'' + game.id + '\',\'perSecond\')"' +
          ' onblur="markInactive(\'' + game.id + '\',\'perSecond\')">' +
        '</div>' +
        '<div class="field">' +
          '<label>Max</label>' +
          '<input type="number" id="max-' + game.id + '" step="any" placeholder="0"' +
          ' onfocus="markActive(\'' + game.id + '\',\'max\')"' +
          ' onblur="markInactive(\'' + game.id + '\',\'max\')">' +
        '</div>' +
      '</div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-save" id="saveBtn-' + game.id + '" onclick="saveSettings(\'' + game.id + '\')">Save</button>' +
        '<button class="btn btn-reset" id="resetBtn-' + game.id + '" onclick="resetJackpot(\'' + game.id + '\')">Reset</button>' +
      '</div>' +
      '<div class="status-msg" id="status-' + game.id + '"></div>' +
    '</div>';

  return card;
}

function markActive(gameId, field) {
  if (!activeInputs[gameId]) activeInputs[gameId] = {};
  activeInputs[gameId][field] = true;
}

function markInactive(gameId, field) {
  if (!activeInputs[gameId]) return;
  delete activeInputs[gameId][field];
}

function isFieldActive(gameId, field) {
  return activeInputs[gameId] && activeInputs[gameId][field];
}

function setOnline(gameId, online) {
  var card = document.getElementById('card-' + gameId);
  var badge = document.getElementById('badge-' + gameId);
  if (!card || !badge) return;

  gameState[gameId].online = online;

  if (online) {
    card.classList.remove('offline');
    badge.className = 'badge online';
    badge.innerHTML = '<span class="dot"></span>Online';
  } else {
    card.classList.add('offline');
    badge.className = 'badge offline-badge';
    badge.innerHTML = '<span class="dot"></span>Offline';
  }
}

function formatJackpot(val) {
  if (val == null || val === '' || isNaN(val)) return '--';
  var n = Number(val);
  if (Number.isInteger(n)) return n.toLocaleString();
  return n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function applySettings(gameId, data) {
  gameState[gameId].settings = data;

  // Always update current jackpot
  var currentEl = document.getElementById('current-' + gameId);
  if (currentEl) {
    currentEl.textContent = formatJackpot(data.current != null ? data.current : data.jackpot);
  }

  // Always update toggle (not an editable text field)
  var enabledEl = document.getElementById('enabled-' + gameId);
  if (enabledEl) {
    enabledEl.checked = !!data.enabled;
  }

  var dailyEnabledEl = document.getElementById('dailyEnabled-' + gameId);
  if (dailyEnabledEl) {
    dailyEnabledEl.checked = data.dailyEnabled !== false;  // default to true if not present
  }

  // Only update formula inputs if user is NOT editing them
  var fields = {
    base: data.base,
    perGuess: data.perGuess != null ? data.perGuess : data.perWord,
    perSecond: data.perSecond,
    max: data.max
  };

  Object.keys(fields).forEach(function(field) {
    if (!isFieldActive(gameId, field)) {
      var el = document.getElementById(field + '-' + gameId);
      if (el && fields[field] != null) {
        el.value = fields[field];
      }
    }
  });
}

function fetchSettings(gameId) {
  return fetch('/api/jackpot-admin/' + gameId + '/settings')
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data) {
      setOnline(gameId, true);
      applySettings(gameId, data);
    })
    .catch(function() {
      setOnline(gameId, false);
      var currentEl = document.getElementById('current-' + gameId);
      if (currentEl && !gameState[gameId].online) {
        currentEl.textContent = '--';
      }
    });
}

function fetchAllSettings() {
  return Promise.all(GAMES.map(function(g) {
    return fetchSettings(g.id);
  }));
}

function showStatus(gameId, message, type) {
  var el = document.getElementById('status-' + gameId);
  if (!el) return;
  el.textContent = message;
  el.className = 'status-msg ' + type;

  setTimeout(function() {
    el.textContent = '';
    el.className = 'status-msg';
  }, 3000);
}

function saveSettings(gameId) {
  var btn = document.getElementById('saveBtn-' + gameId);
  if (btn) btn.disabled = true;

  var body = {
    enabled: document.getElementById('enabled-' + gameId).checked,
    dailyEnabled: document.getElementById('dailyEnabled-' + gameId).checked,
    base: Number(document.getElementById('base-' + gameId).value) || 0,
    perGuess: Number(document.getElementById('perGuess-' + gameId).value) || 0,
    perSecond: Number(document.getElementById('perSecond-' + gameId).value) || 0,
    max: Number(document.getElementById('max-' + gameId).value) || 0,
  };

  // Also send as perWord for spelling bee / rectangled
  if (gameId === 'spellingbee' || gameId === 'rectangled') {
    body.perWord = body.perGuess;
  }

  fetch('/api/jackpot-admin/' + gameId + '/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data) {
      showStatus(gameId, 'Saved!', 'success');
      if (data) applySettings(gameId, data);
    })
    .catch(function(err) {
      showStatus(gameId, 'Error: ' + err.message, 'error');
    })
    .finally(function() {
      if (btn) btn.disabled = false;
    });
}

function resetJackpot(gameId) {
  var gameName = '';
  GAMES.forEach(function(g) { if (g.id === gameId) gameName = g.name; });

  if (!confirm('Reset the jackpot for ' + gameName + ' to its base value?')) return;

  var btn = document.getElementById('resetBtn-' + gameId);
  if (btn) btn.disabled = true;

  fetch('/api/jackpot-admin/' + gameId + '/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
  })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data) {
      showStatus(gameId, 'Jackpot reset!', 'success');
      if (data) applySettings(gameId, data);
    })
    .catch(function(err) {
      showStatus(gameId, 'Error: ' + err.message, 'error');
    })
    .finally(function() {
      if (btn) btn.disabled = false;
    });
}

// ── Current Words ──

function fetchCurrentWords() {
  fetch('/api/word-bank/current-words')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      renderWordTable('daily-words-body', data.daily, 'date');
      renderWordTable('weekly-words-body', data.weekly, 'weekStart');
    })
    .catch(function() {
      document.getElementById('daily-words-body').innerHTML =
        '<tr><td colspan="3" style="color:var(--red)">Failed to load</td></tr>';
      document.getElementById('weekly-words-body').innerHTML =
        '<tr><td colspan="3" style="color:var(--red)">Failed to load</td></tr>';
    });
}

function renderWordTable(tbodyId, items, dateField) {
  var tbody = document.getElementById(tbodyId);
  if (!items || items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="color:var(--text-dim)">No words</td></tr>';
    return;
  }
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    var isSP = item.gameId.endsWith('-sp');
    var nameClass = isSP ? 'game-name sp' : 'game-name';
    html += '<tr>' +
      '<td class="' + nameClass + '">' + (isSP ? '\u2514 ' : '') + item.name + '</td>' +
      '<td class="word-val">' + (item.word || '--') + '</td>' +
      '<td class="date-val">' + (item[dateField] || '--') + '</td>' +
      '</tr>';
  }
  tbody.innerHTML = html;
}

// ── Initialize ──

(function init() {
  var grid = document.getElementById('grid');
  GAMES.forEach(function(game) {
    grid.appendChild(buildCard(game));
  });

  // Initial fetch
  fetchAllSettings();
  fetchCurrentWords();

  // Poll every 2 seconds for jackpots, every 60s for words
  setInterval(fetchAllSettings, 2000);
  setInterval(fetchCurrentWords, 60000);
})();
</script>
  <script src="/js/hangstream-brand.js" defer></script>
</body>
</html>
