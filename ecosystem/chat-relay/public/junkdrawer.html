</head>
<body>
  <div class="bg"><div class="stars"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div id="app">
    <div id="topRow">
      <button id="homeBtn" class="cornerBtn" title="Back to your house">🏠</button>
      <button id="authBtn" class="cornerBtn" title="Sign in"><span id="authLabel">SIGN IN</span></button>
      <div class="spacer"></div>
      <button id="lbBtn" class="cornerBtn" title="Leaderboard">🏆</button>
      <button id="soundBtn" class="cornerBtn" title="Toggle sound">🔊</button>
    </div>

    <div id="hub">
      <div class="hub-coins"><div id="coinPill">🪙 0</div></div>
      <div id="houseCard" class="glass">
        <div class="house-head">
          <div class="house-title" id="houseTitle">🏚️ HOARDER HOUSE — LIVING ROOM</div>
          <div class="house-pct" id="housePct">0/10</div>
        </div>
        <div id="houseScene"></div>
        <div class="house-bar"><div id="houseFill"></div></div>
      </div>
      <div id="playRow">
        <button id="playLevel" class="play-btn">
          <span><span class="pb-main" id="lvMain">LEVEL 1</span><span class="pb-sub" id="lvSub"></span></span>
          <span class="pb-go">▶</span>
        </button>
        <button id="playDaily" class="play-btn">
          <span><span class="pb-main">DAILY CHALLENGE</span><span class="pb-sub" id="dailySub"></span></span>
          <span class="pb-go">📅</span>
        </button>
        <button id="playEndless" class="play-btn">
          <span><span class="pb-main">ENDLESS</span><span class="pb-sub" id="endlessSub"></span></span>
          <span class="pb-go">∞</span>
        </button>
      </div>
      <div id="statsCard" class="glass"><div class="stats-grid" id="statsGrid"></div></div>
    </div>
    <div id="hud">
      <div class="glass card">
        <div class="label">SCORE</div>
        <div id="scoreVal">0</div>
        <div id="bestVal">BEST 0</div>
      </div>
      <div id="brand">
        <h1>JUNKDRAWER<span class="tld">.LIVE</span></h1>
        <div class="tag">merge the mess</div>
        <div id="modeRow">
          <button class="mode-pill" data-mode="endless">ENDLESS</button>
          <button class="mode-pill" data-mode="daily">DAILY</button>
        </div>
        <div id="goalLine"></div>
      </div>
      <div class="glass nextwrap">
        <div class="card" style="min-width:0;padding:0;"><div class="label">NEXT</div></div>
        <div id="nextBubble"><canvas id="nextCv"></canvas></div>
      </div>
    </div>

    <div id="boardWrap">
      <canvas id="game"></canvas>
      <div id="overlay">
        <div class="panel">
          <h2>Drawer Overflow!</h2>
          <div class="sub">TOO MUCH STUFF, NOT ENOUGH DRAWER</div>
          <div id="newBest" class="newbest" style="display:none;">★ NEW BEST ★</div>
          <div class="finalScore" id="finalScore">0</div>
          <div class="stats">
            <div class="stat"><div class="v" id="stMerges">0</div><div class="k">MERGES</div></div>
            <div class="stat"><div class="v" id="stBiggest"></div><div class="k">BIGGEST</div></div>
            <div class="stat"><div class="v" id="stBest">0</div><div class="k">BEST</div></div>
          </div>
          <div id="goExtra"></div>
          <div class="go-btn-row">
            <button id="againBtn">Play Again</button>
            <button id="shareBtn" class="go-secondary" style="display:none;">Share</button>
          </div>
        </div>
      </div>
      <div id="lcOverlay">
        <div class="panel">
          <h2>LEVEL CLEAR!</h2>
          <div class="sub" id="lcGoal"></div>
          <div class="finalScore" id="lcReward">+0 🪙</div>
          <div class="go-btn-row" style="margin-top:18px;"><button id="lcHome">Continue</button></div>
        </div>
      </div>
      <div id="lbOverlay">
        <div class="lbPanel">
          <div class="lbHead"><h3>LEADERBOARD</h3><button id="lbClose" title="Close">✕</button></div>
          <div class="lb-tabs">
            <button class="lb-tab on" data-tab="daily">TODAY</button>
            <button class="lb-tab" data-tab="endless">ALL-TIME</button>
          </div>
          <div id="lbList"><div class="lb-empty">Loading…</div></div>
          <div id="lbMe" style="display:none;"></div>
        </div>
      </div>
    </div>

    <div id="chain" class="glass"></div>
  </div>

    }
    if (a.plugin.tier !== b.plugin.tier) continue;
    // daily starting-pile items don't merge with EACH OTHER (or the dense
    // pile would cascade itself away). They still merge with anything the
    // player drops — that's how you dig the drawer out.
    if (a.plugin.fill && b.plugin.fill) continue;
    a.plugin.merged = b.plugin.merged = true;
    mergeQueue.push([a, b]);
  }

  function step(actions=[]){

    });

    count=e[0]===previous?count+1:1;if(count>4)throw Error('Too many inputs');previous=e[0];

    const actions=[];while(index<t.events.length&&t.events[index][0]===tick){actions.push(t.events[index++].slice(1));}
    game.step(actions);if(game.snapshot().gameOver&&tick+1!==t.ticks)throw Error('Run already ended');

}

/* ---------- modes + daily seed ----------
   Daily mode: every player gets the same drop sequence for the day.
   The day boundary is America/Edmonton (platform convention, matches the
   server's sp-daily logic) and the seed is a pure function of that date,
   so client and server agree without any extra API round-trip. */
let mode = localStorage.getItem('junkdrawer_mode') === 'daily' ? 'daily' : 'endless';
let runDay = '';
let dropRng = Math.random;
function edmontonDay() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Edmonton' }).format(new Date());
}
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- board geometry (logical units) ----------
   640×900 since 2026-07-11 (was 560×880): phone-first aspect (~1:1.4
   matches real usable screen areas once browser bars + HUD are gone) so

/* ---------- responsive layout (sharp at any scale) ---------- */
let VIEW = 1;   // css px per logical unit
function layout() {
  const app = document.getElementById('app');
  const topRow = document.getElementById('topRow');
  const hud = document.getElementById('hud');
  const chain = document.getElementById('chain');
  // two passes: switching density changes the chrome height, so if the
  // first pass flips the compact class, measure and scale once more
  for (let pass = 0; pass < 2; pass++) {
    const compact = app.classList.contains('compact');
    // compact goes edge-to-edge: no side margins, tighter vertical slack
    const sideM = compact ? 0 : 14;
    const chromeH = topRow.offsetHeight + hud.offsetHeight + chain.offsetHeight + (compact ? 22 : 34) + (document.getElementById('runStatus')?.offsetHeight || 0);
    const scale = Math.min((window.innerWidth - sideM) / W, (window.innerHeight - chromeH - (compact ? 6 : 14)) / H);
    VIEW = Math.max(0.2, scale);
    const nowCompact = W * VIEW < 520;
    app.classList.toggle('compact', nowCompact);
    if (nowCompact === compact) break;
  }
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.style.width = (W * VIEW) + 'px';
  canvas.style.height = (H * VIEW) + 'px';
  canvas.style.borderRadius = app.classList.contains('compact') ? '10px' : '22px';
  canvas.width = Math.round(W * VIEW * dpr);
  canvas.height = Math.round(H * VIEW * dpr);
  ctx.setTransform(VIEW * dpr, 0, 0, VIEW * dpr, 0, 0);
  const wpx = Math.max(280, W * VIEW) + 'px';
  topRow.style.width = hud.style.width = chain.style.width = wpx;
}
window.addEventListener('resize', () => { layout(); });

/* ---------- pre-rendered sprites + per-tier physics metadata ---------- */
const SS = 2; // sprite supersampling
const PAD = 18; // sprite padding for glow
const sprites = TIERS.map((t) => {
  const w = t.bb.x1 - t.bb.x0 + PAD * 2;
  const h = t.bb.y1 - t.bb.y0 + PAD * 2;
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * SS); c.height = Math.ceil(h * SS);
  const g = c.getContext('2d');
  g.scale(SS, SS);
  g.translate(PAD - t.bb.x0, PAD - t.bb.y0);
  g.lineJoin = 'round';
  // soft colored glow behind the art
  g.save();
  g.shadowColor = t.c2 + 'CC';
  g.shadowBlur = 16;
  t.draw(g);
  g.restore();
  // crisp pass on top
  t.draw(g);
  return { canvas: c, w, h, x0: t.bb.x0 - PAD, y0: t.bb.y0 - PAD };
});
// Global item scale — one knob that grows every item's physics hull AND
// art together (2026-07-11: +8% per user, to fill the drawer better).
// Universal constant, so every player still plays identical pieces.
const ITEM_SCALE = 1.40;   // global base size (1.19 → 1.40 for ~5-7 min games; sim-tuned 2026-07-12)
// per-tier EXTRA size on top of ITEM_SCALE. number = uniform; {sx,sy} = per-axis
// (pencil is stretched length-only). Physics hull + art scale together.
const TIER_SIZE = [
  1,               // 0 ring
  1,               // 1 key
  { sx: 1.85, sy: 1 }, // 2 pencil — double the length, same thickness
  1.10,            // 3 sunglasses — 10% larger
  1,               // 4 coke
  1,               // 5 wallet
  1,               // 6 phone
  1.30,            // 7 dumbbell — ~40% larger than the rest
  2.0,             // 8 deodorant (pill bottle) — 2× larger, size-matched here
  1,               // 9 sneaker
  1,               // 10 headphones
  1,               // 11 laptop
  1,               // 12 backpack
  1,               // 13 Big TV
];
function tierScale(tier) {
  const s = TIER_SIZE[tier];
  if (s == null) return { sx: 1, sy: 1 };
  return (typeof s === 'number') ? { sx: s, sy: s } : { sx: s.sx || 1, sy: s.sy || 1 };
}

// probe bodies: centre of mass offset (compound bodies rotate about it)
TIERS.forEach((t, ti) => {
  const parts = t.build(0, 0);
  const probe = parts.length > 1 ? Body.create({ parts }) : parts[0];
  t.com = { x: probe.position.x, y: probe.position.y };
  const { sx, sy } = tierScale(ti);
  t.halfW = Math.max(Math.abs(t.bb.x0), Math.abs(t.bb.x1)) * ITEM_SCALE * sx;
  t.maxY = t.bb.y1 * ITEM_SCALE * sy;
  // reach = farthest bbox corner from the COM (the rotation pivot). Since
  // the held item spins, clamping the drop position by reach keeps it
  // inside the walls at ANY angle. Uses the widest per-axis scale.
  const cx0 = t.bb.x0 - t.com.x, cx1 = t.bb.x1 - t.com.x;
  const cy0 = t.bb.y0 - t.com.y, cy1 = t.bb.y1 - t.com.y;
  t.reach = Math.max(
    Math.hypot(cx0 * sx, cy0 * sy), Math.hypot(cx1 * sx, cy0 * sy),
    Math.hypot(cx1 * sx, cy1 * sy), Math.hypot(cx0 * sx, cy1 * sy)) * ITEM_SCALE;
});

function makeItem(tier, x, y) {
  const t = TIERS[tier];
  const parts = t.build(x, y);
  const b = parts.length > 1 ? Body.create({ parts, ...PHYS }) : parts[0];
  // scale about the centre of mass — matches the renderer, which scales
  // the sprite about t.com (per-axis so the pencil can stretch length-only)
  const { sx, sy } = tierScale(tier);
  Body.scale(b, ITEM_SCALE * sx, ITEM_SCALE * sy);
  // per-tier weight: recompute mass from the shared base density × multiplier
  Body.setDensity(b, PHYS.density * (TIER_WEIGHT[tier] || 1));
  b.plugin = { tier, born: performance.now(), spawnT: 0, merged: false };
  return b;
}

/* ---------- TikTok rose (special item, tier -1) ----------
   Ring-sized bloom sent by TikTok viewers (see TikTok mode below). It uses
   tier -1 so the EXISTING merge logic promotes rose+rose → ring (tier 0):
   viewers hand the streamer free merge fuel. Rose bodies are tagged
   plugin.rose so the renderer and shove loop skip the TIERS[] lookup. */
const ROSE_R = 26;
const roseSprite = (() => {
  const pad = 12, size = (ROSE_R + pad) * 2, SS = 2.5;
  const c = document.createElement('canvas');
  c.width = c.height = Math.ceil(size * SS);
  const g = c.getContext('2d');
  g.scale(SS, SS);
  const cx = ROSE_R + pad, cy = ROSE_R + pad;
  // glow
  const glow = g.createRadialGradient(cx, cy, ROSE_R * 0.5, cx, cy, ROSE_R + pad);
  glow.addColorStop(0, 'rgba(244,63,94,0.5)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = glow; g.fillRect(0, 0, size, size);
  // stem
  g.strokeStyle = '#15803d'; g.lineWidth = 4; g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx, cy + 2); g.lineTo(cx + 3, cy + ROSE_R * 0.9); g.stroke();
  // leaf
  g.fillStyle = '#22c55e';
  g.beginPath(); g.ellipse(cx + 12, cy + ROSE_R * 0.5, 8, 4, -0.6, 0, Math.PI * 2); g.fill();
  // bloom — layered petals
  const bloomY = cy - ROSE_R * 0.18, bloomR = ROSE_R * 0.82;
  const outer = g.createRadialGradient(cx - bloomR * 0.3, bloomY - bloomR * 0.3, bloomR * 0.1, cx, bloomY, bloomR);
  outer.addColorStop(0, '#fb7185'); outer.addColorStop(0.6, '#f43f5e'); outer.addColorStop(1, '#be123c');
  g.fillStyle = outer;
  g.beginPath(); g.arc(cx, bloomY, bloomR, 0, Math.PI * 2); g.fill();
  // petal swirls
  g.strokeStyle = 'rgba(136,19,55,0.65)'; g.lineWidth = 1.6;
  for (let i = 0; i < 3; i++) {
    g.beginPath(); g.arc(cx, bloomY, bloomR * (0.3 + i * 0.22), i * 1.6, i * 1.6 + Math.PI * 1.3); g.stroke();
  }
  // center highlight
  g.fillStyle = '#fecdd3';
  g.beginPath(); g.arc(cx - bloomR * 0.15, bloomY - bloomR * 0.15, bloomR * 0.22, 0, Math.PI * 2); g.fill();
  return { canvas: c, size, half: ROSE_R + pad };
})();
function makeRose(x, y) {
  const b = Bodies.circle(x, y, ROSE_R, { ...PHYS, restitution: 0.2 });
  Body.setDensity(b, PHYS.density * 0.9);
  b.plugin = { tier: -1, rose: true, born: performance.now(), spawnT: 1, merged: false };
  return b;
}
function drawRose(b) {
  let sc = 1;
  if (b.plugin.spawnT > 0) {
    b.plugin.spawnT = Math.max(0, b.plugin.spawnT - 0.09);
    const p = 1 - b.plugin.spawnT;
    sc = 0.4 + 0.6 * (1 - Math.pow(1 - p, 3)) + Math.sin(p * Math.PI) * 0.15;
  }
  const sp = roseSprite, half = sp.half;
  ctx.save();
  ctx.translate(b.position.x, b.position.y);
  ctx.rotate(b.angle);
  ctx.scale(sc, sc);
  ctx.drawImage(sp.canvas, -half, -half, half * 2, half * 2);
  ctx.restore();

/* ---------- mini renders (next preview, chain, stats) ---------- */
function miniInto(cv, tier, cssSize) {

/* ---------- juice: particles, rings, floaters ---------- */
function burst(x, y, tier, count) {
  const t = TIERS[tier];
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * (4 + tier * 0.6);
    particles.push({

      life: 1, decay: 0.02 + Math.random() * 0.02,
      size: 3 + Math.random() * (3 + tier * 0.5),
      color: Math.random() < 0.35 ? '#ffffff' : (Math.random() < 0.5 ? t.c1 : t.c2),
    });
  }

}

/* ---------- merging ---------- */
Events.on(engine, 'collisionStart', (ev) => {
  for (const pair of ev.pairs) {
    const a = pair.bodyA.parent || pair.bodyA;   // compound parts report the part; merge on the root
    const b = pair.bodyB.parent || pair.bodyB;
    if (a === b) continue;
    if (!a.plugin || !b.plugin) continue;
    if (a.plugin.merged || b.plugin.merged) continue;
    // coke can bursts from a hard-enough IMPACT (force = hitter momentum),
    // takes priority over merging. A heavy dumbbell pops it; light drops don't.
    if (COKE_TIER >= 0) {
      // only a real item hitting the can counts — NOT the static floor/walls
      // (whose plugin is Matter's default {} and whose mass is Infinity).
      const relSpeed = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
      if (a.plugin.tier === COKE_TIER && !a.plugin.exploding && !b.isStatic && b.mass * relSpeed > EXPLODE_FORCE) { a.plugin.exploding = true; explodeQueue.push(a); }
      if (b.plugin.tier === COKE_TIER && !b.plugin.exploding && !a.isStatic && a.mass * relSpeed > EXPLODE_FORCE) { b.plugin.exploding = true; explodeQueue.push(b); }
    }
    if (a.plugin.tier !== b.plugin.tier) continue;
    // daily starting-pile items don't merge with EACH OTHER (or the dense
    // pile would cascade itself away). They still merge with anything the
    // player drops — that's how you dig the drawer out.
    if (a.plugin.fill && b.plugin.fill) continue;
    a.plugin.merged = b.plugin.merged = true;
    mergeQueue.push([a, b]);
  }
});

function processMerges() {
  while (mergeQueue.length) {
    const [a, b] = mergeQueue.shift();
    const tier = a.plugin.tier;
    const mx = (a.position.x + b.position.x) / 2;
    const my = (a.position.y + b.position.y) / 2;
    Composite.remove(engine.world, a);
    Composite.remove(engine.world, b);
    merges++;
    const now = performance.now();
    combo = (now - lastMergeAt < 1600) ? combo + 1 : 1;
    lastMergeAt = now;
    const mult = 1 + Math.max(0, combo - 1) * 0.25;

    if (tier === MAX_TIER) {
      // two Big TVs cancel out in glory
      const gained = Math.round(TV_MERGE_BONUS * mult);
      score += gained;
      burst(mx, my, MAX_TIER, 70);
      floatText(mx, my - 40, '+' + gained + '  TV OVERLOAD!', '#fde68a', 30);
      shake = Math.min(18, shake + 14);
      sfx.big();
      checkLevelGoal(null);
    } else {
      const newTier = tier + 1;
      const t = TIERS[newTier];
      // spawn so the new item's design centre sits at the merge midpoint,
      // clamped inside the walls
      const sx = Math.max(WALL_PAD + t.halfW, Math.min(W - WALL_PAD - t.halfW, mx));
      const nb = makeItem(newTier, sx, my);
      Body.setVelocity(nb, {
        x: (a.velocity.x + b.velocity.x) / 2,
        y: Math.min(0, (a.velocity.y + b.velocity.y) / 2),
      });
      Body.setAngularVelocity(nb, (Math.random() - 0.5) * 0.08);
      nb.plugin.spawnT = 1; // pop-in animation
      Composite.add(engine.world, nb);
      // the merged item is bigger than the pair it replaces — shove any
      // overlapped neighbours radially out of the way instead of letting
      // the new item sit on top of them
      for (const o of Composite.allBodies(engine.world)) {
        if (o.isStatic || o === nb || !o.plugin || o.plugin.merged) continue;
        const dx = o.position.x - mx, dy = o.position.y - my;
        const dist = Math.hypot(dx, dy) || 1;
        const reach = t.halfW + (o.plugin.rose ? ROSE_R : TIERS[o.plugin.tier].halfW);
        if (dist < reach) {
          const push = (1 - dist / reach) * 10;   // deeper overlap = harder shove
          Body.setVelocity(o, {
            x: o.velocity.x + (dx / dist) * push,
            y: o.velocity.y + (dy / dist) * push,
          });
        }
      }
      const gained = Math.round(t.score * mult);
      score += gained;
      discovered.add(newTier);
      if (newTier > biggestTier) biggestTier = newTier;
      // meta: first-ever discovery pays Junk Coins; count TVs built
      if (!auth.user && !profile.found.includes(newTier)) {
        profile.found.push(newTier);
        awardCoins(DISCOVERY_BONUS);
        floatText(mx, my - t.halfW - 44, 'NEW! +' + DISCOVERY_BONUS + ' 🪙', '#ffd97a', 18);
      }
      if (!auth.user && newTier === MAX_TIER) profile.stats.tv = (profile.stats.tv || 0) + 1;
      checkLevelGoal(newTier);
      burst(mx, my, newTier, 14 + newTier * 3);
      floatText(mx, my - t.halfW - 10,
        '+' + gained + (combo > 1 ? '  x' + combo : ''), combo > 1 ? '#fde68a' : '#ffffff',
        20 + Math.min(12, newTier * 1.5));
      shake = Math.min(14, shake + (newTier >= 6 ? 8 : newTier >= 3 ? 4 : 1.5));
      if (newTier === MAX_TIER) { sfx.big(); shake = 16; } else { sfx.merge(newTier); }
      refreshChain();
    }
    if (score > best) { best = score; localStorage.setItem('junkdrawer_best', String(best)); }
    refreshHUD();
  }
}

function processExplosions() {
  while (explodeQueue.length) {
    const b = explodeQueue.shift();
    if (b.plugin.merged) continue;
    const x = b.position.x, y = b.position.y;
    Composite.remove(engine.world, b);
    burst(x, y, COKE_TIER, 46);                 // fizzy spray
    floatText(x, y - 44, 'FIZZ!', '#f87171', 24);
    shake = Math.min(18, shake + 11);
    sfx.big();
    // radial shove — the burst scatters nearby items
    for (const o of Composite.allBodies(engine.world)) {
      if (o.isStatic || !o.plugin || o === b) continue;
      const dx = o.position.x - x, dy = o.position.y - y, d = Math.hypot(dx, dy) || 1;
      if (d < 170) {
        const f = (1 - d / 170) * 15;
        Body.setVelocity(o, { x: o.velocity.x + (dx / d) * f, y: o.velocity.y + (dy / d) * f - 2 });
      }
    }
  }
}

function clampHold(x) {

/* ---------- daily starting drawer ----------
   The daily challenge begins as a fixed, seeded "half-full" drawer — the
   SAME layout for every player, every time (seeded from the day, on its own
   RNG stream so the drop sequence is unchanged). You dig it out by merging.
   Items are placed at exact rest positions (not physics-settled) so the
   starting board is byte-identical across devices. Kept easy: only small
   junk (ring..wallet), a pile that thins toward the top, well below the
   danger line. */
// All fill items carry plugin.fill and DON'T merge with each other, so the
// pile stays put. That lets us mix in BIG items (wallet/sneaker/headphones)
// for bulk — a base of big pieces plus small clutter piled on top fills the
// drawer much better without anything cascading. Small tiers stay diggable.
const DAILY_BIG_TIERS = [5, 9, 10];   // wallet, sneaker, headphones (avoid coke/dumbbell/pill)
const DAILY_BIG_COUNT = 3;            // feature pieces resting on the floor
const DAILY_SMALL_COLS = 4;
const DAILY_SMALL_ROW_H = 90;
const DAILY_SMALL_ROWS = [            // small clutter piled above the base
  { p: 1.00, maxTier: 5 },           // ring..wallet (COKE_TIER is skipped below — cans explode)
  { p: 1.00, maxTier: 3 },
  { p: 1.00, maxTier: 3 },
  { p: 0.90, maxTier: 2 },
];
function fillDailyDrawer() {
  const rng = mulberry32(fnv1a('junkdrawer-fill:' + runDay));
  const now = performance.now();
  const addFill = (tier, x, y) => {
    const r = TIERS[tier].reach;
    const cx = Math.max(WALL_PAD + r + 2, Math.min(W - WALL_PAD - r - 2, x));
    const b = makeItem(tier, cx, y);
    b.plugin.born = now;
    b.plugin.fill = true;
    Composite.add(engine.world, b);
  };
  // 1) big feature pieces resting on the floor, evenly spread (no two the
  //    same in a row so they read as varied junk)
  const slotW = (W - WALL_PAD * 2) / DAILY_BIG_COUNT;
  let prevBig = -1;
  for (let i = 0; i < DAILY_BIG_COUNT; i++) {
    let pool = DAILY_BIG_TIERS.filter(t => t !== prevBig);
    const tier = pool[Math.floor(rng() * pool.length)];
    prevBig = tier;
    const x = WALL_PAD + slotW * (i + 0.5) + (rng() - 0.5) * 16;
    addFill(tier, x, FLOOR_Y - TIERS[tier].maxY - 4);   // rest bottom on floor
  }
  // 2) small clutter piled above the big base
  const cellW = (W - WALL_PAD * 2) / DAILY_SMALL_COLS;
  const baseTop = FLOOR_Y - 176;      // above the tallest big piece
  const grid = [];
  DAILY_SMALL_ROWS.forEach((rowDef, row) => {
    grid[row] = [];
    const cy = baseTop - DAILY_SMALL_ROW_H * row - DAILY_SMALL_ROW_H / 2;
    for (let col = 0; col < DAILY_SMALL_COLS; col++) {
      if (rng() > rowDef.p) { grid[row][col] = -1; continue; }
      const banned = new Set([grid[row][col - 1], (grid[row - 1] || [])[col]]);
      let choices = [];
      // never seed coke cans into the pile (they explode) — index-safe skip
      for (let t = 0; t <= rowDef.maxTier; t++) if (!banned.has(t) && t !== COKE_TIER) choices.push(t);
      if (!choices.length) for (let t = 0; t <= rowDef.maxTier; t++) if (t !== COKE_TIER) choices.push(t);
      const tier = choices[Math.floor(rng() * choices.length)];
      grid[row][col] = tier;
      const x = WALL_PAD + cellW * (col + 0.5) + (rng() - 0.5) * (cellW * 0.10);

    }
  });
}

function drawPile(cv, seed) {
  const px = 120;
  cv.width = px; cv.height = px;
  const g = cv.getContext('2d');
  const rng = mulberry32(fnv1a('pile:' + seed));
  g.filter = 'saturate(0.5) brightness(0.75)';
  for (let i = 0; i < 6; i++) {
    const tier = Math.floor(rng() * 7); // small junk only
    const sp = sprites[tier];
    const s = (26 + rng() * 22) / Math.max(sp.w, sp.h);
    g.save();
    g.translate(14 + rng() * 92, 30 + rng() * 80);
    g.rotate((rng() - 0.5) * 2.2);
    g.drawImage(sp.canvas, -sp.w * s / 2, -sp.h * s / 2, sp.w * s, sp.h * s);

  if (!auth.user) { profile.coins -= def.cost; profile.cleaned.push(id); sfx.merge(6); saveProfile(); return; }

    e.nm.textContent = s.name;
    e.cost.style.display = done ? 'none' : 'block';
    e.cost.textContent = '🪙' + s.cost;
    if (!done && !e.piled) { drawPile(e.cv, e.seed); e.piled = true; }
  });
  document.getElementById('housePct').textContent = cleanedCount + '/' + ROOM_SPOTS.length;
  document.getElementById('houseFill').style.width = Math.round(cleanedCount / ROOM_SPOTS.length * 100) + '%';
  document.getElementById('houseTitle').textContent =
    cleanedCount === ROOM_SPOTS.length ? '🏡 LIVING ROOM — SPARKLING CLEAN!' : '🏚️ HOARDER HOUSE — LIVING ROOM';
  // play buttons
  if (levelsDone()) {
    document.getElementById('lvMain').textContent = 'ALL LEVELS CLEAR ✓';
    document.getElementById('lvSub').textContent = 'More levels coming soon — replay the finale';
  } else {
    document.getElementById('lvMain').textContent = 'LEVEL ' + profile.level;
    document.getElementById('lvSub').textContent = 'Goal: ' + goalText(currentLevelDef().goal);
  }
  const today = edmontonDay();
  const dailyDone = profile.lastDaily === today;
  document.getElementById('playDaily').classList.toggle('done', dailyDone);
  document.getElementById('dailySub').textContent = dailyDone
    ? '✓ Done today · streak ' + profile.streak + ' 🔥'
    : 'Dig out the shared drawer!' + (profile.streak > 0 ? ' · streak ' + profile.streak + ' 🔥' : '');
  document.getElementById('endlessSub').textContent = 'Best ' + (profile.stats.best || best || 0).toLocaleString();
  // stats
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = '';
  [['Games', profile.stats.games], ['Merges', profile.stats.merges], ['Best', profile.stats.best], ['Streak', profile.streak]]
    .forEach(([k, v]) => {
      const c = document.createElement('div'); c.className = 'stat-cell';
      const vd = document.createElement('div'); vd.className = 'v'; vd.textContent = Number(v || 0).toLocaleString();
      const kd = document.createElement('div'); kd.className = 'k'; kd.textContent = k;
      c.appendChild(vd); c.appendChild(kd); grid.appendChild(c);
    });
}
function edmontonYesterday() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Edmonton' }).format(new Date(Date.now() - 86400000));
}

/* ---------- rendering ---------- */
function drawBoard(warn) {
  // interior back panel
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, 'rgba(20,16,52,0.92)');
  bg.addColorStop(0.5, 'rgba(16,12,42,0.94)');
  bg.addColorStop(1, 'rgba(10,8,30,0.97)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  // faint diagonal sheen
  const sheen = ctx.createLinearGradient(0, 0, W, H * 0.7);
  sheen.addColorStop(0, 'rgba(255,255,255,0.045)');
  sheen.addColorStop(0.45, 'rgba(255,255,255,0)');
  ctx.fillStyle = sheen;
  ctx.fillRect(0, 0, W, H);
  // side wall glows
  const lw = ctx.createLinearGradient(0, 0, WALL_PAD * 3, 0);
  lw.addColorStop(0, 'rgba(129,140,248,0.28)');
  lw.addColorStop(1, 'rgba(129,140,248,0)');
  ctx.fillStyle = lw; ctx.fillRect(0, 0, WALL_PAD * 3, H);
  const rw = ctx.createLinearGradient(W, 0, W - WALL_PAD * 3, 0);
  rw.addColorStop(0, 'rgba(129,140,248,0.28)');
  rw.addColorStop(1, 'rgba(129,140,248,0)');
  ctx.fillStyle = rw; ctx.fillRect(W - WALL_PAD * 3, 0, WALL_PAD * 3, H);
  // floor
  const fl = ctx.createLinearGradient(0, FLOOR_Y - 6, 0, H);
  fl.addColorStop(0, 'rgba(129,140,248,0.35)');
  fl.addColorStop(0.2, 'rgba(60,52,120,0.5)');
  fl.addColorStop(1, 'rgba(30,24,70,0.9)');
  ctx.fillStyle = fl;
  ctx.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(0, FLOOR_Y, W, 2);
  // danger line
  const pulse = warn ? (0.55 + 0.45 * Math.sin(performance.now() / 110)) : 0.28;
  ctx.save();
  ctx.strokeStyle = warn ? `rgba(248,113,113,${pulse})` : `rgba(255,255,255,${pulse * 0.5})`;
  ctx.lineWidth = warn ? 3 : 2;
  ctx.setLineDash([12, 10]);
  ctx.beginPath();
  ctx.moveTo(WALL_PAD, DANGER_Y); ctx.lineTo(W - WALL_PAD, DANGER_Y);
  ctx.stroke();
  ctx.restore();
  if (warn) {
    const dz = ctx.createLinearGradient(0, DANGER_Y - 60, 0, DANGER_Y);
    dz.addColorStop(0, 'rgba(248,113,113,0)');
    dz.addColorStop(1, `rgba(248,113,113,${pulse * 0.22})`);
    ctx.fillStyle = dz;
    ctx.fillRect(WALL_PAD, DANGER_Y - 60, W - WALL_PAD * 2, 60);
  }
}

function drawItem(b) {
  if (b.plugin.rose) { drawRose(b); return; }
  const tier = b.plugin.tier;
  const t = TIERS[tier];
  const sp = sprites[tier];
  let sc = 1;
  if (b.plugin.spawnT > 0) {
    b.plugin.spawnT = Math.max(0, b.plugin.spawnT - 0.09);
    const p = 1 - b.plugin.spawnT;                        // 0 → 1
    sc = 0.45 + 0.55 * (1 - Math.pow(1 - p, 3)) + Math.sin(p * Math.PI) * 0.12; // pop overshoot
  }
  const { sx, sy } = tierScale(tier);
  ctx.save();
  ctx.translate(b.position.x, b.position.y);
  ctx.rotate(b.angle);
  ctx.scale(sc * ITEM_SCALE * sx, sc * ITEM_SCALE * sy);
  // compound bodies rotate about their centre of mass; the art is
  // authored around the design centre, so shift by the COM offset
  ctx.translate(-t.com.x, -t.com.y);
  ctx.drawImage(sp.canvas, sp.x0, sp.y0, sp.w, sp.h);
  ctx.restore();
}

function drawHeld() {
  if (gameOver || !canDrop) return;
  const t = TIERS[currentTier];
  const sp = sprites[currentTier];
  const bob = Math.sin(performance.now() / 400) * 3;
  // aim guide
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 10]);
  ctx.beginPath();
  ctx.moveTo(holdX, HOLD_Y + t.reach + bob + 8);
  ctx.lineTo(holdX, FLOOR_Y - 4);
  ctx.stroke();
  ctx.restore();
  // spin-timer ring: depletes clockwise over the eight-second drop window
  const prog = runCore ? holdAngle / (SPIN_TURNS * Math.PI * 2) : Math.min(1, (performance.now() - holdStartT) / SPIN_MS);
  ctx.save();
  ctx.translate(holdX, HOLD_Y + bob);
  ctx.strokeStyle = 'rgba(251,191,36,0.30)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(0, 0, t.reach + 11, -Math.PI / 2, -Math.PI / 2 + (1 - prog) * Math.PI * 2);
  ctx.stroke();
  ctx.restore();
  // the spinning item — rotate about the COM, exactly like drawItem, so the
  // preview matches the body the instant it drops
  const hs = tierScale(currentTier);
  ctx.save();
  ctx.translate(holdX + t.com.x, HOLD_Y + bob + t.com.y);
  ctx.rotate(holdAngle);
  ctx.scale(ITEM_SCALE * hs.sx, ITEM_SCALE * hs.sy);
  ctx.translate(-t.com.x, -t.com.y);
  ctx.drawImage(sp.canvas, sp.x0, sp.y0, sp.w, sp.h);
  ctx.restore();
}

function drawFx(dt) {
  // shockwave rings
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.life -= 0.035; r.r += (r.max - r.r) * 0.14;
    if (r.life <= 0) { rings.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = r.life * 0.6;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 3 * r.life;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= p.decay; if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += 0.12; p.x += p.vx; p.y += p.vy;
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // floating score text
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= 0.016; f.y -= 1.1;
    if (f.life <= 0) { floaters.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.min(1, f.life * 1.6);
    ctx.font = `900 ${f.size}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = f.color;
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 8;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }
}

/* ---------- overflow (game-over) detection ---------- */
function checkOverflow(dt) {
  if (gameOver) return false;
  const now = performance.now();
  let anyAbove = false;
  for (const b of Composite.allBodies(engine.world)) {
    if (b.isStatic || !b.plugin) continue;
    if (now - b.plugin.born < 700) continue;               // fresh drops get a grace period
    if (b.bounds.min.y < DANGER_Y) { anyAbove = true; break; }
  }
  if (anyAbove) {
    overflowMs += dt;
    if (overflowMs > 1400) endGame();
  } else {
    overflowMs = Math.max(0, overflowMs - dt * 2);
  }
  return overflowMs > 250;
}

/* ---------- main loop ---------- */
let lastT = performance.now();
let lastCoreFrame = lastT;
let lastWinW = 0, lastWinH = 0;
function frame(now) {
  const dt = Math.min(50, now - lastT);
  lastT = now;
  // self-heal layout: some embeds report a wrong viewport at load time
  if (window.innerWidth !== lastWinW || window.innerHeight !== lastWinH) {
    lastWinW = window.innerWidth; lastWinH = window.innerHeight;
    layout();
  }
  let warn;
  if (runCore) {
    advanceCore(now - lastCoreFrame); warn = overflowMs > 250;
  } else {
    if (!gameOver) { Engine.update(engine, 1000 / 60); processMerges(); processExplosions(); }
    if (!gameOver && !inHub && canDrop) {
      const elapsed = now - holdStartT;
      if (elapsed >= SPIN_MS) { holdAngle = 0; dropCurrent(); }
      else holdAngle = elapsed / SPIN_MS * SPIN_TURNS * Math.PI * 2;
    }
    warn = checkOverflow(dt);
  }
  lastCoreFrame = now;

  // screen shake
  let sx = 0, sy = 0;
  if (shake > 0.2) {
    sx = (Math.random() - 0.5) * shake;
    sy = (Math.random() - 0.5) * shake;
    shake *= 0.88;
  } else shake = 0;

  ctx.save();
  ctx.translate(sx, sy);
  drawBoard(warn);
  for (const b of Composite.allBodies(engine.world)) {
    if (!b.isStatic && b.plugin) drawItem(b);
  }
  drawHeld();
  drawFx(dt);
  ctx.restore();

  requestAnimationFrame(frame);
}

/* ---------- debug handle (used by automated diagnostics) ---------- */
window.__jd = {
  get engine() { return engine; },
  // manual frame pump: lets diagnostics drive physics + rendering when the
  // page is hidden (rAF is suspended in hidden tabs)
  step: (n) => { for (let i = 0; i < (n || 1); i++) frame(performance.now()); },
  state: () => ({
    score, best, merges, biggestTier, gameOver, canDrop, currentTier, nextTier,
    bodies: Composite.allBodies(engine.world).filter(b => !b.isStatic).length,
  }),
  spawn: (tier, x, y) => {
    const b = makeItem(tier, x, y == null ? 300 : y);
    Composite.add(engine.world, b);
    return b.id;
  },
  clear: () => {
    for (const b of Composite.allBodies(engine.world)) if (!b.isStatic) Composite.remove(engine.world, b);
  },
  // meta-game hooks for diagnostics
  profile: () => profile,
  playMode,
  showScreen,
  cleanSpot,
  // spin/held-item hooks for diagnostics
  held: () => ({ holdAngle, holdStartT, canDrop, inHub, currentTier, reach: TIERS[currentTier].reach }),
  drop: () => dropCurrent(),
  setSpin: (a) => { holdAngle = a; },
  density: (tier) => { const b = makeItem(tier, 320, 300); const m = b.mass; Composite.remove(engine.world, b); return m; },
  rose: (x, y) => { const b = makeRose(x, y == null ? 300 : y); Composite.add(engine.world, b); return b.id; },
};

/* =========================================================
   TIKTOK MODE — only active when the page is opened with ?streamer=<handle>
   (i.e. from wordgame.live for a live streamer). NOT part of the base
   website game. Viewers' TikTok gifts spawn roses / clear the board.
   ========================================================= */
const TT_STREAMER = (new URLSearchParams(location.search).get('streamer') || '').trim().toLowerCase();
const TT_MODE = /^[a-z0-9_.-]{1,32}$/.test(TT_STREAMER);
const GALAXY_THRESHOLD = 500;   // diamonds ≥ this → clear the board
const ROSE_MAX_PER_GIFT = 8;    // cap roses per gift so a big combo can't flood

function ttSpawnRose() {
  const margin = WALL_PAD + ROSE_R + 4;
  const x = margin + Math.random() * (W - margin * 2);
  Composite.add(engine.world, makeRose(x, HOLD_Y - 10));
  sfx.drop();
}
function ttClearBoard(g) {
  for (const b of Composite.allBodies(engine.world)) {
    if (!b.isStatic && b.plugin) { burst(b.position.x, b.position.y, 3, 4); Composite.remove(engine.world, b); }
  }
  mergeQueue.length = 0;
  shake = Math.min(20, shake + 16);
  sfx.big();
  burst(W / 2, H / 2, MAX_TIER, 60);
}
function ttToast(text, color) {
  floatText(W / 2, DANGER_Y + 60, text, color || '#fb7185', 26);
}
function ttOnGift(g) {
  if (gameOver || inHub) return;   // gifts only affect an active run
  const diamonds = Math.max(1, Number(g && g.diamondCount) || 1);
  const who = (g && g.user && (g.user.displayName || g.user.username)) || 'Someone';
  if (diamonds >= GALAXY_THRESHOLD) {
    ttClearBoard(g);
    ttToast('🌌 ' + who + ' cleared the drawer!', '#a78bfa');
  } else {
    const n = Math.min(diamonds, ROSE_MAX_PER_GIFT);
    for (let i = 0; i < n; i++) setTimeout(ttSpawnRose, i * 170);
    ttToast('🌹 ' + who + ' × ' + n, '#fb7185');
  }
}
function initTikTok() {
  const s = document.createElement('script');
  s.src = '/socket.io/socket.io.js';
  s.onload = () => {
    if (typeof io !== 'function') return;
    try {
      const sock = io({ transports: ['websocket', 'polling'] });
      sock.on('connect', () => sock.emit('join-streamer-gifts', TT_STREAMER));
      sock.on('gift', ttOnGift);
      window.__ttSock = sock;
    } catch (e) { /* socket unavailable — game stays fully playable */ }
  };
  s.onerror = () => { /* /socket.io not served here (base game) — silently off */ };
  document.head.appendChild(s);
}

/* ---------- boot ---------- */
initProfile();      // guest profile immediately; initAuth swaps in the account profile
initAuth();
layout();
if (TT_MODE) {
  // streamer / widget mode: no hub, no menus — drop straight into an endless
  // game so the stream shows gameplay immediately. Gifts drive it.
  document.body.classList.add('tt-mode');
  initTikTok();
  playMode('endless');
} else {
  startRun();
  showScreen('hub');  // base game: land on the hoarder house
}
// diagnostics hook for gift simulation
window.__jd.gift = ttOnGift;
requestAnimationFrame(frame);
</script>
  <script src="/js/hangstream-brand.js" defer></script>
</body>
