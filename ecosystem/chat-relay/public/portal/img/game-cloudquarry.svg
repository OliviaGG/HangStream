<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Quarry</title>
  <desc id="desc">A bright floating formation of blue and green glass blocks breaking apart above grassy hills.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf1"/><stop offset=".62" stop-color="#b9eff8"/><stop offset="1" stop-color="#e8f7b8"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9bec6c"/><stop offset="1" stop-color="#45a964"/></linearGradient>
    <linearGradient id="glassA" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dcfbff"/><stop offset=".35" stop-color="#69dff1"/><stop offset="1" stop-color="#159bd1"/></linearGradient>
    <linearGradient id="glassB" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#efffea"/><stop offset=".35" stop-color="#9aeb7c"/><stop offset="1" stop-color="#45b96e"/></linearGradient>
