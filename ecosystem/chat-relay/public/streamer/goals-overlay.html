        root.classList.toggle('anim-fade', w.animation === 'fade');
        root.classList.toggle('anim-pop', w.animation === 'pop');
        root.classList.toggle('anim-none', w.animation === 'none');
        renderChatFeedRows(w);
      }

      function pushStreamChatMessage(data) {
        if (!data || !data.message) return;
        const key = String(data.id || '') || ('chat-' + Date.now() + '-' + Math.random().toString(36).slice(2));
        recentStreamChat.push({ key, data, receivedAt: Date.now() });
        while (recentStreamChat.length > MAX_RECENT_STREAM_CHAT) recentStreamChat.shift();
        renderAllChatFeeds();
      }

      // ── Camera Embed widget ──────────────────────────────
      // Shared device-camera feed for one or more camera widgets. All
      // widgets mirror the same MediaStream so we never try to open the
      // camera multiple times from one page. The first enabled camera
      // widget in widgetOrder decides front-vs-back camera selection.
      let _cameraStream = null;
      let _cameraFacingMode = null;
      let _cameraStatus = 'idle';
      let _cameraErrorText = '';
      let _cameraRequestSeq = 0;
      // Front/back override set by the stream-view Flip button; wins over the
      // widget's configured cameraFacing so a flip isn't reverted by config snapshots.
      let _cameraFacingOverride = null;

      // ── Phone Cam runtime (WHEP) ──────────────────────────
      // The phone publishes SRT to MediaMTX on render1 over Tailscale; we pull
      // it back as WebRTC/WHEP and hand the resulting MediaStream to the very
      // same presentation pipeline the device camera uses (chroma key, glass,
      // fit, mirror). Only the acquisition differs.
      //
      // The endpoint is http://127.0.0.1 on purpose even though this page is
      // https: loopback counts as a "potentially trustworthy" origin, so it is
      // NOT blocked as mixed content. That also means the phone feed never
      // leaves the box — MediaMTX binds WHEP to loopback only.
      //
      // We read `phonecam`, NOT `phone`. The phone publishes AAC over SRT and
      // WebRTC cannot carry AAC — MediaMTX logs "skipping track 2 (MPEG-4
      // Audio)" and forwards video only, so the mic is silently lost. The
      // `phonecam` path is a runOnDemand ffmpeg that copies the video untouched
      // and transcodes ONLY the audio to Opus. Reading `phone` here = no voice.
      //
      // runOnDemand needs ~5s to spin up, so the first WHEP POST after an idle
      // period 404s. That is expected and handled by the offline/retry path
      // below — do not "fix" it by pre-starting the transcode.
      const PHONE_WHEP_URL = 'http://127.0.0.1:8889/phonecam/whep';
      // Must exceed MediaMTX's runOnDemandStartTimeout (15s) so a normal cold
      // start isn't mistaken for a hang, but stay finite so a wedged request
      // always falls through to the retry path.
      const WHEP_POST_TIMEOUT_MS = 20000;
      // Backstop: any 'connecting' older than this is treated as wedged and a
      // fresh negotiation is allowed through.
      const WHEP_STUCK_MS = 30000;
      let _phoneStream = null;
      let _phoneStatus = 'idle';
      let _phoneErrorText = '';
      let _phonePc = null;
      let _phoneRequestSeq = 0;
      let _phoneRetryTimer = null;
      let _phoneConnectingSince = 0;

      // Which MediaStream/status a given entry should be reading. Lets the
      // shared camera helpers serve both widget types without forking them.
      function _entryStream(entry) {
        return entry && entry.type === 'phoneCam' ? _phoneStream : _cameraStream;
      }
      function _entryStatus(entry) {
        return entry && entry.type === 'phoneCam' ? _phoneStatus : _cameraStatus;
      }

      function orderedWidgetsOfType(type) {
        const widgets = Array.isArray(currentConfig?.widgets) ? currentConfig.widgets : [];
        const order = Array.isArray(currentConfig?.widgetOrder) ? currentConfig.widgetOrder : widgets.map(w => w.id);
        const byId = new Map(widgets.map(w => [w.id, w]));
        const out = [];
        for (const id of order) {
          const w = byId.get(id);
          if (!w || w.type !== type) continue;
          out.push(w);
          byId.delete(id);
        }
        for (const w of byId.values()) if (w.type === type) out.push(w);
        return out;
      }

      function getCameraControllerWidget() {
        for (const w of orderedWidgetsOfType('cameraEmbed')) {
          if (w && w.enabled !== false) return w;
        }
        return null;
      }

      function stopCameraStream() {
        for (const entry of widgetMap.values()) {
          if (entry.type === 'cameraEmbed') stopCameraKeyRenderer(entry);
        }
        if (_cameraStream) {
          try {
            for (const track of _cameraStream.getTracks()) {
              try { track.stop(); } catch (_) {}
            }
          } catch (_) {}
        }
        _cameraStream = null;
      }

      function formatCameraError(err) {
        const name = String(err?.name || '').trim();
        if (name === 'NotAllowedError' || name === 'SecurityError') {
          return 'Camera permission was blocked. Allow camera access for this site, then try again.';
        }
        if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
          return 'No camera was found on this device.';
        }
        if (name === 'NotReadableError' || name === 'TrackStartError') {
          return 'The camera is already in use by another app or browser tab.';
        }
        if (name === 'OverconstrainedError') {
          return 'The selected camera mode is not available on this device.';
        }
        if (name === 'AbortError') {
          return 'Camera startup was interrupted. Try again.';
        }
        return 'Unable to start the camera in this browser.';
      }

      function stopCameraKeyRenderer(entry) {
        if (!entry) return;
        if (entry.cameraKeyRaf) {
          try { cancelAnimationFrame(entry.cameraKeyRaf); } catch (_) {}
        }
        entry.cameraKeyRaf = null;
        entry.cameraKeyRunning = false;
        const canvas = entry.cameraCanvas;
        if (canvas) {
          try {
            const ctx = entry.cameraKeyCtx;
            if (ctx) ctx.clearRect(0, 0, canvas.width || 0, canvas.height || 0);
          } catch (_) {}
        }
      }

      function resizeCameraCanvas(entry) {
        const canvas = entry.cameraCanvas;
        const stage = entry.cameraStage;
        if (!canvas || !stage) return false;
        const rawW = Math.max(1, Math.round(stage.clientWidth || stage.getBoundingClientRect().width || 1));
        const rawH = Math.max(1, Math.round(stage.clientHeight || stage.getBoundingClientRect().height || 1));
        // Black-keying reads pixels every frame; cap the processing canvas so
        // a fullscreen camera widget does not burn through the frame budget.
        const scale = Math.min(1, 960 / rawW, 960 / rawH);
        const w = Math.max(1, Math.round(rawW * scale));
        const h = Math.max(1, Math.round(rawH * scale));
        if (canvas.width !== w) canvas.width = w;
        if (canvas.height !== h) canvas.height = h;
        return true;
      }

      function drawCameraKeyFrame(entry) {
        const video = entry.cameraVideo;
        const canvas = entry.cameraCanvas;
        if (!video || !canvas || !resizeCameraCanvas(entry)) return;
        const vw = video.videoWidth || 0;
        const vh = video.videoHeight || 0;
        if (!vw || !vh) return;
        let ctx = entry.cameraKeyCtx;
        if (!ctx) {
          try { ctx = entry.cameraKeyCtx = canvas.getContext('2d', { willReadFrequently: true }); }
          catch (_) { ctx = canvas.getContext('2d'); entry.cameraKeyCtx = ctx; }
        }
        if (!ctx) return;
        const cw = canvas.width;
        const ch = canvas.height;
        const fit = entry.cameraFit === 'contain' ? 'contain' : 'cover';
        const scale = fit === 'contain' ? Math.min(cw / vw, ch / vh) : Math.max(cw / vw, ch / vh);
        const dw = vw * scale;
        const dh = vh * scale;
        const dx = (cw - dw) / 2;
        const dy = (ch - dh) / 2;
        ctx.clearRect(0, 0, cw, ch);
        ctx.save();
        if (entry.cameraMirror) {
          ctx.translate(cw, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(video, cw - dx - dw, dy, dw, dh);
        } else {
          ctx.drawImage(video, dx, dy, dw, dh);
        }
        ctx.restore();
        let img;
        try { img = ctx.getImageData(0, 0, cw, ch); } catch (_) { return; }
        const data = img.data;
        const threshold = Math.max(0, Math.min(120, Number(entry.cameraKeyThreshold) || 0));
        const softness = Math.max(0, Math.min(120, Number(entry.cameraKeySoftness) || 0));
        const softEnd = threshold + Math.max(1, softness);
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const v = Math.max(r, g, b);
          if (v <= threshold) {
            data[i + 3] = 0;
          } else if (softness > 0 && v < softEnd) {
            data[i + 3] = Math.max(0, Math.min(255, Math.round(255 * (v - threshold) / softness)));
          }
        }
        ctx.putImageData(img, 0, 0);
      }

      function syncCameraKeyRenderer(entry) {
        if (!entry) return;
        if (!entry.cameraKeyEnabled || _entryStatus(entry) !== 'live' || !_entryStream(entry)) {
          stopCameraKeyRenderer(entry);
          return;
        }
        if (entry.cameraKeyRunning) return;
        entry.cameraKeyRunning = true;
        const loop = () => {
          if (!entry.cameraKeyRunning || !entry.cameraKeyEnabled || _entryStatus(entry) !== 'live' || !_entryStream(entry)) {
            stopCameraKeyRenderer(entry);
            return;
          }
          drawCameraKeyFrame(entry);
          entry.cameraKeyRaf = requestAnimationFrame(loop);
        };
        loop();
      }

      function ensureCameraEmbedShell(entry) {
        if (!entry.contentEl.firstElementChild) {
          entry.contentEl.innerHTML = ''
            + '<div class="camera-embed">'
            +   '<div class="camera-stage">'
            +     '<video class="camera-video" autoplay muted playsinline></video>'
            +     '<canvas class="camera-key-canvas"></canvas>'
            +     '<div class="camera-overlay">'
            +       '<div class="camera-placeholder">'
            +         '<div class="camera-icon">📷</div>'
            +         '<div class="camera-title">Camera</div>'
            +         '<div class="camera-message"></div>'
            +         '<button type="button" class="camera-action" hidden>Try again</button>'
            +       '</div>'
            +     '</div>'
            +   '</div>'
            + '</div>';
        }
        const root = entry.contentEl.firstElementChild;
        const stageEl = root && root.querySelector('.camera-stage');
        const video = root && root.querySelector('.camera-video');
        const canvas = root && root.querySelector('.camera-key-canvas');
        const overlay = root && root.querySelector('.camera-overlay');
        const message = root && root.querySelector('.camera-message');
        const action = root && root.querySelector('.camera-action');
        if (action && !action.dataset.bound) {
          action.dataset.bound = '1';
          action.addEventListener('click', () => {
            if (entry.type === 'phoneCam') syncPhoneCamRuntime({ forceRestart: true });
            else syncCameraRuntime({ forceRestart: true, userGesture: true });
          });
        }
        entry.cameraRoot = root;
        entry.cameraStage = stageEl;
        entry.cameraVideo = video;
        entry.cameraCanvas = canvas;
        entry.cameraOverlay = overlay;
        entry.cameraMessage = message;
        entry.cameraAction = action;
        return { root, stageEl, video, canvas, overlay, message, action };
      }

      function applyCameraEntryState(entry, state, messageText, canRetry) {
        const { root, video, message, action } = ensureCameraEmbedShell(entry);
        if (!root || !video) return;
        root.classList.toggle('live', state === 'live');
        if (message) message.textContent = messageText || '';
        if (action) {
          action.hidden = !canRetry;
          if (canRetry) action.textContent = 'Try again';
        }
        const stream = _entryStream(entry);
        if (state === 'live' && stream) {
          if (video.srcObject !== stream) video.srcObject = stream;
          // The shell markup hardcodes `muted` (the device camera must never
          // feed itself back). Phone Cam carries the phone's mic, so honour the
          // widget's mute toggle instead — this is what puts voice on stream.
          video.muted = entry.type === 'phoneCam' ? !!entry.phoneMuted : true;
          try { video.play().catch(() => {}); } catch (_) {}
          syncCameraKeyRenderer(entry);
        } else if (video.srcObject) {
          try { video.srcObject = null; } catch (_) {}
          stopCameraKeyRenderer(entry);
        } else {
          stopCameraKeyRenderer(entry);
        }
      }

      function refreshCameraEntries() {
        for (const w of orderedWidgetsOfType('cameraEmbed')) {
          const entry = widgetMap.get(w.id);
          if (!entry) continue;
          if (!isWidgetVisible(w)) {
            applyCameraEntryState(entry, 'idle', '', false);
            continue;
          }
          if (previewMode) {
            applyCameraEntryState(entry, 'preview', 'Dashboard preview uses a placeholder. Open your live stream-view page to use the real device camera.', false);
            continue;
          }
          if (_cameraStatus === 'live' && _cameraStream) {
            applyCameraEntryState(entry, 'live', '', false);
          } else if (_cameraStatus === 'requesting') {
            applyCameraEntryState(entry, 'requesting', 'Requesting camera permission…', false);
          } else if (_cameraStatus === 'unsupported') {
            applyCameraEntryState(entry, 'unsupported', 'This browser does not expose camera access for the overlay.', false);
          } else if (_cameraStatus === 'error') {
            applyCameraEntryState(entry, 'error', _cameraErrorText || 'Unable to start the camera.', true);
          } else {
            applyCameraEntryState(entry, 'idle', 'Enable the widget in your live stream-view page to start the camera.', true);
          }
        }
      }

      async function syncCameraRuntime(opts) {
        const options = opts || {};
        const controller = getCameraControllerWidget();
        if (previewMode) {
          _cameraStatus = 'preview';
          _cameraErrorText = '';
          stopCameraStream();
          refreshCameraEntries();
          return;
        }
        if (!controller) {
          _cameraStatus = 'idle';
          _cameraErrorText = '';
          _cameraFacingMode = null;
          stopCameraStream();
          refreshCameraEntries();
          return;
        }
        if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
          _cameraStatus = 'unsupported';
          _cameraErrorText = 'Camera access is not available in this browser.';
          _cameraFacingMode = null;
          stopCameraStream();
          refreshCameraEntries();
          return;
        }
        const configuredFacing = controller.cameraFacing === 'environment' ? 'environment' : 'user';
        const desiredFacing = _cameraFacingOverride || configuredFacing;
        const trackEnded = !_cameraStream || !_cameraStream.getVideoTracks().some(track => track.readyState === 'live');
        const needsRestart = !!options.forceRestart || trackEnded || !_cameraStream || _cameraFacingMode !== desiredFacing;
        if (!needsRestart) {
          _cameraStatus = 'live';
          _cameraErrorText = '';
          refreshCameraEntries();
          return;
        }

        const seq = ++_cameraRequestSeq;
        _cameraStatus = 'requesting';
        _cameraErrorText = '';
        _cameraFacingMode = desiredFacing;
        stopCameraStream();
        refreshCameraEntries();
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: desiredFacing },
              width: { ideal: 1920 },
              height: { ideal: 1080 },
            },
            audio: false,
          });
          if (seq !== _cameraRequestSeq) {
            try { for (const track of stream.getTracks()) track.stop(); } catch (_) {}
            return;
          }
          _cameraStream = stream;
          _cameraStatus = 'live';
          _cameraErrorText = '';
        } catch (err) {
          if (seq !== _cameraRequestSeq) return;
          _cameraStatus = 'error';
          _cameraErrorText = formatCameraError(err);
          stopCameraStream();
        }
        refreshCameraEntries();
      }

      // ── Phone Cam: WHEP negotiation ───────────────────────
      // Minimal WHEP client: offer recvonly audio+video, POST the SDP, apply
      // the answer. MediaMTX replies 404 when nothing is publishing to the
      // path, which is the normal "phone is not broadcasting" case rather than
      // an error worth shouting about.
      function getPhoneCamControllerWidget() {
        for (const w of orderedWidgetsOfType('phoneCam')) {
          if (w && w.enabled !== false) return w;
        }
        return null;
      }

      function stopPhoneCamStream() {
        for (const entry of widgetMap.values()) {
          if (entry.type === 'phoneCam') stopCameraKeyRenderer(entry);
        }
        if (_phonePc) {
          try { _phonePc.close(); } catch (_) {}
          _phonePc = null;
        }
        if (_phoneStream) {
          try { for (const t of _phoneStream.getTracks()) { try { t.stop(); } catch (_) {} } } catch (_) {}
        }
        _phoneStream = null;
      }

      function _schedulePhoneCamRetry(delayMs) {
        if (_phoneRetryTimer) return;
        _phoneRetryTimer = setTimeout(() => {
          _phoneRetryTimer = null;
          syncPhoneCamRuntime({ forceRestart: true });
        }, delayMs);
      }

      async function whepConnect(url, seq) {
        const pc = new RTCPeerConnection({ iceServers: [] });
        pc.addTransceiver('video', { direction: 'recvonly' });
        pc.addTransceiver('audio', { direction: 'recvonly' });
        const remote = new MediaStream();
        pc.ontrack = (ev) => {
          try { remote.addTrack(ev.track); } catch (_) {}
        };
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        // Wait for ICE gathering so the single localhost candidate is in the
        // offer — MediaMTX has no trickle endpoint on the initial POST.
        if (pc.iceGatheringState !== 'complete') {
          await new Promise((resolve) => {
            const done = () => { pc.removeEventListener('icegatheringstatechange', check); resolve(); };
            const check = () => { if (pc.iceGatheringState === 'complete') done(); };
            pc.addEventListener('icegatheringstatechange', check);
            setTimeout(done, 1500);
          });
        }
        // MediaMTX holds the WHEP POST open while runOnDemand spins the
        // transcode up, and if that command dies it can hold it indefinitely —
        // which used to wedge the widget on "Connecting…" forever, because an
        // unsettled promise leaves _phoneStatus at 'connecting' and the guard
        // in syncPhoneCamRuntime then refuses every retry. Always bound it.
        const ctl = new AbortController();
        const killer = setTimeout(() => { try { ctl.abort(); } catch (_) {} }, WHEP_POST_TIMEOUT_MS);
        let res;
        try {
          res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/sdp' },
            body: pc.localDescription.sdp,
            signal: ctl.signal,
          });
        } catch (e) {
          try { pc.close(); } catch (_) {}
          const err = new Error(e && e.name === 'AbortError' ? 'whep_timeout' : ('whep_fetch_' + (e?.message || 'failed')));
          throw err;
        } finally {
          clearTimeout(killer);
        }
        if (!res.ok) {
          try { pc.close(); } catch (_) {}
          const err = new Error('whep_' + res.status);
          err.status = res.status;
          throw err;
        }
        const answer = await res.text();
        if (seq !== _phoneRequestSeq) { try { pc.close(); } catch (_) {} return null; }
        await pc.setRemoteDescription({ type: 'answer', sdp: answer });
        return { pc, stream: remote };
      }

      function refreshPhoneCamEntries() {
        for (const w of orderedWidgetsOfType('phoneCam')) {
          const entry = widgetMap.get(w.id);
          if (!entry) continue;
          entry.phoneMuted = !!w.muted;
          if (!isWidgetVisible(w)) { applyCameraEntryState(entry, 'idle', '', false); continue; }
          if (previewMode) {
            applyCameraEntryState(entry, 'preview', 'Dashboard preview does not pull the phone feed. It appears on the live overlay.', false);
            continue;
          }
          if (_phoneStatus === 'live' && _phoneStream) {
            applyCameraEntryState(entry, 'live', '', false);
          } else if (_phoneStatus === 'connecting') {
            applyCameraEntryState(entry, 'requesting', 'Connecting to the phone feed…', false);
          } else if (_phoneStatus === 'offline') {
            applyCameraEntryState(entry, 'idle', 'Phone is not broadcasting. Start the stream in Larix on your phone.', false);
          } else if (_phoneStatus === 'error') {
            applyCameraEntryState(entry, 'error', _phoneErrorText || 'Unable to pull the phone feed.', true);
          } else {
            applyCameraEntryState(entry, 'idle', 'Phone Cam is idle.', false);
          }
        }
      }

      async function syncPhoneCamRuntime(opts) {
        const options = opts || {};
        const controller = getPhoneCamControllerWidget();
        if (previewMode) {
          _phoneStatus = 'preview'; _phoneErrorText = '';
          stopPhoneCamStream(); refreshPhoneCamEntries();
          return;
        }
        if (!controller) {
          _phoneStatus = 'idle'; _phoneErrorText = '';
          stopPhoneCamStream(); refreshPhoneCamEntries();
          return;
        }
        if (typeof RTCPeerConnection !== 'function') {
          _phoneStatus = 'error';
          _phoneErrorText = 'This browser build has no WebRTC support.';
          refreshPhoneCamEntries();
          return;
        }
        const alive = _phoneStream && _phoneStream.getVideoTracks().some(t => t.readyState === 'live');
        if (alive && !options.forceRestart) {
          _phoneStatus = 'live'; refreshPhoneCamEntries();
          return;
        }
        // A negotiation is already in flight; don't cancel it by starting
        // another. Same reason a retry timer is left to fire on its own.
        // The age check is the backstop: if anything ever leaves us in
        // 'connecting' without settling, this breaks the deadlock instead of
        // sitting on "Connecting to the phone feed…" indefinitely.
        const stuck = _phoneStatus === 'connecting'
          && _phoneConnectingSince
          && (Date.now() - _phoneConnectingSince) > WHEP_STUCK_MS;
        if (!options.forceRestart && !stuck && (_phoneStatus === 'connecting' || _phoneRetryTimer)) {
          refreshPhoneCamEntries();
          return;
        }

        const seq = ++_phoneRequestSeq;
        _phoneStatus = 'connecting'; _phoneErrorText = '';
        _phoneConnectingSince = Date.now();
        stopPhoneCamStream();
        refreshPhoneCamEntries();
        try {
          const result = await whepConnect(PHONE_WHEP_URL, seq);
          if (!result || seq !== _phoneRequestSeq) return;
          _phonePc = result.pc;
          _phoneStream = result.stream;
          _phoneStatus = 'live';
          _phoneErrorText = '';
          // A phone that walks out of coverage drops the tracks; reconnect
          // rather than leaving a frozen last frame on stream.
          _phonePc.onconnectionstatechange = () => {
            if (!_phonePc) return;
            const st = _phonePc.connectionState;
            if (st === 'failed' || st === 'disconnected' || st === 'closed') {
              _phoneStatus = 'offline';
              stopPhoneCamStream();
              refreshPhoneCamEntries();
              _schedulePhoneCamRetry(2000);
            }
          };
        } catch (err) {
          if (seq !== _phoneRequestSeq) return;
          stopPhoneCamStream();
          if (err && err.status === 404) {
            // Nothing publishing yet — poll quietly until the phone appears.
            _phoneStatus = 'offline';
            _phoneErrorText = '';
            _schedulePhoneCamRetry(3000);
          } else {
            _phoneStatus = 'error';
            _phoneErrorText = 'Phone feed unavailable (' + (err?.message || 'connection failed') + ').';
            _schedulePhoneCamRetry(5000);
          }
        }
        refreshPhoneCamEntries();
      }

      function renderPhoneCamWidget(w) {
        const entry = widgetMap.get(w.id);
        if (!entry) return;
        entry.phoneMuted = !!w.muted;
        renderCameraEmbedWidget(w);
        // No syncPhoneCamRuntime() here on purpose — the render pass calls it
        // once at the end (next to syncCameraRuntime). Calling it per-widget
        // too would bump _phoneRequestSeq mid-negotiation and cancel the
        // in-flight WHEP offer on every single render.
      }

      function renderCameraEmbedWidget(w) {
        const entry = widgetMap.get(w.id);
        if (!entry) return;
        const { root, video } = ensureCameraEmbedShell(entry);
        if (!root || !video) return;
        applyCommonStyles(w, entry);
        const isLandscape = document.body.classList.contains('landscape');
        const canvasW = isLandscape ? 1920 : 1080;
        const canvasH = isLandscape ? 1080 : 1920;
        const widthPct = Number(w.widthPct) || 32;
        const heightPct = Number(w.heightPct) || 22;
        root.style.width = Math.round(canvasW * widthPct / 100) + 'px';
        root.style.height = Math.round(canvasH * heightPct / 100) + 'px';
        video.style.objectFit = (w.cameraFit === 'contain') ? 'contain' : 'cover';
        // Phone Cam defaults mirror OFF (see _typeDefaults), so it needs a
        // truthy test — `!== false` would flip an unset value the wrong way.
        const wantMirror = w.type === 'phoneCam' ? !!w.mirror : (w.mirror !== false);
        video.classList.toggle('mirror', wantMirror);
        if (w.type === 'phoneCam') {
          const icon = root.querySelector('.camera-icon');
          const title = root.querySelector('.camera-title');
          if (icon) icon.textContent = '📱';
          if (title) title.textContent = 'Phone Cam';
        }
        const glassTint = /^#[0-9a-f]{6}$/i.test(String(w.cameraGlassTint || '')) ? w.cameraGlassTint : '#ffffff';
        const glassOpacity = Math.max(0, Math.min(100, Number(w.cameraGlassOpacity) || 0)) / 100;
        const glassEdge = Math.max(0, Math.min(100, Number(w.cameraGlassEdge) || 0)) / 100;
        root.style.setProperty('--camera-glass-fill-top', hexWithOpacity(glassTint, glassOpacity));
        root.style.setProperty('--camera-glass-fill-bottom', hexWithOpacity(glassTint, glassOpacity * 0.38));
        root.style.setProperty('--camera-glass-edge-strong', hexWithOpacity(glassTint, glassEdge));
        root.style.setProperty('--camera-glass-edge-soft', hexWithOpacity(glassTint, glassEdge * 0.13));
        root.style.setProperty('--camera-glass-edge-mid', hexWithOpacity(glassTint, glassEdge * 0.40));
        root.style.setProperty('--camera-glass-blur', Math.max(0, Math.min(50, Number(w.cameraGlassBlur) || 0)) + 'px');
        root.style.setProperty('--camera-glass-saturation', Math.max(80, Math.min(300, Number(w.cameraGlassSaturation) || 185)) + '%');
        root.style.setProperty('--camera-glass-brightness', Math.max(60, Math.min(160, Number(w.cameraGlassBrightness) || 100)) + '%');
        root.classList.remove('bg-black', 'bg-transparent', 'bg-glass');
        const bgMode = (w.cameraBg === 'transparent' || w.cameraBg === 'glass') ? w.cameraBg : 'black';
        root.classList.add('bg-' + bgMode);
        root.classList.toggle('key-black', !!w.keyBlackBg);
        entry.cameraFit = (w.cameraFit === 'contain') ? 'contain' : 'cover';
        entry.cameraMirror = wantMirror;
        entry.cameraKeyEnabled = !!w.keyBlackBg;
        entry.cameraKeyThreshold = Number.isFinite(Number(w.keyThreshold)) ? Number(w.keyThreshold) : 18;
        entry.cameraKeySoftness = Number.isFinite(Number(w.keySoftness)) ? Number(w.keySoftness) : 18;
        if (!entry.cameraKeyEnabled) stopCameraKeyRenderer(entry);
        else syncCameraKeyRenderer(entry);
        if (w.type === 'phoneCam') refreshPhoneCamEntries();
        else refreshCameraEntries();
      }

      // ── Desktop Stream widget ────────────────────────────────
      // iframe wrapper around /streamer/desktop-feed.html so the Windows OBS
      // desktop HLS feed can be moved, sized, and layered like any widget.
      function renderDesktopStreamWidget(w) {
        const entry = widgetMap.get(w.id);
        if (!entry || !entry.contentEl) return;
        applyCommonStyles(w, entry);

        const isLandscape = document.body.classList.contains('landscape');
        const canvasW = isLandscape ? 1920 : 1080;
        const canvasH = isLandscape ? 1080 : 1920;
        const wPx = Math.round(canvasW * (Number(w.widthPct) || 48) / 100);
        const hPx = Math.round(canvasH * (Number(w.heightPct) || 27) / 100);

        let iframe = entry.desktopStreamIframe;
        if (!iframe) {
          iframe = document.createElement('iframe');
          iframe.setAttribute('scrolling', 'no');
          iframe.setAttribute('title', 'Desktop Stream');
          iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-autoplay');
          iframe.style.cssText = 'border:0;background:transparent;display:block;width:100%;height:100%;';
          iframe.allowTransparency = 'true';
          entry.contentEl.innerHTML = '';
          entry.contentEl.appendChild(iframe);
          entry.desktopStreamIframe = iframe;
        }

        iframe.style.width = wPx + 'px';
        iframe.style.height = hPx + 'px';
        // object-fit on an iframe is a no-op, but we keep it in sync with the
        // widget's cameraFit setting for consistency with the camera widgets.
        // The desktop-feed page itself hard-codes object-fit: contain.
        iframe.style.objectFit = (w.cameraFit === 'contain') ? 'contain' : 'cover';
        const feedUrl = '/streamer/desktop-feed.html?muted=' + (w.muted !== false ? '1' : '0');
        _setIframeSrcIfChanged(iframe, feedUrl);
      }

      // ── Game Embed widget ────────────────────────────────
      // The game iframe rendered inside a widget container. Same drag, scale,
      // border, bg, etc. as other widgets — plus width/height % sliders that
      // size the container (and the iframe inside it) as a portion of the
      // OBS canvas.
      let _gameUrlPollerStarted = false;
      const _gameEmbedIframes = new Set();

      function _sameIframeSrc(iframe, url) {
        if (!iframe) return false;
        const raw = String(url || '');
        const attr = iframe.getAttribute('src') || '';
        if (attr === raw) return true;
        if (raw === 'about:blank') return iframe.src === 'about:blank';
        try {
          return iframe.src === new URL(raw, location.href).href;
        } catch (_) {
          return iframe.src === raw;
        }
      }

      function _setIframeSrcIfChanged(iframe, url) {
        if (!iframe) return;
        if (!_sameIframeSrc(iframe, url)) iframe.src = url;
      }

      function _gameEmbedRequestSig(w) {
        const gameId = resolveWidgetGameContext(w) || '';
        const rows = Number.isFinite(Number(w?.gridRows)) ? Math.max(3, Math.min(25, Math.round(Number(w.gridRows)))) : '';
        return [w?.id || '', gameId, w?.SubtextleMode || '', rows].join('|');
      }

      async function _refreshGameEmbedSource(w, entry) {
        if (!w || !entry) return;
        const requestedGameId = resolveWidgetGameContext(w);
        const requestSig = _gameEmbedRequestSig(w);
        const now = Date.now();
        if (!requestedGameId) {
          entry.gameRequestSig = requestSig;
          entry.gameResolvedUrl = null;
          entry.gameResolvedGameId = null;
          entry.gameViewportMode = 'responsive';
          if (entry.gameIframe) {
            try { if (entry.gameIframe.src !== 'about:blank') entry.gameIframe.src = 'about:blank'; } catch (_) {}
          }
          return;
        }
        if (entry.gameRequestSig === requestSig && entry.gameResolvedUrl && (now - Number(entry.gameLastFetchedAt || 0)) < 4000) return;
        if (entry.gameRequestInflight === requestSig) return;
        entry.gameRequestInflight = requestSig;
        try {
          const params = new URLSearchParams({ gameId: requestedGameId, widgetId: w.id, mode });
          const r = await fetch('/api/streamer-public/' + encodeURIComponent(streamerId) + '/stream-game?' + params.toString(), { cache: 'no-store' });
          const data = await r.json();
          if (entry.gameRequestInflight !== requestSig) return;
          if (!data?.ok || !data.boardOverlayUrl) return;
          let resolvedUrl = data.boardOverlayUrl;
          const resolvedGameId = data.gameId || requestedGameId;
          try {
            if (resolvedGameId === 'Subtextle' && w.SubtextleMode === 'grid' && resolvedUrl) {
              const sep = resolvedUrl.includes('?') ? '&' : '?';
              resolvedUrl += sep + 'mode=grid';
              const rawRows = w.gridRows;
              if (Number.isFinite(Number(rawRows))) {
                const rows = Math.max(3, Math.min(25, Math.round(Number(rawRows))));
                resolvedUrl += '&rows=' + rows;
              }
            }
          } catch (_) {}
          const nextViewportMode = data.viewportMode || 'responsive';
          const changed =
            resolvedUrl !== entry.gameResolvedUrl
            || resolvedGameId !== (entry.gameResolvedGameId || null)
            || nextViewportMode !== (entry.gameViewportMode || 'responsive');
          entry.gameRequestSig = requestSig;
          entry.gameLastFetchedAt = Date.now();
          entry.gameResolvedUrl = resolvedUrl;
          entry.gameResolvedGameId = resolvedGameId;
          entry.gameViewportMode = nextViewportMode;
          _setIframeSrcIfChanged(entry.gameIframe, resolvedUrl);
          if (changed) {
            entry.lastGameEmbedSig = null;
            renderGameEmbedWidget(w);
          }
        } catch (_) { /* ignore */ }
        finally {
          if (entry.gameRequestInflight === requestSig) entry.gameRequestInflight = null;
        }
      }

      // Shared post-fetch handler for /stream-game payloads. Called by BOTH
      // the stream-view bg-game poller (pollGameUrl in the embedGame branch)
      // and the OBS-path poller below — one fetch now feeds the background
      // iframe, the active-game bookkeeping, and every gameEmbed widget.
      function applyStreamGameData(data) {
            if (!data?.ok || !data.boardOverlayUrl) return;
            const gameIdChanged = (data.gameId || null) !== currentActiveGameId;
            currentActiveGameId = data.gameId || null;
            // Set a per-game body class so CSS can apply game-specific
            // tweaks (e.g. clipping the glass widget to where the actual
            // game card visually sits). Strip any prior game class first.
            try {
              const prevClasses = [...document.body.classList].filter(c => c.startsWith('game-'));
              prevClasses.forEach(c => document.body.classList.remove(c));
              if (currentActiveGameId && /^[a-z0-9_-]+$/.test(currentActiveGameId)) {
                document.body.classList.add('game-' + currentActiveGameId);
              }
            } catch (_) {}
            // A game-id flip swaps the active per-game layout overrides —
            // re-layout EVERY widget so positions snap to the new game's
            // tuned defaults (or fall back to base layout). Also re-render
            // the animated background — auto-mode picks the new game's
            // preset/colors from defaultBgPerGame / config.background.perGame.
            if (gameIdChanged && currentConfig?.widgets) {
              for (const w of currentConfig.widgets) {
                const pos = resolveWidgetPos(w);
                if (pos) layoutWidget(w, pos);
              }
              try { ensureAnimBg(); } catch (_) {}
            }
            if (currentConfig?.widgets) {
              for (const w of currentConfig.widgets) {
                if (w.type !== 'gameEmbed') continue;
                const entry = widgetMap.get(w.id);
                if (entry) _refreshGameEmbedSource(w, entry);
              }
            }
      }

      function _ensureGameUrlPoller() {
        if (_gameUrlPollerStarted) return;
        _gameUrlPollerStarted = true;
        // Stream-view (embedGame=1) already polls /stream-game every 5s in
        // pollGameUrl and forwards each payload to applyStreamGameData — a
        // second interval here would just double the network chatter.
        if (embedGame) return;
        const poll = async () => {
          try {
            const r = await fetch('/api/streamer-public/' + encodeURIComponent(streamerId) + '/stream-game', { cache: 'no-store' });
            const data = await r.json();
            applyStreamGameData(data);
          } catch (_) {/* ignore */}
        };
        poll();
        setInterval(poll, 5000);
      }
      // ---- Frosted board glass ----------------------------------------
      // The Game widget's glass sliders reach the embedded game by
      // postMessage, NOT as iframe URL params. A URL change reloads the
      // iframe, which would reset the board every time the streamer nudged a
      // slider mid-stream. Only games that implement the listener are
      // targeted; everyone else silently ignores this.
      //
      // The game bakes the effect with gradients rather than backdrop-filter
      // — render1's software CEF composites backdrop-filter over BLACK, and
      // an iframe cannot sample the parent's animated bg anyway. See the CSS
      // note in the game's own page.
      const _GLASS_CAPABLE_GAMES = new Set(['wordle']);

      function _widgetById(id) {
        try { return (currentConfig?.widgets || []).find(x => x && x.id === id) || null; }
        catch (_) { return null; }
      }

      function _gameGlassPayload(w) {
        const num = (v, dflt) => (Number.isFinite(Number(v)) ? Number(v) : dflt);
        const opacity = num(w?.gameGlassOpacity, 0);
        const frost   = num(w?.gameGlassBlur, 0);
        const edge    = num(w?.gameGlassEdge, 0);
        // Off unless the streamer has actually dialled something in, so the
        // default config renders exactly as it did before this existed.
        const on = (validStyle(w?.style) ? w.style : 'glass') === 'glass'
          && (opacity > 0 || frost > 0 || edge > 0);
        return {
          type: 'wt-glass',
          on,
          tint: /^#[0-9a-f]{6}$/i.test(String(w?.gameGlassTint || '')) ? w.gameGlassTint : '#ffffff',
          opacity,
          frost,
          edge,
          saturation: num(w?.gameGlassSaturation, 100),
          brightness: num(w?.gameGlassBrightness, 100),
          radius: num(w?.gameGlassRadius, 28),
        };
      }

      function _postGameGlass(w, entry, opts) {
        if (!w || !entry || !entry.gameIframe) return;
        const gameId = entry.gameResolvedGameId || resolveWidgetGameContext(w);
        if (!_GLASS_CAPABLE_GAMES.has(gameId)) return;
        const payload = _gameGlassPayload(w);
        const sig = JSON.stringify(payload);
        if (!opts?.force && entry.lastGlassSig === sig) return;
        // Target the game's own origin explicitly — never '*'.
        let origin;
        try { origin = new URL(entry.gameResolvedUrl || '', location.href).origin; }
        catch (_) { return; }
        try {
          const win = entry.gameIframe.contentWindow;
          if (!win) return;
          win.postMessage(payload, origin);
          entry.lastGlassSig = sig;
        } catch (_) { /* iframe not ready yet — the load/ready hooks re-post */ }
      }

      // The child announces itself once its listener is registered; the load
      // event alone can fire before that on a slow load.
      window.addEventListener('message', (ev) => {
        if (!ev.data || ev.data.type !== 'wt-glass-ready') return;
        for (const [id, entry] of widgetMap.entries()) {
          if (entry?.gameIframe && entry.gameIframe.contentWindow === ev.source) {
            const w = _widgetById(id);
            if (w) { entry.lastGlassSig = null; _postGameGlass(w, entry, { force: true }); }
            return;
          }
        }
      });

      // Grid Lite — Subtextle's grid cut down to just the closest words.
      // Points at the standalone /gridlite.html page rather than the full
      // game: that page is hand-written with no bundle and no three.js, so
      // it costs a fraction of a real gameEmbed to show the same words.
      // Scoped to this streamer's private round via ?session=<handle>.
      function renderGridLiteWidget(w) {
        const entry = widgetMap.get(w.id);
        if (!entry || !entry.contentEl) return;
        applyCommonStyles(w, entry);

        const isLandscape = document.body.classList.contains('landscape');
        const canvasW = isLandscape ? 1920 : 1080;
        const canvasH = isLandscape ? 1080 : 1920;
        const wPx = Math.round(canvasW * (Number(w.widthPct) || 34) / 100);
        const hPx = Math.round(canvasH * (Number(w.heightPct) || 26) / 100);

        let iframe = entry.gridLiteIframe;
        if (!iframe) {
          iframe = document.createElement('iframe');
          iframe.setAttribute('scrolling', 'no');
          iframe.setAttribute('title', 'Grid Lite');
          // allow-same-origin is deliberately absent: the page only needs
          // scripts + its own socket, never access to this document.
          iframe.setAttribute('sandbox', 'allow-scripts');
          iframe.style.cssText = 'border:0;background:transparent;display:block;';
          iframe.allowTransparency = 'true';
          entry.contentEl.innerHTML = '';
          entry.contentEl.appendChild(iframe);
          entry.gridLiteIframe = iframe;
          entry.gridLiteSig = null;
        }

        // Rebuild the src only when something in it actually changed —
        // reassigning src reloads the iframe and drops its socket, which
        // would blank the widget mid-round on every unrelated re-render.
        const sig = [wPx, hPx, w.wordCount, w.showPfp, w.scale, currentHandle].join('|');
        if (sig !== entry.gridLiteSig) {
          entry.gridLiteSig = sig;
          iframe.style.width = wPx + 'px';
          iframe.style.height = hPx + 'px';
          const q = new URLSearchParams();
          q.set('count', String(w.wordCount || 7));
          q.set('scale', String(w.scale || 1));
          if (w.showPfp === false) q.set('pfp', '0');
          if (currentHandle) q.set('session', String(currentHandle).toLowerCase());
          _setIframeSrcIfChanged(iframe, 'https://subtextle.com/gridlite.html?' + q.toString());
        }
      }

      // ── Music credits overlay (Pretzel + Incompetech + StreamBeats) ──
      function destroyMusicCreditsIframe(entry) {
        if (!entry || !entry.musicCreditsIframe) return;
        try { entry.musicCreditsIframe.src = 'about:blank'; } catch (_) {}
        entry.musicCreditsIframe.remove();
        entry.musicCreditsIframe = null;
        entry.lastMusicCreditsSig = null;
      }

      function ensureMusicCreditsIframe(entry) {
        let shell = entry.contentEl.querySelector('.music-credits-shell');
        if (!shell) {
          shell = document.createElement('div');
          shell.className = 'music-credits-shell';
          shell.style.cssText = 'position:relative; overflow:hidden; pointer-events:none;';
          entry.contentEl.appendChild(shell);
        }
        let iframe = shell.querySelector('.music-credits-iframe');
        if (!iframe) {
          iframe = document.createElement('iframe');
          iframe.className = 'music-credits-iframe';
          iframe.referrerPolicy = 'no-referrer-when-downgrade';
          iframe.setAttribute('scrolling', 'no');
          iframe.setAttribute('sandbox', 'allow-scripts');
          iframe.src = 'about:blank';
          iframe.style.cssText = 'width:100%; height:100%; border:0; background:transparent; display:block;';
          iframe.allowTransparency = 'true';
          shell.appendChild(iframe);
        }
        entry.musicCreditsIframe = iframe;
        return { shell, iframe };
      }

      function renderMusicCredits(w) {
        const entry = widgetMap.get(w.id);
        if (!entry) return;
        if (!isWidgetVisible(w)) {
          destroyMusicCreditsIframe(entry);
          return;
        }
        const { shell, iframe } = ensureMusicCreditsIframe(entry);
        applyCommonStyles(w, entry);

        const isLandscape = document.body.classList.contains('landscape');
        const canvasW = isLandscape ? 1920 : 1080;
        const canvasH = isLandscape ? 1080 : 1920;
        const widthPct = Number(w.widthPct) || 34;
        const heightPct = Number(w.heightPct) || 18;
        const wPx = Math.round(canvasW * widthPct / 100);
        const hPx = Math.round(canvasH * heightPct / 100);
        shell.style.width = wPx + 'px';
        shell.style.height = hPx + 'px';

        const q = new URLSearchParams();
        q.set('embed', '1');
        if (streamerId) q.set('streamerId', streamerId);
        q.set('style', ['bar', 'card', 'minimal'].includes(w.overlayStyle) ? w.overlayStyle : 'card');
        q.set('position', ['top-left', 'top-right', 'bottom-left', 'bottom-right'].includes(w.position) ? w.position : 'bottom-left');
        q.set('genres', String(w.genres || 'Lofi,EDM,Gaming,Retro'));
        if (w.showPretzel === false) q.set('pretzel', 'false');
        if (w.showIncompetech === false) q.set('incompetech', 'false');
        if (w.showStreamBeats === false) q.set('streambeats', 'false');
        if (w.message) q.set('message', String(w.message));
        const src = '/streamer/music-credits.html?' + q.toString();

        const sig = [isLandscape ? 'l' : 'p', wPx, hPx, src].join('|');
        if (entry.lastMusicCreditsSig === sig) return;
        entry.lastMusicCreditsSig = sig;
        _setIframeSrcIfChanged(iframe, src);
      }

      // ── Spotify DJ request card ─────────────────────────────
      function destroySpotifyDJIframe(entry) {
        if (!entry || !entry.spotifyDJIframe) return;
        try { entry.spotifyDJIframe.src = 'about:blank'; } catch (_) {}
        entry.spotifyDJIframe.remove();
        entry.spotifyDJIframe = null;
        entry.lastSpotifyDJSig = null;
      }

      function ensureSpotifyDJIframe(entry) {
        let shell = entry.contentEl.querySelector('.spotify-dj-shell');
        if (!shell) {
          shell = document.createElement('div');
          shell.className = 'spotify-dj-shell';
          shell.style.cssText = 'position:relative;overflow:hidden;pointer-events:none;';
          entry.contentEl.appendChild(shell);
        }
        let iframe = shell.querySelector('.spotify-dj-iframe');
        if (!iframe) {
          iframe = document.createElement('iframe');
          iframe.className = 'spotify-dj-iframe';
          iframe.referrerPolicy = 'no-referrer-when-downgrade';
          iframe.setAttribute('scrolling', 'no');
          iframe.setAttribute('sandbox', 'allow-scripts');
          iframe.src = 'about:blank';
          iframe.style.cssText = 'width:100%;height:100%;border:0;background:transparent;display:block;';
          iframe.allowTransparency = 'true';
          shell.appendChild(iframe);
        }
        entry.spotifyDJIframe = iframe;
        return { shell, iframe };
      }

      function renderSpotifyDJ(w) {
        const entry = widgetMap.get(w.id);
        if (!entry) return;
        if (!isWidgetVisible(w)) {
          destroySpotifyDJIframe(entry);
          return;
        }
        const { shell, iframe } = ensureSpotifyDJIframe(entry);
        applyCommonStyles(w, entry);

        const isLandscape = document.body.classList.contains('landscape');
        const canvasW = isLandscape ? 1920 : 1080;
        const canvasH = isLandscape ? 1080 : 1920;
        const wPx = Math.round(canvasW * (Number(w.widthPct) || 50) / 100);
        const hPx = Math.round(canvasH * (Number(w.heightPct) || 22) / 100);
        shell.style.width = wPx + 'px';
        shell.style.height = hPx + 'px';

        const q = new URLSearchParams();
        if (streamerId) q.set('streamerId', streamerId);
        q.set('maxTitle', String(Number(w.titleMaxChars) || 42));
        if (w.showAlbumArt === false) q.set('album', '0');
        if (w.showRequester === false) q.set('requester', '0');
        if (w.showQueue === false) q.set('queue', '0');
        if (w.showCommands === false) q.set('commands', '0');
        if (w.showTiers === false) q.set('tiers', '0');
          if (previewMode) q.set('preview', '1');
          q.set('v', '3');
          const src = '/streamer/dj-widget.html?' + q.toString();
        const sig = [isLandscape ? 'l' : 'p', wPx, hPx, src].join('|');
        if (entry.lastSpotifyDJSig === sig) return;
        entry.lastSpotifyDJSig = sig;
        _setIframeSrcIfChanged(iframe, src);
      }

      function renderGameEmbedWidget(w) {
        const entry = widgetMap.get(w.id);
        if (!isWidgetVisible(w)) {
          destroyGameEmbedIframe(entry);
          return;
        }
        const { root, clip, iframe } = ensureGameEmbedIframe(entry);
        if (!root || !clip || !iframe) return;
        applyCommonStyles(w, entry);
        // Re-post glass on every navigation of this iframe (bound once).
        if (!iframe._wtGlassBound) {
          iframe._wtGlassBound = true;
          iframe.addEventListener('load', () => {
            const e2 = widgetMap.get(w.id);
            const w2 = _widgetById(w.id);
            if (e2 && w2) { e2.lastGlassSig = null; _postGameGlass(w2, e2); }
          });
        }
        // Before the sig early-return below: glass is not part of that sig,
        // so it must be pushed on every render pass or slider edits stall.
        _postGameGlass(w, entry);
        // Size the container to the requested % of canvas. Per-game size
        // overrides for this widget's resolved game context win over the
        // widget's universal widthPct/heightPct. Falls through to the
        // server defaults too so game-specific tuning still applies.
        const isLandscape = document.body.classList.contains('landscape');
        const canvasW = isLandscape ? 1920 : 1080;
        const canvasH = isLandscape ? 1080 : 1920;
        const sizeOverride = resolveWidgetSize(w.id);
        const widthPct  = (sizeOverride && Number.isFinite(sizeOverride.widthPct))  ? sizeOverride.widthPct  : (Number(w.widthPct)  || 100);
        const heightPct = (sizeOverride && Number.isFinite(sizeOverride.heightPct)) ? sizeOverride.heightPct : (Number(w.heightPct) || 60);
        const wPx = Math.round(canvasW * widthPct  / 100);
        const hPx = Math.round(canvasH * heightPct / 100);
        const widgetGameId = resolveWidgetGameContext(w);
        const gameEmbedSig = [
          isLandscape ? 'landscape' : 'portrait',
          widthPct,
          heightPct,
          entry.gameViewportMode || 'responsive',
          widgetGameId || '',
          entry.gameResolvedUrl || '',
        ].join('|');
        if (entry.gameResolvedUrl) _setIframeSrcIfChanged(iframe, entry.gameResolvedUrl);
        if (!entry.gameResolvedUrl) {
          try { if (iframe.src !== 'about:blank') iframe.src = 'about:blank'; } catch (_) {}
        }
        if (entry.lastGameEmbedSig === gameEmbedSig && entry.lastGameEmbedRoot === root) {
          _refreshGameEmbedSource(w, entry);
          _ensureGameUrlPoller();
          return;
        }
        entry.lastGameEmbedSig = gameEmbedSig;
        entry.lastGameEmbedRoot = root;
        root.style.width = wPx + 'px';
        root.style.height = hPx + 'px';

        // Iframe sizing per the active game's viewportMode (set by the
        // /api/streamer-public/.../stream-game endpoint):
        //   canvas-native  → iframe sized at the clipper pixels with no
        //                    transform. Game lays itself out at canvas
        //                    resolution. Used by games whose content would
        //                    clip at 720×1280 (e.g. Spelling Bee's
        //                    vertically-centered overlay).
        //   responsive /   → iframe at 720×1280 then CSS-scale to fill.
        //   fixed-720        Matches bgGame behavior. Required for games
        //                    designed at width=720 (wikiSubtextle/wikirect).
        const cw = clip.offsetWidth || wPx;
        const ch = clip.offsetHeight || hPx;
        if ((entry.gameViewportMode || 'responsive') === 'canvas-native') {
          iframe.style.cssText =
            'width:100%; height:100%; transform:none;'
            + 'border:0; background:transparent; display:block;';
        } else {
          const GAME_NATURAL = isLandscape ? { w: 1280, h: 720 } : { w: 720, h: 1280 };
          const sx = cw / GAME_NATURAL.w;
          const sy = ch / GAME_NATURAL.h;
          iframe.style.cssText =
            'width:' + GAME_NATURAL.w + 'px; height:' + GAME_NATURAL.h + 'px;'
            + 'transform-origin: top left;'
            + 'transform: scale(' + sx + ',' + sy + ');'
            + 'border:0; background:transparent; display:block;';
        }
        _refreshGameEmbedSource(w, entry);
        _ensureGameUrlPoller();
      }

      // ── Ad Banner widget (the /ad-vertical/<handle> per-streamer rail) ──
      // The ad page is a fixed 2000×2000 transparent canvas whose only content
      // is a 100px band down (or across) the middle, so we scale that band to
      // fill the widget's short side and window the scroll on the long side.
      function destroyAdBannerIframe(entry) {
        if (!entry || !entry.adIframe) return;
        try { entry.adIframe.src = 'about:blank'; } catch (_) {}
        entry.adIframe.remove();
        entry.adIframe = null;
        entry.lastAdBannerSig = null;
      }

      function ensureAdBannerIframe(entry) {
        let shell = entry.contentEl.querySelector('.ad-banner-shell');
        if (!shell) {
          shell = document.createElement('div');
          shell.className = 'ad-banner-shell';
          shell.style.cssText = 'position:relative; overflow:hidden; pointer-events:none;';
          entry.contentEl.appendChild(shell);
        }
        let iframe = shell.querySelector('.ad-banner-iframe');
        if (!iframe) {
          iframe = document.createElement('iframe');
          iframe.className = 'ad-banner-iframe';
          iframe.referrerPolicy = 'no-referrer-when-downgrade';
          iframe.allow = 'autoplay';
          iframe.src = 'about:blank';
          iframe.style.cssText = 'width:2000px; height:2000px; border:0; background:transparent;'
            + ' display:block; transform-origin:top left; pointer-events:none;';
          shell.appendChild(iframe);
        }
        entry.adIframe = iframe;
        return { shell, iframe };
      }

      function renderAdBanner(w) {
        const entry = widgetMap.get(w.id);
        if (!entry) return;
        if (!isWidgetVisible(w)) {
          destroyAdBannerIframe(entry);
          return;
        }
        const { shell, iframe } = ensureAdBannerIframe(entry);
        // glass / background-color / border / radius cosmetics apply to the
        // shell — the banner page itself runs with ?bg=transparent so the
        // widget's own backdrop shows through
        applyCommonStyles(w, entry);
        const isLandscape = document.body.classList.contains('landscape');
        const canvasW = isLandscape ? 1920 : 1080;
        const canvasH = isLandscape ? 1080 : 1920;
        const widthPct = Number(w.widthPct) || 24;
        const heightPct = Number(w.heightPct) || 100;
        const wPx = Math.round(canvasW * widthPct / 100);
        const hPx = Math.round(canvasH * heightPct / 100);
        const horizontal = w.orientation === 'horizontal';
        let src = 'about:blank';
        if (currentHandle) {
          src = '/ad-vertical/' + encodeURIComponent(currentHandle) + '?bg=transparent';
          const dg = String(w.displayGame || '').trim().toLowerCase();
          if (dg && dg !== 'auto') src += '&game=' + encodeURIComponent(dg);
          if (horizontal) src += '&orient=h';
        }
        const sig = [isLandscape ? 'l' : 'p', wPx, hPx, src].join('|');
        if (entry.lastAdBannerSig === sig) return;
        entry.lastAdBannerSig = sig;
        shell.style.width = wPx + 'px';
        shell.style.height = hPx + 'px';
        // The ad page is 2000×2000 but only a 100px band of it is content:
        // the strip sits dead centre (x 950–1050 vertical, y 950–1050 in
        // ?orient=h). Scaling the whole page to the box therefore rendered the
        // ad at 1/20th of the box and maxed sliders still looked tiny.
