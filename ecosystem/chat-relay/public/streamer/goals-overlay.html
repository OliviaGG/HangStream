<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streamer Goals Overlay</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="/streamer/icons/icon-512.png">
  <link rel="apple-touch-icon" href="/streamer/icons/icon-1024.png">
  <link rel="stylesheet" href="/css/cosmetics-fx.css?v=2">
  <script src="/js/ambient-fx.js?v=3" defer></script>
  <script src="/js/pfp-cosmetics.js?v=15" defer></script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WT Stream">
  <link id="stream-view-manifest-link" rel="manifest" href="/streamer/stream-view-manifest.webmanifest">
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const sid = params.get('streamerId') || '';
      const mode = (params.get('mode') || 'portrait').toLowerCase() === 'landscape' ? 'landscape' : 'portrait';
      const manifestHref = sid
        ? '/streamer/stream-view-manifest.webmanifest?streamerId=' + encodeURIComponent(sid) + '&mode=' + mode
        : '/streamer/manifest.webmanifest';
      const manifestLink = document.getElementById('stream-view-manifest-link');
      if (manifestLink) manifestLink.href = manifestHref;
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/streamer/sw.js', { scope: '/streamer/' })
            .catch(err => console.warn('[SW] registration failed:', err));
        });
      }
    })();
  </script>
  <style>
    :root {
      --c-cyan: #5ab6ff; --c-pink: #ff6ec7; --c-gold: #f6c453;
      --c-green: #43d17c; --c-red: #ff667a; --c-purple: #b07bff;
      --text-shadow: 0 2px 8px rgba(0,0,0,0.85);
    }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #000; overflow: hidden;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #fff;
    }
    .stage { position: fixed; inset: 0; pointer-events: none; }

    /* Embedded game (stream-view mode) — sits behind the widgets so glass
       backdrop-filter on widgets can sample the game pixels for real
       glassmorphism. */
    #bg-game {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh; height: 100dvh;
      border: 0;
      /* Hidden until applySnapshot confirms the streamer has NO gameEmbed
         widget. Otherwise we'd render the game twice (legacy bgGame +
         the modern gameEmbed widget's own iframe) and the opaque bgGame
         would occlude the animated-bg layer behind it, killing all bg
         slider visual effect. */
      display: none;
      /* Transparent so games whose body bg is transparent (the obs-mode
         glass path) let the anim-bg-layer below show through. Games with
         opaque bodies render normally. */
      background: transparent;
      z-index: 0;
    }
    .stage { z-index: 1; }

    /* ── Authentic glassmorphism (shared across widget types) ──────
       The trick: stack two backgrounds clipped differently — a tinted
       fill on the padding-box, and a gradient on the border-box. With
       a transparent border, the gradient shows through the border ring,
       giving an authentic refractive-edge look. Border-radius is respected
       by both layers. */
    .glass-edge {
      background:
        linear-gradient(var(--glass-fill, rgba(255,255,255,0.04)), var(--glass-fill, rgba(255,255,255,0.04))) padding-box,
        var(--glass-edge, linear-gradient(135deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.08) 35%, rgba(255,255,255,0.18) 70%, rgba(255,255,255,0.05) 100%)) border-box;
      border: var(--bw, 1px) solid transparent;
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      box-shadow:
        0 8px 32px rgba(0,0,0,0.40),
        inset 0 1px 0 rgba(255,255,255,0.22),
        inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    /* ── Widget wrapper ──────────────────────────────────────── */
    .widget {
      position: absolute;
      opacity: 0;
      transition: opacity 280ms ease, transform 280ms ease;
    }
    .widget.show { opacity: 1; }
    .widget.dragging {
      transition: none;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.35));
    }

    /* Color presets (accent + glow) — apply via classes on widget child */
    .c-cyan   { --accent: #5ab6ff; --glow: rgba(90,182,255,0.55); }
    .c-pink   { --accent: #ff6ec7; --glow: rgba(255,110,199,0.55); }
    .c-gold   { --accent: #f6c453; --glow: rgba(246,196,83,0.55); }
    .c-green  { --accent: #43d17c; --glow: rgba(67,209,124,0.55); }
    .c-red    { --accent: #ff667a; --glow: rgba(255,102,122,0.55); }
    .c-purple { --accent: #b07bff; --glow: rgba(176,123,255,0.55); }

    /* ── Goal bar (gift / follower) ──────────────────────────── */
    .goal {
      /* Base: sizing/padding only. Each .style-X rule below applies its own
         background, border, blur, shadow treatment. */
      border-radius: var(--radius, 16px);
      padding: 14px 18px;
      min-width: 320px;
      color: var(--text-c, inherit);
    }
    body.portrait .goal { width: 86vw; max-width: 880px; }
    body.landscape .goal { width: 520px; }
    .goal.pad-compact  { padding: 8px 14px; }
    .goal.pad-spacious { padding: 22px 26px; }
    .goal.style-glass    {
      background:
        linear-gradient(var(--glass-fill, rgba(0,0,0,0.7)), var(--glass-fill, rgba(0,0,0,0.7))) padding-box,
        var(--glass-edge, linear-gradient(135deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.06) 40%, rgba(255,255,255,0.18) 75%, rgba(255,255,255,0.04) 100%)) border-box;
      border: var(--bw, 1px) var(--bs, solid) transparent;
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      box-shadow:
        0 8px 32px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.22);
    }
    .goal.style-solid    { background: #0d1320; border: var(--bw, 1px) var(--bs, solid) var(--bc, var(--accent)); backdrop-filter: none; }
    .goal.style-outlined { background: transparent; border: var(--bw, 2px) var(--bs, solid) var(--bc, var(--accent)); backdrop-filter: none; }
    .goal.style-banner   { background: rgba(0,0,0,var(--bg-op,0.7)); border: 0; border-left: var(--bw, 4px) var(--bs, solid) var(--bc, var(--accent)); border-radius: 4px; backdrop-filter: none; }
    .goal-header {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 12px; margin-bottom: 10px;
    }
    .goal-label {
      font-weight: 700; font-size: calc(1.05rem * var(--tm, 1) / var(--ws, 1));
      letter-spacing: 0.02em; text-transform: uppercase;
      text-shadow: var(--text-shadow);
    }
    .goal-numbers {
      font-variant-numeric: tabular-nums;
      font-weight: 700; font-size: calc(1rem * var(--tm, 1) / var(--ws, 1));
      text-shadow: var(--text-shadow);
    }
    .goal-numbers .current { font-size: calc(1.25rem * var(--tm, 1) / var(--ws, 1)); }
    .goal-pct {
      font-size: calc(0.9rem * var(--tm, 1) / var(--ws, 1)); margin-left: 6px;
      color: var(--accent);
    }
    .goal-track {
      position: relative; height: 22px; border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
    }
    .goal-fill {
      position: absolute; inset: 0 auto 0 0;
      width: 0%;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 70%, white 30%), var(--accent));
      border-radius: 999px;
      transition: width 480ms cubic-bezier(.2, .8, .25, 1);
      box-shadow: 0 0 12px var(--glow);
    }

    /* ── Like-for-Hint bar ───────────────────────────────────── */
    /* Pinned masked target (letter mode) — persists between hints. */
    .likehint .hint-pinned {
      margin-top: 8px; text-align: center;
      font-weight: 800; letter-spacing: 0.22em;
      font-size: calc(1.5rem * var(--tm, 1) / var(--ws, 1));
      color: var(--text-c, inherit); text-shadow: var(--text-shadow);
    }
    /* Reveal flash — hidden until a hint fires, then covers the bar. */
    .likehint .hint-reveal {
      display: none; text-align: center;
      font-weight: 900; letter-spacing: 0.14em;
      font-size: calc(2.3rem * var(--tm, 1) / var(--ws, 1));
      color: var(--text-c, inherit); text-shadow: var(--text-shadow);
      padding: 4px 0;
    }
    .likehint.hint-flash .hint-reveal { display: block; animation: hintPulse 700ms ease-out; }
    .likehint.hint-flash .goal-header,
    .likehint.hint-flash .goal-track,
    .likehint.hint-flash .hint-pinned { display: none; }
    @keyframes hintPulse {
      0%   { transform: scale(0.7); opacity: 0; }
      55%  { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ── Milestone burst ─────────────────────────────────────── */
    .milestone {
      text-align: center;
      pointer-events: none;
      color: var(--text-c, inherit);
      display: inline-block;
      border-radius: var(--radius, 18px);
    }
    /* Padding variants */
    .milestone.pad-compact  { padding: 12px 18px; }
    .milestone.pad-regular  { padding: 24px 32px; }
    .milestone.pad-spacious { padding: 40px 56px; }
    /* Style variants — same model as win-card. Default look (without these
       classes) is text-only; selecting Glass gives the frosted card around
       the burst, which is the typical "celebration card" treatment. */
    .milestone.style-glass {
      background:
        linear-gradient(var(--glass-fill, rgba(0,0,0,0.55)), var(--glass-fill, rgba(0,0,0,0.55))) padding-box,
        var(--glass-edge, linear-gradient(135deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.06) 40%, rgba(255,255,255,0.22) 75%, rgba(255,255,255,0.05) 100%)) border-box;
      border: var(--bw, 1px) var(--bs, solid) transparent;
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      box-shadow:
        0 8px 32px rgba(0,0,0,0.4),
        0 0 60px var(--glow),
        inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .milestone.style-solid {
      background: #0d1320;
      border: var(--bw, 1px) var(--bs, solid) var(--bc, var(--accent));
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    }
    .milestone.style-outlined {
      background: transparent;
      border: var(--bw, 2px) var(--bs, solid) var(--bc, var(--accent));
      box-shadow: 0 0 32px var(--glow);
    }
    .milestone.style-banner {
      background: linear-gradient(180deg, rgba(0,0,0,0.85), rgba(0,0,0,0.55));
      border: 0; border-top: var(--bw, 4px) var(--bs, solid) var(--bc, var(--accent));
      border-radius: 4px;
    }
    .milestone .num {
      font-weight: 900; font-size: calc(9rem * var(--tm, 1) / var(--ws, 1)); line-height: 1;
      letter-spacing: -0.04em;
      color: var(--accent);
      text-shadow: 0 4px 24px rgba(0,0,0,0.85), 0 0 64px var(--glow);
      transform: scale(0.5);
      transition: transform 480ms cubic-bezier(.2, 1.6, .35, 1);
    }
    body.landscape .milestone .num { font-size: calc(7rem * var(--tm, 1) / var(--ws, 1)); }
    .widget.show .milestone .num { transform: scale(1); }
    .milestone .label {
      margin-top: 12px;
      font-weight: 800; font-size: calc(2rem * var(--tm, 1) / var(--ws, 1));
      text-transform: uppercase; letter-spacing: 0.1em;
      text-shadow: var(--text-shadow);
    }
    body.landscape .milestone .label { font-size: calc(1.5rem * var(--tm, 1) / var(--ws, 1)); }

    /* ── Donate pill ─────────────────────────────────────────── */
    /* Small static promo bubble — heart + label + bare-domain URL. */
    .donate {
      display: inline-flex; align-items: center; gap: 8px;
      pointer-events: none;
      color: var(--text-c, inherit);
      border-radius: var(--radius, 999px);
      font-weight: 700;
      font-size: calc(1.05rem * var(--tm, 1) / var(--ws, 1));
      line-height: 1.1;
      white-space: nowrap;
      text-shadow: var(--text-shadow);
    }
    .donate.pad-compact  { padding: 6px 14px; }
    .donate.pad-regular  { padding: 10px 20px; }
    .donate.pad-spacious { padding: 16px 28px; }
    .donate .url   { opacity: 0.95; font-weight: 800; }
    .donate.style-glass {
      background:
        linear-gradient(var(--glass-fill, rgba(0,0,0,0.55)), var(--glass-fill, rgba(0,0,0,0.55))) padding-box,
        var(--glass-edge, linear-gradient(135deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.06) 40%, rgba(255,255,255,0.22) 75%, rgba(255,255,255,0.05) 100%)) border-box;
      border: var(--bw, 1px) var(--bs, solid) transparent;
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      box-shadow:
        0 4px 18px rgba(0,0,0,0.3),
        0 0 40px var(--glow),
        inset 0 1px 0 rgba(255,255,255,0.2);
    }
    /* --bc (the Border colour picker) must win over the colour preset, same as
       every other widget. These two used a bare var(--accent), so the picker
       was silently ignored in exactly these styles. */
    .donate.style-solid    { background: var(--solid-bg, rgba(0,0,0,0.7)); border: var(--bw, 1px) var(--bs, solid) var(--bc, var(--accent)); }
    .donate.style-outlined { background: transparent; border: var(--bw, 2px) var(--bs, solid) var(--bc, var(--accent)); }
    .donate.style-banner   { background: var(--accent); color: #000; }
    body.landscape .donate { font-size: calc(0.95rem * var(--tm, 1) / var(--ws, 1)); }

    /* ── Game Vote ─────────────────────────────────────────── */
    /* Two faces on one widget: a slim "turn" pill between votes, and the full
       ballot card while chat is voting. Both live in the same host so the
       streamer positions the widget once. */
    .gvote { pointer-events: none; color: var(--text-c, inherit); text-shadow: var(--text-shadow); }
    .gvote.pad-compact  { padding: 8px 14px; }
    .gvote.pad-regular  { padding: 14px 18px; }
    .gvote.pad-spacious { padding: 20px 26px; }
    .gvote.style-glass {
      background:
        linear-gradient(var(--glass-fill, rgba(0,0,0,0.55)), var(--glass-fill, rgba(0,0,0,0.55))) padding-box,
        var(--glass-edge, linear-gradient(135deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.06) 40%, rgba(255,255,255,0.18) 75%, rgba(255,255,255,0.04) 100%)) border-box;
      border: var(--bw, 1px) var(--bs, solid) transparent;
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.22);
    }
    .gvote.style-solid    { background: var(--solid-bg, #0d1320); border: var(--bw, 1px) var(--bs, solid) var(--bc, var(--accent)); }
    .gvote.style-outlined { background: transparent; border: var(--bw, 2px) var(--bs, solid) var(--bc, var(--accent)); }
    .gvote.style-banner   { background: rgba(0,0,0,var(--bg-op,0.7)); border: 0; border-left: var(--bw, 4px) var(--bs, solid) var(--bc, var(--accent)); border-radius: 4px; }
    .gvote { border-radius: var(--radius, 16px); }

    /* Voting / result: the full card. The between-votes turn readout lives in
       the separate .gvstatus widget below, so this card has no idle state —
       it is simply absent between votes. */
    .gvote.is-voting, .gvote.is-result { display: block; min-width: var(--gv-width, 420px); }
    /* Pinned "learn to play" line. Sits above the title, deliberately quieter
       than it so it reads as a footnote rather than competing with the vote. */
    .gvote .gv-learn {
      text-align: center; font-weight: 700; letter-spacing: 0.01em;
      opacity: 0.82; color: var(--accent);
      font-size: calc(0.82rem * var(--tm, 1) / var(--ws, 1));
      margin-bottom: 8px; padding-bottom: 7px;
      border-bottom: 1px solid rgba(255,255,255,0.14);
    }
    .gvote .gv-learn:empty { display: none; }
    .gvote .gv-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; margin-bottom: 12px;
    }
    .gvote .gv-title {
      font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
      font-size: calc(1.05rem * var(--tm, 1) / var(--ws, 1));
    }
    .gvote .gv-clock {
      font-variant-numeric: tabular-nums; font-weight: 800; color: var(--accent);
      font-size: calc(1.1rem * var(--tm, 1) / var(--ws, 1));
    }
    .gvote .gv-ballot { display: flex; flex-direction: column; gap: 8px; }

    /* Fixed-height rows: bars animate without the card resizing under them. */
    .gvote .gv-row {
      position: relative; display: flex; align-items: center; gap: 10px;
      height: calc(46px * var(--tm, 1) / var(--ws, 1));
      padding: 0 12px 0 8px;
      border-radius: 10px;
      background: rgba(255,255,255,0.07);
      overflow: hidden;
      transition: transform 260ms cubic-bezier(.2,.8,.25,1), opacity 260ms ease;
    }
    /* The fill sits UNDER the row content, not beside it. */
    .gvote .gv-row-fill {
      position: absolute; inset: 0 auto 0 0; width: 0%;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 55%, transparent), color-mix(in srgb, var(--accent) 26%, transparent));
      border-radius: 10px;
      transition: width 420ms cubic-bezier(.2,.8,.25,1);
      z-index: 0;
    }
    /* Bright leading edge. Without it the fill reads as a highlight block
       rather than a bar — at a glance on stream you couldn't tell where one
       game's share ended. Suppressed at zero votes so an empty row doesn't
       show a stray sliver at the far left. */
    .gvote .gv-row-fill::after {
      content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 2px;
      background: var(--accent); box-shadow: 0 0 10px var(--glow);
    }
    .gvote .gv-row:not(.has-votes) .gv-row-fill::after { display: none; }
    .gvote .gv-row > *:not(.gv-row-fill) { position: relative; z-index: 1; }
    .gvote .gv-num {
      flex: 0 0 auto; min-width: calc(28px * var(--tm, 1) / var(--ws, 1));
      text-align: center; font-weight: 900;
      font-size: calc(1.3rem * var(--tm, 1) / var(--ws, 1));
      color: var(--accent);
    }
    .gvote .gv-logo {
      flex: 0 0 auto; width: calc(30px * var(--tm, 1) / var(--ws, 1));
      height: calc(30px * var(--tm, 1) / var(--ws, 1));
      object-fit: contain; border-radius: 6px;
    }
    .gvote .gv-name {
      flex: 1 1 auto; font-weight: 700; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      font-size: calc(1rem * var(--tm, 1) / var(--ws, 1));
    }
    .gvote .gv-count {
      flex: 0 0 auto; font-variant-numeric: tabular-nums; font-weight: 800;
      opacity: 0.95; font-size: calc(0.98rem * var(--tm, 1) / var(--ws, 1));
    }
    .gvote .gv-row.is-leader { background: rgba(255,255,255,0.13); }
    .gvote .gv-row.is-leader .gv-name { color: var(--accent); }

    /* Result: losers fade back, the winner takes the card. */
    .gvote.is-result .gv-row:not(.is-winner) { opacity: 0.28; transform: scale(0.97); }
    .gvote.is-result .gv-row.is-winner {
      transform: scale(1.04);
      background: rgba(255,255,255,0.16);
      box-shadow: 0 0 26px var(--glow);
    }
    .gvote .gv-foot {
      margin-top: 10px; text-align: center; font-weight: 700; opacity: 0.9;
      font-size: calc(0.86rem * var(--tm, 1) / var(--ws, 1));
    }
    .gvote .gv-foot:empty { display: none; }
    .gvote .gv-hint {
      margin-top: 9px; text-align: center; opacity: 0.7; font-weight: 600;
      font-size: calc(0.8rem * var(--tm, 1) / var(--ws, 1));
    }
    .gvote.is-result .gv-hint { display: none; }
    body.landscape .gvote.is-voting, body.landscape .gvote.is-result { min-width: var(--gv-width, 360px); }

    /* The "keep playing" row reads as the status-quo choice, not a rival game:
       muted number, italic label, dimmer fill. It still wins on votes alone. */
    .gvote .gv-row.is-keep { background: rgba(255,255,255,0.045); }
    .gvote .gv-row.is-keep .gv-num { color: var(--text-c, #fff); opacity: 0.6; }
    .gvote .gv-row.is-keep .gv-name { font-style: italic; opacity: 0.88; }
    .gvote .gv-row.is-keep .gv-row-fill {
      background: linear-gradient(90deg, rgba(255,255,255,0.26), rgba(255,255,255,0.10));
    }
    .gvote .gv-row.is-keep .gv-row-fill::after { background: rgba(255,255,255,0.75); box-shadow: none; }
    .gvote .gv-row.is-keep.is-leader .gv-name { color: var(--text-c, #fff); }
    .gvote.is-result .gv-row.is-keep.is-winner .gv-name { font-style: normal; opacity: 1; }

    /* ── Game Vote status card ─────────────────────────────────── */
    /* Whose turn it is and how much is left. Its own widget so it can sit
       anywhere — typically a quiet corner, away from the ballot. */
    .gvstatus {
      pointer-events: none; color: var(--text-c, inherit);
      text-shadow: var(--text-shadow); border-radius: var(--radius, 16px);
    }
    .gvstatus.pad-compact  { padding: 7px 14px; }
    .gvstatus.pad-regular  { padding: 11px 18px; }
    .gvstatus.pad-spacious { padding: 16px 24px; }
    .gvstatus.style-glass {
      background:
        linear-gradient(var(--glass-fill, rgba(0,0,0,0.55)), var(--glass-fill, rgba(0,0,0,0.55))) padding-box,
        var(--glass-edge, linear-gradient(135deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.06) 40%, rgba(255,255,255,0.18) 75%, rgba(255,255,255,0.04) 100%)) border-box;
      border: var(--bw, 1px) var(--bs, solid) transparent;
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      box-shadow: 0 6px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .gvstatus.style-solid    { background: var(--solid-bg, #0d1320); border: var(--bw, 1px) var(--bs, solid) var(--bc, var(--accent)); }
    .gvstatus.style-outlined { background: transparent; border: var(--bw, 2px) var(--bs, solid) var(--bc, var(--accent)); }
    .gvstatus.style-banner   { background: rgba(0,0,0,var(--bg-op,0.7)); border: 0; border-left: var(--bw, 4px) var(--bs, solid) var(--bc, var(--accent)); border-radius: 4px; }

    .gvstatus .gvs-main {
      display: flex; align-items: center; gap: 8px;
      font-weight: 700; line-height: 1.15; white-space: nowrap;
      font-size: calc(0.98rem * var(--tm, 1) / var(--ws, 1));
    }
    .gvstatus .gvs-logo {
      width: calc(24px * var(--tm, 1) / var(--ws, 1));
      height: calc(24px * var(--tm, 1) / var(--ws, 1));
      object-fit: contain; border-radius: 5px; flex: 0 0 auto;
    }
    .gvstatus .gvs-label { opacity: 0.7; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      font-size: calc(0.78rem * var(--tm, 1) / var(--ws, 1)); }
    .gvstatus .gvs-game { color: var(--accent); font-weight: 800; }
    .gvstatus .gvs-sep  { opacity: 0.4; }
    .gvstatus .gvs-term { font-variant-numeric: tabular-nums; opacity: 0.92; }

    .gvstatus .gvs-track {
      margin-top: 7px; height: calc(5px * var(--tm, 1) / var(--ws, 1));
      min-width: calc(120px * var(--tm, 1) / var(--ws, 1));
      border-radius: 999px; background: rgba(255,255,255,0.13); overflow: hidden;
    }
    .gvstatus .gvs-fill {
      height: 100%; width: 0%; border-radius: 999px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 70%, white 30%), var(--accent));
      box-shadow: 0 0 8px var(--glow);
      transition: width 500ms cubic-bezier(.2,.8,.25,1);
    }

    /* Card layout stacks the term under the game name instead of inline. */
    .gvstatus.is-card .gvs-main { display: grid; grid-template-columns: auto 1fr; gap: 2px 9px; white-space: normal; }
    .gvstatus.is-card .gvs-logo { grid-row: 1 / span 2; align-self: center;
      width: calc(34px * var(--tm, 1) / var(--ws, 1)); height: calc(34px * var(--tm, 1) / var(--ws, 1)); }
    .gvstatus.is-card .gvs-label { grid-column: 2; }
    .gvstatus.is-card .gvs-game  { grid-column: 2; font-size: calc(1.12rem * var(--tm, 1) / var(--ws, 1)); }
    .gvstatus.is-card .gvs-sep   { display: none !important; }
    .gvstatus.is-card .gvs-term  { grid-column: 2; opacity: 0.8;
      font-size: calc(0.88rem * var(--tm, 1) / var(--ws, 1)); }

    /* ── Fan Club Ad ───────────────────────────────────────── */
    .fan-club-ad {
      width: var(--fc-width, 780px);
      height: var(--fc-height, 240px);
      pointer-events: none;
      color: var(--fc-primary, #33f3ff);
      filter: drop-shadow(0 18px 22px rgba(0,0,0,0.55));
      transform-origin: center;
    }
    .fan-club-ad svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    .fan-club-ad .fc-shadow {
      fill: none;
      stroke: rgba(0,0,0,0.95);
      stroke-width: calc(var(--fc-stroke, 12px) + 18px);
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .fan-club-ad .fc-fill {
      fill: var(--fc-fill, #020308);
      stroke: rgba(0,0,0,0.96);
      stroke-width: calc(var(--fc-stroke, 12px) + 6px);
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .fan-club-ad .fc-edge,
    .fan-club-ad .fc-inner {
      fill: none;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .fan-club-ad .fc-edge {
      stroke: var(--fc-edge-paint, currentColor);
      stroke-width: var(--fc-stroke, 12px);
      filter: var(--fc-glow-filter, none);
    }
    .fan-club-ad .fc-inner {
      stroke: rgba(255,255,255,0.35);
      stroke-width: var(--fc-inner-stroke, 4px);
      opacity: 0.65;
    }
    .fan-club-ad .fc-headline,
    .fan-club-ad .fc-label {
      font-family: var(--fc-font, Impact, Haettenschweiler, "Arial Black", sans-serif);
      paint-order: stroke fill;
      stroke: rgba(0,0,0,0.92);
      stroke-linejoin: round;
      text-transform: uppercase;
      text-anchor: middle;
      dominant-baseline: middle;
      letter-spacing: 0;
      filter: drop-shadow(0 6px 0 rgba(0,0,0,0.55));
    }
    .fan-club-ad .fc-headline {
      font-size: var(--fc-head-font, 96px);
      fill: var(--fc-text-paint, currentColor);
      stroke-width: 9px;
    }
    .fan-club-ad .fc-label {
      font-size: var(--fc-label-font, 48px);
      fill: var(--fc-text-paint, currentColor);
      stroke-width: 6px;
    }
    .fan-club-ad.font-system { --fc-font: "Inter", "Segoe UI", Arial, sans-serif; }
    .fan-club-ad.font-condensed { --fc-font: "Arial Narrow", "Roboto Condensed", Impact, sans-serif; }
    .fan-club-ad.font-serif { --fc-font: Georgia, "Times New Roman", serif; }
    .fan-club-ad.font-mono { --fc-font: "Cascadia Mono", "Consolas", monospace; }
    .fan-club-ad.font-script { --fc-font: "Segoe Script", "Brush Script MT", cursive; }
    .fan-club-ad .fc-spray-dot,
    .fan-club-ad .fc-halo,
    .fan-club-ad .fc-bolt,
    .fan-club-ad .fc-scan,
    .fan-club-ad .fc-drip,
    .fan-club-ad .fc-rgb {
      pointer-events: none;
    }
    .fan-club-ad.fc-neon .fc-edge { stroke-dasharray: 34 12; animation: fcDash 2.1s linear infinite; }
    .fan-club-ad.fc-neon .fc-label { animation: fcShimmer 1.7s ease-in-out infinite alternate; }
    .fan-club-ad.fc-graffiti { animation: fcFloat 2.8s ease-in-out infinite; }
    .fan-club-ad.fc-graffiti .fc-headline { transform-box: fill-box; transform-origin: center; animation: fcWobble 1.6s ease-in-out infinite; }
    .fan-club-ad.fc-graffiti .fc-fill { filter: var(--fc-paper-filter, none); }
    .fan-club-ad.fc-hologram .fc-fill { opacity: 0.72; }
    .fan-club-ad.fc-hologram .fc-scan { fill: rgba(255,255,255,0.22); animation: fcScan 1.45s linear infinite; }
    .fan-club-ad.fc-electric .fc-bolt { fill: none; stroke: var(--fc-primary, #33f3ff); stroke-width: 7px; stroke-linecap: round; filter: var(--fc-glow-filter, none); animation: fcFlicker 0.38s steps(2,end) infinite; }
    .fan-club-ad.fc-electric .fc-edge { animation: fcFlicker 0.52s steps(2,end) infinite; }
    .fan-club-ad.fc-sticker { animation: fcSticker 3.2s ease-in-out infinite; }
    .fan-club-ad.fc-sticker .fc-edge { stroke: #fff; filter: drop-shadow(0 0 18px var(--fc-secondary, #ff3f7f)); }
    .fan-club-ad.fc-vip .fc-halo { fill: none; stroke: var(--fc-accent, #9a7cff); stroke-width: 5px; opacity: 0.5; transform-origin: 236px 108px; animation: fcHalo 2.2s ease-in-out infinite; }
    .fan-club-ad.fc-spray .fc-spray-dot { fill: var(--fc-secondary, #ff3f7f); opacity: 0.65; animation: fcPop 1.8s ease-in-out infinite alternate; }
    .fan-club-ad.fc-spray .fc-drip { fill: var(--fc-secondary, #ff3f7f); opacity: 0.9; animation: fcDrip 2.4s ease-in-out infinite; }
    .fan-club-ad.fc-glitch .fc-rgb { opacity: 0.55; mix-blend-mode: screen; animation: fcGlitch 0.85s steps(2,end) infinite; }
    .fan-club-ad.fc-glitch .fc-headline,
    .fan-club-ad.fc-glitch .fc-label { animation: fcTextGlitch 0.9s steps(2,end) infinite; }
    .fan-club-ad.fc-liquid .fc-edge,
    .fan-club-ad.fc-liquid .fc-label { animation: fcHue 2.8s linear infinite; }
    .fan-club-ad.fc-liquid .fc-fill { opacity: 0.9; }
    .fan-club-ad.fc-compact .fc-headline { opacity: 0; }
    .fan-club-ad.fc-compact .fc-label { font-size: var(--fc-label-font, 54px); }
    .fan-club-ad.fc-compact { height: min(var(--fc-height, 160px), 190px); }
    @keyframes fcDash { to { stroke-dashoffset: -92; } }
    @keyframes fcShimmer { from { opacity: 0.72; } to { opacity: 1; filter: drop-shadow(0 0 18px var(--fc-primary, #33f3ff)); } }
    @keyframes fcFloat { 0%,100% { transform: translateY(0) rotate(-0.7deg); } 50% { transform: translateY(-8px) rotate(0.8deg); } }
    @keyframes fcWobble { 0%,100% { transform: rotate(-1deg) scale(1); } 50% { transform: rotate(1.2deg) scale(1.04); } }
    @keyframes fcScan { from { transform: translateY(-160px); } to { transform: translateY(270px); } }
    @keyframes fcFlicker { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
    @keyframes fcSticker { 0%,100% { transform: rotate(-1deg) scale(1); } 50% { transform: rotate(1deg) scale(1.025); } }
    @keyframes fcHalo { 0%,100% { transform: scale(0.92); opacity: 0.32; } 50% { transform: scale(1.12); opacity: 0.72; } }
    @keyframes fcPop { from { transform: scale(0.85); } to { transform: scale(1.2); } }
    @keyframes fcDrip { 0%,100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
    @keyframes fcGlitch { 0%,100% { transform: translate(0,0); } 35% { transform: translate(8px,-3px); } 70% { transform: translate(-7px,3px); } }
    @keyframes fcTextGlitch { 0%,100% { transform: translate(0,0); } 40% { transform: translate(4px,0); } 70% { transform: translate(-3px,1px); } }
    @keyframes fcHue { to { filter: hue-rotate(360deg); } }

    /* ── Campaign Gift Ad ──────────────────────────────────────
       Replica of TikTok's "Campaign Gift" panel: blue header, two
       gift tiles (Press Start / Heart Me art), coin price chips and
       a CTA pill. All motion is transform/opacity only (OBS-safe). */
    .campaign-gift {
      width: 440px;
      pointer-events: none;
      filter: drop-shadow(0 16px 26px rgba(0,0,0,0.45));
    }
    .campaign-gift .cg-card {
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      background: #fdfdfe;
      border: 1px solid rgba(0,0,0,0.08);
    }
    .campaign-gift .cg-shine {
      position: absolute;
      top: -30%;
      bottom: -30%;
      left: 0;
      width: 34%;
      background: linear-gradient(105deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0) 100%);
      transform: translateX(-180%) rotate(8deg);
      animation: cgShine 6.5s ease-in-out infinite;
      z-index: 5;
    }
    .campaign-gift .cg-header {
      /* light shade precomputed in JS — color-mix() isn't available in
         older OBS CEF builds and would kill the whole declaration */
      background: linear-gradient(180deg, var(--cg-header-light, #55c3f7), var(--cg-header, #22b0f4));
      color: #fff;
      font-weight: 800;
      font-size: calc(1.55rem * var(--tm, 1));
      text-align: center;
      padding: 14px 16px;
      letter-spacing: 0.2px;
    }
    .campaign-gift .cg-body {
      display: flex;
      gap: 14px;
      padding: 18px 16px 6px;
    }
    .campaign-gift .cg-tile {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      background: #f5f6f8;
      border-radius: 18px;
      padding: 16px 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .campaign-gift.cg-single .cg-tile { max-width: 62%; margin: 0 auto; }
    .campaign-gift .cg-img-wrap {
      width: 118px;
      height: 118px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .campaign-gift .cg-img {
      max-width: 100%;
      max-height: 100%;
      animation: cgBob 3.4s ease-in-out infinite;
    }
    .campaign-gift .cg-tile[data-gift="2"] .cg-img { animation-delay: -1.7s; }
    .campaign-gift .cg-img-wrap.cg-noimg .cg-img { display: none; }
    .campaign-gift .cg-img-wrap.cg-noimg::before { content: '🎁'; font-size: 72px; animation: cgBob 3.4s ease-in-out infinite; }
    .campaign-gift .cg-name {
      color: #1c1c1e;
      font-weight: 700;
      font-size: calc(1.12rem * var(--tm, 1));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .campaign-gift .cg-price {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      animation: cgPulse 2.6s ease-in-out infinite;
    }
    .campaign-gift .cg-tile[data-gift="2"] .cg-price { animation-delay: -1.3s; }
    .campaign-gift .cg-coin {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #ffd668, #f7a91d 68%, #d8860a);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 -2px 3px rgba(150,80,0,0.4), 0 1px 2px rgba(0,0,0,0.18);
    }
    .campaign-gift .cg-cost {
      color: #1c1c1e;
      font-weight: 800;
      font-size: calc(1.05rem * var(--tm, 1));
      font-variant-numeric: tabular-nums;
    }
    .campaign-gift .cg-spark {
      position: absolute;
      color: #f7b52c;
      font-size: 15px;
      opacity: 0;
      animation: cgTwinkle 2.3s ease-in-out infinite;
      z-index: 2;
    }
    .campaign-gift .cg-s1 { top: 10px; left: 12px; }
    .campaign-gift .cg-s2 { top: 26px; right: 14px; animation-delay: -0.8s; font-size: 11px; }
    .campaign-gift .cg-s3 { bottom: 52px; left: 18px; animation-delay: -1.5s; font-size: 12px; }
    .campaign-gift .cg-cta {
      margin: 12px 16px 16px;
      border: 2px solid #17171b;
      border-radius: 999px;
      background: #eef0f4;
      color: #17171b;
      font-weight: 700;
      font-size: calc(1.15rem * var(--tm, 1));
      text-align: center;
      padding: 12px 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Sender toast + burst when the matching TikTok gift arrives */
    .campaign-gift .cg-sender {
      position: absolute;
      left: 50%;
      bottom: -4px;
      transform: translate(-50%, 8px);
      background: #17171b;
      color: #ffd668;
      font-weight: 700;
      font-size: calc(0.82rem * var(--tm, 1));
      border-radius: 999px;
      padding: 4px 12px;
      white-space: nowrap;
      max-width: 96%;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      z-index: 4;
    }
    .campaign-gift .cg-tile.cg-burst .cg-sender { animation: cgSender 6s ease forwards; }
    .campaign-gift .cg-tile.cg-burst .cg-img { animation: cgBurst 0.9s cubic-bezier(.2,.9,.3,1.4) 3; }
    .campaign-gift .cg-tile.cg-burst { animation: cgTileGlow 1.2s ease-in-out 5; }
    .campaign-gift .cg-tile.cg-burst .cg-spark { animation-duration: 0.7s; }
    @keyframes cgBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes cgTwinkle {
      0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(20deg); }
    }
    @keyframes cgPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.09); }
    }
    @keyframes cgShine {
      0%, 55% { transform: translateX(-180%) rotate(8deg); }
      85%, 100% { transform: translateX(420%) rotate(8deg); }
    }
    @keyframes cgBurst {
      0%, 100% { transform: scale(1) rotate(0deg); }
      30% { transform: scale(1.42) rotate(-7deg); }
      60% { transform: scale(1.28) rotate(6deg); }
    }
    @keyframes cgTileGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(247,181,44,0); }
      50% { box-shadow: 0 0 24px 4px rgba(247,181,44,0.75); }
    }
    @keyframes cgSender {
      0% { opacity: 0; transform: translate(-50%, 8px); }
      8%, 88% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, 8px); }
    }

    /* ── Chat Feed ───────────────────────────────────────────── */
    .chat-feed {
      border-radius: var(--radius, 18px);
      color: var(--text-c, inherit);
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      pointer-events: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.42);
    }
    .chat-feed.pad-compact  { padding: 8px; }
    .chat-feed.pad-regular  { padding: 12px; }
    .chat-feed.pad-spacious { padding: 18px; }
    .chat-feed.style-glass {
      background:
        linear-gradient(var(--glass-fill, rgba(0,0,0,0.58)), var(--glass-fill, rgba(0,0,0,0.58))) padding-box,
        var(--glass-edge, linear-gradient(135deg, rgba(255,255,255,0.42) 0%, rgba(255,255,255,0.06) 40%, rgba(255,255,255,0.16) 75%, rgba(255,255,255,0.04) 100%)) border-box;
      border: var(--bw, 1px) var(--bs, solid) transparent;
      backdrop-filter: blur(13px) saturate(180%);
      -webkit-backdrop-filter: blur(13px) saturate(180%);
      box-shadow:
        0 8px 32px rgba(0,0,0,0.42),
        inset 0 1px 0 rgba(255,255,255,0.18);
    }
    .chat-feed.style-solid    { background: #0d1320; border: var(--bw, 1px) var(--bs, solid) var(--bc, var(--accent)); }
    .chat-feed.style-outlined { background: transparent; border: var(--bw, 2px) var(--bs, solid) var(--bc, var(--accent)); }
    .chat-feed.style-banner   { background: linear-gradient(180deg, rgba(0,0,0,0.85), rgba(0,0,0,0.55)); border: 0; border-left: var(--bw, 4px) var(--bs, solid) var(--bc, var(--accent)); border-radius: 4px; }
    .chat-feed .cf-list {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
      overflow: hidden;
    }
    .chat-feed.newest-top .cf-list {
      justify-content: flex-start;
    }
    .chat-feed.compact .cf-list { gap: 4px; }
    .cf-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      min-width: 0;
      padding: 8px 10px;
      border-radius: calc(var(--radius, 18px) * 0.65);
      background: rgba(255,255,255,0.055);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      text-align: var(--chat-align, left);
      animation: cfSlide 260ms cubic-bezier(.2,.8,.2,1) both;
    }
    .chat-feed.compact .cf-row {
      padding: 5px 7px;
      gap: 7px;
    }
    .chat-feed.no-avatar .cf-row { grid-template-columns: minmax(0, 1fr); }
    .chat-feed.anim-fade .cf-row { animation-name: cfFade; }
    .chat-feed.anim-pop .cf-row { animation-name: cfPop; }
    .chat-feed.anim-none .cf-row { animation: none; }
    @keyframes cfSlide {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes cfFade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes cfPop {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }
    .cf-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-weight: 800;
      font-size: calc(0.9rem * var(--tm, 1) / var(--ws, 1));
      color: rgba(255,255,255,0.92);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 4px 12px rgba(0,0,0,0.25);
    }
    .chat-feed.compact .cf-avatar { width: 28px; height: 28px; }
    .chat-feed.avatar-rounded .cf-avatar { border-radius: 10px; }
    .chat-feed.avatar-square .cf-avatar { border-radius: 3px; }
    .cf-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cf-body { min-width: 0; }
    .cf-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      margin-bottom: 2px;
      justify-content: flex-start;
    }
    .chat-feed.align-center .cf-meta { justify-content: center; }
    .chat-feed.align-right .cf-meta { justify-content: flex-end; }
    .cf-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 850;
      font-size: calc(0.88rem * var(--tm, 1) / var(--ws, 1));
      color: var(--accent);
      text-shadow: var(--text-shadow);
    }
    .cf-chip {
      flex-shrink: 0;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.82);
      font-size: calc(0.64rem * var(--tm, 1) / var(--ws, 1));
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .cf-message {
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.25;
      font-size: calc(0.94rem * var(--tm, 1) / var(--ws, 1));
      font-weight: 650;
      text-shadow: var(--text-shadow);
    }
    .chat-feed.compact .cf-message { font-size: calc(0.82rem * var(--tm, 1) / var(--ws, 1)); }

    /* ── Win Card ────────────────────────────────────────────── */
    /* Outer frame — wraps .win-card so the winner's pfp_border + pfp_glow
       can decorate the entire popup. Stays inert (no border, no padding)
       until _applyWinCardCosmetics writes --wc-frame-border / --wc-frame-glow.
       Border-radius mirrors the card's --radius so corners align;
       applyCommonStyles writes that var onto the frame too. */
    .wc-frame {
      display: inline-block;
      border-radius: var(--radius, 18px);
      padding: 0;
      border: var(--wc-frame-border, 0 solid transparent);
      box-shadow: var(--wc-frame-glow, none);
      transition: box-shadow 220ms ease, border-color 220ms ease;
    }
    /* When the frame is decorated by a cosmetic, suppress the inner
       card's own border so we don't get a double-stroke that visually
       offsets from the cosmetic stroke. .wc-frame-decorated is added by
       _applyWinCardCosmetics whenever the cosmetic frame is in use. */
    .wc-frame.wc-frame-decorated > .win-card {
      border-color: transparent !important;
      /* NESTED RADIUS. The card sits directly inside the frame's stroke
         (.wc-frame has padding:0), so its corner radius must be the frame's
         radius MINUS that stroke's width. Given both the same --radius, the
         card's corner arc is too large and bulges out through the ring — the
         fill visibly separates from the cosmetic border at every corner. It
         only shows once radius > 0, which is why square cards looked fine.
         --wc-frame-bw is written by _applyWinCardCosmetics from the frame's
         COMPUTED border width (cosmetics supply arbitrary border shorthands,
         so the width can't be parsed out of the string reliably). */
      border-radius: max(0px, calc(var(--radius, 18px) - var(--wc-frame-bw, 0px)));
    }
    /* Hero badge background layer — absolute-positioned behind .win-card
       content via position:relative on .win-card + position:absolute here.
       opacity controlled by --wc-hero-opacity so streamer-readable text
       stays legible over even busy badges. */
    .wc-hero-bg {
      position: absolute; inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: var(--wc-hero-opacity, 0);
      background: var(--wc-hero-bg, transparent);
      background-size: cover;
      background-position: center;
      transition: opacity 220ms ease;
      z-index: 0;
    }
    /* The hero-bg lives inside .win-card; the existing flex children need
       to render above it. Force them to a higher stacking context. */
    .win-card > .wc-row, .win-card > .wc-lb { position: relative; z-index: 1; }
    .win-card {
      position: relative;
      min-width: 420px; max-width: 720px;
      border-radius: var(--radius, 18px);
      color: var(--text-c, inherit);
      box-shadow: 0 12px 48px rgba(0,0,0,0.55), 0 0 60px var(--glow);
      display: flex; flex-direction: column; gap: 10px;
      /* NO overflow:hidden. It used to clip .wc-hero-bg to the rounded
         corners, but that layer is inset:0 with border-radius:inherit, so it
         already clips ITSELF — and the clip was also swallowing the winner's
         avatar, which is deliberately allowed to spill past the card edges
         (see .wc-avatar). Re-adding overflow:hidden here squares the pfp off
         at the border and undoes the whole corner-badge look. */
      /* Avatar geometry, consumed by .wc-avatar's negative margins. --wc-av-padx
         / --wc-av-pady must mirror this preset's padding so the overhang is
         measured from the card BORDER rather than from the padding box. */
      --wc-av-size: 180px; --wc-av-padx: 22px; --wc-av-pady: 18px;
    }
    .win-card.pad-compact  { padding: 10px 14px; gap: 6px; --wc-av-size: 130px; --wc-av-padx: 14px; --wc-av-pady: 10px; }
    .win-card.pad-regular  { padding: 18px 22px; gap: 10px; --wc-av-size: 180px; --wc-av-padx: 22px; --wc-av-pady: 18px; }
    .win-card.pad-spacious { padding: 26px 32px; gap: 14px; --wc-av-size: 180px; --wc-av-padx: 32px; --wc-av-pady: 26px; }
    .win-card.style-glass    {
      background:
        linear-gradient(var(--glass-fill, rgba(0,0,0,0.7)), var(--glass-fill, rgba(0,0,0,0.7))) padding-box,
        var(--glass-edge, linear-gradient(135deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.06) 40%, rgba(255,255,255,0.22) 75%, rgba(255,255,255,0.05) 100%)) border-box;
      border: var(--bw, 1px) var(--bs, solid) transparent;
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      box-shadow:
        0 12px 48px rgba(0,0,0,0.55),
        0 0 60px var(--glow),
        inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .win-card.style-solid    { background: #0d1320; border: var(--bw, 1px) var(--bs, solid) var(--bc, var(--accent)); }
    .win-card.style-outlined { background: transparent; border: var(--bw, 2px) var(--bs, solid) var(--bc, var(--accent)); }
    .win-card.style-banner   { background: linear-gradient(90deg, rgba(0,0,0,0.85), rgba(0,0,0,0.55)); border: 0; border-left: var(--bw, 4px) var(--bs, solid) var(--bc, var(--accent)); border-radius: 4px; min-width: 520px; max-width: 920px; }
    .wc-row { display: flex; align-items: center; gap: 16px; }
    /* Winner pfp — 2.5x the old 72px disc (180px), pinned to the card's
       top-left corner and deliberately spilling past the card's left and top
       borders so all that extra size costs the layout as little as possible.
       40% of the disc hangs off the left edge, 30% off the top.

       NEGATIVE MARGINS, not position:absolute. A flex item pulled left by a
       negative margin still reserves only the portion that stays INSIDE the
       row, so the text gutter and the row's height both come out right for
       free — and they collapse to nothing the moment the avatar is hidden
       (showAvatar off, no profilePic, or the always-show placeholder), which
       an absolutely-positioned disc plus a hard-coded padding-left would not.

       The "- var(--wc-av-padx/pady)" terms cancel the card's own padding so
       the overhang is measured from the card BORDER; without them the padding
       eats most of the spill and the disc barely breaks the edge. Both vars
       are declared per padding preset on .win-card — keep them in sync with
       that preset's padding or the overhang drifts. */
    .wc-avatar {
      width: var(--wc-av-size, 180px); height: var(--wc-av-size, 180px);
      border-radius: 50%;
      object-fit: cover;
      align-self: flex-start; /* upper-left corner, not vertically centered */
      margin-left: calc(var(--wc-av-size, 180px) * -0.4 - var(--wc-av-padx, 22px));
      margin-top:  calc(var(--wc-av-size, 180px) * -0.3 - var(--wc-av-pady, 18px));
      /* When winner has pfp_border, override the accent stroke with their
         cosmetic stroke (e.g. gradient via border-image). Falls back to
         the accent ring when no cosmetic is set — 5px so the ring still
         reads at 180px (3px vanished once the disc grew). */
      border: var(--wc-pfp-border, 5px solid var(--accent));
      outline: var(--wc-pfp-outline, none);
      /* pfp_glow stacks on top of the existing accent halo so cosmetic-
         owners get an additive halo (their tint + the card's accent). */
      box-shadow: var(--wc-pfp-glow, 0 0 20px var(--glow));
      flex-shrink: 0;
    }
    .win-card.pad-compact .wc-avatar { border-width: 4px; }
    .wc-text { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .wc-headline {
      font-weight: 900; font-size: calc(1.05rem * var(--tm, 1) / var(--ws, 1)); color: var(--accent);
      letter-spacing: 0.05em; text-transform: uppercase;
      text-shadow: var(--text-shadow);
    }
    /* Name + winning-word chip share one line. It is a FLEX row, not plain
       inline text, so the chip can never be the thing that gets clipped: the
       name shrinks to an ellipsis (.wc-name-text) and the word always reads.
       Before this, a wide display name ate the whole line and overflow:hidden
       silently swallowed the word chip that sits after it. */
    .wc-name {
      font-weight: 800; font-size: calc(1.6rem * var(--tm, 1) / var(--ws, 1));
      text-shadow: var(--text-shadow);
      display: flex; align-items: center; min-width: 0; overflow: hidden;
    }
    /* The shrinkable half of a name line (win card + leaderboard rows). */
    .wc-name-text {
      flex: 0 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .win-card.pad-compact .wc-name { font-size: calc(1.25rem * var(--tm, 1) / var(--ws, 1)); }
    .wc-game-pill {
      font-size: calc(0.78rem * var(--tm, 1) / var(--ws, 1)); font-weight: 700;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.08);
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--accent);
    }
    .wc-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: calc(0.92rem * var(--tm, 1) / var(--ws, 1)); opacity: 0.92; }
    .wc-chip { padding: 2px 8px; border-radius: 8px; background: rgba(255,255,255,0.08); font-variant-numeric: tabular-nums; }
    /* A long "Title found by @name — WORD" line can't stretch the card either
       (names are already capped in truncName). Same flex split as .wc-name:
       the label and the word hold their width, only the name ellipsizes. */
    .wc-title-finder {
      font-size: calc(0.82rem * var(--tm, 1) / var(--ws, 1)); opacity: 0.7; font-style: italic; margin-top: 2px;
      display: flex; align-items: baseline; min-width: 0; overflow: hidden;
      /* Wraps onto a second line rather than clipping — this line carries the
         article title on WikirecTangled, where the finder isn't the winner.
         Capped for the same reason as .is-block: uncapped, THIS line becomes
         the card's widest child and stretches it right back out. */
      flex-wrap: wrap; white-space: normal; max-width: 26em;
    }
    .wc-tf-fixed { flex: 0 0 auto; white-space: nowrap; }
    /* The quoted title is the one part allowed to break mid-line. */
    .wc-tf-word { flex: 0 1 auto; min-width: 0; white-space: normal; overflow-wrap: anywhere; }
    .wc-lb { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px; }
    .wc-lb-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: calc(0.92rem * var(--tm, 1) / var(--ws, 1)); }
    .wc-lb-rank { width: 22px; text-align: center; font-weight: 800; color: rgba(255,255,255,0.7); font-variant-numeric: tabular-nums; }
    .wc-lb-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: calc(0.85rem * var(--tm, 1) / var(--ws, 1)); overflow: hidden; flex-shrink: 0;
    }
    .wc-lb-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
    .wc-lb-name { flex: 1; min-width: 0; display: flex; align-items: center; overflow: hidden; }
    .wc-lb-points { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); }
    /* Win-tally list mode (listMode session/saved) — caption above the rows
       so viewers know the numbers are wins, not this round's points. */
    .wc-lb-title {
      font-size: calc(0.68rem * var(--tm, 1) / var(--ws, 1));
      letter-spacing: 0.14em; text-transform: uppercase;
      opacity: 0.62; font-weight: 800; padding-bottom: 2px;
    }
    /* The round's winner also sits somewhere in the standings — mark their
       row so viewers can see the win they just watched move the board. */
    .wc-lb-row.wc-lb-winner { background: rgba(255,255,255,0.07); border-radius: 8px; padding-left: 4px; padding-right: 4px; }
    .wc-lb-trophy { font-size: 0.82em; opacity: 0.85; margin-left: 1px; }
    /* Word chip — appears next to whoever found the target (Subtextle / wiki* style games). */
    .wc-found-word {
      display: inline-block;
      padding: 1px 10px;
      margin-left: 8px;
      border: 1px solid rgba(0, 0, 0, 0.55);
      border-radius: 8px;
      font-size: 0.78em;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      vertical-align: middle;
      white-space: nowrap;
      /* Never shrink or wrap inside a .wc-name / .wc-lb-name flex row — the
         name yields space to the word, not the other way round. */
      flex: 0 0 auto; max-width: 100%;
    }
    /* Wiki games (wikicontexto / WikirecTangled) send a multi-word ARTICLE
       TITLE, not a single guessable word. On the name line a nowrap chip that
       long drove .win-card straight to its 720px ceiling and then got clipped
       by .wc-name's overflow, so the widget visibly ballooned round to round.
       Past the length threshold the chip drops to its own full-width row and
       wraps instead: the card keeps its natural width and only grows a little
       in height. See _wcIsLongTitle. */
    .wc-found-word.is-block {
      display: -webkit-box;
      -webkit-line-clamp: 3; line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-left: 0; margin-top: 4px;
      padding: 4px 12px;
      white-space: normal;
      /* A single un-spaced title longer than the card must break too, or it
         reintroduces the exact overflow this row exists to avoid. */
      overflow-wrap: anywhere;
      text-align: center;
      line-height: 1.22;
      font-size: calc(1.05rem * var(--tm, 1) / var(--ws, 1));
      align-self: stretch;
      /* The card is elastic (420–720px) and sizes to its widest child, so an
         uncapped block just moves the stretching from one line to one long
         row. Capping in `em` wraps the title at roughly the width the rest of
         the card already needs, and scales with the --tm/--ws sliders. */
      max-width: 20em;
    }
    .win-card.pad-compact .wc-found-word.is-block { font-size: calc(0.9rem * var(--tm, 1) / var(--ws, 1)); }
    /* Standings rows stay one line — a long title there ellipsizes rather than
       pushing the name and points out of the row. */
    .wc-lb .wc-found-word { max-width: 58%; overflow: hidden; text-overflow: ellipsis; }

    /* ── Game Embed ──────────────────────────────────────────── */
    .game-embed {
      /* Width/height set inline by renderGameEmbedWidget based on the
         widget's widthPct/heightPct config. Style classes (.style-glass etc.)
         contribute border/bg/blur exactly like the other widgets. */
      overflow: hidden;
      border-radius: var(--radius, 16px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.4);
      /* renderGameEmbedWidget sets width/height inline in px. There is no
         global border-box reset in this file, so without this a border would
         be ADDED to those pixels and push the widget past its configured
         size. Default borderWidth for gameEmbed is 0, so this is inert until
         a streamer actually sets a border. */
      box-sizing: border-box;
      /* Glass had no border declaration at all, which is why Border width /
         colour / style were dead on this widget. Transparent default keeps
         the existing look at borderWidth:0. */
      border: var(--bw, 0px) var(--bs, solid) var(--bc, transparent);
    }
    .game-embed.pad-compact  { padding: 4px; }
    .game-embed.pad-regular  { padding: 8px; }
    .game-embed.pad-spacious { padding: 14px; }
    /* Game-card glass: applied to the whole card wrapper. backdrop-filter
       here samples the animated bg layer behind .game-embed and blurs it
       — the iframe content (game with transparent body) is drawn on top
       and any transparent area shows the glassy pixels through. This is
       what makes the *whole game card* read as a frosted glass surface,
       not just the inner panels of the game. */
    /* Glass on the game-embed widget itself — backdrop-filter samples
       the animated bg in the parent stacking context. Iframe sits on top
       transparent; the blurred bg shows through unmuddied. Simple. */
    .game-embed.style-glass {
      /* --glass-fill is set by applyCommonStyles from the widget's bgColor +
         bgOpacity (it clears the inline background on the glass path and
         expects the CSS to read the var — every other widget's glass rule
         does). This used to hardcode the tint, which is why the Bg colour
         and Bg opacity controls silently did nothing on the Game widget.
         The fallback keeps the previous look when no bgColor is set. */
      background: var(--glass-fill, rgba(8, 18, 28, 0.20));
      backdrop-filter: blur(28px) saturate(200%) brightness(1.03);
      -webkit-backdrop-filter: blur(28px) saturate(200%) brightness(1.03);
      box-shadow:
        0 14px 48px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.20),
        inset 0 -1px 0 rgba(0,0,0,0.30);
    }
    /* The other three Style options had NO CSS at all, so Solid / Outlined /
       Banner each rendered as a transparent borderless box — identical to one
       another. These mirror the .goal treatments so the dropdown means
       something. Note _typeDefaults('gameEmbed') ships borderWidth:0, so the
       --bw fallbacks below only apply once a streamer sets a width. */
    .game-embed.style-solid {
      background: var(--glass-fill, #0d1320);
      border: var(--bw, 1px) var(--bs, solid) var(--bc, var(--accent));
      backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    .game-embed.style-outlined {
      background: var(--glass-fill, transparent);
      border: var(--bw, 2px) var(--bs, solid) var(--bc, var(--accent));
      backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    .game-embed.style-banner {
      background: var(--glass-fill, rgba(0,0,0,var(--bg-op, 0.7)));
      border: 0;
      border-left: var(--bw, 4px) var(--bs, solid) var(--bc, var(--accent));
      border-radius: 4px;
      backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    /* Games that go transparent inside their own iframe under ?obs=1 get a
       fully transparent parent widget (no tint, no blur) so the animated bg
       shows through clear. Subtextle's inner cards (.guess-entry /
       .guess-chip) additionally apply their own backdrop-filter, which has
       real bg pixels to sample because Subtextle mounts AnimBg INSIDE its
       own document — that's what makes it read as frosted glass rather than
       merely see-through. backdrop-filter cannot cross an iframe boundary,
       so the other games here are see-through, not frosted.

       ADD A GAME HERE ONLY IF its embedded page actually clears its own
       backgrounds under ?obs=1. Otherwise the tint below is the only thing
       hiding an opaque page, and removing it changes nothing.
         Subtextle / Subtextle-numbers / Subtextle-grid → AnimBg + transparent
         sproutle / erecTangled / recTangled → obs-mode clears container+tiles
         wordle → obs-mode clears .container/#game-ui/#app (mp.html:57)
         word500 → obs-mode clears html/body (next/index.html); only opaque
                   layer, guess tiles carry their own colours
         wikiSubtextle → obs-mode clears html/body + .article-panel and forces
                   #gameArea::before to backdrop-filter:none (index.html:237).
                   It only qualifies as of the fix that restored `obs=1` to its
                   embed URL in server.js _STREAM_VIEW_GAME_URLS — before that
                   the page rendered full-site/opaque and this tint was the
                   only thing hiding it. Dropping the blur also removes a
                   1080x1920 backdrop-filter: blur(18px) saturate(180%), which
                   render1 (no GPU, SwiftShader raster) was paying for every
                   frame at 30fps. */
    body.game-Subtextle .game-embed.style-glass,
    body.game-wikiSubtextle .game-embed.style-glass,
    body.game-Subtextle-numbers .game-embed.style-glass,
    body.game-Subtextle-grid .game-embed.style-glass,
    body.game-sproutle .game-embed.style-glass,
    body.game-erecTangled .game-embed.style-glass,
    body.game-recTangled .game-embed.style-glass,
    body.game-wordle .game-embed.style-glass,
    body.game-word500 .game-embed.style-glass {
      /* var(--glass-fill, transparent), NOT a flat `transparent`. Empty Bg
         colour → glass-fill unset → transparent → the full-screen animated
         background shows through the see-through game (the default). But when a
         streamer DOES set the widget's Background colour, applyCommonStyles sets
         --glass-fill and it shows here — so the Background setting actually
         works on a see-through game instead of being clobbered to transparent.
         NB this rule is keyed on the body's ACTIVE-game class but matches EVERY
         .game-embed on the page, so a game widget pinned to a different game
         (e.g. a wordle widget while Subtextle is live) was having its Bg colour
         wiped by the active game's override — this is the fix for that too. */
      background: var(--glass-fill, transparent);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: none;
    }
    /* Make sure the iframe sits ABOVE the blur card */
    .game-embed .game-clip { position: relative; z-index: 1; }
    /* .game-embed needs to be a positioned container for the blur card */
    .game-embed { position: relative; }
    .game-embed .game-clip {
      width: 100%; height: 100%;
      overflow: hidden;
      border-radius: calc(var(--radius, 16px) - 4px);
      position: relative;
      /* Transparent so games whose body bg is transparent let the animated
         layer behind show through (glassmorphism path). Games that have
         opaque bodies still cover this; the transparency only matters when
         the game opts in. */
      background: transparent;
    }
    .game-embed .game-iframe {
      width: 100%; height: 100%;
      border: 0; background: transparent;
      display: block;
    }
    /* The .stage parent is pointer-events:none so it doesn't block clicks to
       the OBS source background. The game-embed widget IS the interactive
       game though, so we have to re-enable pointer-events on it (and the
       iframe inside) or every click falls through to whatever is behind. */
    .widget.has-game .game-embed, .widget.has-game .game-iframe { pointer-events: auto; }
    /* In edit/preview mode the iframe must NOT capture clicks — otherwise
       drag-to-position on the gameEmbed widget is impossible (pointerdown
       lands in the cross-origin iframe and never bubbles to .widget). */
    body.edit .widget.has-game .game-iframe,
    body.preview .widget.has-game .game-iframe { pointer-events: none; }

    /* ── Ad Banner / Junk Drawer shells ───────────────────────────
       Both shells are created in JS (ensureAdBannerIframe /
       ensureJunkDrawerIframe) and are contentEl.firstElementChild, so
       applyCommonStyles DOES stamp c-* / pad-* / style-* onto them — there
       was simply no CSS to match, so Style / Radius / Border / Bg all
       silently no-opped despite the comments at renderAdBanner claiming
       otherwise.

       Deliberately NO pad-* rules here. renderAdBanner/renderJunkDrawer size
       the shell inline in px and then scale the child iframe by
       (wPx / 2000) — i.e. off the shell's OUTER width, not its content box.
       Adding padding would shrink the content box while the iframe kept its
       outer-width scale, pushing it under overflow:hidden and clipping the
       rail. Making Padding real for these two needs the render math to
       subtract the padding first; that's a JS change, not a CSS one. */
    .ad-banner-shell, .junk-drawer-shell {
      box-sizing: border-box;
      border-radius: var(--radius, 16px);
      border: var(--bw, 0px) var(--bs, solid) var(--bc, transparent);
      background: var(--glass-fill, transparent);
    }
    .ad-banner-shell.style-glass, .junk-drawer-shell.style-glass {
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
    }
    .ad-banner-shell.style-solid, .junk-drawer-shell.style-solid {
      background: var(--glass-fill, #0d1320);
      border: var(--bw, 1px) var(--bs, solid) var(--bc, var(--accent));
    }
    .ad-banner-shell.style-outlined, .junk-drawer-shell.style-outlined {
      border: var(--bw, 2px) var(--bs, solid) var(--bc, var(--accent));
    }
    .ad-banner-shell.style-banner, .junk-drawer-shell.style-banner {
      background: var(--glass-fill, rgba(0,0,0,var(--bg-op, 0.7)));
      border: 0;
      border-left: var(--bw, 4px) var(--bs, solid) var(--bc, var(--accent));
      border-radius: 4px;
    }

    /* ── Camera Embed ────────────────────────────────────────── */
    .camera-embed {
      overflow: hidden;
      border-radius: var(--radius, 16px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.4);
      position: relative;
      /* Same reasoning as .game-embed: sized inline in px, no global
         border-box reset, so a border must not inflate the box. */
      box-sizing: border-box;
      border: var(--bw, 0px) var(--bs, solid) var(--bc, transparent);
    }
    .camera-embed.pad-compact  { padding: 4px; }
    .camera-embed.pad-regular  { padding: 8px; }
    .camera-embed.pad-spacious { padding: 14px; }
    /* Style select had no matching CSS, so it was inert. These style the
       OUTER wrapper (the ring the padding exposes around the stage) and are
       deliberately separate from the camera's own Background control
       (.bg-black / .bg-transparent / .bg-glass), which targets .camera-stage
       INSIDE this. Both can be set; the stage draws on top of the wrapper. */
    .camera-embed.style-glass {
      background: var(--glass-fill, rgba(8, 18, 28, 0.20));
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
    }
    .camera-embed.style-solid {
      background: var(--glass-fill, #0d1320);
      border: var(--bw, 1px) var(--bs, solid) var(--bc, var(--accent));
      backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    .camera-embed.style-outlined {
      background: var(--glass-fill, transparent);
      border: var(--bw, 2px) var(--bs, solid) var(--bc, var(--accent));
      backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    .camera-embed.style-banner {
      background: var(--glass-fill, rgba(0,0,0,var(--bg-op, 0.7)));
      border: 0;
      border-left: var(--bw, 4px) var(--bs, solid) var(--bc, var(--accent));
      border-radius: 4px;
      backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    .camera-embed .camera-stage {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: calc(var(--radius, 16px) - 4px);
      position: relative;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }
    .camera-embed.bg-transparent .camera-stage {
      background: transparent;
    }
    .camera-embed.bg-glass .camera-stage {
      background:
        linear-gradient(var(--camera-glass-fill-top, rgba(255,255,255,0.08)), var(--camera-glass-fill-bottom, rgba(255,255,255,0.03))) padding-box,
        linear-gradient(135deg, var(--camera-glass-edge-strong, rgba(255,255,255,0.45)), var(--camera-glass-edge-soft, rgba(255,255,255,0.06)), var(--camera-glass-edge-mid, rgba(255,255,255,0.18))) border-box;
      border: 1px solid transparent;
      backdrop-filter:
        blur(var(--camera-glass-blur, 18px))
        saturate(var(--camera-glass-saturation, 185%))
        brightness(var(--camera-glass-brightness, 100%));
      -webkit-backdrop-filter:
        blur(var(--camera-glass-blur, 18px))
        saturate(var(--camera-glass-saturation, 185%))
        brightness(var(--camera-glass-brightness, 100%));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 -1px 0 rgba(0,0,0,0.25);
    }
    .camera-embed .camera-video,
    .camera-embed .camera-key-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
      object-position: center center;
    }
    .camera-embed.bg-black .camera-video { background: #000; }
    .camera-embed .camera-video.mirror {
      transform: scaleX(-1);
      transform-origin: center center;
    }
    .camera-embed .camera-key-canvas {
      display: none;
    }
    .camera-embed.key-black .camera-video {
      opacity: 0;
      pointer-events: none;
    }
    .camera-embed.key-black .camera-key-canvas {
      display: block;
    }
    .camera-embed .camera-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      text-align: center;
      background: linear-gradient(180deg, rgba(5,10,18,0.45), rgba(5,10,18,0.72));
      transition: opacity 180ms ease;
    }
    .camera-embed.live .camera-overlay {
      opacity: 0;
      pointer-events: none;
    }
    .camera-placeholder {
      max-width: min(84%, 320px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-shadow: var(--text-shadow);
    }
    .camera-placeholder .camera-icon {
      font-size: calc(2rem * var(--tm, 1) / var(--ws, 1));
      line-height: 1;
      opacity: 0.92;
    }
    .camera-placeholder .camera-title {
      font-size: calc(1rem * var(--tm, 1) / var(--ws, 1));
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .camera-placeholder .camera-message {
      font-size: calc(0.82rem * var(--tm, 1) / var(--ws, 1));
      line-height: 1.35;
      opacity: 0.86;
    }
    .camera-placeholder .camera-action {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.10);
      color: inherit;
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      pointer-events: auto;
    }
    .widget.has-camera .camera-embed { pointer-events: none; }
    .widget.has-camera .camera-action { pointer-events: auto; }
    body.edit .widget.has-camera .camera-action,
    body.preview .widget.has-camera .camera-action { pointer-events: none; }

    /* ── Top Likers ──────────────────────────────────────────── */
    .top-likers {
      /* Fixed width — long usernames truncate via .tl-name ellipsis instead
         of stretching the card. Portrait uses a wider card since vertical
         space is at a premium; landscape can afford a narrower one. */
      width: 380px;
      border-radius: var(--radius, 14px);
      color: var(--text-c, inherit);
      box-shadow: 0 6px 24px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }
    body.landscape .top-likers { width: 360px; }
    .top-likers.pad-compact  { padding: 8px 12px; }
    .top-likers.pad-regular  { padding: 14px 16px 12px; }
    .top-likers.pad-spacious { padding: 22px 24px; }
    .top-likers.style-glass    {
      background:
        linear-gradient(var(--glass-fill, rgba(0,0,0,0.6)), var(--glass-fill, rgba(0,0,0,0.6))) padding-box,
        var(--glass-edge, linear-gradient(135deg, rgba(255,255,255,0.40) 0%, rgba(255,255,255,0.06) 40%, rgba(255,255,255,0.16) 75%, rgba(255,255,255,0.04) 100%)) border-box;
      border: var(--bw, 1px) var(--bs, solid) transparent;
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      box-shadow:
        0 6px 24px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.18);
    }
    .top-likers.style-solid    { background: #0d1320; border: var(--bw, 1px) var(--bs, solid) var(--bc, var(--accent)); }
    .top-likers.style-outlined { background: transparent; border: var(--bw, 2px) var(--bs, solid) var(--bc, var(--accent)); }
    .top-likers.style-banner   { background: linear-gradient(180deg, rgba(0,0,0,0.85), rgba(0,0,0,0.55)); border: 0; border-top: var(--bw, 4px) var(--bs, solid) var(--bc, var(--accent)); border-radius: 4px; }
    .tl-title {
      font-weight: 800; font-size: calc(0.85rem * var(--tm, 1) / var(--ws, 1));
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      text-shadow: var(--text-shadow);
    }
    .tl-row { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 8px; }
    .tl-row + .tl-row { border-top: 1px solid rgba(255,255,255,0.06); }
    .tl-row.gold   { background: linear-gradient(90deg, rgba(246,196,83,0.12), transparent); }
    .tl-row.silver { background: linear-gradient(90deg, rgba(192,200,210,0.10), transparent); }
    .tl-row.bronze { background: linear-gradient(90deg, rgba(205,127,50,0.10), transparent); }
    .tl-rank { width: 22px; text-align: center; font-weight: 800; font-size: calc(0.92rem * var(--tm, 1) / var(--ws, 1)); font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.7); }
    .tl-row.gold .tl-rank   { color: #f6c453; }
    .tl-row.silver .tl-rank { color: #c0c8d2; }
    .tl-row.bronze .tl-rank { color: #cd7f32; }
    .tl-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: calc(0.92rem * var(--tm, 1) / var(--ws, 1)); color: rgba(255,255,255,0.92);
      flex-shrink: 0; overflow: hidden;
    }
    .tl-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
    .tl-name { flex: 1; min-width: 0; font-weight: 600; font-size: calc(0.96rem * var(--tm, 1) / var(--ws, 1)); text-shadow: var(--text-shadow); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tl-likes { font-weight: 700; font-size: calc(0.9rem * var(--tm, 1) / var(--ws, 1)); font-variant-numeric: tabular-nums; color: var(--accent); text-shadow: var(--text-shadow); }

    /* ── Edit / preview mode ────────────────────────────────── */
    body.edit .widget, body.preview .widget {
      pointer-events: auto; cursor: grab; touch-action: none;
      outline: 2px dashed rgba(255, 255, 255, 0.32);
      outline-offset: 4px;
    }
    body.edit .widget.dragging,
    body.preview .widget.dragging { cursor: grabbing; outline-color: rgba(255, 255, 255, 0.85); }
    .widget-tag {
      position: absolute; top: -22px; left: 0;
      font-size: 10px;
      background: rgba(0,0,0,0.7);
      padding: 2px 8px; border-radius: 999px;
      letter-spacing: 0.05em; text-transform: uppercase;
      color: #fff; pointer-events: none;
      display: none;
    }
    body.edit .widget-tag, body.preview .widget-tag { display: inline-block; }
    .widget-content {
      position: relative;
    }
    .widget.is-trimmed .widget-content {
      contain: paint;
      overflow: hidden;
    }
    .widget.has-game.is-trimmed .widget-content,
    .widget.has-game.is-trimmed .game-embed,
    .widget.has-game.is-trimmed .game-clip,
    .widget.has-game.is-trimmed .game-iframe {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    body.trim-preview .widget.trim-preview-hidden,
    body.trim-preview #anim-bg-layer.trim-preview-hidden {
      display: none !important;
    }
    body.trim-preview .widget:not(.trim-preview-hidden) {
      outline-color: rgba(90, 182, 255, 0.9);
    }

    /* ── Debug pill ─────────────────────────────────────────── */
    #status {
      position: fixed; left: 12px; bottom: 12px;
      padding: 6px 10px; border-radius: 999px;
      background: rgba(0,0,0,0.55);
      font-size: 12px; letter-spacing: 0.04em;
      display: none;
    }
    body.debug #status, body.edit #status { display: inline-block; }
    body.debug .stage { background: repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0 12px, transparent 12px 24px); }
    .ok { color: #43d17c; } .bad { color: #ff667a; }

    /* ── Animated background layer ──────────────────────────────
       Renders in the same stage stack as normal widgets. Its z-index is
       assigned from widgetOrder, so dragging the background widget changes
       whether it sits behind, between, or over other widgets. */
    #anim-bg-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
      box-sizing: border-box;
    }
    #anim-bg-layer canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #anim-bg-layer .vscroll {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 100%;
      overflow: hidden;
    }
    #anim-bg-layer .vscroll-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: animBgScroll var(--anim-bg-scroll-dur, 200s) linear infinite;
      will-change: transform;
    }
    @keyframes animBgScroll {
      0%   { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }
    #anim-bg-layer .vscroll .v-letter {
      width: 120px;
      text-align: center;
      font-family: 'Outfit', system-ui, sans-serif;
      font-weight: 900;
      font-size: 64px;
      line-height: 0.95;
      padding: 4px 0;
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
      color: var(--anim-bg-fg, #fff);
    }
    #anim-bg-layer .vscroll .v-letter.faded { opacity: 0.38; }
    #anim-bg-layer .vscroll .v-letter.tld   { font-size: 44px; }
    #anim-bg-layer .vscroll .v-word {
      width: 120px;
      text-align: center;
      font-family: 'Fredoka', 'Outfit', system-ui, sans-serif;
      font-weight: 700;
      font-size: 30px;
