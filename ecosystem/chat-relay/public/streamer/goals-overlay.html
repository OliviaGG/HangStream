      function _fanClubClamp(n, lo, hi, fallback) {
        const x = Number(n);
        return Number.isFinite(x) ? Math.max(lo, Math.min(hi, x)) : fallback;
      }

      function _fanClubColor(v, fallback) {
        const s = String(v || '').trim();
        return /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(s) ? s : fallback;
      }

      function _fanClubShapePath(barHeight) {
        const bottom = 258;
        const top = Math.max(118, Math.min(224, bottom - barHeight));
        return {
          top,
          bottom,
          d: [
            `M42 ${top}`,
            `L150 ${top}`,
            'L150 120',
            'L109 120',
            'L211 28',
            'L315 120',
            'L270 120',
            `L270 ${top}`,
            `L736 ${top}`,
            `Q762 ${top} 762 ${top + 27}`,
            `L762 ${bottom - 24}`,
            `Q762 ${bottom} 736 ${bottom}`,
            `L42 ${bottom}`,
            `Q18 ${bottom} 18 ${bottom - 24}`,
            `L18 ${top + 24}`,
            `Q18 ${top} 42 ${top}`,
            'Z',
          ].join(' '),
        };
      }

        switch (variant) {

            return '<rect class="fc-scan" x="18" y="-90" width="744" height="42" rx="18"></rect>'
              + '<path class="fc-inner" d="M86 154 H720"></path>';

              + '<path class="fc-bolt" d="M690 166 L716 124 L684 134 L708 92"></path>';
          case 'sticker':
            return '<path class="fc-inner" d="M58 ' + (top + 19) + ' H730"></path>'
              + '<path class="fc-inner" d="M72 ' + (bottom - 21) + ' H704"></path>';
          case 'vip':
            return '<ellipse class="fc-halo" cx="235" cy="107" rx="103" ry="72"></ellipse>'
              + '<ellipse class="fc-halo" cx="235" cy="107" rx="144" ry="98" style="animation-delay:.4s"></ellipse>';
          case 'spray':
            return '<circle class="fc-spray-dot" cx="90" cy="94" r="10"></circle>'

              + '<circle class="fc-spray-dot" cx="640" cy="82" r="7" style="animation-delay:.6s"></circle>'
              + '<path class="fc-drip" d="M80 ' + bottom + ' q8 34 0 58 q-9 -25 0 -58Z"></path>'
              + '<path class="fc-drip" d="M708 ' + bottom + ' q10 42 0 70 q-11 -28 0 -70Z" style="animation-delay:.35s"></path>';
          case 'glitch':
            return '<path class="fc-rgb" d="' + shapePath + '" fill="none" style="stroke:var(--fc-primary)" stroke-width="9"></path>'
              + '<path class="fc-rgb" d="' + shapePath + '" fill="none" style="stroke:var(--fc-secondary); animation-delay:.12s" stroke-width="9"></path>';
          case 'liquid':
            return '<path class="fc-inner" d="M68 ' + (bottom - 42) + ' C210 ' + (bottom - 72) + ' 360 ' + (bottom - 18) + ' 518 ' + (bottom - 45) + ' S700 ' + (bottom - 56) + ' 740 ' + (bottom - 34) + '"></path>';
          case 'compact':
            return '<path class="fc-inner" d="M72 ' + (top + ((bottom - top) / 2)) + ' H716"></path>';
          case 'graffiti':

              + '<circle class="fc-spray-dot" cx="742" cy="' + (bottom + 12) + '" r="10"></circle>';
        }
      }

      function applyFanClubAdVisibility(w, entry, baseVisible) {
        if (!entry) return;

        if (!baseVisible) {
          entry.el.classList.remove('show');
          return;

        if (isAlwaysShow() || !w.cycleEnabled) {
          entry.el.classList.add('show');
          return;
        }

        const everyMs = Math.max(10, Math.min(3600, Math.round(Number(w.showEverySec) || 120))) * 1000;
        const durationMs = Math.min(everyMs, Math.max(5, Math.min(300, Math.round(Number(w.showDurationSec) || 20))) * 1000);
        const cycleSig = [w.id, everyMs, durationMs].join('|');
        if (entry.fanClubAdCycleSig !== cycleSig || !entry.fanClubAdCycleStart) {
          entry.fanClubAdCycleSig = cycleSig;
          entry.fanClubAdCycleStart = Date.now();
        }

        const phase = (Date.now() - entry.fanClubAdCycleStart) % everyMs;
        const showing = phase < durationMs;
        entry.el.classList.toggle('show', showing);
        const nextMs = showing ? (durationMs - phase) : (everyMs - phase);
        entry.fanClubAdTimer = setTimeout(() => {
          applyFanClubAdVisibility(w, entry, true);

              + '<div class="cg-name">' + escapeHtml(g.name) + '</div>'
              + '<div class="cg-price"><span class="cg-coin">♪</span><span class="cg-cost">' + g.coins + '</span></div>'
              + '<div class="cg-sender"></div>'
              + '</div>').join('')
            + '</div>'
            + (cta ? '<div class="cg-cta">' + escapeHtml(cta) + '</div>' : '')
            + '</div></div>';
        }
        const root = entry.contentEl.firstElementChild;
        root.style.setProperty('--cg-header', headerColor);
        root.style.setProperty('--cg-header-light', _cgLightenHex(headerColor, 0.35));
        applyCommonStyles(w, entry);
      }

      // Notifications widget — transparent positioning host for the owing /
      // batch alerts. The banner element is built once here; live events
      // (showOwingBanner / showBatchBanner) fill + reveal it. The placeholder
      // text is only ever seen in the dashboard preview/edit view (the banner
      // is display:none in OBS output until an event fires).
      function renderNotifications(w) {
        const entry = widgetMap.get(w.id);
        if (!entry) return;
        if (!entry.contentEl.querySelector('.notif-banner')) {
          entry.contentEl.innerHTML = ''
            + '<div class="notif-banner">'
            + '<img class="nb-pfp" alt="" src="" style="display:none">'
            + '<div class="nb-text">'
            + '<div class="nb-title">🔔 Notifications appear here</div>'
            + '<div class="nb-sub">Owing “pay up” &amp; batch “Donor perk” alerts</div>'
            + '</div></div>';
        }
        applyCommonStyles(w, entry);
      }

      // Same timed-cycle behavior as the Fan Club Ad, plus a "flash"
      // override that keeps the card visible while a gift burst plays
      // even if the cycle would have it hidden.
      function applyCampaignGiftVisibility(w, entry, baseVisible) {
        if (!entry) return;
        if (entry.campaignGiftTimer) {
          clearTimeout(entry.campaignGiftTimer);
          entry.campaignGiftTimer = null;
        }
        if (!baseVisible) {
          entry.el.classList.remove('show');
          return;
        }
        if (isAlwaysShow() || !w.cycleEnabled) {
          entry.el.classList.add('show');
          return;
        }

        const everyMs = Math.max(10, Math.min(3600, Math.round(Number(w.showEverySec) || 120))) * 1000;
        const durationMs = Math.min(everyMs, Math.max(5, Math.min(300, Math.round(Number(w.showDurationSec) || 20))) * 1000);
        const cycleSig = [w.id, everyMs, durationMs].join('|');
        if (entry.campaignGiftCycleSig !== cycleSig || !entry.campaignGiftCycleStart) {
          entry.campaignGiftCycleSig = cycleSig;
          entry.campaignGiftCycleStart = Date.now();
        }

        const flashing = !!(entry._cgFlashUntil && entry._cgFlashUntil > Date.now());
        const phase = (Date.now() - entry.campaignGiftCycleStart) % everyMs;
        const showing = phase < durationMs;
        entry.el.classList.toggle('show', showing || flashing);
        const nextMs = showing ? (durationMs - phase) : (everyMs - phase);
        entry.campaignGiftTimer = setTimeout(() => {
          applyCampaignGiftVisibility(w, entry, true);
        }, Math.max(250, Math.min(2147483647, Math.ceil(nextMs) + 20)));
      }

      // Celebration burst on the matching tile when the actual TikTok
      // gift arrives over the streamer-gift room.
      function fireCampaignGiftBurst(w, tileIdx, user) {
        const entry = widgetMap.get(w.id);
        if (!entry) return;
        if (!entry.contentEl.firstElementChild) renderCampaignGift(w);
        const root = entry.contentEl.firstElementChild;
        const tile = root && root.querySelector('.cg-tile[data-gift="' + tileIdx + '"]');
        if (!tile) return;
        entry._cgFlashUntil = Date.now() + 6000;
        entry.el.classList.add('show');
        const who = String(user?.displayName || user?.username || '').slice(0, 24);
        const senderEl = tile.querySelector('.cg-sender');
        if (senderEl) senderEl.textContent = who ? (who + ' sent one! \u{1F389}') : 'Thank you! \u{1F389}';
        // Restart the animation cleanly on rapid repeat gifts.
        tile.classList.remove('cg-burst');
        void tile.offsetWidth;
        tile.classList.add('cg-burst');
        if (!entry._cgBurstTimers) entry._cgBurstTimers = {};
        clearTimeout(entry._cgBurstTimers[tileIdx]);
        entry._cgBurstTimers[tileIdx] = setTimeout(() => {
          tile.classList.remove('cg-burst');
          entry._cgFlashUntil = 0;
          applyCampaignGiftVisibility(w, entry, isWidgetVisible(w));
        }, 6000);
      }

      // Donate pill — static promo: label + bare-domain URL. The URL
      // display strips https:// + www. so it stays compact ("jorry.live"
      // rather than "https://www.jorry.live").
      function _stripDonateUrl(url) {
        if (!url) return '';
        try { return String(url).replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, ''); }
        catch (_) { return String(url || ''); }
      }
      function renderDonate(w) {
        const entry = widgetMap.get(w.id);
        if (!entry.contentEl.firstElementChild) {
          entry.contentEl.innerHTML = '<div class="donate"><span class="text"><span class="label"></span> <span class="url"></span></span></div>';
        }
        applyCommonStyles(w, entry);
        const root = entry.contentEl.firstElementChild;
        root.querySelector('.label').textContent = String(w.label || 'Donate @');
        root.querySelector('.url').textContent   = _stripDonateUrl(w.url) || 'jorry.live';
      }

      // ── Game Vote ────────────────────────────────────────────────
      // Logos are resolved here (not server-side) because these are browser
      // asset paths. All of these are portal art: the `/game/<id>/icon.png`
      // form that the activity overlay uses 404s on prod (verified against
      // :3000 directly, so it isn't the nginx allowlist — those files just
      // don't exist), which would have left every row logo-less.
      const GV_LOGOS = {
        Subtextle: '/portal/img/game-subtextle.png',
        'Subtextle-grid': '/portal/img/game-subtextle.png',
        'Subtextle-numbers': '/portal/img/game-subtextle.png',
        wikiSubtextle: '/portal/img/game-wikiSubtextle.png',
        recTangled: '/portal/img/game-recTangled.png',
        erecTangled: '/portal/img/game-erecTangled.png',
        sproutle: '/portal/img/game-sproutle.png',
        WikirecTangled: '/portal/img/game-wikirectangled.png',
        'WikiWord 4×4': '/portal/img/game-wikiword.png',
        word500: '/portal/img/game-word500.png',
        colour500: '/portal/img/game-colour500.svg',
        spellingbee: '/portal/img/game-spellingbee.png',
        pixeletters: '/portal/img/game-pixeletters.png',
        wordle: '/portal/img/game-wordle.png',
        betwixt: '/portal/img/game-betwixt.png',
        figural: '/portal/img/game-figural.png',
        synapse: '/portal/img/game-synapse.png',
        letterworks: '/letterworks/icon.svg',
        wordfall: '/wordfall/icon.svg',
      };

      // Last vote payload from the server, per streamer (one vote at a time,
      // but every enabled gameVote widget renders the same one).
      let _gvState = null;

      function _gvMMSS(sec) {
        const n = Math.max(0, Number(sec) || 0);
        return Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
      }

      // Sample ballot so the card is positionable in edit/preview before a
      // real vote has ever run. Mirrors the winCard/pookieTok placeholder idea.
      function _gvPlaceholder(w) {
        const rows = [
          { n: 1, gameId: 'erecTangled', name: 'erecTangled', votes: 5, pct: 42, keep: false },
          { n: 2, gameId: 'wordle', name: 'Wordle', votes: 3, pct: 25, keep: false },
          { n: 3, gameId: 'betwixt', name: 'Betwixt', votes: 1, pct: 8, keep: false },
        ].slice(0, Math.max(2, Math.min(4, Number(w.ballotSize) || 3)));
        if (w.allowKeepPlaying !== false) {
          rows.push({ n: rows.length + 1, gameId: 'Subtextle', name: 'Subtextle',
            votes: 3, pct: 25, keep: true });
        }
        return {
          phase: 'voting', placeholder: true,
          secondsLeft: 42, totalVotes: 12,
          activeGameId: 'Subtextle', activeGameName: 'Subtextle',
          ballot: rows,
        };
      }

      // Idle-state sample for the status card in edit/preview.
      function _gvStatusPlaceholder() {
        return {
          phase: 'idle', placeholder: true, inRotation: true,
          activeGameId: 'Subtextle', activeGameName: 'Subtextle',
          termUnit: 'rounds', roundsDone: 0, termValue: 2,
        };
      }

      function renderGameVote(w) {
        const entry = widgetMap.get(w.id);
        if (!entry) return;
        if (!entry.contentEl.firstElementChild) {
          entry.contentEl.innerHTML =
            '<div class="gvote">'
            + '<div class="gv-learn"></div>'
            + '<div class="gv-head"><span class="gv-title"></span><span class="gv-clock"></span></div>'
            + '<div class="gv-ballot"></div>'
            + '<div class="gv-hint"></div>'
            + '<div class="gv-foot"></div>'
            + '</div>';
        }
        applyCommonStyles(w, entry);
        const root = entry.contentEl.firstElementChild;

        // No live vote yet: show the sample ballot in edit/preview so it can be
        // dragged. The between-votes turn readout is NOT this widget's job —
        // it belongs to the separate gameVoteStatus card.
        let v = _gvState;
        if ((!v || v.phase === 'idle') && isAlwaysShow()) v = _gvPlaceholder(w);

        const phase = (v && v.phase) || 'idle';
        root.classList.toggle('is-voting', phase === 'voting');
        root.classList.toggle('is-result', phase === 'result');
        // Idle = nothing to show. The caller hides the host entirely.
        if (phase !== 'voting' && phase !== 'result') return;

        // Pinned promo line above the title. Blank clears it entirely, so the
        // streamer turns it off by emptying the field rather than via a toggle.
        const learnEl = root.querySelector('.gv-learn');
        const learnText = String(w.learnText ?? 'Learn to Play at WordTycoon.Live/Rules').trim();
        learnEl.textContent = learnText;
        learnEl.style.display = learnText ? '' : 'none';

        root.querySelector('.gv-title').textContent = String(w.title || 'VOTE NEXT GAME');
        root.querySelector('.gv-clock').textContent = phase === 'voting'
          ? _gvMMSS(v.secondsLeft)
          : '';

        const ballot = Array.isArray(v.ballot) ? v.ballot : [];
        const top = ballot.reduce((m, b) => Math.max(m, b.votes || 0), 0);
        const host = root.querySelector('.gv-ballot');

        // Rebuild rows only when the ballot itself changes — a re-render on
        // every tally update would restart the CSS width transition and the
        // bars would jump instead of sliding.
        const sig = ballot.map(b => b.n + ':' + b.gameId + (b.keep ? ':k' : '')).join('|');
        if (host.dataset.sig !== sig) {
          host.dataset.sig = sig;
          host.innerHTML = ballot.map(b => {
            const logo = GV_LOGOS[b.gameId];
            const logoHtml = (w.showLogos !== false && logo)
              // A missing icon must not leave a broken-image box on stream.
              ? `<img class="gv-logo" src="${escapeHtml(logo)}" alt="" onerror="this.style.display='none'">`
              : '';
            // The keep row names the game too — the ballot has to stand on its
            // own for a viewer who can't see the status card.
            const label = b.keep
              ? `Keep playing ${escapeHtml(b.name || b.gameId)}`
              : escapeHtml(b.name || b.gameId);
            return `<div class="gv-row${b.keep ? ' is-keep' : ''}" data-n="${b.n}">
                <div class="gv-row-fill"></div>
                <div class="gv-num">${b.n}</div>
                ${logoHtml}
                <div class="gv-name">${label}</div>
                <div class="gv-count"></div>
              </div>`;
          }).join('');
        }

        const winnerId = v.winner && v.winner.gameId;
        ballot.forEach(b => {
          const row = host.querySelector(`.gv-row[data-n="${b.n}"]`);
          if (!row) return;
          row.querySelector('.gv-row-fill').style.width = (Number(b.pct) || 0) + '%';
          const countEl = row.querySelector('.gv-count');
          countEl.style.display = w.showCounts === false ? 'none' : '';
          countEl.textContent = String(b.votes || 0);
          row.classList.toggle('has-votes', (b.votes || 0) > 0);
          row.classList.toggle('is-leader', phase === 'voting' && top > 0 && (b.votes || 0) === top);
          row.classList.toggle('is-winner', phase === 'result' && b.gameId === winnerId);
        });

        root.querySelector('.gv-hint').textContent = phase === 'voting'
          ? 'type the number in chat'
          : '';

        if (phase === 'result') {
          const name = v.winner ? v.winner.name : '';
          const tie = v.tiebreak ? ' (tie — coin flip)' : '';
          if (!v.winner) {
            root.querySelector('.gv-foot').textContent = '';
          } else if (v.winner.stay) {
            // "Keep playing" won — nothing switches, the turn just restarts.
            root.querySelector('.gv-foot').textContent = `STAYING ON: ${name}${tie}`;
          } else if (v.willSwitch) {
            root.querySelector('.gv-foot').textContent =
              `NEXT UP: ${name}${tie} · ${v.resultSecondsLeft}s`;
          } else {
            root.querySelector('.gv-foot').textContent = `CHAT PICKED: ${name}${tie}`;
          }
        } else {
          root.querySelector('.gv-foot').textContent = '';
        }
      }

      // ── Game Vote status card (separate widget) ──────────────────
      // Shows whose turn it is and how much of it is left. Display-only: it
      // renders whatever the gameVote widget's rules produce.
      function renderGameVoteStatus(w) {
        const entry = widgetMap.get(w.id);
        if (!entry) return;
        if (!entry.contentEl.firstElementChild) {
          entry.contentEl.innerHTML =
            '<div class="gvstatus">'
            + '<div class="gvs-main">'
              + '<img class="gvs-logo" alt="">'
              + '<span class="gvs-label"></span>'
              + '<span class="gvs-game"></span>'
              + '<span class="gvs-sep">·</span>'
              + '<span class="gvs-term"></span>'
            + '</div>'
            + '<div class="gvs-track"><div class="gvs-fill"></div></div>'
            + '</div>';
        }
        applyCommonStyles(w, entry);
        const root = entry.contentEl.firstElementChild;

        let v = _gvState;
        if ((!v || !v.inRotation) && isAlwaysShow()) v = _gvStatusPlaceholder();
        if (!v) return;

        root.classList.toggle('is-card', w.layout === 'card');
        root.classList.toggle('is-pill', w.layout !== 'card');

        const logoEl = root.querySelector('.gvs-logo');
        const logo = w.showLogo && v.activeGameId ? GV_LOGOS[v.activeGameId] : null;
        if (logo) {
          logoEl.src = logo;
          logoEl.style.display = '';
          logoEl.onerror = () => { logoEl.style.display = 'none'; };
        } else {
          logoEl.style.display = 'none';
        }

        const labelEl = root.querySelector('.gvs-label');
        labelEl.textContent = String(w.label || '');
        labelEl.style.display = w.label ? '' : 'none';

        const gameEl = root.querySelector('.gvs-game');
        gameEl.textContent = v.activeGameName || '';
        const showName = w.showGameName !== false && !!v.activeGameName;
        gameEl.style.display = showName ? '' : 'none';
        root.querySelector('.gvs-sep').style.display = showName ? '' : 'none';

        // Term text + progress. Rounds are 1-based for humans: the round in
        // play is roundsDone + 1, capped so a finished term doesn't read
        // "round 3 of 2" in the moment before the vote opens.
        let termText = '';
        let pct = 0;
        if (v.termUnit === 'rounds' && v.termValue > 0) {
          termText = `Round ${Math.min(v.roundsDone + 1, v.termValue)} of ${v.termValue}`;
          pct = Math.max(0, Math.min(100, (v.roundsDone / v.termValue) * 100));
        } else if (v.termUnit === 'minutes' && v.termValue > 0) {
          termText = `${_gvMMSS(v.termSecondsLeft)} left`;
          const total = v.termValue * 60;
          pct = Math.max(0, Math.min(100, ((total - (v.termSecondsLeft || 0)) / total) * 100));
        } else {
          termText = 'not in rotation';
        }
        // A vote is running — say so rather than showing a stale turn counter.
        if (v.phase === 'voting') { termText = 'Voting now!'; pct = 100; }
        else if (v.phase === 'result') { termText = 'Vote over'; pct = 100; }
        // Turn is done but the ballot is queued behind the win card; without
        // this the card would sit on a full bar and look stuck.
        else if (v.votePending) { termText = 'Vote coming up…'; pct = 100; }
        root.querySelector('.gvs-term').textContent = termText;

        const track = root.querySelector('.gvs-track');
        track.style.display = w.showBar === false ? 'none' : '';
        root.querySelector('.gvs-fill').style.width = pct + '%';
      }

      // Should the status card be on screen right now?
      function _gvStatusVisible(w) {
        if (isAlwaysShow()) return true;
        if (!_gvState) return false;
        if (w.hideWhileVoting && (_gvState.phase === 'voting' || _gvState.phase === 'result')) return false;
        // Stay visible even when the active game isn't in the rotation. This
        // used to return inRotation, which meant switching to a game the
        // streamer hadn't added made a widget they'd deliberately placed
        // silently vanish — indistinguishable from it being broken. The card
        // renders "<game> · not in rotation" for that case instead.
        return true;
      }

      // Re-render every Game Vote surface from the latest payload.
      function applyGameVoteUpdate(payload) {
        _gvState = payload || null;
        const widgets = (currentConfig && currentConfig.widgets) || [];
        for (const w of widgets) {
          if (!w.enabled) continue;
          const entry = widgetMap.get(w.id);
          if (!entry) continue;
          if (w.type === 'gameVote') {
            renderGameVote(w);
            const live = _gvState && (_gvState.phase === 'voting' || _gvState.phase === 'result');
            entry.el.classList.toggle('show', !!live || isAlwaysShow());
          } else if (w.type === 'gameVoteStatus') {
            renderGameVoteStatus(w);
            entry.el.classList.toggle('show', _gvStatusVisible(w));
          }
        }
      }

      function fireMilestone(w, payload) {
        const entry = widgetMap.get(w.id);
        if (!entry) return;
        if (!entry.contentEl.firstElementChild) renderMilestone(w);
        const root = entry.contentEl.firstElementChild;
        const num = root.querySelector('.num');
        const lab = root.querySelector('.label');
        const count = Math.max(0, Number(payload.count) || w.every || 0);
        // Like-for-Hint bursts override the big number with reveal text (a
        // word, or a masked "T H _ _ _" progression). numText shrinks the
        // font a touch so longer masked words still fit the card.
        if (typeof payload.numText === 'string' && payload.numText.length) {
          num.textContent = payload.numText;
          num.style.fontSize = payload.numText.length > 7 ? '3.4rem' : '';
        } else {
          num.textContent = count.toLocaleString();
          num.style.fontSize = '';
        }
        const label = String(payload.label || w.label || '')
          .replaceAll('%count%', count.toLocaleString())
          .replaceAll('%source%', String(payload.source || w.source || ''))
          .replaceAll('%nickname%', String(payload.nickname || ''))
          .replaceAll('%username%', String(payload.username || ''));
        lab.textContent = label;

        const sound = payload.soundUrl || w.soundUrl;
        if (sound) {
          try { const a = $('ms-audio'); a.src = sound; a.currentTime = 0; a.play().catch(() => {}); } catch (e) {}
        }
        if (entry.milestoneTimer) clearTimeout(entry.milestoneTimer);
        entry.el.classList.add('show');
        entry.milestoneTimer = setTimeout(() => {
          entry.milestoneTimer = null;
          if (!isAlwaysShow()) entry.el.classList.remove('show');
        }, 2500);
      }

      function renderWinCard(w) {
        const entry = widgetMap.get(w.id);
        if (!entry.contentEl.firstElementChild) {
          // .wc-frame wraps .win-card so the winner's pfp_border + pfp_glow
          // decorates the entire popup, not just the avatar. .wc-hero-bg
          // sits inside .win-card as an absolute layer behind the content
          // for the optional hero_badge background.
          entry.contentEl.innerHTML = '<div class="wc-frame"><div class="win-card">'
            + '<div class="wc-hero-bg"></div>'
            + '<div class="wc-row">'
              + '<img class="wc-avatar" alt="" style="display:none">'
              + '<div class="wc-text">'
                + '<div class="wc-headline">WINNER</div>'
                + '<div style="display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;">'
                  + '<div class="wc-name">—</div>'
                  + '<span class="wc-game-pill"></span>'
                + '</div>'
                + '<div class="wc-meta">'
                  + '<span class="wc-chip rank" style="display:none"></span>'
                  + '<span class="wc-chip streak" style="display:none"></span>'
                  + '<span class="wc-chip elo" style="display:none"></span>'
                  + '<span class="wc-chip points" style="display:none"></span>'
                + '</div>'
                + '<div class="wc-title-finder" style="display:none"></div>'
              + '</div>'
            + '</div>'
            + '<div class="wc-lb" style="display:none"></div>'
          + '</div></div>';
        }
        applyCommonStyles(w, entry);
        if (isAlwaysShow()) {
          fillWinCardPlaceholder(w);
          entry.el.classList.add('show');
        }
        joinWinRoomIfNeeded(w);
      }

      // ── _applyWinCardCosmetics ──
      // Reads the winner's equipped cosmetics and writes CSS on the
      // wc-frame / wc-hero-bg / wc-avatar / wc-name elements so the win
      // card visually represents what they're wearing.
      //
      // SHAPE NOTE (verified 2026-05-23 against the catalog DB):
      // Each cosmetic value is the raw `css_property` JSON from the WT
      // catalog — a flat CSS object with camelCase keys, NOT a wrapper
      // like { css: {...} }. e.g.
      //   hero_badge     = { background, backgroundSize, backgroundImage,
      //                      backgroundImageSize, animation }
      //   name_color     = { color, textShadow }
      //   profile_border = { border, boxShadow }
      //   profile_glow   = { boxShadow }
      //   word_color     = { color, textShadow }
      //   word_glow      = { textShadow }
      // The category KEYS use `profile_*`, not `pfp_*` — the dashboard /
      // session memory uses the short form but the DB uses the long form.
      // We accept both for forward-compat.
      function _applyWinCardCosmetics(w, root, cosmeticsRaw) {
        if (!root) return;
        // Cosmetics arrive as either { equipped: {...} } (chat-relay
        // enrichment) or just the table directly (legacy/synthetic).
        const eq = (cosmeticsRaw && cosmeticsRaw.equipped) || cosmeticsRaw || {};
        const frame = root; // caller passes .wc-frame
        const card = frame.querySelector('.win-card');
        const heroBg = card && card.querySelector('.wc-hero-bg');
        const avatar = card && card.querySelector('.wc-avatar');
        const nameEl = card && card.querySelector('.wc-name');

        // Pull a cosmetic value tolerating both naming conventions.
        const pick = (...keys) => {
          for (const k of keys) if (eq[k]) return eq[k];
          return null;
        };

        // ── 1) Hero badge background layer ──
        // Animate the catalog background separately from its centered
        // artwork so fan-club drift never moves the heart off the card.
        const hero = pick('hero_badge');
        if (heroBg) {
          // Clear prior media when switching winners or badge settings.
          heroBg.querySelectorAll('.wc-hero-video, .wc-hero-scrim, .wc-hero-art').forEach(el => el.remove());
          // Video hero badge (e.g. Solar Sovereign): __render metadata rides
          // in the equipped css payload. Muted looping fill + scrim.
          if (w.heroBadgeBg && hero && hero.__render && hero.__render.type === 'video_bg') {
            const vid = document.createElement('video');
            vid.className = 'wc-hero-video';
            vid.src = hero.__render.asset || '';
            if (hero.__render.poster) vid.poster = hero.__render.poster;
            vid.autoplay = true; vid.muted = true; vid.loop = true; vid.playsInline = true;
            vid.setAttribute('muted', ''); vid.setAttribute('playsinline', '');
            vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;';
            heroBg.style.overflow = 'hidden';
            heroBg.appendChild(vid);
            if (hero.__render.scrim) {
              const scrim = document.createElement('div');
              scrim.className = 'wc-hero-scrim';
              scrim.style.cssText = 'position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:' + hero.__render.scrim + ';';
              heroBg.appendChild(scrim);
            }
            heroBg.style.background = '';
            heroBg.style.removeProperty('animation');
            heroBg.style.setProperty('--wc-hero-opacity',
              String(Number.isFinite(Number(w.heroBadgeOpacity)) ? Number(w.heroBadgeOpacity) : 0.55));
            if (window.AmbientFx) AmbientFx.attachFromCss(heroBg, hero);
          } else if (w.heroBadgeBg && hero) {
            heroBg.style.background = hero.background || hero.color || '';
            heroBg.style.backgroundSize = hero.backgroundSize || 'cover';
            heroBg.style.backgroundPosition = hero.backgroundPosition || 'center';
            // Drift offsets match the catalog's gradient tiles. Repeat those
            // tiles so the aurora loops without a jump or an empty edge.
            heroBg.style.backgroundRepeat = hero.backgroundRepeat ||
              (hero.backgroundImage && /\bcfx-drift\b/.test(hero.animation || '') ? 'repeat' : 'no-repeat');
            if (hero.backgroundImage) {
              // Fit both short solo cards and taller multiplayer cards.
              // This child has no background-position animation of its own.
              const art = document.createElement('div');
              art.className = 'wc-hero-art';
              art.style.cssText = 'position:absolute;inset:10%;border-radius:inherit;pointer-events:none;background-size:contain;background-position:center;background-repeat:no-repeat;';
              art.style.backgroundImage = hero.backgroundImage.startsWith('url(')
                ? hero.backgroundImage
                : `url("${hero.backgroundImage}")`;
              heroBg.appendChild(art);
            }
            if (hero.animation) heroBg.style.animation = hero.animation;
            else heroBg.style.removeProperty('animation');
            heroBg.style.setProperty('--wc-hero-opacity',
              String(Number.isFinite(Number(w.heroBadgeOpacity)) ? Number(w.heroBadgeOpacity) : 0.55));
            // Ambient particles (embers/motes) declared by the badge's
            // __ambient spec — clipped to the badge area by the engine.
            if (window.AmbientFx) AmbientFx.attachFromCss(heroBg, hero);
          } else {
            heroBg.style.background = '';
            heroBg.style.removeProperty('animation');
            heroBg.style.setProperty('--wc-hero-opacity', '0');
            if (window.AmbientFx) AmbientFx.detach(heroBg);
          }
        }

        // ── 2) Outer .wc-frame: pfp_border + pfp_glow scaled up ──
        // Accept both `profile_border` (DB) and `pfp_border` (old code).
        const pfpBorder = pick('profile_border', 'pfp_border');
        const pfpGlow   = pick('profile_glow',   'pfp_glow');
        if (frame) {
          let hasFrameBorder = false;
          if (w.outerPfpFrame !== false && (pfpBorder || pfpGlow)) {
            // Border line itself (4px solid #color). Synthesise from .color
            // when the cosmetic only provides one.
            const borderCss = (pfpBorder && (
              pfpBorder.border ||
              (pfpBorder.css && pfpBorder.css.border) ||
              (pfpBorder.color ? '4px solid ' + pfpBorder.color : null)
            )) || null;
            if (borderCss) {
              frame.style.setProperty('--wc-frame-border', borderCss);
              hasFrameBorder = true;
            } else {
              frame.style.removeProperty('--wc-frame-border');
            }
            // Rotating conic-gradient rings (epic+ borders after the 2026-08
            // rehaul): the cosmetic ships border:'4px solid transparent' plus
            // a conic backgroundImage painted into the border-box. The inner
            // .win-card covers the content area, so only the ring shows.
            if (pfpBorder && pfpBorder.backgroundImage && borderCss) {
              frame.style.backgroundImage = pfpBorder.backgroundImage;
              frame.style.backgroundOrigin = pfpBorder.backgroundOrigin || 'border-box';
              frame.style.backgroundClip = pfpBorder.backgroundClip || 'border-box';
              if (pfpBorder.animation) frame.style.animation = pfpBorder.animation;
              else frame.style.removeProperty('animation');
            } else {
              frame.style.removeProperty('background-image');
              frame.style.removeProperty('background-origin');
              frame.style.removeProperty('background-clip');
              frame.style.removeProperty('animation');
            }
            // Glow = box-shadow halo. profile_border ALSO carries a
            // boxShadow (the "fan club" set, e.g., uses border AND its
            // own shadow). Stack profile_glow on top so both layer.
            const glowParts = [];
            if (pfpBorder && pfpBorder.boxShadow) glowParts.push(pfpBorder.boxShadow);
            if (pfpGlow) {
              const g = pfpGlow.boxShadow ||
                        (pfpGlow.css && pfpGlow.css['box-shadow']) ||
                        pfpGlow['box-shadow'] ||
                        (pfpGlow.color ? '0 0 38px 6px ' + pfpGlow.color : null);
              if (g) glowParts.push(g);
            }
            if (glowParts.length) frame.style.setProperty('--wc-frame-glow', glowParts.join(', '));
            else frame.style.removeProperty('--wc-frame-glow');
          } else {
            frame.style.removeProperty('--wc-frame-border');
            frame.style.removeProperty('--wc-frame-glow');
            frame.style.removeProperty('background-image');
            frame.style.removeProperty('background-origin');
            frame.style.removeProperty('background-clip');
            frame.style.removeProperty('animation');
          }
          // Suppress the inner card's own border when a cosmetic frame
          // border is active so the cosmetic stroke isn't visually
          // offset from the card's default 1px outline.
          frame.classList.toggle('wc-frame-decorated', hasFrameBorder);
          // Publish the frame's stroke width so the inner card can nest its
          // corner radius inside it (see .wc-frame-decorated > .win-card).
          // Read it back off the COMPUTED style rather than parsing borderCss:
          // cosmetics supply arbitrary shorthands ('4px solid #aaa', 'medium
          // double gold', border-image forms), so string parsing would break
          // on the first unusual one. getComputedStyle here forces the style
          // recalc that picks up the --wc-frame-border set just above.
          if (hasFrameBorder) {
            const _fbw = parseFloat(getComputedStyle(frame).borderTopWidth) || 0;
            frame.style.setProperty('--wc-frame-bw', _fbw + 'px');
          } else {
            frame.style.removeProperty('--wc-frame-bw');
          }
        }

        // ── 3) Avatar: same pfp_border + pfp_glow applied directly ──
        if (avatar) {
          // Scale cosmetic px against the same 96px reference the shared
          // applier uses, so this 180px (or 130px compact) avatar wears a
          // proportionally identical ring to a 96px portal hero.
          const _pfx = window.PfpCosmetics && window.PfpCosmetics._internals;
          const _avW = parseFloat(getComputedStyle(avatar).width) || 0;
          const _k = (_pfx && _avW) ? (_avW / _pfx.REF_SIZE) : 1;
          const _scale = (v, floor) => (_pfx && _k !== 1 && v) ? _pfx.scalePx(v, _k, floor) : v;
          if (pfpBorder) {
            const borderCss = _scale(pfpBorder.border ||
                              (pfpBorder.css && pfpBorder.css.border) ||
                              (pfpBorder.color ? '3px solid ' + pfpBorder.color : null), _pfx && _pfx.RING_FLOOR);
            if (borderCss) avatar.style.setProperty('--wc-pfp-border', borderCss);
            else avatar.style.removeProperty('--wc-pfp-border');
            const outlineCss = pfpBorder.outline || (pfpBorder.css && pfpBorder.css.outline) || null;
            if (outlineCss) avatar.style.setProperty('--wc-pfp-outline', outlineCss);
            else avatar.style.removeProperty('--wc-pfp-outline');
            // Conic ring (epic+): paint the gradient into the transparent
            // border-box; the avatar image itself covers the content area.
            if (pfpBorder.backgroundImage && borderCss) {
              avatar.style.backgroundImage = pfpBorder.backgroundImage;
              avatar.style.backgroundOrigin = pfpBorder.backgroundOrigin || 'border-box';
              avatar.style.backgroundClip = pfpBorder.backgroundClip || 'border-box';
              if (pfpBorder.animation) avatar.style.animation = pfpBorder.animation;
              else avatar.style.removeProperty('animation');
            } else {
              avatar.style.removeProperty('background-image');
              avatar.style.removeProperty('background-origin');
              avatar.style.removeProperty('background-clip');
              avatar.style.removeProperty('animation');
            }
          } else {
            avatar.style.removeProperty('--wc-pfp-border');
            avatar.style.removeProperty('--wc-pfp-outline');
            avatar.style.removeProperty('background-image');
            avatar.style.removeProperty('background-origin');
            avatar.style.removeProperty('background-clip');
            avatar.style.removeProperty('animation');
          }
          // Ambient particle halo (ultra borders / legendary+ glows).
          if (window.AmbientFx) {
            const avAmb = (pfpBorder && pfpBorder.__ambient) || (pfpGlow && pfpGlow.__ambient) || null;
            if (avAmb) AmbientFx.attach(avatar, avAmb);
            else AmbientFx.detach(avatar);
          }
          // Stack profile_border.boxShadow + profile_glow.boxShadow on
          // the avatar too so cosmetic owners get the full halo.
          const aGlowParts = [];
          if (pfpBorder && pfpBorder.boxShadow) aGlowParts.push(_scale(pfpBorder.boxShadow));
          if (pfpGlow) {
            const g = pfpGlow.boxShadow || (pfpGlow.css && pfpGlow.css['box-shadow']) ||
                      pfpGlow['box-shadow'] ||
                      (pfpGlow.color ? '0 0 22px 4px ' + pfpGlow.color : null);
            if (g) aGlowParts.push(_scale(g));
          }
          if (aGlowParts.length) avatar.style.setProperty('--wc-pfp-glow', aGlowParts.join(', '));
          else avatar.style.removeProperty('--wc-pfp-glow');
        }

        // ── 4) name_color on .wc-name (color only — no text-shadow) ──
        // name_color CSS carries both color + textShadow (heavy black
        // outline + multi-stop glow). Streamer feedback: too noisy on the
        // win card. We honor name_color.color but STRIP the textShadow.
        // If the user wants glow specifically, they should equip name_glow
        // as a separate category — its textShadow applies independently.
        const nameColor = pick('name_color');
        const nameGlow  = pick('name_glow');
        if (nameEl) {
          const nc = nameColor && (nameColor.color || (nameColor.css && nameColor.css.color));
          if (nc) nameEl.style.setProperty('color', nc, 'important');
          else nameEl.style.removeProperty('color');
          // Only apply text-shadow from the dedicated *_glow category.
          if (nameGlow && nameGlow.textShadow) {
            nameEl.style.setProperty('text-shadow', nameGlow.textShadow, 'important');
          } else {
            nameEl.style.removeProperty('text-shadow');
          }
          // Ambient aura riding the winner's name (legendary/ultra names).
          if (window.AmbientFx) {
            const nAmb = (nameColor && nameColor.__ambient) || (nameGlow && nameGlow.__ambient) || null;
            if (nAmb) AmbientFx.attach(nameEl, nAmb);
            else AmbientFx.detach(nameEl);
          }
        }

        // ── 5) word_color on the found-word chip (color only — no shadow) ──
        // Same rule as name_color: only color carries through from
        // word_color; word_glow as a dedicated category contributes any
        // shadow. Keeps the chip clean and readable on the win card.
        const wordColor = pick('word_color');
        const wordGlow  = pick('word_glow');
        const wc = wordColor && (wordColor.color || (wordColor.css && wordColor.css.color));
        const wgCss = (wordGlow && wordGlow.textShadow) || null;
        // `.wc-text` rather than `.wc-name`: a long article title renders as a
        // sibling block under the name line, and it must still wear the
        // winner's word cosmetics.
        const winnerWordChips = card ? card.querySelectorAll('.wc-text .wc-found-word, .wc-lb .wc-found-word') : [];
        winnerWordChips.forEach(chip => {
          if (wc) chip.style.setProperty('color', wc, 'important');
          else chip.style.removeProperty('color');
          if (wgCss) chip.style.setProperty('text-shadow', wgCss, 'important');
          else chip.style.removeProperty('text-shadow');
        });
      }

      function fillWinCardPlaceholder(w) {
        const entry = widgetMap.get(w.id);
        const root = entry.contentEl.firstElementChild;
        root.querySelector('.wc-headline').textContent = 'WINNER';
        // The word chip always rides the winner's name now (see showWinCard),
        // so the always-show preview shows it unconditionally — lets the
        // streamer see how word_color / word_glow will style their found word.
        root.querySelector('.wc-name').innerHTML = '<span class="wc-name-text">PlayerName</span>'
          + '<span class="wc-found-word">WORD</span>';
        root.querySelector('.wc-game-pill').textContent = 'Game';
        root.querySelector('.wc-avatar').style.display = 'none';
        root.querySelector('.wc-avatar').removeAttribute('src');
        const rank = root.querySelector('.rank'); rank.textContent = '#1'; rank.style.display = w.showRank ? '' : 'none';
        const streak = root.querySelector('.streak'); streak.textContent = '🔥 5'; streak.style.display = w.showStreak ? '' : 'none';
        const elo = root.querySelector('.elo'); elo.textContent = 'ELO 1500'; elo.style.display = w.showElo ? '' : 'none';
        root.querySelector('.points').style.display = 'none';
        const tf = root.querySelector('.wc-title-finder');
        if (w.showTitleFinder) {
          tf.style.display = '';
          tf.innerHTML = '<span class="wc-tf-fixed">Title found by @</span><span class="wc-name-text">runner-up</span>';
        }
        else tf.style.display = 'none';
        // Placeholder leaderboard with a sample word chip on the first
        // leaderboard row (rank 2) so the streamer can see where it'll render.
        const topN = Math.max(1, Number(w.topN) || 1);
        if (w.listMode === 'session' || w.listMode === 'saved') {
          // Wins mode: show the REAL board if the streamer has one (the whole
          // point of an always-on card), and only fall back to sample rows
          // when nothing has been tallied yet.
          const board = winTallyBoardFor(w);
          const hasReal = board && (board[w.listMode] || []).length;
          renderWinLeaderboard(w, [], hasReal ? null : { _tallyBoard: fakeWinBoard(topN, w.listMode) });
        } else {
          // fakes[0] is the would-be winner (skipped by the renderer's slice).
          // fakes[1] is the first leaderboard row — tag it as the target-finder.
          const fakes = fakeTopPlayers(Math.max(0, topN - 1));
          const fakeFinder = fakes[1] ? { ...fakes[1] } : null;
          renderWinLeaderboard(w, fakes, fakeFinder ? { targetFinder: fakeFinder, word: 'WORD' } : null);
        }
        // Always-show preview uses synthetic cosmetics so the streamer can
        // see how each enabled layer renders without waiting for a real
        // win from a cosmetic-owning viewer. Real wins overwrite these.
        // Uses the catalog's real key names (profile_border / profile_glow)
        // and OMITS textShadow on name_color / word_color since the helper
        // strips those by design (use name_glow / word_glow for shadow).
        const fakeCos = {
          equipped: {
            hero_badge:     { background: 'linear-gradient(135deg, #6a11cb 0%, #2575fc 100%)' },
            profile_border: { border: '4px solid #ff6ec7' },
            profile_glow:   { boxShadow: '0 0 22px rgba(255,110,199,0.75), 0 0 44px rgba(255,110,199,0.35)' },
            name_color:     { color: '#ffea00' },
            word_color:     { color: '#43d17c' },
          },
        };
        _applyWinCardCosmetics(w, root, fakeCos);
      }

      // Sample standings for the always-show preview when a streamer has
      // switched a card to session/saved wins but hasn't tallied any yet.
      function fakeWinBoard(n, mode) {
        const rows = Array.from({ length: Math.max(1, Math.min(10, n)) }, (_, i) => ({
          displayName: i === 0 ? 'Winner' : ('Player ' + (i + 1)),
          profilePic: null,
          wins: Math.max(1, 6 - i),
          platformUserId: 'preview-' + i,
        }));
        return { [mode]: rows };
      }

      function fakeTopPlayers(n) {
        // n = desired number of LEADERBOARD rows. Builds n+1 entries so the
        // renderer can slice(1) off the winner and still fill n rows.
        return Array.from({length: n + 1}, (_, i) => ({
          displayName: i === 0 ? 'Winner' : ('Player ' + (i + 1)),
          profilePic: null,
          points: 1100 - i * 100,
          platformUserId: 'preview-' + i,
        }));
      }

      // ── Display-name cap ──
      // A long username used to stretch the win card (it's elastic between
      // 420px and 720px), so the widget visibly grew and shrank from win to
      // win. Capping the rendered name keeps the card a consistent size.
      // The CSS ellipsis on .wc-name / .wc-lb-name stays as a backstop.
      const WC_NAME_MAX = 10;
      // ── Long-title detection ──
      // Most games' `word` is one guessable token and belongs on the winner's
      // name line. The wiki games send a Wikipedia ARTICLE TITLE — several
      // words — which the nowrap chip can neither shrink nor wrap, so it
      // stretched the card to its max width and then clipped. Anything this
      // long renders as a stacked, wrapping block instead (.is-block).
      const WC_TITLE_WORDS = 2;
      const WC_TITLE_CHARS = 18;
      function _wcIsLongTitle(raw) {
        const s = String(raw == null ? '' : raw).trim();
        if (!s) return false;
        return s.split(/\s+/).length >= WC_TITLE_WORDS || s.length > WC_TITLE_CHARS;
      }
      // Emoji are roughly twice the width of a latin glyph, so a 10-character
      // cap alone still let an all-emoji name render much wider than a normal
      // one. Keeping only the first few emoji holds the width steady AND
      // preserves the readable part of names like "🔥🔥🔥🔥🔥kat".
      const WC_EMOJI_MAX = 3;

      // Does this grapheme read as an emoji? Built with new RegExp so an
      // engine without Unicode property escapes falls back at RUNTIME — a
      // literal /\p{...}/u would be a parse error and take the whole overlay
      // down on that engine.
      const _wcEmojiRe = (() => {
        try {
          return new RegExp('[\\p{Extended_Pictographic}\\p{Regional_Indicator}\\uFE0F\\u20E3]', 'u');
        } catch (_) {
          // Crude surrogate-range fallback: good enough to spot pictographs.
          return /[\uD83C-\uDBFF][\uDC00-\uDFFF]|[☀-➿️⃣]/;
        }
      })();

      function _wcGraphemes(s) {
        // Split by GRAPHEME, not UTF-16 code unit — TikTok display names are
        // full of emoji, skin-tone modifiers and ZWJ sequences, and a naive
        // slice() would cut one in half and render a replacement box.
        try {
          return (typeof Intl !== 'undefined' && Intl.Segmenter)
            ? [...new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(s)].map(x => x.segment)
            : Array.from(s);
        } catch (_) {
          return Array.from(s);
        }
      }

      function truncName(raw, max = WC_NAME_MAX, maxEmoji = WC_EMOJI_MAX) {
        const s = String(raw == null ? '' : raw);
        const units = _wcGraphemes(s);
        const isEmoji = (g) => _wcEmojiRe.test(g);

        const out = [];
        let emoji = 0;
        let i = 0;
        for (; i < units.length; i++) {
          if (out.length >= max) break;
          const g = units[i];
          if (isEmoji(g)) {
            // Surplus emoji are SKIPPED, not treated as the end of the name,
            // so "🔥🔥🔥🔥🔥kat" keeps its "kat".
            if (emoji >= maxEmoji) continue;
            emoji++;
          }
          out.push(g);
        }
        if (i >= units.length && out.length === units.length) return s;

        // Ellipsis only when real content was cut. Everything left over being
        // surplus emoji means nothing readable is missing, and a trailing "…"
        // there would imply words that don't exist.
        let cutContent = false;
        for (let j = i; j < units.length; j++) {
          if (!(isEmoji(units[j]) && emoji >= maxEmoji)) { cutContent = true; break; }
        }
        // Trim trailing space so we don't render "Bob The …".
        return out.join('').replace(/\s+$/, '') + (cutContent ? '…' : '');
      }

      // Helper: do two player objects refer to the same person?
      function samePlayer(a, b) {
        if (!a || !b) return false;
        const ax = a.platformUserId || a.id;
        const bx = b.platformUserId || b.id;
        return ax && bx && String(ax) === String(bx);
      }

      // ── Win tallies ──
      // Running per-player win counts for winCard listMode 'session'/'saved'.
      // The server pushes `win-tally-update` on join and after a dashboard
      // reset, and attaches `winTally` to each game-win. Boards are cached per
      // game so a card filtered to one game never shows another game's counts.
      const _winTallyBoards = new Map(); // gameId → { session: [], saved: [] }
      let _winTallyAll = null;           // cross-game board

      function ingestWinTally(snap) {
        if (!snap) return;
        if (snap.full) {
          // Authoritative replacement — a reset must drop stale per-game rows.
          _winTallyBoards.clear();
          for (const gid of Object.keys(snap.games || {})) _winTallyBoards.set(gid, snap.games[gid]);
        } else if (snap.gameId) {
          _winTallyBoards.set(snap.gameId, snap.game);
        }
        if (snap.all) _winTallyAll = snap.all;
      }

      // Which board a given winCard should read. A game-filtered card uses
      // that game's board only — falling back to the cross-game totals would
      // silently show numbers the card claims are for one game.
      function winTallyBoardFor(w) {
        const gid = String(w.displayGame || '').trim().toLowerCase();
        if (gid) return _winTallyBoards.get(gid) || null;
        return _winTallyAll;
      }

      function winListCaption(w) {
        if (w.listTitle) return String(w.listTitle);
        return w.listMode === 'saved' ? 'ALL-TIME WINS' : 'SESSION WINS';
      }

      // ctx (optional) carries { targetFinder, titleFinder, word } from the
      // game-win payload. If a leaderboard row matches the target-finder, we
      // append a small word chip showing what they solved (e.g. "ROGUE").
      function renderWinLeaderboard(w, list, ctx) {
        const entry = widgetMap.get(w.id);
        const root = entry.contentEl.firstElementChild;
        const lb = root.querySelector('.wc-lb');
        const topN = Math.max(1, Math.min(10, Number(w.topN) || 1));
        const winsMode = w.listMode === 'session' || w.listMode === 'saved';

        let showList;
        let caption = '';
        let startRank = 2;
        if (winsMode) {
          // Standings, not this round's scores. The row numbering starts at 1
          // and INCLUDES the winner — the player at the top of the card isn't
          // necessarily the one leading on total wins.
          const board = ctx?._tallyBoard || winTallyBoardFor(w);
          const rows = board ? (board[w.listMode] || []) : [];
          showList = rows.slice(0, topN);
          caption = winListCaption(w);
          startRank = 1;
        } else {
          // Skip index 0 of topPlayers — that's the winner already shown at
          // the top of the card. Leaderboard starts at rank 2.
          showList = topN > 1 ? (Array.isArray(list) ? list.slice(1, topN) : []) : [];
        }

        if (!showList.length) { lb.style.display = 'none'; lb.innerHTML = ''; return; }
        lb.style.display = '';
        lb.innerHTML = '';
        if (caption) {
          const cap = document.createElement('div');
          cap.className = 'wc-lb-title';
          cap.textContent = caption;
          lb.appendChild(cap);
        }
        const finder = ctx?.targetFinder || ctx?.titleFinder;
        const word = ctx?.word;
        const winner = winsMode ? (ctx?.winner || null) : null;
        showList.forEach((p, i) => {
          const name = p.displayName || p.username || 'Anon';
          // Initial comes from the FULL name — truncation must not change it.
          const initial = (String(name).trim()[0] || '?').toUpperCase();
          const shownName = truncName(name);
          const isFinder = !winsMode && finder && word && samePlayer(finder, p);
          const wordChip = isFinder
            ? '<span class="wc-found-word">' + escapeHtml(String(word).toUpperCase()) + '</span>'
            : '';
          const value = winsMode
            ? Number(p.wins || 0).toLocaleString() + ' <span class="wc-lb-trophy">🏆</span>'
            : Number(p.points || p.score || 0).toLocaleString();
          const row = document.createElement('div');
          row.className = 'wc-lb-row' + (winner && samePlayer(winner, p) ? ' wc-lb-winner' : '');
          row.innerHTML = '<div class="wc-lb-rank">' + (i + startRank) + '</div>'
            + '<div class="wc-lb-avatar">' + (p.profilePic ? '<img alt="" src="' + escapeHtml(p.profilePic) + '">' : escapeHtml(initial)) + '</div>'
            + '<div class="wc-lb-name"><span class="wc-name-text">' + escapeHtml(shownName) + '</span>' + wordChip + '</div>'
            + '<div class="wc-lb-points">' + value + '</div>';
          lb.appendChild(row);
          const img = row.querySelector('.wc-lb-avatar img');
          if (img) img.addEventListener('error', () => img.replaceWith(document.createTextNode(initial)), { once: true });
        });
      }

      // The widget wrapper hides with opacity alone (.widget/.widget.show), so
      // a hidden card still has a bounding box and AmbientFx kept spawning the
      // winner's halo particles (ultra borders / legendary glows) at the
      // vanished card's coordinates. Drop every emitter the card owns once the
      // fade-out has finished.
      function releaseWinCardFx(entry) {
        if (!entry || !entry.el) return;
        if (entry.winCardFxTimer) clearTimeout(entry.winCardFxTimer);
        entry.winCardFxTimer = setTimeout(() => {
          entry.winCardFxTimer = null;
          if (entry.el.classList.contains('show')) return; // shown again mid-fade
          if (window.AmbientFx && AmbientFx.detachWithin) AmbientFx.detachWithin(entry.el);
        }, 320); // .widget transition is 280ms
      }

      function showWinCard(w, data) {
        const entry = widgetMap.get(w.id);
        if (!entry) return;
        if (entry.winCardFxTimer) { clearTimeout(entry.winCardFxTimer); entry.winCardFxTimer = null; }
        if (!entry.contentEl.firstElementChild) renderWinCard(w);
        // entry.contentEl.firstElementChild is now .wc-frame; querySelector
        // calls below still find the inner .wc-* elements transparently.
        const root = entry.contentEl.firstElementChild;
        const winner = data.winner || {};
        const finder = data.targetFinder || data.titleFinder;
        root.querySelector('.wc-headline').textContent = 'WINNER';
        // Winner name + word chip.
        //
        // targetFinder/titleFinder only exists in games where "who found the
        // target word" is a DIFFERENT person from the round winner
        // (recTangled / WikirecTangled). Word-guessing games — Wordle,
        // Subtextle, SpellingBee, … — never send it because the winner IS the
        // finder, and the old `finder &&` guard meant their word was silently
        // dropped from the card. No finder + a word ⇒ the winner solved it.
        //
        // Not gated on w.showTitleFinder: that toggle governs the separate
        // "Title found by @someone-else" line below, not the winner's own word.
        const winnerName = winner.displayName || winner.username || 'Someone';
        const winnerIsFinder = !!data.word && (finder ? samePlayer(winner, finder) : true);
        // Name goes in its own .wc-name-text span so the flex row can ellipsize
        // the NAME and keep the word chip at full width (see .wc-name CSS).
        // A multi-word article title moves off the name line into its own
        // wrapping row (see _wcIsLongTitle / .wc-found-word.is-block) so it
        // can't stretch the card; single words stay inline as before.
        const wordIsTitle = winnerIsFinder && _wcIsLongTitle(data.word);
        root.querySelector('.wc-name').innerHTML = '<span class="wc-name-text">' + escapeHtml(truncName(winnerName)) + '</span>'
          + (winnerIsFinder && !wordIsTitle ? '<span class="wc-found-word">' + escapeHtml(String(data.word).toUpperCase()) + '</span>' : '');
        // Stale block from a previous win — always cleared, even when this
        // round's word is short enough to go back inline.
        const oldBlock = root.querySelector('.wc-text > .wc-found-word.is-block');
        if (oldBlock) oldBlock.remove();
        if (wordIsTitle) {
          const block = document.createElement('span');
          block.className = 'wc-found-word is-block';
          block.textContent = String(data.word).toUpperCase();
          // Directly after the name row, before .wc-meta.
          const text = root.querySelector('.wc-text');
          text.insertBefore(block, root.querySelector('.wc-meta'));
        }
        root.querySelector('.wc-game-pill').textContent = data.gameName || data.game || '';
        const av = root.querySelector('.wc-avatar');
        if (w.showAvatar && winner.profilePic) {
          av.src = winner.profilePic; av.style.display = '';
          av.onerror = () => { av.style.display = 'none'; av.onerror = null; };
        } else av.style.display = 'none';

        const rank = root.querySelector('.rank');
        if (w.showRank && (data.rank || data.place)) { rank.textContent = '#' + (data.rank || data.place); rank.style.display = ''; }
        else rank.style.display = 'none';
        const streak = root.querySelector('.streak');
        if (w.showStreak && (winner.streak || data.streak)) { streak.textContent = '🔥 ' + (winner.streak || data.streak); streak.style.display = ''; }
        else streak.style.display = 'none';
        const elo = root.querySelector('.elo');
        if (w.showElo && (data.elo || winner.elo)) { elo.textContent = 'ELO ' + (data.elo || winner.elo); elo.style.display = ''; }
        else elo.style.display = 'none';
        const pts = root.querySelector('.points');
        const pv = winner.points || winner.xp || winner.score;
        if (pv) { pts.textContent = Number(pv).toLocaleString() + ' pts'; pts.style.display = ''; }
        else pts.style.display = 'none';

        const tf = root.querySelector('.wc-title-finder');
        // `finder` was already declared earlier in this scope for the winner-chip logic.
        if (w.showTitleFinder && finder && (finder.platformUserId || finder.id) !== (winner.platformUserId || winner.id)) {
          const tfName = truncName(finder.displayName || finder.username || 'someone');
          // Label + word are fixed-width; only the @name ellipsizes, so the
          // word survives on a narrow card.
          tf.innerHTML = '<span class="wc-tf-fixed">Title found by @</span>'
            + '<span class="wc-name-text">' + escapeHtml(tfName) + '</span>'
            + (data.word ? '<span class="wc-tf-word">&nbsp;— "' + escapeHtml(data.word) + '"</span>' : '');
          tf.style.display = '';
        } else tf.style.display = 'none';

        // The win that triggered this card is already counted server-side, so
        // ingesting before rendering means the card announces the win AND
        // shows the board it just moved — no one-win lag.
        if (data.winTally) ingestWinTally(data.winTally);
        renderWinLeaderboard(w, Array.isArray(data.topPlayers) ? data.topPlayers : [], data);

        // Apply the winner's equipped cosmetics LAST so that any chips/
        // child elements injected above (e.g. the .wc-found-word chip
        // inside .wc-name when winner is also the title finder) get
        // styled by the word_color / word_glow pass inside the helper.
        _applyWinCardCosmetics(w, root, winner.cosmetics);

        if (entry.winCardTimer) { clearTimeout(entry.winCardTimer); entry.winCardTimer = null; }
        entry.el.classList.add('show');
        const persistence = w.persistence || 'fade';
        if (persistence === 'fade') {
          const dur = Math.max(1000, Math.min(10000, Number(w.durationMs) || 5000));
          entry.winCardTimer = setTimeout(() => {
            entry.winCardTimer = null;
            if (!isAlwaysShow()) { entry.el.classList.remove('show'); releaseWinCardFx(entry); }
            else fillWinCardPlaceholder(w);
          }, dur);
        }
      }

      function renderTopLikersWidget(w) {
        const entry = widgetMap.get(w.id);
        if (!entry.contentEl.firstElementChild) {
          entry.contentEl.innerHTML = '<div class="top-likers"><div class="tl-title"></div><div class="tl-rows"></div></div>';
        }
        applyCommonStyles(w, entry);
        const root = entry.contentEl.firstElementChild;
        root.querySelector('.tl-title').textContent = w.title || 'TOP LIKERS';
        renderTopLikersRows(w, lastTopLikersData);
        // Join the toplikers room (joining is idempotent server-side)
        if (socket && w.enabled && !entry.topLikersJoined) {
          socket.emit('join-toplikers', streamerId);
          entry.topLikersJoined = true;
        }
      }

      function renderTopLikersRows(w, data) {
        const entry = widgetMap.get(w.id);
        if (!entry?.contentEl.firstElementChild) return;
        const rows = entry.contentEl.firstElementChild.querySelector('.tl-rows');
        const list = Array.isArray(data?.top) ? data.top : [];
        const limit = Math.max(1, Math.min(10, Number(w.rows) || 5));
        const showPlaceholder = list.length === 0;
        const items = showPlaceholder
          ? Array.from({length: limit}, (_, i) => ({ rank: i+1, displayName: 'Viewer ' + (i+1), profilePic: null, likes: (limit - i) * 137 }))
          : list.slice(0, limit);
        if (rows.children.length !== items.length) rows.innerHTML = '';
        items.forEach((item, idx) => {
          const name = item.displayName || item.username || 'Anon';
          const initial = (String(name).trim()[0] || '?').toUpperCase();
          let cls = 'tl-row';
          if (w.highlightTop3) {
            if (item.rank === 1) cls += ' gold';
            else if (item.rank === 2) cls += ' silver';
            else if (item.rank === 3) cls += ' bronze';
          }
          const key = (w.showAvatar?'1':'0') + '|' + (item.profilePic||'') + '|' + name + '|' + (item.rank||idx+1) + '|' + (item.likes||0) + '|' + (w.showLikes?'1':'0');
          let row = rows.children[idx];
          if (!row) { row = document.createElement('div'); rows.appendChild(row); }
          row.className = cls;
          if (row.dataset.cacheKey === key) return;
          row.dataset.cacheKey = key;
          const avHtml = w.showAvatar
            ? '<div class="tl-avatar">' + (item.profilePic ? '<img alt="" src="' + escapeHtml(item.profilePic) + '">' : escapeHtml(initial)) + '</div>'
            : '';
          row.innerHTML = '<div class="tl-rank">' + (item.rank || idx+1) + '</div>' + avHtml
            + '<div class="tl-name">' + escapeHtml(name) + '</div>'
            + (w.showLikes ? '<div class="tl-likes">' + Number(item.likes || 0).toLocaleString() + '</div>' : '');
          const img = row.querySelector('.tl-avatar img');
          if (img) img.addEventListener('error', () => img.replaceWith(document.createTextNode(initial)), { once: true });
        });
        while (rows.children.length > items.length) rows.removeChild(rows.lastChild);
      }

      // Track latest top-likers payload for use by all topLikers widgets
      let lastTopLikersData = null;

      // ── Chat Feed widget ────────────────────────────────
      const recentStreamChat = [];
      const MAX_RECENT_STREAM_CHAT = 200;
      let chatExpiryTimer = null;
      const previewChatMessages = [
        { platform: 'tiktok', user: { displayName: 'WordFan', username: 'wordfan', badges: ['follower'], profilePic: null }, message: 'period before guesses is perfect', timestamp: new Date().toISOString() },
        { platform: 'youtube', user: { displayName: 'PuzzlePilot', username: 'puzzlepilot', badges: ['subscriber'], profilePic: null }, message: 'that win card looked clean', timestamp: new Date().toISOString() },
        { platform: 'discord', user: { displayName: 'Jorry', username: 'jorry', badges: ['moderator'], profilePic: null }, message: 'chat widget is live', timestamp: new Date().toISOString() },
      ];

      function ensureChatFeedShell(entry) {
        if (!entry.contentEl.firstElementChild) {
          entry.contentEl.innerHTML = '<div class="chat-feed"><div class="cf-list"></div></div>';
        }
        const root = entry.contentEl.firstElementChild;
        const list = root && root.querySelector('.cf-list');
        return { root, list };
      }

      function chatInitial(name) {
        return (String(name || '?').trim()[0] || '?').toUpperCase();
      }

      function chatBadgeLabel(raw) {
        const badge = String(raw || '').trim().toLowerCase();
        if (!badge) return '';
        if (badge === 'fan-club') return 'FC';
        if (badge === 'superfan') return 'SF';
        if (badge === 'subscriber') return 'SUB';
        if (badge === 'moderator') return 'MOD';
        if (badge === 'follower') return 'FOL';
        if (badge === 'bot') return 'BOT';
        return badge.slice(0, 8).toUpperCase();
      }

      function chatPlatformLabel(raw) {
        const p = String(raw || '').trim().toLowerCase();
        if (p === 'tiktok') return 'TT';
        if (p === 'youtube') return 'YT';
        if (p === 'discord') return 'DC';
        if (p === 'mobile') return 'WT';
        return p ? p.slice(0, 3).toUpperCase() : '';
      }

      function chatTimeLabel(ts) {
        const d = new Date(ts || Date.now());
        if (!Number.isFinite(d.getTime())) return '';
        try { return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
        catch (_) { return ''; }
      }

      function chatCosmeticPick(cosmeticsRaw, key) {
        const eq = (cosmeticsRaw && cosmeticsRaw.equipped) || cosmeticsRaw || {};
        return eq[key] || null;
      }

      function applyChatNameCosmetics(nameEl, cosmeticsRaw) {
        if (!nameEl) return;
        const nameColor = chatCosmeticPick(cosmeticsRaw, 'name_color');
        const nameGlow = chatCosmeticPick(cosmeticsRaw, 'name_glow');
        const color = nameColor && (nameColor.color || (nameColor.css && nameColor.css.color));
        const shadow = nameGlow && (nameGlow.textShadow || (nameGlow.css && nameGlow.css.textShadow));
        if (color) nameEl.style.color = color;
        if (shadow) nameEl.style.textShadow = shadow;
      }

      // Display filter. Returns the text this widget should SHOW for a
      // message, or null when the widget's symbol filter excludes it.
      // Display-only: the message still reaches the game / TTS as normal.
      function chatFeedMessageText(w, data) {
        const raw = String((data && data.message) || '');
        const prefix = String(w.filterPrefix || '').trim();
        if (!prefix) return raw;
        // Leading whitespace is trimmed before the test so " !hi" still
        // matches — viewers routinely type a stray leading space.
        const trimmed = raw.replace(/^\s+/, '');
        if (!trimmed.startsWith(prefix)) return null;
        if (w.keepFilterPrefix) return trimmed;
        const stripped = trimmed.slice(prefix.length).replace(/^\s+/, '');
        // A bare symbol with nothing after it has no content left to show.
        return stripped || null;
      }

      // Signature of every setting that changes a row's rendered CONTENTS.
      // When it changes we wipe and rebuild (a settings edit is rare, and one
      // flash there is fine). Otherwise rows reconcile by key — see below.
      function chatFeedRowSig(w) {
        return [
          w.showAvatar !== false, w.showName !== false, w.showBadges !== false,
          !!w.showPlatform, !!w.showTimestamp,
          String(w.filterPrefix || ''), !!w.keepFilterPrefix,
        ].join('|');
      }

      function buildChatFeedRow(w, item) {
        const data = item.data || {};
        const user = data.user || {};
        const displayName = user.customNick || user.displayName || user.username || 'Viewer';
        const row = document.createElement('div');
        row.className = 'cf-row';
        row.dataset.key = item.key || '';
        if (w.showAvatar !== false) {
          const av = document.createElement('div');
          av.className = 'cf-avatar';
          if (user.profilePic) {
            const img = document.createElement('img');
            img.alt = '';
            img.src = user.profilePic;
            img.addEventListener('error', () => img.replaceWith(document.createTextNode(chatInitial(displayName))), { once: true });
            av.appendChild(img);
          } else {
            av.textContent = chatInitial(displayName);
          }
          row.appendChild(av);
        }
        const body = document.createElement('div');
        body.className = 'cf-body';
        const metaBits = [];
        if (w.showName !== false) metaBits.push({ type: 'name', text: displayName, cosmetics: user.cosmetics });
        if (w.showPlatform) {
          const label = chatPlatformLabel(data.platform);
          if (label) metaBits.push({ type: 'chip', text: label });
        }
        if (w.showBadges !== false && Array.isArray(user.badges)) {
          for (const badge of user.badges.slice(0, 4)) {
            const label = chatBadgeLabel(badge);
            if (label) metaBits.push({ type: 'chip', text: label });
          }
        }
        if (w.showTimestamp) {
          const label = chatTimeLabel(data.timestamp);
          if (label) metaBits.push({ type: 'chip', text: label });
        }
        if (metaBits.length) {
          const meta = document.createElement('div');
          meta.className = 'cf-meta';
          for (const bit of metaBits) {
            const el = document.createElement(bit.type === 'name' ? 'div' : 'span');
            el.className = bit.type === 'name' ? 'cf-name' : 'cf-chip';
            el.textContent = bit.text;
            if (bit.type === 'name') applyChatNameCosmetics(el, bit.cosmetics);
            meta.appendChild(el);
          }
          body.appendChild(meta);
        }
        const msg = document.createElement('div');
        msg.className = 'cf-message';
        msg.textContent = item.text;
        body.appendChild(msg);
        row.appendChild(body);
        return row;
      }

      function renderChatFeedRows(w) {
        const entry = widgetMap.get(w.id);
        if (!entry) return;
        const { root, list } = ensureChatFeedShell(entry);
        if (!root || !list) return;
        const now = Date.now();
        const lifetime = Math.max(0, Number(w.messageLifetimeSec) || 0);
        const limit = Math.max(1, Math.min(30, Number(w.maxMessages) || 8));
        const prefix = String(w.filterPrefix || '').trim();
        // Filter FIRST, cap second: maxMessages counts what this widget
        // actually shows, so a filtered feed still fills up instead of being
        // thinned out by the chat it was told to ignore.
        let items = [];
        for (const item of recentStreamChat) {
          if (lifetime && (now - item.receivedAt) > lifetime * 1000) continue;
          const text = chatFeedMessageText(w, item.data);
          if (text === null) continue;
          items.push({ key: item.key, data: item.data, text });
        }
        items = items.slice(-limit);
        if (!items.length && isAlwaysShow()) {
          // Preview rows are synthesized, so they bypass the filter — but echo
          // the symbol back when it would be kept, so the dashboard preview
          // shows what the live feed will actually look like.
          items = previewChatMessages.map((message, idx) => ({
            key: 'preview-' + idx,
            data: message,
            text: (prefix && w.keepFilterPrefix ? prefix + ' ' : '') + message.message,
          }));
        }
        if ((w.newestAt || 'bottom') === 'top') items.reverse();

        // ── Keyed reconcile ──
        // This used to be `list.innerHTML = ''` + rebuild-everything, which
        // re-created every .cf-row on every incoming message. Since .cf-row
        // carries the entry animation in CSS, that restarted it on all rows at
        // once — the whole feed blinked instead of the new message animating
        // in. Reusing the existing nodes means only genuinely new rows animate.
        const sig = chatFeedRowSig(w);
        if (list.dataset.sig !== sig) {
          list.innerHTML = '';
          list.dataset.sig = sig;
        }
        const existing = new Map();
        for (const node of list.children) {
          const k = node.dataset.key;
          if (k && !existing.has(k)) existing.set(k, node);
        }
        const desired = [];
        for (const item of items) {
          const key = item.key || '';
          const reused = key ? existing.get(key) : null;
          if (reused) {
            existing.delete(key);
            // Same key can be re-rendered with different text if the filter's
            // strip setting changed mid-flight; keep the body in sync.
            const msgEl = reused.querySelector('.cf-message');
            if (msgEl && msgEl.textContent !== item.text) msgEl.textContent = item.text;
            desired.push(reused);
          } else {
            desired.push(buildChatFeedRow(w, item));
          }
        }
        const keep = new Set(desired);
        for (const node of Array.from(list.children)) {
          if (!keep.has(node)) node.remove();
        }
        // Reorder in place. Moving an element inside the DOM does not restart
        // a finished CSS animation, so surviving rows stay visually still.
        desired.forEach((node, i) => {
          if (list.children[i] !== node) list.insertBefore(node, list.children[i] || null);
        });
      }

      function scheduleChatExpiryTick() {
        if (chatExpiryTimer) {
          clearTimeout(chatExpiryTimer);
          chatExpiryTimer = null;
        }
        if (!currentConfig?.widgets || !recentStreamChat.length) return;
        const now = Date.now();
        let nextAt = Infinity;
        for (const w of currentConfig.widgets) {
          if (w.type !== 'chatFeed' || !w.enabled) continue;
          const lifetime = Math.max(0, Number(w.messageLifetimeSec) || 0);
          if (!lifetime) continue;
          for (const item of recentStreamChat) {
            const expires = item.receivedAt + lifetime * 1000;
            if (expires > now && expires < nextAt) nextAt = expires;
          }
        }
        if (Number.isFinite(nextAt)) {
          chatExpiryTimer = setTimeout(() => {
            chatExpiryTimer = null;
            renderAllChatFeeds();
          }, Math.max(250, nextAt - now + 80));
        }
      }

      function renderAllChatFeeds() {
        if (!currentConfig?.widgets) return;
        for (const w of currentConfig.widgets) {
          if (w.type === 'chatFeed') renderChatFeedRows(w);
        }
        scheduleChatExpiryTick();
      }

      function renderChatFeedWidget(w) {
        const entry = widgetMap.get(w.id);
        if (!entry) return;
        const { root } = ensureChatFeedShell(entry);
        if (!root) return;
        applyCommonStyles(w, entry);
        const isLandscape = document.body.classList.contains('landscape');
        const canvasW = isLandscape ? 1920 : 1080;
        const canvasH = isLandscape ? 1080 : 1920;
        const widthPct = Number(w.widthPct) || 48;
        const heightPct = Number(w.heightPct) || 30;
        root.style.width = Math.round(canvasW * widthPct / 100) + 'px';
        root.style.height = Math.round(canvasH * heightPct / 100) + 'px';
        root.style.setProperty('--chat-align', (w.textAlign === 'center' || w.textAlign === 'right') ? w.textAlign : 'left');
        root.classList.toggle('compact', !!w.compact);
        root.classList.toggle('newest-top', w.newestAt === 'top');
        root.classList.toggle('align-center', w.textAlign === 'center');
        root.classList.toggle('align-right', w.textAlign === 'right');
        root.classList.toggle('no-avatar', w.showAvatar === false);
        root.classList.toggle('avatar-rounded', w.avatarShape === 'rounded');
        root.classList.toggle('avatar-square', w.avatarShape === 'square');
