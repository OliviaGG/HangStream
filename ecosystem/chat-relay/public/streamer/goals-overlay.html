        if (hasGameWidget && bg) {
          bg.remove();
          document.body.classList.remove('embed-game');
        }

        setStatus('live · ' + streamerId, 'ok');
      }

      function applyOrder(order) {
        if (!Array.isArray(order)) return;
        const widgets = Array.isArray(currentConfig?.widgets) ? currentConfig.widgets : [];
        const widgetById = new Map(widgets.map(w => [w.id, w]));
        const bgWidget = widgets.find(w => w && w.type === 'animatedBg');
        let bgOrdered = false;
        const zById = new Map();
        const setWidgetZ = (id, z) => {
          const entry = widgetMap.get(id);
          if (!entry) return;
          entry.el.style.zIndex = String(z);
          zById.set(id, z);
        };
        order.forEach((id, idx) => {
          const z = 100 - idx * 5;
          if (bgWidget && id === bgWidget.id) {
            const layer = document.getElementById('anim-bg-layer');
            if (layer) layer.style.zIndex = String(z);
            bgOrdered = true;
            return;
          }
          setWidgetZ(id, z);
        });
        if (bgWidget && !bgOrdered) {
          const layer = document.getElementById('anim-bg-layer');
          if (layer) layer.style.zIndex = '0';
        }
      }

      function applyPositionPreview(p) {
        if (!p || p.mode !== mode) return;
        const w = currentConfig?.widgets?.find(x => x.id === p.widgetId);
        if (!w) return;
        if (!currentConfig.layout[mode]) currentConfig.layout[mode] = {};
        const pos = currentConfig.layout[mode][p.widgetId] || { x: 50, y: 50, anchor: 'center' };
        pos.x = p.x; pos.y = p.y; if (p.anchor) pos.anchor = p.anchor;
        currentConfig.layout[mode][p.widgetId] = pos;
        layoutWidget(w, pos);
      }

      // ── Streamer gift room join (Campaign Gift reactions) ──
      // Joining is idempotent; reset on reconnect like the win rooms.
      let _giftRoomJoined = false;
      function joinGiftRoomIfNeeded(w) {
        if (!socket || !w.enabled || w.reactToGifts === false) return;
        if (currentHandle && !_giftRoomJoined) {
          socket.emit('join-streamer-gifts', currentHandle);
          _giftRoomJoined = true;
        }
      }

      // ── Win room join (cumulative — joining is idempotent) ─
      const _winRoomsJoined = { streamer: false, public: false };
      function joinWinRoomIfNeeded(w) {
        if (!socket || !w.enabled) return;
        if ((w.scope === 'streamer' || w.scope === 'both') && currentHandle && !_winRoomsJoined.streamer) {
          socket.emit('join-streamer-win-overlay', currentHandle);
          _winRoomsJoined.streamer = true;
        }
        if ((w.scope === 'public' || w.scope === 'both') && !_winRoomsJoined.public) {
          socket.emit('join-win-overlay');
          _winRoomsJoined.public = true;
        }
      }

      // ── Drag / touch logic — same as before, per-widget ────
      let dragState = null;
      // Positions saved by a recent drag, re-applied over incoming snapshots
      // for a few seconds — a goal-update generated BEFORE our layout PUT
      // landed would otherwise revert the widget to its pre-drag spot.
      const _recentDragPos = new Map();

      function bindDragHandlers(widgetId, el) {
        el.addEventListener('pointerdown', (e) => {
          if (e.pointerType === 'mouse') {
            if (dragState && dragState.widgetId === widgetId) { endDrag(); return; }
            if (dragState) endDrag();
          } else if (dragState) {
            // Touch: a second finger landing on a widget mid-drag must NOT
            // hijack the gesture — its coordinates would mix with the first
            // finger's and teleport the widget across the screen.
            return;
          }
          startDrag(widgetId, e);
        });
      }

      function startDrag(widgetId, ev) {
        if (!document.body.classList.contains('edit') && !document.body.classList.contains('preview')) return;
        const entry = widgetMap.get(widgetId);
        if (!entry) return;
        ev.preventDefault();
        const point = ev.touches ? ev.touches[0] : ev;
        dragState = {
          widgetId,
          pointerType: ev.pointerType || (ev.touches ? 'touch' : 'mouse'),
          pointerId: ev.pointerId != null ? ev.pointerId : null,
          startX: point.clientX, startY: point.clientY,
          startPctX: Number(entry.el.dataset.x) || 50,
          startPctY: Number(entry.el.dataset.y) || 50,
          anchor: entry.el.dataset.anchor || 'center',
        };
        entry.el.classList.add('dragging');
      }

      // Only the pointer that STARTED the drag may move or end it. Without
      // this, window-level pointermove/pointerup from any other finger or a
      // palm brush feeds foreign coordinates into the drag math.
      function _isDragPointer(ev) {
        if (!dragState) return false;
        if (dragState.pointerId == null || ev.pointerId == null) return true;
        return ev.pointerId === dragState.pointerId;
      }

      function moveDrag(ev) {
        if (!dragState || !_isDragPointer(ev)) return;
        const point = ev.touches ? ev.touches[0] : ev;
        // Map pointer movement into design-canvas percent using the canvas's
        // ACTUAL on-screen size (VW*s via getBoundingClientRect), not
        // window.innerWidth. When the portrait canvas is letterboxed inside a
        // wider viewport, innerWidth >> canvas width, so the widget lagged the
        // pointer — you'd run out of rightward screen travel before it reached
        // the right edge (drag-right felt blocked while drag-left still worked).
        const canvasEl = document.getElementById('scale-root');
        const rect = canvasEl ? canvasEl.getBoundingClientRect() : null;
        const cw = rect && rect.width ? rect.width : window.innerWidth;
        const ch = rect && rect.height ? rect.height : window.innerHeight;
        const dx = (point.clientX - dragState.startX) / cw * 100;
        const dy = (point.clientY - dragState.startY) / ch * 100;
        // Allow dragging beyond the canvas on EVERY side (-100..200), not
        // just where the anchor math happened to permit it. 0..100 clamps
        // the ANCHOR POINT, so a left-anchored widget could hang fully off
        // the right edge but hit a wall flush against the left one.
        const nx = Math.max(-100, Math.min(200, dragState.startPctX + dx));
        const ny = Math.max(-100, Math.min(200, dragState.startPctY + dy));
        const w = currentConfig?.widgets?.find(x => x.id === dragState.widgetId);
        if (!w) return;
        layoutWidget(w, { x: nx, y: ny, anchor: dragState.anchor }, { fromDrag: true });
      }

      // Debounced direct-save used when the overlay is the top-level page
      // (stream-view scenario). The dashboard-preview path saves via the
      // parent window's PUT — when there's no parent, the overlay itself
      // has to call /api/streamer/goals to persist drag changes.
      let _saveLayoutTimer = null;
      function saveLayoutToServer() {
        if (!currentConfig) return;
        clearTimeout(_saveLayoutTimer);
        _saveLayoutTimer = setTimeout(async () => {
          try {
            const r = await fetch('/api/streamer/goals', {
              method: 'PUT', credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ config: currentConfig }),
            });
            if (!r.ok) {
              const data = await r.json().catch(() => ({}));
              setStatus('Save failed: ' + (data.error || ('HTTP ' + r.status)), 'bad');
              svToast('Layout save failed: ' + (data.error || ('HTTP ' + r.status)), 'bad', 3500);
            }
          } catch (e) {
            setStatus('Save failed: ' + (e.message || e), 'bad');
            svToast('Layout save failed: ' + (e.message || e), 'bad', 3500);
          }
        }, 250);
      }

      function endDrag() {
        if (!dragState) return;
        const widgetId = dragState.widgetId;
        const entry = widgetMap.get(widgetId);
        if (entry) entry.el.classList.remove('dragging');
        if (entry) {
          const newX = Number(entry.el.dataset.x);
          const newY = Number(entry.el.dataset.y);
          const newAnchor = entry.el.dataset.anchor || 'center';
          if (Number.isFinite(newX) && Number.isFinite(newY)) {
            // Mirror the new position into the in-memory config regardless
            // of context, so subsequent renders use it even before save.
            // Per-game for the GAME widget; every other widget writes the
            // universal slot so it keeps one position across all games.
            const widget = resolveWidgetById(widgetId);
            const gameId = resolveWidgetLayoutGameContext(widget) || null;
            if (gameId) {
              if (!currentConfig.gameLayouts) currentConfig.gameLayouts = {};
              if (!currentConfig.gameLayouts[gameId]) currentConfig.gameLayouts[gameId] = {};
              if (!currentConfig.gameLayouts[gameId][mode]) currentConfig.gameLayouts[gameId][mode] = {};
              const existing = currentConfig.gameLayouts[gameId][mode][widgetId] || {};
              currentConfig.gameLayouts[gameId][mode][widgetId] = { ...existing, x: newX, y: newY, anchor: newAnchor };
            } else {
              if (!currentConfig.layout) currentConfig.layout = {};
              if (!currentConfig.layout[mode]) currentConfig.layout[mode] = {};
              currentConfig.layout[mode][widgetId] = { x: newX, y: newY, anchor: newAnchor };
            }
            // Shield this position from stale snapshots for a few seconds
            // (applySnapshot re-applies it until the saved config catches up).
            _recentDragPos.set(widgetId, { gameId, x: newX, y: newY, anchor: newAnchor, ts: Date.now() });

            const inIframe = (window.parent && window.parent !== window);
            if (inIframe) {
              // Dashboard preview owns the save — bubble up the gameId too
              // so it knows whether to update gameLayouts vs base layout.
              window.parent.postMessage({
                type: 'goals-drag', phase: 'end',
                mode, widgetId, x: newX, y: newY, anchor: newAnchor,
                gameId,
              }, '*');
            } else {
              // Top-level (stream-view) — persist directly. Requires the
              // viewer to be logged in as the streamer (cookie session).
              saveLayoutToServer();
            }
          }
        }
        dragState = null;
      }

      function endDragOnRelease(ev) {
        if (!dragState) return;
        if (dragState.pointerType === 'mouse') return;
        if (!_isDragPointer(ev)) return;   // another finger lifting ≠ drop
        endDrag();
      }

      window.addEventListener('pointermove', moveDrag);
      window.addEventListener('pointerup', endDragOnRelease);
      window.addEventListener('pointercancel', (ev) => {
        if (!dragState || !_isDragPointer(ev)) return;
        endDrag();
      });
      document.addEventListener('mousedown', (e) => {
        if (!dragState || dragState.pointerType !== 'mouse') return;
        if (!e.target.closest || !e.target.closest('.widget')) endDrag();
      });

      // ── postMessage protocol ───────────────────────────────
      window.addEventListener('message', (ev) => {
        const m = ev.data || {};
        if (m.type === 'goals-set-edit') {
          document.body.classList.toggle('edit', !!m.edit);
          if (lastSnap) applySnapshot(lastSnap);
        } else if (m.type === 'goals-set-trim-mode') {
          const id = String(m.widgetId || '');
          trimPreviewWidgetId = id || null;
          if (lastSnap) applySnapshot(lastSnap);
          else applyTrimPreviewIsolation();
        } else if (m.type === 'goals-set-anchor' && m.widgetId && m.anchor) {
          const w = currentConfig?.widgets?.find(x => x.id === m.widgetId);
          if (!w) return;
          if (!currentConfig.layout[mode]) currentConfig.layout[mode] = {};
          const pos = currentConfig.layout[mode][m.widgetId] || { x: 50, y: 50, anchor: 'center' };
          pos.anchor = m.anchor;
          currentConfig.layout[mode][m.widgetId] = pos;
          layoutWidget(w, pos);
          if (window.parent !== window) {
            window.parent.postMessage({ type: 'goals-drag', phase: 'end', mode, widgetId: m.widgetId, x: pos.x, y: pos.y, anchor: pos.anchor }, '*');
          }
        } else if (m.type === 'goals-set-position' && m.widgetId) {
          // Dashboard sliders updating x/y for a widget (used by gameEmbed
          // which can't be dragged because the iframe captures pointers).
          const w = currentConfig?.widgets?.find(x => x.id === m.widgetId);
          if (!w) return;
          if (!currentConfig.layout[mode]) currentConfig.layout[mode] = {};
          const pos = currentConfig.layout[mode][m.widgetId] || { x: 50, y: 50, anchor: 'center' };
          if (Number.isFinite(m.x)) pos.x = Math.max(0, Math.min(100, m.x));
          if (Number.isFinite(m.y)) pos.y = Math.max(0, Math.min(100, m.y));
          if (m.anchor) pos.anchor = m.anchor;
          currentConfig.layout[mode][m.widgetId] = pos;
          layoutWidget(w, pos);
        } else if (m.type === 'goals-end-drag') {
          if (dragState && dragState.pointerType !== 'mouse') endDrag();
        } else if (m.type === 'goals-preview-snap' && m.config) {
          // Dashboard pushed an unsaved config preview (slider drag, color
          // pick, etc.). Render it instantly without waiting for the 350ms
          // save debounce + server roundtrip. The next real goal-update
          // from the socket will replace this once the save persists.
          const merged = Object.assign({}, lastSnap || {}, {
            config: m.config,
            state: m.state || (lastSnap && lastSnap.state) || { widgetState: {} },
          });
          applySnapshot(merged);
        }
      });

      // ── Notifications widget alerts (owing "pay up" + batch "Donor perk") ──
      // Both fire over the goals room the overlay already joins. They render
      // INSIDE the streamer's Notifications widget (type 'notifications') if
      // they've added + enabled one, inheriting its position; with no such
      // widget they're a no-op (the alerts are off until the widget is added).
      // Server throttles per viewer (30s), so every event we get is meant to show.
      function _activeNotifWidget() {
        const widgets = (currentConfig && currentConfig.widgets) || [];
        for (const w of widgets) {
          if (w.type !== 'notifications' || !w.enabled) continue;
          const entry = widgetMap.get(w.id);
          if (entry && entry.contentEl && entry.contentEl.querySelector('.notif-banner')) {
            return { w, entry };
          }
        }
        return null;
      }

      let _notifBannerTimer = null;
      let _notifCooldownUntil = 0;
      function _showNotifBanner(kind, build) {
        const active = _activeNotifWidget();
        if (!active) return;                     // no enabled Notifications widget → nothing shows
        const { w, entry } = active;
        if (kind === 'owing' && w.showOwing === false) return;
        if (kind === 'batch' && w.showBatch === false) return;
        if (Date.now() < _notifCooldownUntil) return;  // still within the "before it shows again" window
        const el = entry.contentEl.querySelector('.notif-banner');
        if (!el) return;
        const title = el.querySelector('.nb-title');
        const sub = el.querySelector('.nb-sub');
        title.textContent = '';
        for (const node of build.titleNodes()) title.append(node);
        sub.innerHTML = build.subHtml;          // fixed markup, no user input
        const pfp = el.querySelector('.nb-pfp');
        pfp.style.display = build.profilePic ? '' : 'none';
        if (build.profilePic) pfp.src = build.profilePic;
        // display:flex must land a frame before .show so the transition animates.
        el.style.display = 'flex';
        requestAnimationFrame(() => el.classList.add('show'));
        // Streamer-configurable: how long it stays present, and how long before
        // another alert can appear (the cooldown starts after it dismisses).
        const durationMs = Math.max(1, Number(w.showDurationSec) || 8) * 1000;
        const cooldownMs = Math.max(0, Number(w.cooldownSec) || 0) * 1000;
        _notifCooldownUntil = Date.now() + durationMs + cooldownMs;
        if (_notifBannerTimer) clearTimeout(_notifBannerTimer);
        _notifBannerTimer = setTimeout(() => {
          el.classList.remove('show');
          setTimeout(() => { if (!el.classList.contains('show')) el.style.display = 'none'; }, 300);
        }, durationMs);
      }

      function showOwingBanner(payload) {
        if (!payload) return;
        const name = String(payload.displayName || payload.tiktokUserId || 'This viewer').slice(0, 60);
        const amount = Number(payload.amountDollars) || 0;
        const amountLabel = '$' + (Number.isInteger(amount) ? amount : amount.toFixed(2));
        _showNotifBanner('owing', {
          profilePic: payload.profilePic || null,
          titleNodes: () => {
            const amt = document.createElement('span');
            amt.className = 'nb-amount';
            amt.textContent = amountLabel;
            return [document.createTextNode(name + ' owes '), amt];
          },
          subHtml: 'Pay the <b>$2/mo Donor sub</b> at <span class="nb-link">jorry.live</span> to play',
        });
      }

      function showBatchBanner(payload) {
        if (!payload) return;
        const name = String(payload.displayName || payload.tiktokUserId || 'This viewer').slice(0, 60);
        _showNotifBanner('batch', {
          profilePic: payload.profilePic || null,
          titleNodes: () => {
            const perk = document.createElement('span');
            perk.className = 'nb-perk';
            perk.textContent = 'Donor perk';
            return [document.createTextNode(name + ', batch guessing is a '), perk];
          },
          subHtml: 'First word only &middot; <b>$2 Donor Class</b> at <span class="nb-link">jorry.live</span>, or Super Fan on TikTok',
        });
      }

      // ── Pookie Tok — paid viewer messages (widget host, or fixed fallback) ──
      const PTOK_TIERS = {
        note:      { emoji: '💌', label: 'Pookie Note' },
        shout:     { emoji: '💖', label: 'Pookie Shout' },
        spotlight: { emoji: '👑', label: 'Pookie Spotlight' },
        royalty:   { emoji: '🌟', label: 'Pookie Royalty' },
      };
      const PTOK_MAX_VISIBLE = 4;

      // Fixed fallback stack on <body>, used only when no pookieTok widget is enabled.
      function ensurePookieLayer() {
        let layer = document.getElementById('pookieTokLayer');
        if (!layer) {
          layer = document.createElement('div');
          layer.id = 'pookieTokLayer';
          layer.className = 'ptok-stack';
          document.body.appendChild(layer);
        }
        return layer;
      }

      // The enabled pookieTok widget (+ its host + card stack), or null.
      function _activePookieWidget() {
        const widgets = (currentConfig && currentConfig.widgets) || [];
        for (const w of widgets) {
          if (w.type !== 'pookieTok' || !w.enabled) continue;
          const entry = widgetMap.get(w.id);
          const stack = entry && entry.contentEl && entry.contentEl.querySelector('.ptok-stack');
          if (stack) return { w, entry, stack };
        }
        return null;
      }

      // Build a paid-message card (textContent only — never innerHTML).
      function _buildPookieCard(data) {
        const meta = PTOK_TIERS[data.tier] || PTOK_TIERS.note;
        const card = document.createElement('div');
        card.className = 'ptok ptok-' + (PTOK_TIERS[data.tier] ? data.tier : 'note');
        if (data.id != null) card.setAttribute('data-id', String(data.id));
        const badge = document.createElement('div');
        badge.className = 'ptok-badge';
        badge.textContent = meta.emoji + ' ' + meta.label;
        const msg = document.createElement('div');
        msg.className = 'ptok-msg';
        msg.textContent = String(data.message);
        card.appendChild(badge);
        card.appendChild(msg);
        if (data.displayName) {
          const nm = document.createElement('div');
          nm.className = 'ptok-name';
          nm.textContent = '— ' + String(data.displayName);
          card.appendChild(nm);
        }
        if (data.tier === 'royalty') {
          for (let i = 0; i < 6; i++) {
            const h = document.createElement('span');
            h.className = 'ptok-heart';
            h.textContent = i % 2 ? '💖' : '💕';
            h.style.left = (8 + i * 15) + '%';
            h.style.animationDelay = (i * 0.35) + 's';
            card.appendChild(h);
          }
        }
        return card;
      }

      function dismissPookie(card) {
        if (!card || card._ptokDismissing) return;
        card._ptokDismissing = true;
        if (card._ptokTimer) clearTimeout(card._ptokTimer);
        const host = card._ptokHost || null;      // widget host el, or null for the fixed layer
        const stack = card.parentNode;
        card.classList.remove('ptok-in');
        card.classList.add('ptok-out');
        setTimeout(() => {
          if (card.parentNode) card.parentNode.removeChild(card);
          // Hide the widget host once its last real card is gone (OBS mode only).
          if (host && stack && !stack.querySelector('.ptok:not(.ptok-placeholder)') && !isAlwaysShow()) {
            host.classList.remove('show');
          }
        }, 450);
      }

      // Widget render fn (dispatched from the build loop): stamp the card stack
      // into the host; in edit/preview show a sample card so it can be positioned.
      function renderPookieTok(w) {
        const entry = widgetMap.get(w.id);
        if (!entry) return;
        if (!entry.contentEl.querySelector('.ptok-stack')) {
          const stack = document.createElement('div');
          stack.className = 'ptok-stack';
          entry.contentEl.appendChild(stack);
        }
        applyCommonStyles(w, entry);
        if (isAlwaysShow()) {
          _fillPookiePlaceholder(entry);
          entry.el.classList.add('show');
        }
      }

      function _fillPookiePlaceholder(entry) {
        const stack = entry.contentEl.querySelector('.ptok-stack');
        if (!stack) return;
        if (stack.querySelector('.ptok')) return;   // a real card (or placeholder) already there
        const card = _buildPookieCard({ tier: 'spotlight', message: 'Paid messages appear here', displayName: 'Pookie' });
        card.classList.add('ptok-placeholder', 'ptok-in');
        stack.appendChild(card);
      }

      // Transient driver (socket 'pookie-tok'): render a paid message into the
      // enabled widget host, or the fixed fallback when no widget is enabled.
      function showPookieTok(data) {
        if (!data || !data.message) return;
        const active = _activePookieWidget();
        const stack = active ? active.stack : ensurePookieLayer();
        const host = active ? active.entry.el : null;
        const ph = stack.querySelector('.ptok-placeholder');   // clear edit-mode sample
        if (ph) stack.removeChild(ph);
        // Cap concurrent cards — hard-remove the oldest synchronously (a fade here
        // would never shrink the count in time and would spin).
        while (stack.querySelectorAll('.ptok').length >= PTOK_MAX_VISIBLE) {
          const oldest = stack.querySelector('.ptok');
          if (oldest._ptokTimer) clearTimeout(oldest._ptokTimer);
          stack.removeChild(oldest);
        }
        const card = _buildPookieCard(data);
        card._ptokHost = host;
        stack.appendChild(card);
        if (host) host.classList.add('show');
        requestAnimationFrame(() => card.classList.add('ptok-in'));
        const dur = Math.max(3000, Math.min(Number(data.durationMs) || 15000, 180000));
        card._ptokTimer = setTimeout(() => dismissPookie(card), dur);
      }

      function hidePookieById(id) {
        if (id == null) return;
        const stacks = [];
        const layer = document.getElementById('pookieTokLayer');
        if (layer) stacks.push(layer);
        const active = _activePookieWidget();
        if (active) stacks.push(active.stack);
        for (const stack of stacks) {
          for (const c of stack.querySelectorAll('.ptok')) {
            if (c.getAttribute('data-id') === String(id)) { dismissPookie(c); return; }
          }
        }
      }

      // ── Socket ─────────────────────────────────────────────
      socket = io({ transports: ['websocket', 'polling'] });
      // If embedGame=1 set up an overlay-side TTS queue, hand it the socket
      // now that it exists so it can join the TTS room and listen.
      if (typeof _ttsSocketSetup === 'function') _ttsSocketSetup(socket);
      window.addEventListener('beforeunload', stopCameraStream);
      socket.on('connect', () => {
        _winRoomsJoined.streamer = false;
        _winRoomsJoined.public = false;
        _giftRoomJoined = false;
        for (const entry of widgetMap.values()) entry.topLikersJoined = false;
        socket.emit('join-goals-overlay', { streamerId });
        setStatus('connected · ' + streamerId, 'ok');
        svConnUp();
        if (currentConfig?.widgets) {
          for (const w of currentConfig.widgets) {
            if (w.type === 'topLikers') renderTopLikersWidget(w);
            else if (w.type === 'winCard') joinWinRoomIfNeeded(w);
            else if (w.type === 'campaignGift') joinGiftRoomIfNeeded(w);
          }
        }
      });
      socket.on('disconnect', () => { setStatus('disconnected', 'bad'); svConnDown(); });
      socket.on('goal-update', (snap) => { lastSnap = snap; applySnapshot(snap); });
      socket.on('stream-chat-message', pushStreamChatMessage);
      socket.on('owing-blocked', showOwingBanner);
      socket.on('batch-locked', showBatchBanner);
      socket.on('pookie-tok', showPookieTok);
      socket.on('pookie-tok-hide', (payload) => hidePookieById(payload && payload.id));
      // Next-game vote: one full-surface payload per change (phase, ballot,
      // tallies, countdown). Sent on join too, so a reconnect mid-vote is
      // instantly correct rather than blank until the next tick.
      socket.on('game-vote-update', applyGameVoteUpdate);
      socket.on('milestone-fire', (payload) => {
        const w = currentConfig?.widgets?.find(x => x.id === payload?.widgetId);
        if (!w) return;
        fireMilestone(w, payload);
      });
      // Like-for-Hint: flash a reveal (word or masked letters) over the hint
      // progress bar. Letter-mode reveals also pin the mask so it stays
      // visible between hints.
      socket.on('likehint-flash', (payload) => {
        const w = currentConfig?.widgets?.find(x => x.id === payload?.widgetId && x.type === 'likeHint');
        if (!w) return;
        const entry = widgetMap.get(w.id);
        if (!entry) return;
        // Word-mode reveal starts a fresh round's worth of clues → clear any
        // pinned letter mask carried over from a previous round.
        if (payload.mode === 'letters') entry._letterMask = String(payload.text || '').slice(0, 120);
        else entry._letterMask = null;
        if (!entry.contentEl.firstElementChild) renderLikeHint(w, currentState?.widgetState?.[w.id]);
        const root = entry.contentEl.firstElementChild;
        const reveal = root.querySelector('.hint-reveal');
        reveal.textContent = String(payload.text || '').slice(0, 120);
        entry._hintFlashing = true;
        root.classList.add('hint-flash');
        entry.el.classList.add('show');
        if (payload.soundUrl) {
          try { const a = $('ms-audio'); a.src = payload.soundUrl; a.currentTime = 0; a.play().catch(() => {}); } catch (e) {}
        }
        if (entry._hintFlashTimer) clearTimeout(entry._hintFlashTimer);
        entry._hintFlashTimer = setTimeout(() => {
          entry._hintFlashing = false;
          root.classList.remove('hint-flash');
          if (!isAlwaysShow() && !isWidgetVisible(w)) entry.el.classList.remove('show');
          renderLikeHint(w, currentState?.widgetState?.[w.id]);
        }, 6000);
      });
      // Campaign Gift reactions: raw per-streamer TikTok gifts (the
      // overlay only joins this room when a reactToGifts campaignGift
      // widget is enabled). Match by gift name, burst the tile.
      socket.on('gift', (g) => {
        const widgets = currentConfig?.widgets;
        if (!Array.isArray(widgets)) return;
        const name = String(g?.giftName || '').toLowerCase().trim();
        if (!name) return;
        for (const w of widgets) {
          if (w.type !== 'campaignGift' || !w.enabled || w.reactToGifts === false) continue;
          let tile = 0;
          if (name === String(w.gift1Name || '').toLowerCase().trim()) tile = 1;
          else if (w.showGift2 !== false && name === String(w.gift2Name || '').toLowerCase().trim()) tile = 2;
          if (tile) fireCampaignGiftBurst(w, tile, g?.user);
        }
      });
      socket.on('position-preview', applyPositionPreview);
      socket.on('order-preview', (p) => applyOrder(p?.widgetOrder));
      socket.on('game-win', (data) => {
        if (!currentConfig) return;
        // Cache the updated standings even when no win card matches this
        // game — a card filtered to another game still wants a fresh board
        // the next time it fires.
        if (data && data.winTally) ingestWinTally(data.winTally);
        // Tint the animated background toward the winner's hero-badge
        // color for the duration of the win card. Prefer the headline
        // winner's cosmetics; fall back to topPlayers[0] when the
        // payload only carries the leaderboard.
        try {
          const win = (data && data.winner) || (data && Array.isArray(data.topPlayers) && data.topPlayers[0]) || null;
          const cos = (win && (win.cosmetics || (win.equipped && win.equipped))) || {};
          const hero = cos.hero_badge || (cos.equipped && cos.equipped.hero_badge);
          const bgStr = hero && (hero.background || (hero.css && hero.css.background) || hero.color);
          if (_activeBgConfig && _activeBgConfig.preset === 'neon-frame') {
            const layer = document.getElementById('anim-bg-layer');
            // Full color profile: the banner's gradient palette, neonized.
            const pal = bgStr ? _bgExtractHeroPalette(bgStr) : [];
            if (pal.length) {
              // Neon frame: the winner's hero-banner profile is persistent —
              // the frame stays theirs until someone else wins (or the
              // active game changes; see ensureAnimBg).
              _bgWinnerHoldColor = pal;
              _bgWinnerHoldGameId = currentActiveGameId || '-';
              _neonFrameApplyPalette(layer, pal, true);
            } else {
              // New winner has NO hero banner — release the previous
              // winner's hold so the frame sweeps back to the neutral grey
              // default instead of staying stuck on the old champ.
              _bgWinnerHoldColor = null;
              _bgWinnerHoldGameId = null;
              _neonFrameApplyPalette(layer, NF_NO_BADGE_PALETTE, true);
            }
          } else {
            const hex = bgStr ? _bgExtractHeroColor(bgStr) : null;
            if (hex) bgTint(hex, 9000);
          }
        } catch (_) { /* tint is decoration — never break the win flow */ }
        // The psychedelic takeover would replace the neon frame wholesale —
        // for that preset the color hold above IS the win effect.
        if (!(_activeBgConfig && _activeBgConfig.preset === 'neon-frame')) {
          _applyWinnerPresetOverride(data);
        }
        // Fire all enabled winCards matching the scope
        for (const w of currentConfig.widgets) {
          if (w.type !== 'winCard' || !w.enabled) continue;
          const fromStreamer = !!data?.streamerHandle;
          if (fromStreamer && w.scope === 'public') continue;
          if (!fromStreamer && w.scope === 'streamer') continue;
          if (!winCardMatchesGame(w, data)) continue;
          showWinCard(w, data || {});
        }
        // The spoken win congratulation (opt-in `voiceAnnounce`) is emitted
        // server-side through the viewer-TTS pipeline (see server.js
        // maybeEmitWinAnnounce) so it plays from the streamer's live tab via
        // the already-unlocked <audio> element — a client-side Audio().play()
        // here would be blocked by the browser autoplay policy.
      });
      // Win standings pushed outside a win: on join (seed) and after the
      // streamer resets a board from the dashboard. Only re-renders cards
      // that are actually on screen in a wins mode — a card mid-fade keeps
      // the numbers it announced with.
      socket.on('win-tally-update', (snap) => {
        ingestWinTally(snap);
        if (!currentConfig) return;
        for (const w of currentConfig.widgets) {
          if (w.type !== 'winCard' || !w.enabled) continue;
          if (w.listMode !== 'session' && w.listMode !== 'saved') continue;
          const entry = widgetMap.get(w.id);
          if (!entry || !entry.contentEl.firstElementChild) continue;
          if (isAlwaysShow()) fillWinCardPlaceholder(w);
          else if (entry.el.classList.contains('show')) renderWinLeaderboard(w, [], null);
        }
      });
      socket.on('toplikers-update', (data) => {
        lastTopLikersData = data;
        if (!currentConfig) return;
        for (const w of currentConfig.widgets) {
          if (w.type === 'topLikers') renderTopLikersRows(w, data);
        }
      });
      socket.on('toplikers-reset', () => {
        lastTopLikersData = null;
        if (!currentConfig) return;
        for (const w of currentConfig.widgets) if (w.type === 'topLikers') renderTopLikersRows(w, null);
      });
      socket.on('winner-clear', (p) => {
        if (!currentConfig) return;
        for (const w of currentConfig.widgets) {
          if (w.type !== 'winCard') continue;
          if (p?.widgetId && p.widgetId !== w.id) continue;
          const entry = widgetMap.get(w.id);
          if (!entry) continue;
          if (entry.winCardTimer) { clearTimeout(entry.winCardTimer); entry.winCardTimer = null; }
          if (isAlwaysShow()) fillWinCardPlaceholder(w);
          else entry.el.classList.remove('show');
        }
      });
    })();
  </script>
  <script src="/js/hangstream-brand.js" defer></script>
</body>
</html>
