    /* ── Notifications widget — "pay up" (owing) + "Donor perk" (batch) alerts ──
       Rendered INSIDE the Notifications widget (type 'notifications') so it
       inherits that widget's position/anchor via layoutWidget. Off by default;
       the streamer adds the widget from the palette. Fired by relay.js
       'owing-blocked' / 'batch-locked' over the goals room the overlay already
       joins. NOT position:fixed — the parent .widget is positioned; the banner
       shakes around its own centre. */
    .notif-banner {
      display: none;
      align-items: center; gap: 16px;
      width: max-content; max-width: min(88vw, 720px);
      padding: 16px 24px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(120,10,20,0.92), rgba(60,4,10,0.94));
      border: 2px solid rgba(255,90,90,0.85);
      box-shadow: 0 8px 40px rgba(0,0,0,0.55), 0 0 28px rgba(255,60,60,0.35);
      color: #fff;
      font-family: 'Outfit', "Segoe UI", system-ui, sans-serif;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }
    .notif-banner.show {
      display: flex;
      opacity: 1;
      transform: scale(1);
      animation: notifShake 0.5s ease 0.25s 1;
    }
    /* Dashboard preview/edit: reveal a placeholder so the otherwise-invisible
       host is visible + draggable. In OBS output it stays hidden until fired. */
    body.edit .widget .notif-banner,
    body.preview .widget .notif-banner {
      display: flex; opacity: 1; transform: none; animation: none;
    }
    @keyframes notifShake {
      0%,100% { transform: scale(1); }
      20% { transform: translateX(-8px) scale(1); }
      40% { transform: translateX(8px) scale(1); }
      60% { transform: translateX(-5px) scale(1); }
      80% { transform: translateX(5px) scale(1); }
    }
    .notif-banner .nb-pfp {
      width: 64px; height: 64px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.75);
      object-fit: cover; flex: 0 0 auto;
      background: rgba(255,255,255,0.12);
    }
    .notif-banner .nb-text { min-width: 0; }
    .notif-banner .nb-title {
      font-weight: 900; font-size: clamp(20px, 2.6vw, 30px); line-height: 1.15;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      overflow-wrap: anywhere;
    }
    .notif-banner .nb-title .nb-amount,
    .notif-banner .nb-title .nb-perk { color: #ffd24a; }
    .notif-banner .nb-sub {
      margin-top: 4px;
      font-weight: 600; font-size: clamp(14px, 1.7vw, 19px);
      color: rgba(255,255,255,0.92);
    }
    .notif-banner .nb-sub .nb-link { color: #7fd4ff; font-weight: 800; }

    /* ── Pookie Tok — paid viewer messages ──
       Renders into the 'pookieTok' widget host (positioned/styled by the
       streamer), or, if no such widget is enabled, into #pookieTokLayer — a
       fixed top-center fallback so a paid message is never lost. Tier drives
       styling + on-screen time. Message text is set via textContent (never
       innerHTML). No backdrop-filter / color-mix / color-scheme, so it stays
       OBS-transparency-safe. */
    #pookieTokLayer {                 /* fixed fallback (no widget enabled) */
      position: fixed; top: 3.5%; left: 50%; transform: translateX(-50%);
      z-index: 99990;
    }
    .ptok-stack {                     /* the card column — inside a widget host OR the fallback */
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      pointer-events: none;
      width: max-content; max-width: min(92vw, 860px);
      font-family: 'Outfit', "Segoe UI", system-ui, sans-serif;
    }
    .ptok {
      --acc: #ff4d97;
      box-sizing: border-box; width: 100%;
      padding: 14px 22px; border-radius: 20px;
      text-align: center; color: #fff; position: relative;
      background: rgba(28,10,26,0.86);
      border: 2px solid var(--acc);
      box-shadow: 0 10px 34px rgba(0,0,0,0.5);
      opacity: 0; transform: translateY(-14px) scale(0.94);
      transition: opacity .35s ease, transform .35s cubic-bezier(.2,.9,.3,1.2);
      overflow: hidden;
    }
    .ptok.ptok-in { opacity: 1; transform: translateY(0) scale(1); }
    .ptok.ptok-out { opacity: 0; transform: translateY(-10px) scale(0.96); }
    .ptok-badge {
      display: inline-block; font-weight: 800; font-size: 13px; letter-spacing: .04em;
      text-transform: uppercase; color: var(--acc);
      margin-bottom: 6px; text-shadow: 0 1px 4px rgba(0,0,0,.5);
    }
    .ptok-msg {
      font-weight: 800; line-height: 1.2; overflow-wrap: anywhere;
      font-size: clamp(20px, 2.6vw, 30px);
      text-shadow: 0 2px 8px rgba(0,0,0,.55);
    }
    .ptok-name {
      margin-top: 6px; font-weight: 700; font-size: clamp(13px, 1.5vw, 17px);
      color: rgba(255,255,255,.82);
    }
    /* Tier 1 — Note: understated */
    .ptok-note { --acc: #ff87b8; background: rgba(24,10,22,0.82); }
    /* Tier 2 — Shout: gradient + bigger */
    .ptok-shout {
      --acc: #ff4d97;
      background: linear-gradient(120deg, rgba(190,26,120,0.92), rgba(120,40,190,0.92));
      border-color: rgba(255,150,200,0.9);
    }
    .ptok-shout .ptok-msg { font-size: clamp(22px, 2.9vw, 34px); }
    /* Tier 3 — Spotlight: glow pulse */
    .ptok-spotlight {
      --acc: #ffd24a;
      background: linear-gradient(120deg, rgba(150,20,120,0.94), rgba(90,30,200,0.94));
      border-color: rgba(255,210,74,0.95);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 26px rgba(255,90,170,0.5);
      animation: ptokGlow 2.2s ease-in-out infinite;
    }
    .ptok-spotlight .ptok-msg { font-size: clamp(24px, 3.3vw, 40px); }
    .ptok-spotlight .ptok-name { color: #ffe08a; }
    @keyframes ptokGlow {
      0%,100% { box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 22px rgba(255,90,170,0.45); }
      50%     { box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 40px rgba(255,150,90,0.75); }
    }
    /* Tier 4 — Royalty: takeover + animated gradient + floating hearts */
    .ptok-royalty {
      --acc: #ffd24a;
      padding: 22px 30px;
      background: linear-gradient(120deg, rgba(210,20,110,0.95), rgba(120,20,210,0.95), rgba(40,90,230,0.95));
      background-size: 200% 200%;
      border: 3px solid rgba(255,210,74,0.95);
      box-shadow: 0 14px 54px rgba(0,0,0,0.55), 0 0 48px rgba(255,120,190,0.6);
      animation: ptokRoyalShift 6s ease infinite, ptokGlow 2.2s ease-in-out infinite;
    }
    .ptok-royalty .ptok-badge { font-size: 15px; color: #ffe08a; }
    .ptok-royalty .ptok-msg { font-size: clamp(28px, 4vw, 52px); }
    .ptok-royalty .ptok-name { color: #ffe08a; font-size: clamp(15px, 1.8vw, 20px); }
    @keyframes ptokRoyalShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .ptok-heart {
      position: absolute; bottom: -24px; font-size: 22px; pointer-events: none;
      opacity: 0; animation: ptokFloat 3.2s ease-in forwards;
    }
    @keyframes ptokFloat {
      0% { opacity: 0; transform: translateY(0) scale(0.6); }
      15% { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-220px) scale(1.1); }
    }

    /* ===== OBS stream surface: disable glassmorphism =====
       Applied only under ?obs=1 (body.obs-surface), so the browser-viewed
       dashboard and the edit/preview surfaces are untouched.

       Why: the glass here is designed to sample #bg-game (see the comment
       above #bg-game), but #bg-game is an <iframe>, and an iframe is its own
       backdrop root -- backdrop-filter can never sample its pixels. On the
       stream this glass therefore renders black/empty rather than frosted.

       Cost: render1 has NO GPU (ASPEED BMC only), so OBS composites browser
       sources in software via SwiftShader. Every backdrop-filter forces a
       full-frame readback plus blur on the CPU, once per frame, per element.
       This overlay is 87% of all browser-source pixels on the stream and the
       browser processes were burning ~609% CPU with the box at ~123% load and
       6-8% lagged frames.

       So dropping it is strictly better on the stream: it removes the single
       most expensive property AND the black-glass artefact at the same time.
       Only backdrop-filter is cleared -- backgrounds, borders and shadows are
       left alone, and every .style-glass rule already carries its own
       translucent fill, so the panels stay readable.

       Deliberately NOT touched here: `filter: blur()`, which blurs the element
       itself, needs no backdrop root, and does render correctly on stream.
       That is a separate lever to measure on its own if this is not enough. */
    body.obs-surface,
    body.obs-surface *,
    body.obs-surface *::before,
    body.obs-surface *::after {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage"></div>
  <div id="status">connecting…</div>
  <audio id="ms-audio" preload="auto" style="display:none"></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/streamer/halloween-background.js?v=1"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const streamerId = params.get('streamerId');
      const modeParam = (params.get('mode') || 'portrait').toLowerCase();
      const mode = modeParam === 'landscape' ? 'landscape' : 'portrait';
      const debug = params.get('debug') === '1';
      const initialEdit = params.get('edit') === '1';
      const previewMode = params.get('preview') === '1';
      const embedGame = params.get('embedGame') === '1';
      const obsSurface = params.get('obs') === '1' || params.get('source') === 'obs';

      document.body.classList.add(mode);
      if (debug) document.body.classList.add('debug');
      if (initialEdit) document.body.classList.add('edit');
      if (previewMode) document.body.classList.add('preview');
      if (embedGame) document.body.classList.add('embed-game');
      if (obsSurface) document.body.classList.add('obs-surface');

    // Throttle the animated-background canvas loops on the OBS stream surface.
    // render1 has no GPU, so these full-canvas (1080x1920) redraws are software-
    // rasterised every frame and dominate CPU. They are purely decorative, so on
    // ?obs=1 we run them at ~15fps instead of the compositor's ~60. Returns a real
    // rAF id and tracks the latest into _activeBgRaf so cancelAnimationFrame() —
    // used when switching background presets — still stops the loop cleanly.
    // Only the bg canvas loops call this; the tint/camera/layout rAFs are left alone.
    function _bgRAF(cb) {
      var N = obsSurface ? 4 : 1;               // 60fps -> ~15fps on the stream
      if (N <= 1) return window.requestAnimationFrame(cb);
      var n = 0, id;
      function step(ts) {
        if (++n >= N) { cb(ts); return; }        // do the real draw at 1/N rate; cb re-arms via _bgRAF
        id = window.requestAnimationFrame(step);  // skip this frame, keep waiting
        _activeBgRaf = id;                        // track latest so cancel targets it
      }
      id = window.requestAnimationFrame(step);
      return id;
    }

      const $ = (id) => document.getElementById(id);
      const status = $('status');
      const stage = $('stage');
      function setStatus(t, c) { if (status) { status.textContent = t; status.className = c || ''; } }
      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
          '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));
      }

      // Convert a hex color (#rgb / #rrggbb / #rrggbbaa) to an rgba() string
      // using the supplied 0..1 opacity. Lets the bg-opacity slider stay
      // meaningful when a custom solid background color is set.
      function hexWithOpacity(hex, opacity) {
        const s = String(hex || '').trim();
        if (!s.startsWith('#')) return s;
        let h = s.slice(1);
        if (h.length === 3) h = h.split('').map(c => c + c).join('');     // #rgb → #rrggbb
        if (h.length === 8) h = h.slice(0, 6);                            // drop trailing alpha
        if (h.length !== 6 || !/^[0-9a-fA-F]+$/.test(h)) return s;
        const r = parseInt(h.slice(0, 2), 16);
        const g = parseInt(h.slice(2, 4), 16);
        const b = parseInt(h.slice(4, 6), 16);
        const a = Math.max(0, Math.min(1, Number(opacity)));
        return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
      }

      // ── Stream-view toast ──────────────────────────────────
      // Visible feedback pill for the streamer's phone. No-op on the OBS
      // capture path (obs=1) and in the dashboard preview iframe, where a
      // toast would leak onto the stream / preview.
      let _svToastEl = null;
      let _svToastTimer = null;
      function svToast(text, kind, ms) {
        if (!embedGame || obsSurface) return;
        if (!_svToastEl) {
          _svToastEl = document.createElement('div');
          _svToastEl.id = 'sv-toast';
          document.body.appendChild(_svToastEl);
        }
        clearTimeout(_svToastTimer);
        _svToastEl.textContent = String(text || '');
        _svToastEl.className = 'show' + (kind ? ' ' + kind : '');
        // ms=0 → persistent until replaced or svToastHide() is called.
        if (ms) _svToastTimer = setTimeout(svToastHide, ms);
      }
      function svToastHide() {
        clearTimeout(_svToastTimer);
        if (_svToastEl) _svToastEl.className = '';
      }
      // Connection banner: only alert when the socket stays down long
      // enough to matter (>3s), then confirm recovery briefly.
      let _connDownTimer = null;
      let _connToastShown = false;
      function svConnDown() {
        if (_connDownTimer) return;
        _connDownTimer = setTimeout(() => {
          _connToastShown = true;
          svToast('Reconnecting…', 'bad', 0);
        }, 3000);
      }
      function svConnUp() {
        clearTimeout(_connDownTimer); _connDownTimer = null;
        if (_connToastShown) {
          _connToastShown = false;
          svToast('✓ Reconnected', 'ok', 2000);
        }
      }

      if (!streamerId) { setStatus('missing ?streamerId=', 'bad'); document.body.classList.add('debug'); return; }

      // Hook the socket-init block calls once `socket` exists, populated
      // by the embedGame branch below. Stays null in OBS-source mode where
      // we don't pipe TTS audio through the overlay.
      let _ttsSocketSetup = null;

      // ── Embedded game (full stream-view mode) ──────────────
      // When embedGame=1 we inject the streamer's active-game OBS overlay as
      // an iframe behind the widgets, all in the SAME document. That's what
      // lets the widgets' backdrop-filter glassmorphism actually blur the
      // game pixels (cross-iframe blur is impossible).
      if (embedGame) {
        // Force the viewport to a fixed CSS-pixel width matching the OBS
        // canvas (1080 portrait / 1920 landscape). On mobile this is the
        // equivalent of "Request desktop site" — the browser lays the page
        // out at the OBS canvas size and downscales the rendered output to
        // fit the device. Widgets, sizes, and the game embed end up in the
        // same proportional spots they occupy on desktop, instead of being
        // shrunken/squeezed by the default `width=device-width` viewport.
        const fixedVw = mode === 'landscape' ? 1920 : 1080;
        const metaVp = document.querySelector('meta[name=viewport]');
        if (metaVp) metaVp.setAttribute('content', 'width=' + fixedVw + ', initial-scale=1, user-scalable=no, viewport-fit=cover');

        const bgGame = document.createElement('iframe');
        bgGame.id = 'bg-game';
        bgGame.referrerPolicy = 'no-referrer-when-downgrade';
        bgGame.setAttribute('allow', 'autoplay; fullscreen');
        document.body.insertBefore(bgGame, document.body.firstChild);
        let currentGameUrl = null;
        const pollGameUrl = async () => {
          try {
            const r = await fetch('/api/streamer-public/' + encodeURIComponent(streamerId) + '/stream-game', { cache: 'no-store' });
            const data = await r.json();
            // Single poller: this fetch also feeds the shared handler
            // (active-game body class, per-game layouts, gameEmbed widget
            // refresh) so the widget-side poller never needs to start.
            try { applyStreamGameData(data); } catch (_) {}
            if (!data?.ok || !data.boardOverlayUrl) return;
            // Subtextle alt-mode (chip grid): append &mode=grid when the
            // streamer set the gameEmbed widget's Mode dropdown to "Grid"
            // in the dashboard. Mirrors the same logic in the gameEmbed
            // widget poller below — kept in both pollers because the
            // bg-game iframe (embedGame=1 / stream-view path) and the
            // gameEmbed widget iframe (OBS source path) use different
            // URL paths to the same backend.
            let resolvedUrl = data.boardOverlayUrl;
            try {
              const activeGame = data.gameId || null;
              if (activeGame === 'Subtextle' && currentConfig?.widgets) {
                const gw = currentConfig.widgets.find(w => w.type === 'gameEmbed');
                if (gw && gw.SubtextleMode === 'grid' && resolvedUrl) {
                  const sep = resolvedUrl.includes('?') ? '&' : '?';
                  resolvedUrl += sep + 'mode=grid';
                  // Append &rows=N if the streamer set a custom row cap.
                  // alt-main.js reads it on load → IndexGrid.setMaxRows().
                  const rawRows = gw.gridRows;
                  if (Number.isFinite(Number(rawRows))) {
                    const rows = Math.max(3, Math.min(25, Math.round(Number(rawRows))));
                    resolvedUrl += '&rows=' + rows;
                  }
                }
              }
              // Bake bg config into the URL so the iframe's first-paint
              // AnimBg mount fires. Without these params alt-main.js skips
              // its initial AnimBg.mount() and the iframe renders white.
              // No-op when currentConfig isn't ready yet; the 5s poll
              // re-attempts and updates bgGame.src on the next iteration
              // once snap has populated config.
            } catch (_) {}
            if (resolvedUrl !== currentGameUrl) {
              currentGameUrl = resolvedUrl;
              bgGame.src = currentGameUrl;
            }
          } catch (_) {/* ignore — placeholder game shown by default */}
        };
        pollGameUrl();
        setInterval(pollGameUrl, 5000);

        // Mobile/responsive scaling: wrap the game iframe + .stage in a
        // fixed-size container (the virtual OBS canvas) and CSS-scale that
        // container to fit the device viewport. We don't transform body
        // because mobile browsers inconsistently re-anchor `position:fixed`
        // descendants under a transformed body. The wrapper is `position:
        // absolute`, so widgets and bg-game inside use it as containing
        // block reliably.
        const VW = mode === 'landscape' ? 1920 : 1080;
        const VH = mode === 'landscape' ? 1080 : 1920;
        document.documentElement.style.cssText += 'overflow:hidden; background:#000; height:100%;';
        // Force desktop-style viewport sizing on mobile: 100vw/100vh always,
        // ignoring the URL-bar dynamic resize. This guarantees the canvas
        // renders at the same proportions regardless of device — what the
        // user asked for. (Previously this used 100dvh + visualViewport which
        // gave a tighter-than-desktop fit and shifted widget placement.)
        document.body.style.cssText += 'overflow:hidden; background:#000; width:100vw; height:100vh; min-height:100vh; position:fixed; top:0; left:0; margin:0;';
        const scaleRoot = document.createElement('div');
        scaleRoot.id = 'scale-root';
        scaleRoot.style.cssText = 'position:absolute; top:0; left:0; width:' + VW + 'px; height:' + VH + 'px; transform-origin:top left;';
        document.body.appendChild(scaleRoot);
        // Move bg-game + .stage into the scaled wrapper. bgGame gets z-index
        // 1 so it stacks above the bg layer; widgets get 100+ via applyOrder.
        bgGame.style.zIndex = '1';
        scaleRoot.appendChild(bgGame);
        const stageEl = document.getElementById('stage');
        if (stageEl) scaleRoot.appendChild(stageEl);
        // Animated background layer: lives in the same stage stacking
        // context as normal widgets, so widgetOrder controls whether it is
        // behind, between, or over other widgets.
        const animBgLayer = document.createElement('div');
        animBgLayer.id = 'anim-bg-layer';
        (stageEl || scaleRoot).appendChild(animBgLayer);
        // Game iframe sizing strategy:
        //   The game's overlay page may use a fixed-virtual-viewport `<meta
        //   viewport width=N>` that auto-scales width only — so giving it a
        //   1080×1920 iframe leaves vertical empty space because the natural
        //   document height at the design width doesn't match the canvas.
        //   We size the iframe to the game's NATURAL design dimensions
        //   (defaults to mobile-portrait 720×1280, can be tuned per game),
        //   then CSS-scale the iframe element to fill the scaleRoot canvas.
        //   That way the game thinks it's in its design viewport AND visually
        //   fills the whole composition.
        const GAME_NATURAL = mode === 'landscape' ? { w: 1280, h: 720 } : { w: 720, h: 1280 };
        // z-index:1 so the legacy full-canvas game sits ABOVE the anim-bg
        // layer (z-index:0) we just added. Widgets still stack above (100+).
        bgGame.style.cssText = 'position:absolute; top:0; left:0; border:0; background:transparent; z-index:1; transform-origin:top left;'
          + 'width:' + GAME_NATURAL.w + 'px; height:' + GAME_NATURAL.h + 'px;'
          + 'transform: scale(' + (VW / GAME_NATURAL.w) + ',' + (VH / GAME_NATURAL.h) + ');';
        // .stage was position:fixed inset:0 — re-anchor to wrapper.
        if (stageEl) stageEl.style.cssText = 'position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1;';

        // Fit mode for the scaled canvas:
        //   'cover'   (default) → fill the device viewport edge-to-edge; canvas
        //                         overflow clips on the longer axis.
        //   'contain' → letterbox so the entire canvas is visible.
        // Override with ?fit=contain if widgets near the edges get clipped.
        const fitMode = params.get('fit') === 'contain' ? 'contain' : 'cover';
        // Always fit to window.innerWidth/innerHeight — the same measurement
        // desktop uses. We deliberately ignore visualViewport (which would
        // shrink the canvas to exclude the mobile URL bar) so mobile renders
        // exactly like desktop: widget positions, sizes, and the game embed
        // all sit at the same proportional coordinates regardless of device.
        // Trade-off: the bottom edge of the canvas may slide under the iOS
        // URL bar, but that's the same trade-off desktop OBS makes, and the
        // user explicitly asked for parity over mobile-fit.
        function fitOverlayCanvas() {
          const vw = window.innerWidth;
          const vh = window.innerHeight || document.documentElement.clientHeight;
          // The streamer bar FLOATS over the canvas and is deliberately NOT
          // part of this math: reserving its height meant the entire stream
          // composition rescaled every time the streamer opened or closed
          // the controls — a visible jump for viewers watching the capture.
          // Stream-view (bar present, obs=0) always uses contain math so the
          // whole canvas is visible at one stable scale, centered both ways.
          // The OBS source path keeps the requested fitMode (cover default).
          const useContain = !obsSurface || fitMode === 'contain';
          const s = useContain
            ? Math.min(vw / VW, vh / VH)
            : Math.max(vw / VW, vh / VH);
          const offsetX = (vw - VW * s) / 2;
          const offsetY = useContain ? (vh - VH * s) / 2 : 0;
          scaleRoot.style.transform = 'translate(' + offsetX + 'px,' + offsetY + 'px) scale(' + s + ')';
        }
        window.addEventListener('resize', fitOverlayCanvas);
        window.addEventListener('orientationchange', () => setTimeout(fitOverlayCanvas, 100));
        // Re-fit after layout settles + after any late-loading fonts.
        fitOverlayCanvas();
        requestAnimationFrame(fitOverlayCanvas);
        setTimeout(fitOverlayCanvas, 300);

        // ── Streamer controls bar ──────────────────────────────
        // Streamer controls across the bottom of the device viewport:
        //   Game      — mute/unmute embedded game audio (postMessage opt-in)
        //   TTS       — mute/unmute overlay TTS playback
        //   ✎ Edit    — toggle body.edit so widgets become draggable live
        //   ⌨ Input   — open inline text field that POSTs to /api/streamer/
        //                inject-chat (routed to the streamer's active game
        //                through the normal chat pipeline)
        document.body.classList.add('has-streamer-bar');
        const bar = document.createElement('div');
        bar.id = 'streamer-bar';
        // Collapsed by default — the streamer taps ▴ to reveal the controls,
        // so the game gets the full viewport on a fresh load.
        bar.classList.add('controls-hidden');
        bar.innerHTML = `
          <div id="streamer-bar-input">
            <input type="text" id="sb-input-field" maxlength="200" placeholder="Type a guess to send…" autocomplete="off" autocapitalize="off" spellcheck="false">
            <button type="button" id="sb-input-send">Send</button>
          </div>
          <div id="streamer-bar-buttons">
            <button type="button" class="sb-btn" id="sb-game-audio" aria-pressed="false" title="Mute or unmute game audio">
              <span class="sb-emoji" id="sb-game-audio-emoji">🎮</span><span id="sb-game-audio-label">Game</span>
            </button>
            <button type="button" class="sb-btn" id="sb-tts-audio" aria-pressed="false" title="Mute or unmute TTS">
              <span class="sb-emoji" id="sb-tts-audio-emoji">🔊</span><span id="sb-tts-audio-label">TTS</span>
            </button>
            <button type="button" class="sb-btn" id="sb-tts-skip" title="Skip the current TTS clip">
              <span class="sb-emoji">⏭</span><span>Skip</span><span class="sb-badge" id="sb-tts-skip-badge"></span>
            </button>
            <button type="button" class="sb-btn" id="sb-edit" aria-pressed="false" title="Move widgets in real time">
              <span class="sb-emoji">✎</span><span>Edit</span>
            </button>
            <button type="button" class="sb-btn" id="sb-input-toggle" aria-pressed="false" title="Send a guess to your game">
              <span class="sb-emoji">⌨</span><span>Input</span>
            </button>
            <button type="button" class="sb-btn" id="sb-flip-cam" aria-pressed="false" title="Switch between front and back camera">
              <span class="sb-emoji">🔄</span><span>Flip</span>
            </button>
          </div>
          <button type="button" id="sb-collapse" aria-pressed="true" title="Show controls"><span id="sb-collapse-glyph">▴</span></button>`;
        document.body.appendChild(bar);
        // (No re-fit needed here — the bar floats over the canvas and no
        // longer participates in fitOverlayCanvas math.)

        // ── Screen wake lock ───────────────────────────────────
        // The phone screen IS the capture surface: if it sleeps mid-stream
        // the stream dies. The dashboard page already holds a wake lock;
        // the stream-view page never did. Re-acquire whenever the page
        // becomes visible again (browsers auto-release on background).
        let _wakeLock = null;
        async function acquireWakeLock() {
          if (obsSurface) return;
          if (!('wakeLock' in navigator)) return;
          try {
            _wakeLock = await navigator.wakeLock.request('screen');
            _wakeLock.addEventListener('release', () => { _wakeLock = null; });
          } catch (_) { /* denied (e.g. low battery) — retried on next gesture */ }
        }
        acquireWakeLock();
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible' && !_wakeLock) acquireWakeLock();
        });
        // Some browsers require a user gesture for the first request.
        window.addEventListener('pointerdown', () => { if (!_wakeLock) acquireWakeLock(); }, { once: true });

        // ── 1. Game + TTS audio toggles ───────────────────────
        const readAudioToggle = (key, fallback) => {
          try {
            const v = localStorage.getItem(key);
            return v == null ? fallback : v === '1';
          } catch (_) { return fallback; }
        };
        const legacyMuted = readAudioToggle('sv-muted', false);
        let gameMuted = readAudioToggle('sv-game-muted', legacyMuted);
        let ttsMuted = readAudioToggle('sv-tts-muted', legacyMuted);
        const ttsQueue = [];
        let ttsPlaying = false;
        let ttsUnlocked = false;
        let ttsButtonUnlockAt = 0;
        let ttsServerEnabled = null;
        let ttsSettingsError = false;
        // Skip support: token guards drainTts's finish() so a stale onend
        // from a skipped/cancelled clip can't clobber the next clip's state.
        let _ttsPlayToken = 0;
        let _ttsSkipCurrent = null;

        // Show the Skip button only while a clip is playing; badge = queue depth.
        function updateTtsSkipBtn() {
          const btn = document.getElementById('sb-tts-skip');
          if (!btn) return;
          btn.classList.toggle('show', ttsPlaying);
          const badge = document.getElementById('sb-tts-skip-badge');
          if (badge) {
            const n = ttsQueue.length;
            badge.textContent = n > 0 ? String(n) : '';
            badge.classList.toggle('show', n > 0);
          }
        }

        // We can't directly mute a cross-origin iframe, so we use two
        // mechanisms: (a) postMessage the game iframe so opt-in games can
        // stop their own audio; (b) toggle the
        // <iframe muted> attribute as a hint (most browsers ignore on cross-
        // origin but it's harmless).
        function applyGameMute() {
          const btn = document.getElementById('sb-game-audio');
          const emoji = document.getElementById('sb-game-audio-emoji');
          const label = document.getElementById('sb-game-audio-label');
          btn.classList.toggle('active', gameMuted);
          btn.setAttribute('aria-pressed', String(gameMuted));
          emoji.textContent = gameMuted ? '🔇' : '🎮';
          label.textContent = gameMuted ? 'Game muted' : 'Game';
          // Postmessage to all game iframes (gameEmbed widgets + legacy
          // bgGame if still present). Keep the legacy event name so any
          // opt-in game listener continues to work.
          const targets = [];
          const bg = document.getElementById('bg-game'); if (bg) targets.push(bg);
          document.querySelectorAll('.game-iframe').forEach(f => targets.push(f));
          for (const f of targets) {
            try { f.contentWindow?.postMessage({ type: 'streamer-mute', muted: gameMuted, channel: 'game' }, '*'); } catch (_) {}
            try { f.contentWindow?.postMessage({ type: 'streamer-game-mute', muted: gameMuted }, '*'); } catch (_) {}
            try { f.muted = gameMuted; } catch (_) {}
          }
        }

        function applyTtsMute() {
          const btn = document.getElementById('sb-tts-audio');
          const emoji = document.getElementById('sb-tts-audio-emoji');
          const label = document.getElementById('sb-tts-audio-label');
          const serverOff = ttsServerEnabled === false;
          const serverOn = ttsServerEnabled === true;
          const needsAction = serverOn && !ttsMuted && !ttsUnlocked;
          const ready = serverOn && !ttsMuted && ttsUnlocked;
          btn.classList.toggle('active', serverOn && ttsMuted);
          btn.classList.toggle('ready', ready);
          btn.classList.toggle('needs-action', needsAction);
          btn.disabled = serverOff;
          btn.setAttribute('aria-disabled', String(serverOff));
          btn.setAttribute('aria-pressed', String(ready));
          if (serverOff) {
            emoji.textContent = '🔇';
            label.textContent = 'TTS off';
            btn.title = 'TTS is disabled in the streamer dashboard';
          } else if (ttsSettingsError && ttsServerEnabled == null) {
            emoji.textContent = '!';
            label.textContent = 'TTS status?';
            btn.title = 'Could not confirm TTS settings yet';
          } else if (ttsServerEnabled == null) {
            emoji.textContent = '…';
            label.textContent = 'TTS...';
            btn.title = 'Checking TTS settings';
          } else if (ttsMuted) {
            emoji.textContent = '🔇';
            label.textContent = 'TTS muted';
            btn.title = 'Unmute TTS';
          } else if (!ttsUnlocked) {
            emoji.textContent = '🔈';
            label.textContent = 'Tap TTS';
            btn.title = 'Tap to unlock TTS audio';
          } else {
            emoji.textContent = '🔊';
            label.textContent = 'TTS on';
            btn.title = 'Mute TTS';
          }
          if (serverOff || ttsMuted) {
            const a = document.getElementById('overlay-tts-audio');
            if (a) { try { a.onended = null; a.onerror = null; a.pause(); a.currentTime = 0; } catch (_) {} }
            try { window.speechSynthesis?.cancel(); } catch (_) {}
            if (Array.isArray(ttsQueue)) ttsQueue.length = 0;
            // pause() never fires onended, so without this a mute during an
            // mp3 clip left ttsPlaying stuck true — TTS dead until reload.
            if (typeof _ttsSkipCurrent === 'function') _ttsSkipCurrent();
          }
          updateTtsSkipBtn();
        }

        async function refreshTtsSettings() {
          const wasEnabled = ttsServerEnabled === true;
          try {
            const r = await fetch('/api/streamer-public/' + encodeURIComponent(streamerId) + '/tts-settings', { cache: 'no-store' });
            const data = await r.json().catch(() => ({}));
            if (!r.ok || !data?.ok) throw new Error(data?.error || ('HTTP ' + r.status));
            ttsSettingsError = false;
            ttsServerEnabled = !!data.enabled;
          } catch (err) {
            ttsSettingsError = true;
            console.warn('[overlay-tts] settings check failed:', err?.message || err);
          }
          applyTtsMute();
          if (ttsServerEnabled === true && !wasEnabled) drainTts();
        }

        document.getElementById('sb-game-audio').addEventListener('click', () => {
          gameMuted = !gameMuted;
          try { localStorage.setItem('sv-game-muted', gameMuted ? '1' : '0'); } catch (_) {}
          applyGameMute();
        });
        document.getElementById('sb-tts-audio').addEventListener('click', () => {
          if (ttsServerEnabled !== true) return;
          if (!ttsMuted && ttsButtonUnlockAt && (Date.now() - ttsButtonUnlockAt) < 700) {
            applyTtsMute();
            return;
          }
          if (!ttsUnlocked && !ttsMuted) {
            unlockTts();
            applyTtsMute();
            return;
          }
          ttsMuted = !ttsMuted;
          try { localStorage.setItem('sv-tts-muted', ttsMuted ? '1' : '0'); } catch (_) {}
          applyTtsMute();
          if (!ttsMuted) unlockTts();
        });
        document.getElementById('sb-tts-skip').addEventListener('click', () => {
          if (!ttsPlaying) return;
          // Detach the element handlers BEFORE pausing so the pause can't
          // race a spurious onerror into finish(); speechSynthesis.cancel()
          // may still fire the utterance's onend, which the token guard in
          // finish() ignores once the next clip starts.
          try { ttsAudio.onended = null; ttsAudio.onerror = null; ttsAudio.pause(); } catch (_) {}
          try { window.speechSynthesis?.cancel(); } catch (_) {}
          if (typeof _ttsSkipCurrent === 'function') _ttsSkipCurrent();
        });
        applyGameMute();
        applyTtsMute();
        refreshTtsSettings();
        setInterval(refreshTtsSettings, 10000);
        // Re-broadcast mute state when a new game iframe appears (gameEmbed
        // renders asynchronously after the snapshot arrives).
        const muteRebroadcast = setInterval(() => { if (gameMuted) applyGameMute(); }, 2000);
        // (Interval stays — overlay page lives for the whole stream.)

        // ── 2. Edit toggle ─────────────────────────────────────
        // Toggles body.edit so all widgets are always-visible + draggable.
        // We call applySnapshot(lastSnap) to force a re-render so widgets
        // that were hidden (e.g. milestone bursts that haven't fired) appear.
        document.getElementById('sb-edit').addEventListener('click', () => {
          const on = !document.body.classList.contains('edit');
          document.body.classList.toggle('edit', on);
          document.getElementById('sb-edit').classList.toggle('active', on);
          document.getElementById('sb-edit').setAttribute('aria-pressed', String(on));
          if (lastSnap) applySnapshot(lastSnap);
        });

        // ── Camera flip (front/back) ───────────────────────────
        // Flips the shared camera stream between the user-facing and
        // environment cameras. Sets _cameraFacingOverride (which wins over
        // the widget config in syncCameraRuntime) and forces a stream restart.
        const flipCamBtn = document.getElementById('sb-flip-cam');
        flipCamBtn.addEventListener('click', () => {
          const ctrl = getCameraControllerWidget();
          const current = _cameraFacingOverride
            || ((ctrl && ctrl.cameraFacing === 'environment') ? 'environment' : 'user');
          _cameraFacingOverride = current === 'environment' ? 'user' : 'environment';
          const isBack = _cameraFacingOverride === 'environment';
          flipCamBtn.classList.toggle('active', isBack);
          flipCamBtn.setAttribute('aria-pressed', String(isBack));
          syncCameraRuntime({ forceRestart: true, userGesture: true });
        });

        // ── Collapse (hide all controls) ───────────────────────
        // Hides the button row for a clean stream, leaving only this small
        // toggle visible. The bar floats over a fixed-scale canvas, so
        // collapsing/expanding no longer re-fits anything.
        const collapseBtn = document.getElementById('sb-collapse');
        const collapseGlyph = document.getElementById('sb-collapse-glyph');
        let _barIdleTimer = null;
        function setBarCollapsed(hidden) {
          bar.classList.toggle('controls-hidden', hidden);
          collapseBtn.setAttribute('aria-pressed', String(hidden));
          collapseBtn.title = hidden ? 'Show controls' : 'Hide controls';
          collapseGlyph.textContent = hidden ? '▴' : '▾';
          if (hidden) { setInputOpen(false); clearTimeout(_barIdleTimer); }
          else armBarIdleCollapse();
        }
        // Auto-collapse: the open bar overlays the capture, so leaving it
        // up leaks buttons onto the stream. Fold it away after 10s idle —
        // unless the streamer is mid-edit or typing a guess.
        function armBarIdleCollapse() {
          clearTimeout(_barIdleTimer);
          if (bar.classList.contains('controls-hidden')) return;
          _barIdleTimer = setTimeout(() => {
            if (document.body.classList.contains('edit')
              || document.activeElement === document.getElementById('sb-input-field')) {
              armBarIdleCollapse();
              return;
            }
            setBarCollapsed(true);
          }, 10000);
        }
        collapseBtn.addEventListener('click', () => setBarCollapsed(!bar.classList.contains('controls-hidden')));
        // Any interaction with the open bar resets the idle countdown.
        bar.addEventListener('pointerdown', () => {
          if (!bar.classList.contains('controls-hidden')) armBarIdleCollapse();
        });

        // ── 3. Input (send a guess) ────────────────────────────
        const inputPane = document.getElementById('streamer-bar-input');
        const inputField = document.getElementById('sb-input-field');
        const inputBtn = document.getElementById('sb-input-toggle');
        const sendBtn = document.getElementById('sb-input-send');
        function setInputOpen(open) {
          inputPane.classList.toggle('show', open);
          inputBtn.classList.toggle('active', open);
          inputBtn.setAttribute('aria-pressed', String(open));
          if (open) setTimeout(() => inputField.focus(), 50);
        }
        inputBtn.addEventListener('click', () => setInputOpen(!inputPane.classList.contains('show')));
        async function sendInput() {
          const text = inputField.value.trim();
          if (!text) return;
          sendBtn.disabled = true;
          try {
            const r = await fetch('/api/streamer/inject-chat', {
              method: 'POST', credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text }),
            });
            const data = await r.json();
            if (!r.ok || !data.ok) {
              setStatus('Send failed: ' + (data.error || ('HTTP ' + r.status)), 'bad');
              svToast('Send failed: ' + (data.error || ('HTTP ' + r.status)), 'bad', 3500);
            } else {
              inputField.value = '';
              // Clear confirmation: green flash on the field + button label.
              sendBtn.style.background = '#43d17c';
              sendBtn.textContent = 'Sent ✓';
              inputField.classList.add('sent-ok');
              setTimeout(() => {
                sendBtn.style.background = '';
                sendBtn.textContent = 'Send';
                inputField.classList.remove('sent-ok');
              }, 900);
            }
          } catch (e) {
            setStatus('Send failed: ' + (e.message || e), 'bad');
            svToast('Send failed: ' + (e.message || e), 'bad', 3500);
          } finally {
            sendBtn.disabled = false;
          }
        }
        sendBtn.addEventListener('click', sendInput);
        inputField.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); sendInput(); }
          if (e.key === 'Escape') setInputOpen(false);
        });

        // ── TTS playback ───────────────────────────────────────
        // Subscribe to the streamer's TTS room and play any tts-play events
        // through an <audio> element on this same page (so TTS comes out of
        // the device speakers alongside the game audio). Honors the TTS
        // button — when muted, queued TTS clips are dropped on the floor
        // rather than queued, so toggling back doesn't dump a backlog.
        // Browser autoplay rules require a user gesture before audio can
        // play, so we wait for the first tap on the page to unlock the
        // audio context.
        const ttsAudio = document.createElement('audio');
        ttsAudio.id = 'overlay-tts-audio';
        ttsAudio.preload = 'auto';
        ttsAudio.style.display = 'none';
        document.body.appendChild(ttsAudio);

        // WebAudio chain for the mp3 path so per-voice `gain` (carried on
        // every tts-play payload, sourced from the admin voice-volumes
        // page) can boost above the <audio> element's 1.0 ceiling.
        let _ttsAudioCtx = null;
        let _ttsAudioSrc = null;
        let _ttsAudioGain = null;
        function ensureTtsAudioGraph() {
          if (_ttsAudioCtx) return;
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            _ttsAudioCtx = new AC();
            _ttsAudioSrc = _ttsAudioCtx.createMediaElementSource(ttsAudio);
            _ttsAudioGain = _ttsAudioCtx.createGain();
            _ttsAudioSrc.connect(_ttsAudioGain).connect(_ttsAudioCtx.destination);
          } catch (_) { /* falls back to ttsAudio.volume */ }
        }
        // Pre-load voices for speechSynthesis fallback. Some browsers
        // populate the voice list asynchronously, so the very first
        // utterance may get the wrong voice — keep the cache fresh.
        if ('speechSynthesis' in window) {
          try {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
          } catch (_) {}
        }
        // Picks a SpeechSynthesisVoice that roughly matches a 'web:xx-yy'
        // key based on language + gender hints in the OS voice's name.
        // Same logic as the dashboard's findWebVoice — duplicated here so
        // the overlay doesn't need to import dashboard JS.
        const FEM_HINTS = /\b(female|aria|sonia|samantha|allison|kate|moira|tessa|fiona|karen|catherine|susan|zira|hazel|emily|emma|joanna|salli|libby|natasha|olivia|sophia|jenny|martha|kelly|amy|cora|nova|ada|elizabeth)\b/i;
        const MAL_HINTS = /\b(male|david|davis|eric|guy|daniel|alex|fred|jorge|tom|james|mark|brian|ryan|paul|liam|matthew|aaron|ethan|kevin|john|justin|joey|christopher|william|tony|ravi|prabhat|noah|alvaro|enrique|jorge|carlos)\b/i;
        const LANG_MAP = { us: 'en-US', uk: 'en-GB', au: 'en-AU', ca: 'en-CA', cn: 'zh', es: 'es', in: 'en-IN' };
        function findWebVoice(key) {
          if (!('speechSynthesis' in window)) return null;
          const m = /^web:([a-z]+)-(female|male)$/.exec(String(key || ''));
          if (!m) return null;
          const region = m[1], wantGender = m[2];
          const lang = (LANG_MAP[region] || 'en').toLowerCase();
          const all = window.speechSynthesis.getVoices();
          const norm = (s) => String(s || '').toLowerCase().replace('_', '-');
          let sameLang = all.filter(v => norm(v.lang).startsWith(lang));
          if (!sameLang.length) {
            const base = lang.split('-')[0];
            sameLang = all.filter(v => norm(v.lang).startsWith(base));
          }
          const matchesGender = (v) => wantGender === 'female' ? FEM_HINTS.test(v.name) : MAL_HINTS.test(v.name);
          const matchesOther  = (v) => wantGender === 'female' ? MAL_HINTS.test(v.name) : FEM_HINTS.test(v.name);
          let target = sameLang.find(matchesGender);
          if (!target) target = sameLang.find(v => !matchesOther(v));
          if (!target) target = wantGender === 'female' ? sameLang[0] : (sameLang[1] || sameLang[0]);
          return target || all[0] || null;
        }
        function drainTts() {
          if (ttsPlaying) return;
          if (ttsServerEnabled === false) { ttsQueue.length = 0; return; }
          if (ttsServerEnabled !== true) return;
          if (ttsMuted) { ttsQueue.length = 0; return; }
          if (!ttsUnlocked) return;
          const item = ttsQueue.shift();
          if (!item) { updateTtsSkipBtn(); return; }
          ttsPlaying = true;
          const myToken = ++_ttsPlayToken;
          const finish = () => {
            // Stale callback from a clip that was already skipped/replaced.
            if (myToken !== _ttsPlayToken) return;
            ttsPlaying = false;
            _ttsSkipCurrent = null;
            updateTtsSkipBtn();
            setTimeout(drainTts, 150);
          };
          _ttsSkipCurrent = finish;
          updateTtsSkipBtn();
          // Per-voice gain multiplier (0–2.0 typical) from the admin
          // voice-volumes page. Default 1.0 if the payload didn't carry one.
          const rawGain = Number(item.gain);
          let gain = Number.isFinite(rawGain) && rawGain >= 0 ? rawGain : 1;
          // Server-stream surface: the admin gains (~0.3–0.45) were tuned for
          // phone playback where TTS had no music bed under it. On the OBS
          // renderer TTS shares the mix with music + game audio and drowns.
          // Boost ~2.2× but hard-cap at 1.0 — clips peak near 0 dBFS, so any
          // gain >1 through the WebAudio graph is guaranteed digital clipping.
          if (obsSurface) gain = Math.min(gain * 2.2, 1.0);
          // mp3Url path → ElevenLabs MP3 through <audio> element. Use the
          // WebAudio GainNode when available so values >1 actually boost;
          // fall back to <audio>.volume (capped at 1) if not.
          if (item.mp3Url) {
            ttsAudio.src = item.mp3Url;
            if (_ttsAudioGain) {
              _ttsAudioGain.gain.value = gain;
              ttsAudio.volume = 1;
            } else {
              ttsAudio.volume = Math.max(0, Math.min(1, gain));
            }
            ttsAudio.onended = finish;
            ttsAudio.onerror = finish;
            ttsAudio.play().catch((err) => { console.warn('[overlay-tts] play err:', err?.message || err); finish(); });
            return;
          }
          // speechSynthesis path → free web voice (e.g. web:us-male).
          // SpeechSynthesisUtterance.volume is hard-capped at 1.0, so
          // boosts can't be applied to web voices — clamp.
          if (item.text && 'speechSynthesis' in window) {
            try {
              const u = new SpeechSynthesisUtterance(String(item.text));
              u.volume = Math.max(0, Math.min(1, gain));
              if (item.voiceKey) {
                const v = findWebVoice(item.voiceKey);
                if (v) u.voice = v;
                if (v?.lang) u.lang = v.lang;
              }
              u.onend = finish;
              u.onerror = finish;
              window.speechSynthesis.speak(u);
              return;
            } catch (_) { /* fall through to skip */ }
          }
          // Neither path works — skip this item and try the next.
          finish();
        }

        // Unlock on first user gesture (tap or click anywhere on the page).
        function unlockTts(ev) {
          try {
            if (ev?.target?.closest?.('#sb-tts-audio')) ttsButtonUnlockAt = Date.now();
          } catch (_) {}
          if (ttsUnlocked) return;
          ttsUnlocked = true;
          // Build the WebAudio chain now — AudioContext construction is
          // gated on a user gesture in most browsers.
          ensureTtsAudioGraph();
          if (_ttsAudioCtx && _ttsAudioCtx.state === 'suspended') {
            try { _ttsAudioCtx.resume(); } catch (_) {}
          }
          // Prime the audio element with a silent play so subsequent .play()
          // calls work without further gesture.
          try { ttsAudio.play().catch(() => {}); ttsAudio.pause(); } catch (_) {}
          // Also warm up speechSynthesis with a silent utterance during the
          // gesture so later speak() calls don't get blocked by autoplay rules.
          if ('speechSynthesis' in window) {
            try {
              const warm = new SpeechSynthesisUtterance(' ');
              warm.volume = 0;
              window.speechSynthesis.speak(warm);
            } catch (_) {}
          }
          applyTtsMute();
          drainTts();
        }
        window.addEventListener('pointerdown', unlockTts, { once: true });
        window.addEventListener('touchstart', unlockTts, { once: true });
        // Headless OBS surface (server-side stream renderer): no human ever
        // taps the page, and OBS's CEF permits autoplay without a gesture —
        // unlock immediately or TTS clips queue up and get dropped forever.
        if (obsSurface) setTimeout(unlockTts, 0);

        // Socket isn't created until further down in this IIFE; expose a
        // callback the socket-creation block will invoke once the socket
        // exists. Server emits tts-play into voice-tts:<streamerId> for
        // every chat message that passes the TTS pipeline filters.
        _ttsSocketSetup = (sock) => {
          // The dashboard mounts THIS page in its live-preview iframe with
          // `preview=1&embedGame=1` (index.html mountGoalsPreview). Because the
          // TTS block is gated on embedGame alone, that preview joined the real
          // TTS room and played real viewer audio — a second live client
          // alongside the OBS stream overlay, so every clip was heard twice
          // whenever the dashboard was open. The preview is layout-only: never
          // wire it to the audio pipeline.
          if (previewMode) return;
          const joinTts = () => sock.emit('voice-tts-join-public', streamerId);
          if (sock.connected) joinTts(); else sock.on('connect', joinTts);
          sock.on('tts-play', (payload) => {
            if (!payload) return;
            // Accept any payload with an mp3Url (ElevenLabs) OR text +
            // speechSynthesis available (web voice). drainTts decides
            // which playback path to use.
            if (!payload.mp3Url && !(payload.text && 'speechSynthesis' in window)) return;
            // Cap the queue so a flood doesn't back up forever.
            ttsQueue.push(payload);
            if (ttsQueue.length > 8) ttsQueue.shift();
            updateTtsSkipBtn();
            drainTts();
          });
        };
      }

      // ── Layout / anchor helpers ────────────────────────────
      const ANCHOR_OFFSETS = {
        'top-left':[0,0], 'top-center':[-50,0], 'top-right':[-100,0],
        'center-left':[0,-50], 'center':[-50,-50], 'center-right':[-100,-50],
        'bottom-left':[0,-100], 'bottom-center':[-50,-100], 'bottom-right':[-100,-100],
      };
      function validColor(c) { return ['cyan','pink','gold','green','red','purple'].includes(c); }
      function validStyle(s) { return ['glass','solid','outlined','banner'].includes(s); }
      function validPadding(p) { return ['compact','regular','spacious'].includes(p); }

      // ── Per-instance DOM cache ─────────────────────────────
      // widgetMap[id] = { el, type, contentEl, lastConfig, milestoneTimer?, winCardTimer? }
      const widgetMap = new Map();
      let currentConfig = null;
      let currentState = null;
      let currentHandle = null;
      let currentActiveGameId = null;   // populated by _ensureGameUrlPoller
      let lastSnap = null;
      let socket = null;
      let trimPreviewWidgetId = null;

      // Server-supplied per-game default positions (same for every streamer).
      // Populated from the snapshot's defaultGameLayouts field; used as a
      // mid-tier fallback so streamers who haven't customized still get
      // game-tuned positions.
      let defaultGameLayouts = {};

      function resolveWidgetById(widgetOrId) {
        if (!currentConfig?.widgets) return null;
        if (widgetOrId && typeof widgetOrId === 'object') return widgetOrId;
        return currentConfig.widgets.find(w => w && w.id === widgetOrId) || null;
      }

      function resolveWidgetGameContext(widgetOrId) {
        const widget = resolveWidgetById(widgetOrId);
        const explicit = String(widget?.type === 'gameEmbed' ? (widget.displayGame || '') : '').trim().toLowerCase();
        if (/^[a-z0-9_-]{1,32}$/.test(explicit)) return explicit;
        return currentActiveGameId || null;
      }

      // Per-game POSITION/SIZE overrides belong to the game widget alone — it's
      // the only widget whose framing legitimately differs per title, and the
      // dashboard only ever exposes per-game sliders for it. Every other widget
      // resolves from the single universal layout, otherwise dragging one while
      // a game happened to be active would silently pin it to that game and it
      // would jump the moment the game changed.
      // NB: deliberately NOT folded into resolveWidgetGameContext — that one
      // also drives the game embed's iframe URL and several runtime lookups.
      function resolveWidgetLayoutGameContext(widgetOrId) {
        const widget = resolveWidgetById(widgetOrId);
        if (widget?.type !== 'gameEmbed') return null;
        return resolveWidgetGameContext(widget);
      }

      function normalizeWinCardGameId(rawGameId) {
        const gameId = String(rawGameId || '').trim().toLowerCase();
        if (!/^[a-z0-9_-]{1,32}$/.test(gameId)) return '';
        if (gameId === 'sproutle') return 'erecTangled';
        // Grid mode is only a Subtextle render variant; wins still emit as
        // plain `Subtextle`, so treat both ids as the same filter target.
        if (gameId === 'subtextle-grid') return 'Subtextle';
        // WikiWord 4×4 is a compact mode of WikiWord; wins for either should
        // match a WikiWord-filtered win card (and vice versa).
        if (gameId === 'wikiword-4x4') return 'wikiword';
        return gameId;
      }

      function resolveWinCardFilterGameId(widgetOrId) {
        const widget = resolveWidgetById(widgetOrId);
        if (widget?.type !== 'winCard') return '';
        return normalizeWinCardGameId(widget.displayGame || '');
      }

      function resolveWinEventGameId(data) {
        return normalizeWinCardGameId(data?.game || data?.gameId || '');
      }

      // Win-card game filter equivalence. WikiWord 4×4 lives on wikirectangled.com
      // but is a WikiWord mode, so wins should match filters for any of those ids.
      function winCardGameEquivalents(gameId) {
        if (!gameId) return new Set();
        const id = String(gameId).toLowerCase();
        if (id === 'wikiword' || id === 'wikirectangled' || id === 'wikiword-4x4') {
          return new Set(['wikiword', 'wikirectangled', 'wikiword-4x4']);
        }
        return new Set([id]);
      }

      function winCardMatchesGame(widgetOrId, data) {
        const filterGameId = resolveWinCardFilterGameId(widgetOrId);
        if (!filterGameId) return true;
        const eventGameId = resolveWinEventGameId(data);
        if (!eventGameId) return false;
        const filterSet = winCardGameEquivalents(filterGameId);
        const eventSet = winCardGameEquivalents(eventGameId);
        for (const id of filterSet) if (eventSet.has(id)) return true;
        return false;
      }

      // Server per-game defaults are keyed by the FACTORY widget ids
      // ('gameEmbed-default', 'winCard-default'). A streamer who deleted and
      // re-added their game widget carries a random id ('gameEmbed-77ea7055'),
      // which would never match — so fall back to the factory id for the
      // widget's type. Without this the whole defaultGameLayouts fallback is
      // dead for anyone who rebuilt their setup.
      function defaultGameEntry(gameId, widget, widgetId) {
        const byMode = gameId ? defaultGameLayouts[gameId]?.[mode] : null;
        if (!byMode) return null;
        return byMode[widgetId]
          || (widget?.type ? byMode[widget.type + '-default'] : null)
          || null;
      }

      // Resolve a widget's effective position. Precedence:
      //   1. streamer's own gameLayouts[activeGame][mode][widgetId]
      //   2. server's defaultGameLayouts[activeGame][mode][widgetId or type]
      //   3. streamer's universal layout[mode][widgetId]
      //   4. null (caller leaves the widget at its prior position)
      function resolveWidgetPos(widgetOrId) {
        if (!currentConfig) return null;
        const widget = resolveWidgetById(widgetOrId);
        const widgetId = widget?.id || widgetOrId;
        const gameId = resolveWidgetLayoutGameContext(widget);
        const g = currentConfig.gameLayouts;
        if (g && gameId && g[gameId]?.[mode]?.[widgetId]) {
          return g[gameId][mode][widgetId];
        }
        const def = defaultGameEntry(gameId, widget, widgetId);
        if (def) return def;
        return currentConfig.layout?.[mode]?.[widgetId] || null;
      }

      // Resolve a gameEmbed widget's per-game size override (widthPct /
      // heightPct). Same precedence as position. Returns {widthPct,heightPct}
      // when either field is set, else null so the caller falls back to the
      // widget's universal w.widthPct / w.heightPct.
      function resolveWidgetSize(widgetOrId) {
        if (!currentConfig) return null;
        const widget = resolveWidgetById(widgetOrId);
        const widgetId = widget?.id || widgetOrId;
        const gameId = resolveWidgetLayoutGameContext(widget);
        const tryEntry = (e) => (e && (Number.isFinite(e.widthPct) || Number.isFinite(e.heightPct))) ? e : null;
        const g = currentConfig.gameLayouts;
        if (g && gameId && g[gameId]?.[mode]?.[widgetId]) {
          const hit = tryEntry(g[gameId][mode][widgetId]);
          if (hit) return hit;
        }
        const defHit = tryEntry(defaultGameEntry(gameId, widget, widgetId));
        if (defHit) return defHit;
        return null;
      }

      // Same fallback chain as resolveWidgetSize but for the `scale` field
      // (widget-level transform/zoom). Returns the per-game override when
      // set, else null so the caller falls back to w.scale.
      function resolveWidgetScale(widgetOrId) {
        if (!currentConfig) return null;
        const widget = resolveWidgetById(widgetOrId);
        const widgetId = widget?.id || widgetOrId;
        const gameId = resolveWidgetLayoutGameContext(widget);
        const g = currentConfig.gameLayouts;
        const userEntry = g && gameId && g[gameId]?.[mode]?.[widgetId];
        if (userEntry && Number.isFinite(userEntry.scale)) return userEntry.scale;
        const defEntry = defaultGameEntry(gameId, widget, widgetId);
        if (defEntry && Number.isFinite(defEntry.scale)) return defEntry.scale;
        return null;
      }

      function ensureWidget(w) {
        let entry = widgetMap.get(w.id);
        if (entry) return entry;
        const el = document.createElement('div');
        let extraClass =
          w.type === 'gameEmbed' ? ' has-game'
          : ((w.type === 'cameraEmbed' || w.type === 'phoneCam') ? ' has-camera'
            : (w.type === 'fanClubAd' ? ' has-fan-club-ad'
              : (w.type === 'campaignGift' ? ' has-campaign-gift'
                : (w.type === 'adBanner' ? ' has-ad-banner'
                  : (w.type === 'junkDrawer' ? ' has-junk-drawer'
                    : (w.type === 'musicCredits' ? ' has-music-credits' : ''))))));
        if (w.type === 'spotifyDJ') extraClass = ' has-spotify-dj';
        el.className = 'widget' + extraClass;
        el.id = 'w-' + w.id;
        const tag = document.createElement('span');
        tag.className = 'widget-tag';
        tag.textContent = w.name || w.type;
        el.appendChild(tag);
        const content = document.createElement('div');
        content.className = 'widget-content';
        el.appendChild(content);
        stage.appendChild(el);
        entry = {
          el,
          type: w.type,
          contentEl: content,
          lastConfig: null,
          lastLayoutSig: null,
          lastCommonStyleSig: null,
          lastCommonStyleRoot: null,
          lastGameEmbedSig: null,
          lastGameEmbedRoot: null,
          gameIframe: null,
          topLikersJoined: false,
        };
        widgetMap.set(w.id, entry);
        bindDragHandlers(w.id, el);
        return entry;
      }

      function pruneWidgets(activeIds) {
        for (const [id, entry] of widgetMap.entries()) {
          if (!activeIds.has(id)) {
            if (entry.type === 'gameEmbed') destroyGameEmbedIframe(entry);
            if (entry.type === 'adBanner') destroyAdBannerIframe(entry);
            if (entry.type === 'junkDrawer') destroyJunkDrawerIframe(entry);
            if (entry.type === 'musicCredits') destroyMusicCreditsIframe(entry);
            if (entry.type === 'spotifyDJ') destroySpotifyDJIframe(entry);
            if (entry.type === 'desktopStream' && entry.desktopStreamIframe) {
              try { entry.desktopStreamIframe.src = 'about:blank'; } catch (_) {}
              entry.desktopStreamIframe = null;
            }
            if ((entry.type === 'cameraEmbed' || entry.type === 'phoneCam') && entry.cameraVideo) {
              stopCameraKeyRenderer(entry);
              try { entry.cameraVideo.srcObject = null; } catch (_) {}
            }
            // Last Phone Cam widget removed → tear the WHEP session down so we
            // stop pulling (and decoding) a feed nothing is showing.
            if (entry.type === 'phoneCam') {
              _phoneStatus = 'idle';
              stopPhoneCamStream();
            }
            if (entry.fanClubAdTimer) {
              clearTimeout(entry.fanClubAdTimer);
              entry.fanClubAdTimer = null;
            }
            if (entry.campaignGiftTimer) {
              clearTimeout(entry.campaignGiftTimer);
              entry.campaignGiftTimer = null;
            }
            if (entry._cgBurstTimers) {
              for (const k of Object.keys(entry._cgBurstTimers)) clearTimeout(entry._cgBurstTimers[k]);
              entry._cgBurstTimers = null;
            }
            entry.el.remove();
            widgetMap.delete(id);
          }
        }
      }

      function isWidgetVisible(w) {
        if (
          previewMode
          && trimPreviewWidgetId
          && Array.isArray(currentConfig?.widgets)
          && currentConfig.widgets.some(x => x && x.id === trimPreviewWidgetId)
        ) {
          return w.id === trimPreviewWidgetId;
        }
        return !!(w && (w.enabled || isAlwaysShow()));
      }

      function normalizeWidgetTrim(raw) {
        const src = raw && typeof raw === 'object' ? raw : {};
        const side = (key) => {
          const n = Number(src[key]);
          return Number.isFinite(n) ? Math.max(0, Math.min(95, Math.round(n * 10) / 10)) : 0;
        };
        const out = {
          top: side('top'),
          right: side('right'),
          bottom: side('bottom'),
          left: side('left'),
        };
        const fitPair = (a, b) => {
          const sum = out[a] + out[b];
          if (sum <= 95) return;
          const ratio = 95 / sum;
          out[a] = Math.round(out[a] * ratio * 10) / 10;
          out[b] = Math.round(out[b] * ratio * 10) / 10;
        };
        fitPair('top', 'bottom');
        fitPair('left', 'right');
        return out;
      }

      function hasWidgetTrim(trim) {
        return !!(trim && (trim.top || trim.right || trim.bottom || trim.left));
      }

      function applyTrimToElement(el, rawTrim) {
        if (!el) return false;
        const trim = normalizeWidgetTrim(rawTrim);
        if (!hasWidgetTrim(trim)) {
          el.style.clipPath = '';
          el.style.webkitClipPath = '';
          return false;
        }
        const inset = buildTrimInset(el, trim);
        el.style.clipPath = inset;
        el.style.webkitClipPath = inset;
        return true;
      }

      function buildTrimInset(el, trim) {
        const percentInset = `inset(${trim.top}% ${trim.right}% ${trim.bottom}% ${trim.left}%)`;
        try {
          const child = el.firstElementChild;
          const baseW = el.offsetWidth || (child && child.offsetWidth) || 0;
          const baseH = el.offsetHeight || (child && child.offsetHeight) || 0;
          if (!baseW || !baseH) return percentInset;
          const rect = el.getBoundingClientRect();
          const scaleX = rect && rect.width > 0 ? rect.width / baseW : 1;
          const scaleY = rect && rect.height > 0 ? rect.height / baseH : 1;
          const snap = (cssPx, scale) => {
            if (!Number.isFinite(scale) || scale <= 0) return Math.round(cssPx);
            return Math.round(cssPx * scale) / scale;
          };
          const px = (n) => {
            const v = Math.max(0, Math.round(n * 1000) / 1000);
            return (Math.abs(v - Math.round(v)) < 0.001 ? String(Math.round(v)) : v.toFixed(3).replace(/0+$/, '').replace(/\.$/, '')) + 'px';
          };
          return `inset(${px(snap(baseH * trim.top / 100, scaleY))} ${px(snap(baseW * trim.right / 100, scaleX))} ${px(snap(baseH * trim.bottom / 100, scaleY))} ${px(snap(baseW * trim.left / 100, scaleX))})`;
        } catch (_) {
          return percentInset;
        }
      }

      function applyWidgetTrim(w, entry) {
        if (!w || !entry) return;
        const trimmed = applyTrimToElement(entry.contentEl, w.trim);
        entry.el.classList.toggle('is-trimmed', trimmed);
      }

      function applyTrimPreviewIsolation() {
        const bgWidget = Array.isArray(currentConfig?.widgets)
          ? currentConfig.widgets.find(w => w && w.type === 'animatedBg')
          : null;
        const hasTarget = !!trimPreviewWidgetId && (
          widgetMap.has(trimPreviewWidgetId) || (bgWidget && bgWidget.id === trimPreviewWidgetId)
        );
        const active = !!(previewMode && hasTarget);
        document.body.classList.toggle('trim-preview', active);
        for (const [id, entry] of widgetMap.entries()) {
          entry.el.classList.toggle('trim-preview-hidden', active && id !== trimPreviewWidgetId);
        }
        const bgLayer = document.getElementById('anim-bg-layer');
        if (bgLayer) {
          bgLayer.classList.toggle('trim-preview-hidden', active && (!bgWidget || bgWidget.id !== trimPreviewWidgetId));
        }
      }

      function ensureGameEmbedShell(entry) {
        if (!entry.contentEl.firstElementChild) {
          entry.contentEl.innerHTML = '<div class="game-embed"><div class="game-clip"></div></div>';
        }
        const root = entry.contentEl.firstElementChild;
        let clip = root && root.querySelector('.game-clip');
        if (!clip && root) {
          root.innerHTML = '<div class="game-clip"></div>';
          clip = root.querySelector('.game-clip');
        }
        return { root, clip };
      }

      function destroyGameEmbedIframe(entry) {
        if (!entry) return;
        const iframe = entry.gameIframe || entry.contentEl.querySelector('.game-iframe');
        if (!iframe) {
          entry.gameIframe = null;
          entry.lastGameEmbedSig = null;
          entry.lastGameEmbedRoot = null;
          entry.gameResolvedUrl = null;
          entry.gameResolvedGameId = null;
          entry.gameViewportMode = 'responsive';
          return;
        }
        _gameEmbedIframes.delete(iframe);
        entry.gameIframe = null;
        entry.lastGameEmbedSig = null;
        entry.lastGameEmbedRoot = null;
        entry.gameResolvedUrl = null;
        entry.gameResolvedGameId = null;
        entry.gameViewportMode = 'responsive';
        try { iframe.src = 'about:blank'; } catch (_) {}
        iframe.remove();
      }

      // Games are embedded through the relay proxy (/game/<id>/...), so the
      // frame is SAME-ORIGIN and we can style into it. Scrollable panels
      // inside a game (e.g. wikiSubtextle's #body article pane) paint their
      // scrollbar at the 720px design size, and the whole iframe is then
      // CSS-scaled up — under fixed-720 that magnifies a "thin" scrollbar into
      // a fat bar down the side of the stream. Hide the bar without touching
      // scrollability, so the game still scrolls itself programmatically.
      // No-ops silently if a game is ever embedded cross-origin.
      const GAME_IFRAME_HIDE_SCROLLBAR_CSS =
        '*::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}'
        + '*{scrollbar-width:none!important;-ms-overflow-style:none!important}';
      function hideGameIframeScrollbars(iframe) {
        try {
          const doc = iframe && iframe.contentDocument;
          if (!doc || !doc.head) return;
          if (doc.getElementById('wt-hide-scrollbars')) return;
          const style = doc.createElement('style');
          style.id = 'wt-hide-scrollbars';
          style.textContent = GAME_IFRAME_HIDE_SCROLLBAR_CSS;
          doc.head.appendChild(style);
        } catch (_) { /* cross-origin game — nothing we can do, and that's fine */ }
      }

      function ensureGameEmbedIframe(entry) {
        const { root, clip } = ensureGameEmbedShell(entry);
        if (!root || !clip) return { root, clip, iframe: null };
        let iframe = clip.querySelector('.game-iframe');
        if (!iframe) {
          iframe = document.createElement('iframe');
          iframe.className = 'game-iframe';
          iframe.referrerPolicy = 'no-referrer-when-downgrade';
          iframe.allow = 'autoplay; fullscreen';
          iframe.src = 'about:blank';
          // Fires on every navigation, so a game switch re-injects.
          iframe.addEventListener('load', () => hideGameIframeScrollbars(iframe));
          clip.appendChild(iframe);
        }
        entry.gameIframe = iframe;
        _gameEmbedIframes.add(iframe);
        return { root, clip, iframe };
      }

      function layoutWidget(w, pos, opts) {
        const entry = widgetMap.get(w.id);
        if (!entry || !pos) return;
        // While a widget is being dragged, its on-screen position belongs to
        // the drag — snapshots (goal-update fires on every like) and game
        // re-layouts must not yank it to the saved position mid-gesture.
        if (!opts?.fromDrag && dragState && dragState.widgetId === w.id) return;
        const s = Number(entry.el.dataset.scale || 1) || 1;
        const layoutSig = [pos.x, pos.y, pos.anchor, s].join('|');
        if (entry.lastLayoutSig === layoutSig) return;
        entry.lastLayoutSig = layoutSig;
        const [tx, ty] = ANCHOR_OFFSETS[pos.anchor] || ANCHOR_OFFSETS['center'];
        entry.el.style.left = pos.x + '%';
        entry.el.style.top = pos.y + '%';
        const suf = s !== 1 ? ` scale(${s})` : '';
        entry.el.style.transform = `translate(${tx}%, ${ty}%)` + suf;
        // Scale from the ANCHOR point, not the element center. With the
        // default center origin, a scaled-down widget shrinks toward its
        // own middle and leaves a (1-s)/2 × size visual gap on every side —
        // so a left-anchored widget dragged to x=0 could never actually
        // touch the border. The anchor point is the negation of the
        // translate offsets (top-left → 0% 0%, center → 50% 50%, …).
        entry.el.style.transformOrigin = (-tx) + '% ' + (-ty) + '%';

        // → text-size slider becomes independent of widget scale.
        entry.el.style.setProperty('--ws', s);
        entry.el.dataset.anchor = pos.anchor;
        entry.el.dataset.x = pos.x;
        entry.el.dataset.y = pos.y;

      function applyCommonStyles(w, entry) {

        // applyCommonStyles still needs to target the actual styled card
        // (.win-card) for color/padding/style/border vars — descend into
        // the frame when present.
        const isFrame = outer.classList.contains('wc-frame');
        const root = isFrame

        // (when present) wraps the card with matching rounded corners
        // instead of falling back to the CSS default of 18px.
        if (isFrame) {

        }

        const color = validColor(w.color) ? w.color : 'cyan';
        const padding = validPadding(w.padding) ? w.padding : 'regular';
        const style = validStyle(w.style) ? w.style : 'glass';
        // Scale via per-widget transform — per-game override wins over
        // widget universal so one game can use a different framing than
        // another on the same gameEmbed widget.
        const _scaleOverride = resolveWidgetScale(w.id);
        const _effScale = Number.isFinite(_scaleOverride) ? _scaleOverride : (Number(w.scale) || 100);
        const nextScale = String(_effScale / 100);
        if (entry.el.dataset.scale !== nextScale) {
          entry.el.dataset.scale = nextScale;
          entry.lastLayoutSig = null;
        }
        // Position: prefer this widget's resolved game context override
        // (fixed game or active stream game), else the universal layout.
        const pos = resolveWidgetPos(w);
        if (pos) layoutWidget(w, pos);
        const styleSig = JSON.stringify([
          color,
          padding,
          style,
          Number(w.bgOpacity) || 70,
          Number(w.borderRadius) || 16,
          Number(w.textSize) || 100,
          Number.isFinite(Number(w.borderWidth)) ? Math.max(0, Math.min(8, Number(w.borderWidth))) : '',
          w.borderStyle || '',
          w.borderColor || '',
          w.bgColor || '',
          w.textColor || '',
        ]);
        if (entry.lastCommonStyleSig === styleSig && entry.lastCommonStyleRoot === root) return;
        entry.lastCommonStyleSig = styleSig;
        entry.lastCommonStyleRoot = root;
        // Apply to root child (.goal / .win-card / .top-likers / .milestone)
        root.classList.forEach(c => {
          if (c.startsWith('c-') || c.startsWith('pad-') || c.startsWith('style-')) root.classList.remove(c);
        });
        root.classList.add('c-' + color, 'pad-' + padding, 'style-' + style);
        // NB Number.isFinite guard, NOT `|| 70`: bgOpacity is a real 0-100
        // value and 0 is legitimate ("fully transparent"). `Number(0) || 70`
        // is 70 because 0 is falsy, so dragging BG opacity to 0 to make a
        // widget see-through silently snapped it back to 70%. Only fall back to
        // 70 when the value is genuinely absent/non-numeric.
        const _bgOpRaw = Number(w.bgOpacity);
        const bgOp = (Number.isFinite(_bgOpRaw) ? _bgOpRaw : 70) / 100;
        root.style.setProperty('--bg-op', bgOp);
        root.style.setProperty('--radius', (Number(w.borderRadius) || 16) + 'px');
        // Text-size multiplier — applied to all font-size declarations in
        // this stylesheet via calc(<base>rem * var(--tm, 1)).
        root.style.setProperty('--tm', (Number(w.textSize) || 100) / 100);

        if (Number.isFinite(Number(w.borderWidth))) root.style.setProperty('--bw', Math.max(0, Math.min(8, Number(w.borderWidth))) + 'px');

        if (w.borderStyle && w.borderStyle !== 'solid') root.style.setProperty('--bs', w.borderStyle);
        else if (w.borderStyle === 'solid') root.style.setProperty('--bs', 'solid');
        else root.style.removeProperty('--bs');
        if (w.borderColor) root.style.setProperty('--bc', w.borderColor);
        else root.style.removeProperty('--bc');
        // bgColor + style interaction:
        //  - For Glass style, set --glass-fill var so the gradient border
        //    layer stays intact (overriding `background` would wipe it).
        //  - For other styles, override `background` outright and disable
        //    the blur (those styles aren't glass).
        const isGlass = w.style === 'glass';

        } else {
          root.style.removeProperty('--text-c');
          root.style.color = '';
        }
      }
