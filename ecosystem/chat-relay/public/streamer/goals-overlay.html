      letter-spacing: 1px;
      padding: 18px 0;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      color: var(--anim-bg-fg, #fff);
      opacity: 0.85;
    }
    /* Gradient-pulse preset is pure CSS — the JS just toggles the class
       and sets the CSS vars. */
    #anim-bg-layer.preset-gradient-pulse {
      background:
        radial-gradient(circle at var(--gp-x, 50%) var(--gp-y, 50%),
          var(--anim-bg-primary, #5865F2) 0%,
          var(--anim-bg-secondary, #0a0e1a) 70%);
      animation: animBgGradient var(--anim-bg-gp-dur, 16s) ease-in-out infinite alternate;
    }
    @keyframes animBgGradient {
      0%   { --gp-x: 30%; --gp-y: 40%; filter: hue-rotate(0deg)   brightness(1); }
      50%  { --gp-x: 70%; --gp-y: 60%; filter: hue-rotate(20deg)  brightness(1.08); }
      100% { --gp-x: 50%; --gp-y: 50%; filter: hue-rotate(-15deg) brightness(0.95); }
    }
    /* Property registration so the gradient stop position animates
       smoothly (CSS custom-property animation otherwise jumps). */
    @property --gp-x { syntax: '<percentage>'; inherits: true; initial-value: 50%; }
    @property --gp-y { syntax: '<percentage>'; inherits: true; initial-value: 50%; }

    /* ── Preset: neon-frame ─────────────────────────────────────
       Near-black interior with a glowing neon rectangle inset from the
       edges. All colors come from --nf-* vars written by JS
       (_neonFrameApplyColor) so a game-win can recolor the frame to the
       winner's hero-banner color without a renderer rebuild. */
    /* Pitch-black interior — the only color inside the frame comes from the
       glow rings on .nf-frame itself. */
    #anim-bg-layer.preset-neon-frame {
      background: #000;
    }
    /* The frame is a stack of gradient RINGS (mask-composited so only the
       band between outer edge and content box paints), all driven by
       --nf-grad / --nf-grad-core built in JS from the winner's hero-banner
       palette. A single-color palette degenerates to the old solid look;
       multi-color palettes get a 135° gradient that slowly flows, same
       angle/motion as the hero badges themselves. */
    #anim-bg-layer.preset-neon-frame .nf-frame {
      position: absolute;
      inset: 5.5%;
      border-radius: 6px;
      animation: nfBreathe var(--nf-dur, 9s) ease-in-out infinite alternate;
      will-change: opacity;
    }
    /* The glow rings are STATIC. They used to pan their gradient via
       background-position (nfFlow), but each of these rings sits inside a
       blur wrapper — changing ring content every frame forced all four blur
       passes to be recomputed over the full 1080x1920 surface. The pan is
       invisible under an 18-56px blur anyway, so only .nf-core animates now.
       background-size is 100% (was 300%) so the static ring shows the WHOLE
       palette rather than the top-left third of a 3x-zoomed gradient. */
    #anim-bg-layer.preset-neon-frame .nf-ring {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: var(--nf-grad, linear-gradient(135deg, #ff2fa8, #ff2fa8));
      background-size: 100% 100%;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
    }
    /* Blur lives on a WRAPPER, never on the masked ring itself: CSS applies
       filter BEFORE mask on the same element, so blur+mask together gives a
       hard-clipped band (the "straight cutoff" bug). Blurring the wrapper
       operates on the already-masked ring, so the glow fades softly into
       the black on both sides of the tube. */
    #anim-bg-layer.preset-neon-frame .nf-blur {
      position: absolute;
      border-radius: inherit;
    }
    /* Crisp near-white core line (the "lit tube") — no blur, direct ring.
       This is the ONLY neon-frame layer that still animates. Its gradient
       lives on a ::before sized 3x the ring (matching the old
       background-size: 300%) and pans by transform, which the compositor
       can run without repainting. overflow:hidden keeps the oversized
       ::before inside the ring box; the mask above still carves the band. */
    #anim-bg-layer.preset-neon-frame .nf-core {
      padding: 8px;
      background: none;
      overflow: hidden;
    }
    #anim-bg-layer.preset-neon-frame .nf-core::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 300%;
      height: 300%;
      background: var(--nf-grad-core, linear-gradient(135deg, #ffd9ef, #ffd9ef));
      background-size: 100% 100%;
      will-change: transform;
      animation: nfFlow var(--nf-flow-dur, 20s) ease infinite;
    }
    /* Tight halo hugging the core. */
    #anim-bg-layer.preset-neon-frame .nf-tube { inset: -3px; filter: blur(5px); }
    #anim-bg-layer.preset-neon-frame .nf-tube .nf-ring { padding: 14px; }
    /* Mid glow. */
    #anim-bg-layer.preset-neon-frame .nf-glow-near {
      inset: -8px;
      filter: blur(calc(18px * var(--nf-glow, 1)));
      opacity: 0.95;
    }
    #anim-bg-layer.preset-neon-frame .nf-glow-near .nf-ring { padding: 26px; }
    /* Broad outer wash. */
    #anim-bg-layer.preset-neon-frame .nf-glow-far {
      inset: -18px;
      filter: blur(calc(56px * var(--nf-glow, 1)));
      opacity: 0.9;
    }
    #anim-bg-layer.preset-neon-frame .nf-glow-far .nf-ring { padding: 46px; }
    /* Wide inward wash so color bleeds into the black interior near the
       frame, like the old inset box-shadow did. */
    #anim-bg-layer.preset-neon-frame .nf-wash {
      inset: 0;
      filter: blur(calc(40px * var(--nf-glow, 1)));
      opacity: 0.34;
    }
    #anim-bg-layer.preset-neon-frame .nf-wash .nf-ring { padding: 95px; }
    /* Breathing used to animate `filter: brightness()/saturate()` on
       .nf-frame. filter is not a composited property, so every frame
       re-rendered the entire glow subtree — four blur passes across a
       1080x1920 surface. render1 has no GPU (swiftshader), so that was
       software-rasterised at the compositor's 60fps and dominated CPU;
       the ?obs=1 15fps throttle never applied because _bgRAF only wraps
       CANVAS loops and this preset has no canvas. Opacity IS composited:
       the frame paints once into a cached texture and only its alpha
       varies per frame. Against the preset's pitch-black interior, alpha
       multiplies luminance, so this reads as the same dimming.
       0.78->1.0 is a 1.29x swing, matching the old 0.9->1.16 brightness
       range, so the BREATHE DEPTH is unchanged. What is lost is the old
       overdrive above 1.0: peak glow is ~14% dimmer than before, and the
       saturate(1->1.15) component is dropped. Do NOT "fix" that by adding
       a filter back onto .nf-frame — .nf-core::before animates inside it,
       so a parent filter would re-render the whole glow subtree (four
       blurs) every frame, which is exactly the cost this removed. */
    @keyframes nfBreathe {
      from { opacity: 0.78; }
      to   { opacity: 1; }
    }
    /* Equivalent motion to the old background-position 0%->100% pan across
       a 300%-sized background: the ::before is 3x the ring, so travelling
       -66.667% of its own size moves the window across the full gradient. */
    @keyframes nfFlow {
      0%   { transform: translate3d(0, 0, 0); }
      50%  { transform: translate3d(-66.667%, -66.667%, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }

    /* Psychedelic presets — implemented in JS (see _bgPsy below). The
       class is kept only for diagnostic hooks; CSS doesn't drive visuals. */
    #anim-bg-layer[class*="preset-psy-"] {
      background-color: #050810;
    }

    /* ── Streamer controls bar (stream-view only) ─────────────── */
    /* Permanent toolbar at the bottom of the device viewport. Sits OUTSIDE
       the scaleRoot so it doesn't get CSS-scaled with the OBS canvas — these
       are real-pixel UI affordances for the streamer, not part of the OBS
       composition. Only renders when ?embedGame=1 (stream-view path). */
    #streamer-bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      z-index: 9999;
      display: none;  /* flipped to flex when embedGame=1 */
      flex-direction: column;
      padding: 8px max(8px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      gap: 6px;
      /* The bar FLOATS over the canvas (fitOverlayCanvas no longer reserves
         its height), so it must not tint the capture while collapsed. The
         gradient only appears with the controls open. */
      background: none;
      pointer-events: none;  /* let dead space click through */
    }
    #streamer-bar:not(.controls-hidden) {
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 60%, rgba(0,0,0,0.85) 100%);
    }
    #streamer-bar > * { pointer-events: auto; }
    #streamer-bar-buttons {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    }
    .sb-btn {
      flex: 1; max-width: 200px; min-width: 0;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px;
      padding: 12px 14px;
      font: 600 14px/1.0 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #fff;
      /* Match the widget glassmorphism recipe (blur + saturate + brightness)
         so the bar reads as part of the same design system. */
      background: rgba(14, 20, 28, 0.55);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 16px;
      cursor: pointer;
      backdrop-filter: blur(24px) saturate(180%) brightness(1.05);
      -webkit-backdrop-filter: blur(24px) saturate(180%) brightness(1.05);
      box-shadow: 0 4px 16px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.14);
      transition: background 120ms ease, border-color 120ms ease, transform 80ms ease;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .sb-btn:active { transform: scale(0.97); }
    .sb-btn.active {
      background: rgba(90, 182, 255, 0.28);
      border-color: rgba(90, 182, 255, 0.65);
      box-shadow: 0 0 14px rgba(90, 182, 255, 0.35);
    }
    .sb-btn.ready {
      background: rgba(34, 197, 94, 0.22);
      border-color: rgba(34, 197, 94, 0.58);
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.28);
    }
    .sb-btn.needs-action {
      background: rgba(246, 196, 83, 0.20);
      border-color: rgba(246, 196, 83, 0.58);
    }
    .sb-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .sb-btn .sb-emoji { font-size: 18px; line-height: 1; }
    #streamer-bar.controls-hidden #streamer-bar-buttons { display: none; }
    #sb-collapse {
      align-self: center;
      width: 44px; height: 32px; padding: 0; margin: 0 auto;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 16px; line-height: 1; color: #fff;
      background: rgba(14, 20, 28, 0.55);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px; cursor: pointer;
      backdrop-filter: blur(24px) saturate(180%) brightness(1.05);
      -webkit-backdrop-filter: blur(24px) saturate(180%) brightness(1.05);
      transition: opacity 200ms ease;
    }
    #sb-collapse:active { transform: scale(0.97); }
    /* Collapsed, the chip is the only thing floating over the capture —
       keep it subtle so it barely registers on stream. */
    #streamer-bar.controls-hidden #sb-collapse { opacity: 0.55; }
    /* TTS skip — hidden unless a clip is actually playing. Queue badge. */
    #sb-tts-skip { display: none; position: relative; }
    #sb-tts-skip.show { display: inline-flex; }
    #sb-tts-skip .sb-badge {
      position: absolute; top: -6px; right: -6px;
      min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 9px;
      background: #f6c453; color: #231a00;
      font: 700 11px/18px system-ui, sans-serif;
      text-align: center;
      display: none;
    }
    #sb-tts-skip .sb-badge.show { display: block; }
    /* Guess-input success flash */
    #streamer-bar-input input.sent-ok {
      border-color: #43d17c;
      box-shadow: 0 0 10px rgba(67, 209, 124, 0.45);
    }
    /* ── Stream-view toast ──────────────────────────────────── */
    /* Real-pixel notification pill OUTSIDE the scaled canvas. Errors used
       to go to #status, which is display:none outside debug/edit mode —
       invisible exactly when the streamer needed them. */
    #sv-toast {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, -12px);
      opacity: 0;
      pointer-events: none;
      z-index: 10001;
      max-width: 86vw;
      padding: 8px 14px;
      border-radius: 999px;
      font: 600 13px/1.25 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #fff;
      text-align: center;
      background: rgba(20, 24, 32, 0.88);
      border: 1px solid rgba(255,255,255,0.16);

      -webkit-backdrop-filter: blur(14px) saturate(160%);
      transition: opacity 160ms ease, transform 160ms ease;
    }
    #sv-toast.show { opacity: 1; transform: translate(-50%, 0); }
    #sv-toast.bad { background: rgba(160, 32, 44, 0.9); border-color: rgba(255, 120, 130, 0.5); }
    #sv-toast.ok  { background: rgba(22, 122, 62, 0.9); border-color: rgba(90, 220, 140, 0.5); }
    #streamer-bar-input {
      display: none;
      gap: 8px; align-items: center;
      padding: 8px;
      background: rgba(20, 24, 32, 0.85);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px;
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
    }
    #streamer-bar-input.show { display: flex; }
    #streamer-bar-input input {
      flex: 1; min-width: 0;
      padding: 10px 12px;
      font: 500 15px/1.2 system-ui;
      color: #fff;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
    }
    #streamer-bar-input input:focus { outline: 0; border-color: rgba(90,182,255,0.75); }
    #streamer-bar-input button {
      padding: 10px 16px;
      font: 600 14px/1.0 system-ui;
      color: #001226;
      background: #5ab6ff;
      border: 0; border-radius: 10px;
