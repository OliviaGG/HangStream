<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Credits Overlay — Pretzel + Incompetech + StreamBeats</title>
<style>
:root {
  color-scheme: dark;
  --bg-backdrop: rgba(11, 15, 24, 0.78);
  --panel: rgba(19, 28, 45, 0.92);
  --panel-2: rgba(24, 36, 58, 0.95);
  --text: #eef4ff;
  --muted: #96a8c6;
  --accent: #5ab6ff;
  --accent-2: #9e7bff;
  --good: #43d17c;
  --line: rgba(255,255,255,0.10);
  --shadow: 0 10px 30px rgba(0,0,0,0.45);
  --radius: 14px;
  --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: transparent;
  font-family: var(--font);
  color: var(--text);
}

.overlay {
  position: fixed;
  display: flex;
  padding: 24px;
  pointer-events: none;
}

/* ─── Embed mode (inside a widget iframe) ─── */
.embed-mode html,
.embed-mode body {
  width: 100%;
  height: 100%;
}
.embed-mode .overlay {
  position: absolute;
  inset: 0;
  padding: 0;
  align-items: stretch;
  justify-content: stretch;
}
.embed-mode .card {
  max-width: none;
  width: 100%;
  height: 100%;
  border-radius: 0;
  animation: none;
}
.embed-mode .card-header {
  flex-shrink: 0;
}
.embed-mode .credits {
  overflow: hidden;
}

/* ─── Positions ─── */
.position-bottom-left  { left: 0;  bottom: 0;  align-items: flex-end;   justify-content: flex-start; }
.position-bottom-right { right: 0; bottom: 0;  align-items: flex-end;   justify-content: flex-end;   }
.position-top-left     { left: 0;  top: 0;     align-items: flex-start; justify-content: flex-start; }
.position-top-right    { right: 0; top: 0;     align-items: flex-start; justify-content: flex-end;   }

/* ─── Card styles ─── */
.card {
  pointer-events: auto;
  max-width: 420px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: linear-gradient(180deg, var(--panel), var(--panel-2));
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px) saturate(1.15);
  -webkit-backdrop-filter: blur(12px) saturate(1.15);
  overflow: hidden;
  animation: slideIn 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

.style-bar .card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 16px;
  max-width: 640px;
}

.style-card .card {
  padding: 16px 18px;
}

.style-minimal .card {
  padding: 8px 14px;
  background: var(--bg-backdrop);
  border-color: rgba(255,255,255,0.06);
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(16px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0)  scale(1); }
}

/* ─── Header / genre badge ─── */
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.style-bar .card-header {
  margin-bottom: 0;
}

.title {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
}

.genre-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(90,182,255,0.18), rgba(158,123,255,0.18));
  border: 1px solid rgba(90,182,255,0.22);
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
  animation: fadeIn 360ms ease both;
}

.genre-badge::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--good);
  box-shadow: 0 0 8px var(--good);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.65; transform: scale(0.9); }
  50%      { opacity: 1;    transform: scale(1.1); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ─── Credit rows ─── */
.credits {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.style-bar .credits {
  flex-direction: row;
  gap: 18px;
}

.credit {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.icon {
  flex: 0 0 22px;
  width: 22px; height: 22px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 800;
  color: #fff;
}

.icon-pretzel   { background: linear-gradient(135deg, #ff6b6b, #feca57); }
.icon-incomp    { background: linear-gradient(135deg, #5ab6ff, #9e7bff); }
.icon-streambeats { background: linear-gradient(135deg, #00d4aa, #00a8e8); }

.text {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.name {
  font-size: 0.84rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}

.sub {
  font-size: 0.72rem;
  color: var(--muted);
  line-height: 1.35;
}

.style-minimal .name { font-size: 0.78rem; }
.style-minimal .sub  { font-size: 0.68rem; }

/* ─── Custom message ─── */
.custom-message {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  font-size: 0.78rem;
  color: var(--muted);
  line-height: 1.4;
}

.style-bar .custom-message {
  margin-top: 0;
  padding-top: 0;
  padding-left: 14px;
  border-top: 0;
  border-left: 1px solid var(--line);
}

/* ─── Light theme ─── */
.theme-light {
  --bg-backdrop: rgba(255, 255, 255, 0.82);
  --panel: rgba(255, 255, 255, 0.95);
  --panel-2: rgba(245, 248, 255, 0.98);
  --text: #0f172a;
  --muted: #475569;
  --line: rgba(15, 23, 42, 0.10);
  --shadow: 0 10px 30px rgba(0,0,0,0.18);
}

.theme-light .genre-badge {
  background: linear-gradient(90deg, rgba(90,182,255,0.14), rgba(158,123,255,0.14));
}

/* ─── Hide toggles ─── */
.hide-pretzel .credit-pretzel,
.hide-incompetech .credit-incompetech,
.hide-streambeats .credit-streambeats,
.no-message .custom-message,
.no-genres .genre-badge,
.no-now-playing .now-playing { display: none; }

/* In embed mode, bar layout may need to stack if the box is narrow */
.embed-mode.style-bar .credits {
  flex-direction: column;
  gap: 8px;
}
.embed-mode.style-bar .card {
  gap: 10px;
}

/* ─── Now playing row ─── */
.now-playing {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  padding: 10px 12px;
  background: rgba(0,0,0,0.22);
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.06);
}
.now-playing-icon {
  flex: 0 0 22px;
  width: 22px; height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 11px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
}
.now-playing-icon.playing {
  animation: spin 4s linear infinite;
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.now-playing-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.now-playing-title {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.now-playing-source {
  font-size: 0.72rem;
  color: var(--muted);
  text-transform: capitalize;
}
.style-bar .now-playing {
  margin-bottom: 0;
  padding: 6px 10px;
}
.style-minimal .now-playing {
  background: transparent;
  border-color: transparent;
  padding: 4px 0;
}
</style>
</head>
<body>

<script src="/socket.io/socket.io.js"></script>
<div class="overlay" id="overlay">
  <div class="card">
    <div class="card-header">
      <div class="title">Now Playing</div>
      <div class="genre-badge" id="genre-badge">Lofi</div>
    </div>
    <div class="now-playing no-now-playing" id="now-playing">
      <div class="now-playing-icon" id="np-icon">♪</div>
      <div class="now-playing-text">
        <div class="now-playing-title" id="np-title">—</div>
        <div class="now-playing-source" id="np-source">—</div>
      </div>
    </div>
    <audio id="music-audio" preload="none" style="display:none;"></audio>
    <div class="credits" id="credits">
      <div class="credit credit-pretzel">
        <div class="icon icon-pretzel">P</div>
        <div class="text">
          <div class="name">Pretzel Rocks</div>
          <div class="sub">Free tier · DMCA-safe stream music · pretzel.rocks</div>
        </div>
      </div>
      <div class="credit credit-incompetech">
        <div class="icon icon-incomp">K</div>
        <div class="text">
          <div class="name">Kevin MacLeod — incompetech.com</div>
          <div class="sub">Licensed under Creative Commons: By Attribution 4.0</div>
        </div>
      </div>
      <div class="credit credit-streambeats">
        <div class="icon icon-streambeats">S</div>
        <div class="text">
          <div class="name">StreamBeats</div>
          <div class="sub">DMCA-safe stream music · streambeats.com</div>
        </div>
      </div>
    </div>
    <div class="custom-message" id="custom-message"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const params = new URLSearchParams(location.search);
  const $ = id => document.getElementById(id);

  // ─── URL options ───
  const opts = {
    embed:           params.get('embed')       === '1',
    streamerId:      params.get('streamerId')  || params.get('streamer') || '',
    position: params.get('position') || 'bottom-left',
    theme:    params.get('theme')    || 'dark',
    style:    params.get('style')    || 'card',
    scale:    parseFloat(params.get('scale') || '1'),
    showPretzel:     params.get('pretzel')     !== 'false',
    showIncompetech: params.get('incompetech') !== 'false',
    showStreamBeats: params.get('streambeats') !== 'false',
    showGenres:      params.get('genres')      !== 'false',
    message:         params.get('message')     || '',
    genres:          (params.get('genres')     || 'Lofi,EDM,Gaming,Retro').split(',').map(s => s.trim()).filter(Boolean),
    interval:        Math.max(3000, parseInt(params.get('interval') || '6000', 10)),
  };

  const body = document.body;
  const overlay = $('overlay');
  const audio = $('music-audio');
  const npRow = $('now-playing');
  const npIcon = $('np-icon');
  const npTitle = $('np-title');
  const npSource = $('np-source');

  // Apply configuration classes
  if (opts.embed) body.classList.add('embed-mode');
  body.classList.add(`theme-${opts.theme}`);
  body.classList.add(`style-${opts.style}`);
  if (!opts.embed) overlay.classList.add(`position-${opts.position}`);

  if (!opts.showPretzel)     body.classList.add('hide-pretzel');
  if (!opts.showIncompetech) body.classList.add('hide-incompetech');
  if (!opts.showStreamBeats) body.classList.add('hide-streambeats');
  if (!opts.showGenres)      body.classList.add('no-genres');
  if (!opts.message)         body.classList.add('no-message');
  else                       $('custom-message').textContent = opts.message;

  // Scale the whole overlay
  if (opts.scale !== 1) {
    overlay.style.transform = `scale(${opts.scale})`;
    overlay.style.transformOrigin = {
      'top-left':     'left top',
      'top-right':    'right top',
      'bottom-left':  'left bottom',
      'bottom-right': 'right bottom',
    }[opts.position] || 'left bottom';
  }

  // ─── Genre rotation ───
  const badge = $('genre-badge');
  let genreIndex = 0;

  function rotateGenre() {
    if (!opts.genres.length) return;
    badge.style.animation = 'none';
    void badge.offsetWidth; // force reflow
    badge.textContent = opts.genres[genreIndex];
    badge.style.animation = 'fadeIn 360ms ease both';
    genreIndex = (genreIndex + 1) % opts.genres.length;
  }

  if (opts.genres.length) {
    badge.textContent = opts.genres[0];
    if (opts.genres.length > 1) {
      genreIndex = 1;
      setInterval(rotateGenre, opts.interval);
    }
  }

  // ─── Now playing / audio state ───
  let currentUrl = '';
  let currentPlaying = false;
  let socket = null;
  let endedEmitted = false;

  function setNowPlaying(title, source, playing) {
    const hasTrack = !!(title || source);
    npRow.classList.toggle('no-now-playing', !hasTrack);
    if (!hasTrack) return;
    npTitle.textContent = title || 'Now Playing';
    npSource.textContent = (source || 'custom').replace(/-/g, ' ');
    npIcon.classList.toggle('playing', !!playing);
  }

  function syncAudio(url, playing) {
    if (!audio) return;
    const wantsPlay = !!playing && !!url;
    if (url && url !== currentUrl) {
      currentUrl = url;
      audio.src = url;
      audio.load();
    }
    if (!url) {
      audio.pause();
      audio.removeAttribute('src');
      currentUrl = '';
      return;
    }
    if (wantsPlay) {
      const p = audio.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    } else {
      audio.pause();
    }
  }

  function applyMusicState(state) {
    if (!state) return;
    setNowPlaying(state.title, state.source, state.playing);
    if (state.url) {
      syncAudio(state.url, state.playing);
    } else {
      syncAudio('', false);
    }
    currentPlaying = !!state.playing;
  }

  if (audio) {
    audio.addEventListener('ended', () => {
      if (endedEmitted) return;
      endedEmitted = true;
      if (socket && socket.connected) socket.emit('music-ended');
      // Fallback if socket isn't connected: stop.
      setTimeout(() => { endedEmitted = false; }, 500);
    });
    audio.addEventListener('error', () => {
      // Don't spam the server; just stop locally on error.
      console.warn('[music-credits] audio error', currentUrl);
    });
  }

  // ─── Socket.IO (live updates from dashboard) ───
  if (opts.streamerId && typeof io === 'function') {
    try {
      socket = io({ transports: ['websocket', 'polling'] });
      socket.on('connect', () => {
        socket.emit('join-goals-overlay', { streamerId: opts.streamerId });
      });
      socket.on('music-state', (state) => {
        applyMusicState(state);
      });
    } catch (e) {
      console.warn('[music-credits] socket init failed', e);
    }
  }

  // ─── BroadcastChannel / localStorage bridge for live updates ───
  // Another tab or OBS browser source can send messages to update the overlay.
  const channelName = params.get('channel') || 'wt-music-credits';
  try {
    const bc = new BroadcastChannel(channelName);
    bc.onmessage = (ev) => {
      const data = ev.data || {};
      if (data.genre && badge) badge.textContent = data.genre;
      if (data.message && $('custom-message')) {
        $('custom-message').textContent = data.message;
        body.classList.remove('no-message');
      }
      if (data.pretzel === false) body.classList.add('hide-pretzel');
      if (data.pretzel === true)  body.classList.remove('hide-pretzel');
      if (data.incompetech === false) body.classList.add('hide-incompetech');
      if (data.incompetech === true)  body.classList.remove('hide-incompetech');
      if (data.streambeats === false) body.classList.add('hide-streambeats');
      if (data.streambeats === true)  body.classList.remove('hide-streambeats');
      if (data.title != null || data.source != null) {
        setNowPlaying(data.title, data.source, data.playing);
      }
    };
  } catch (e) {
    // BroadcastChannel not supported; overlay still works via URL params.
  }
})();
</script>

  <script src="/js/hangstream-brand.js" defer></script>
</body>
</html>
