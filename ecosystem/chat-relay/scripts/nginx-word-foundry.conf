# Install inside the wordtycoon.live HTTPS server block, before its generic
# `location /` fallback. The Foundry API continues through Chat Relay's
# existing `/api/` location so its signed-in session remains authoritative.

location = /word-foundry {
    return 301 /word-foundry/;
}

location ^~ /word-foundry/ {
    proxy_pass http://127.0.0.1:3020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
