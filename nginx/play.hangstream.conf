# play.hangstream.me — chat-relay (Word Tycoon ecosystem relay + games + TTS)
# Runs as a second Node service on the same server as HangStream.
# chat-relay: 127.0.0.1:3000   voice-tts: 127.0.0.1:3032 (private, not exposed)

server {
    listen 80;
    listen [::]:80;

    server_name play.hangstream.me;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name play.hangstream.me;

    ssl_certificate /etc/letsencrypt/live/play.hangstream.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.hangstream.me/privkey.pem;

    # Socket.IO + app websocket endpoints need upgrade headers and long timeouts
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # TTS synthesis and game proxies can be slow — don't cut them off
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;

        # Chat messages and game posts are small; uploads (avatars) are the
        # only large bodies this app sees.
        client_max_body_size 10m;
    }
}
