<style id="inline-shared">
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap');

  :root {
    --bg: #0e0e12;
    --bg-elevated: #0b0b0f;
    --panel: #1a1a22;
    --panel-strong: #20202a;
    --text: #f0ede8;

    --accent: #ff4d6d;

    --good: #2ecc71;
    --bad: #ff7a7a;
    --secondary: #3a3a45;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: transparent;
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    overflow: hidden;
  }

  .overlay-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    gap: 32px;
  }

  .hangman-container {
    width: 300px;
    height: 270px;
  }

  .hm-part {
    transition: opacity 0.3s;
    opacity: 0;
    stroke: var(--accent);
    stroke-width: 4;
    stroke-linecap: round;
    fill: none;
  }

  .hm-part.show { opacity: 1; }

  .hm-gallows {
    stroke: var(--secondary);
    stroke-width: 4;
    stroke-linecap: round;
    fill: none;
  }

  .word-row {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .letter-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .letter-char {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    color: var(--accent);
    min-width: 36px;
    text-align: center;
    transition: all 0.2s;
  }

  .letter-line {
    width: 36px;
    height: 3px;
    background: var(--secondary);
  }

  .keyboard {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 600px;
  }

  .kb-row {
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  .kb-key {
    width: 48px;
    height: 52px;
    background: color-mix(in srgb, var(--panel) 90%, transparent);
    border: 2px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: default;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .kb-key.correct {
    background: color-mix(in srgb, var(--good) 18%, transparent);
    border-color: var(--good);
    color: var(--good);
  }

  .kb-key.wrong {
    background: var(--panel);
    border-color: var(--border);
    color: var(--border);
    opacity: 0.3;
  }

  .lives-container {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }

  .life-dot {
    width: 16px;
    height: 16px;
    border-radius: 999px;
    background: var(--accent);
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 10%, transparent);
  }

  .life-dot.lost { background: var(--border); }

  .game-status {
    font-size: 14px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  .leaderboard-overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(14, 14, 18, 0.95);
    border: 2px solid var(--accent);
    border-radius: 20px;
    padding: 24px 32px;
    max-width: 500px;
    width: 90%;
    backdrop-filter: blur(18px);
    z-index: 1000;
    display: none;
  }

  .leaderboard-overlay.visible {
    display: block;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  .leaderboard-title {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 8px 0;
    color: var(--text);
    text-align: center;
  }

  .leaderboard-subtitle {
    font-size: 14px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 20px;
  }

  .leaderboard-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .leaderboard-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.05);
    padding: 12px 16px;
    border-radius: 12px;
  }

  .leaderboard-rank {
    font-size: 24px;
    font-weight: 700;

  .leaderboard-rank.rank-1 { color: #ffd700; }
  .leaderboard-rank.rank-2 { color: #c0c0c0; }
  .leaderboard-rank.rank-3 { color: #cd7f32; }

  .leaderboard-name {
    flex: 1;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }

  .leaderboard-score {
    font-size: 20px;
    font-weight: 700;
    color: var(--good);
  }

  .leaderboard-footer {
    text-align: center;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  .leaderboard-close {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }

  .word-category {
    text-align: center;
    font-size: 14px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 20px;
    font-family: 'Bebas Neue', sans-serif;
  }

  /* Hide all ads on overlay for clean OBS stream */
  .adsbygoogle,
  ins.adsbygoogle {
    display: none !important;
  }

  .overlay-mode .adsbygoogle,
  .overlay-mode ins.adsbygoogle {
    display: none !important;
  }

<!-- Next-game vote ("what do we play next?"), fed by `game-vote-update`.
     Pinned bottom-right so it never covers the hangman board. -->
<div class="hs-vote-overlay-slot" id="vote-slot"></div>

<script src="/hangstream-vote-card.js"></script>

<script>
// Overlay-specific game logic - simplified for streaming
const MAX_WRONG = 6;
let currentWord = '';
let currentCategory = '';
let maskedChars = [];
let wrongCount = 0;
let revealedWord = '';
let ALL_WORDS = [];
let VISIBLE_WORDS = [];
let usedWords = new Set();

// Namespace handling (same as main game)
function getRouteNamespace() {
  const pathName = String(location.pathname || '/').replace(/\/+$/, '');
  if (!pathName || pathName === '/' || pathName === '/viewer' || pathName === '/streamer') return '';
  if (/^\/(oauth|auth|terms|privacy|scores|score|music)(\/|$)/.test(pathName)) return '';
  // Extract streamer name from /streamer-name/overlay
  const overlayMatch = pathName.match(/^\/([^/]+)\/overlay\/?$/);
  if (overlayMatch) {
    const slug = overlayMatch[1].trim().toLowerCase();
    return /^[a-z0-9_.@-]+$/.test(slug) ? slug : '';
  }
  if (pathName.indexOf('/', 1) !== -1) return '';
  const slug = pathName.slice(1).trim().toLowerCase();
  return /^[a-z0-9_.@-]+$/.test(slug) ? slug : '';
}

function isLetter(ch) {
  return /^[A-Z]$/.test(ch);
}

// Length bands per difficulty. They mirror the server games
// (server/games/hangman.js, server/games/speedscramble.js) so a local round
// and an online round feel the same.
const DIFFICULTY_BANDS = {
  easy:    [4, 6],
  medium:  [5, 8],
  hard:    [8, 20],
  normal:  [5, 7],
  extreme: [9, 14],
};

// Game level -> pool difficulty tag. Speed Scramble says normal/extreme where
// the pool only knows easy/medium/hard.
const LEVEL_TO_TAG = {
  easy: 'easy',
  medium: 'medium',
  normal: 'medium',
  hard: 'hard',
  extreme: 'hard',
};

function filterByDifficulty(list, difficulty) {
  if (!Array.isArray(list)) return [];
  const level = String(difficulty || '').toLowerCase();
  const tag = LEVEL_TO_TAG[level] || level;
  const band = DIFFICULTY_BANDS[level] || null;
  const inBand = (w) => {
    if (!band) return true;
    const len = (w.word || '').length;
    return len >= band[0] && len <= band[1];
  };
  const byTag = list.filter(w => String((w.difficulty || '')).toLowerCase() === tag);
  // Prefer words inside the band, but keep the hand-curated ones even when
  // they sit outside it - the streamer picked those deliberately.
  const banded = byTag.filter(inBand);
  if (banded.length) return banded;
  if (byTag.length) return byTag;
  const easy = list.filter(w => (w.word || '').length <= 6);
  const medium = list.filter(w => (w.word || '').length >= 5 && (w.word || '').length <= 9);
  const hard = list.filter(w => (w.word || '').length >= 8);
  if (level === 'easy') return easy.length ? easy : list;
  if (level === 'hard') return hard.length ? hard : list;
  return medium.length ? medium : list;
}

// The general pool: the ecosystem's curated target list, tagged by difficulty.
// It carries no category of its own, so those rounds show "Common".
async function loadWordBankFile() {
  try {
    const res = await fetch('/word-bank.json', { cache: 'no-store' });
    if (!res || res.status !== 200) return [];
    const data = await res.json();
    const buckets = (data && data.words) || {};
    const out = [];
    for (const [difficulty, list] of Object.entries(buckets)) {
      if (!Array.isArray(list)) continue;
      for (const raw of list) {
        const word = String(raw || '').toUpperCase().trim();
        if (!word) continue;
        out.push({ word, cat: 'Common', difficulty: String(difficulty || 'medium').toLowerCase(), src: 'general' });
      }
    }
    return out;
  } catch (e) {
    return [];
  }
}

async function loadCustomWordsFile() {
  try {
    const [curatedRes, general] = await Promise.all([
      fetch('/custom-words.json', { cache: 'no-store' }),
      loadWordBankFile(),
    ]);
    const normalized = [];
    if (curatedRes && curatedRes.status === 200) {
      const data = await curatedRes.json();
      if (Array.isArray(data) && data.length > 0) {
        for (const item of data) {
          if (!item || typeof item !== 'object') continue;
          normalized.push({
            word: String(item.word || '').toUpperCase().trim(),
            cat: String(item.cat || 'Custom'),
            difficulty: String(item.difficulty || 'medium').toLowerCase(),
            src: 'curated'
          });
        }
      }
    }
    const merged = normalized.concat(general);
    if (merged.length) {
      ALL_WORDS = merged.slice();
      VISIBLE_WORDS = filterByDifficulty(ALL_WORDS, 'medium');
    }
  } catch (e) {
    ALL_WORDS = [];
    VISIBLE_WORDS = [];
  }
}

function prepareMasked(word) {
  maskedChars = Array.from(word).map(ch => {
    const c = String(ch || '');
    const upper = c.toUpperCase();
    const symbol = !isLetter(upper);
    return { char: upper, revealed: symbol, symbol };
  });
}

function renderWordRow() {
  const row = document.getElementById('word-row');
  if (!row) return;
  row.innerHTML = '';
  maskedChars.forEach((m, idx) => {
    const box = document.createElement('div');
    box.className = 'letter-box';
    const ch = document.createElement('div');
    ch.className = 'letter-char';
    ch.textContent = m.revealed ? m.char : '';
    const line = document.createElement('div');
    line.className = 'letter-line';
    if (m.revealed) line.style.visibility = 'hidden';
    box.appendChild(ch);
    box.appendChild(line);
    row.appendChild(box);
  });
}

function buildKeyboard() {
  const keys = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const kb = document.getElementById('keyboard');
  if (!kb) return;
  kb.innerHTML = '';
  const rows = [keys.slice(0,10), keys.slice(10,19), keys.slice(19)];
  rows.forEach(r => {
    const row = document.createElement('div');
    row.className = 'kb-row';
    r.forEach(k => {
      const btn = document.createElement('div');
      btn.className = 'kb-key';
      btn.textContent = k;
      btn.id = `key-${k}`;
      row.appendChild(btn);
    });
    kb.appendChild(row);
  });
}

function handleGuess(letter, found) {
  const btn = document.getElementById(`key-${letter}`);
  if (btn) {
    btn.classList.add(found ? 'correct' : 'wrong');
  }
  if (!found) {
    wrongCount = Math.min(MAX_WRONG, wrongCount + 1);
    updateHangmanParts();
  } else {
    renderWordRow();
  }
  checkWinLose();
}

function updateHangmanParts() {
  const parts = ['hm-head','hm-body','hm-la','hm-ra','hm-ll','hm-rl'];
  parts.forEach((id, i) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (i < wrongCount) el.classList.add('show'); else el.classList.remove('show');
  });
  updateLives();
}

function updateLives() {
  const container = document.getElementById('lives-container');
  if (!container) return;
  container.innerHTML = '';
  for (let i = 0; i < MAX_WRONG; i++) {
    const dot = document.createElement('div');
    dot.className = 'life-dot';
    if (i >= wrongCount) dot.classList.add('lost');
    container.appendChild(dot);
  }
}

function checkWinLose() {
  const allRevealed = maskedChars.every(m => m.revealed);
  const status = document.getElementById('game-status');
  if (allRevealed) {
    if (status) status.textContent = '🎉 SOLVED!';
  } else if (wrongCount >= MAX_WRONG) {
    if (status) status.textContent = `Game over! Word: ${revealedWord}`;
  } else {
    if (status) status.textContent = getStreamerNamespace() ? `@${getStreamerNamespace()}'s Game` : 'HangStream';
  }
}

// How often a round is drawn from the curated pool rather than the general
// one. These mirror server/games/dictionary.js.
const CURATED_PREFERENCE = 0.6;
const MIN_CURATED_STOCK = 40;

function newGame() {
  wrongCount = 0;
  const pool = Array.isArray(VISIBLE_WORDS) && VISIBLE_WORDS.length ? VISIBLE_WORDS : (Array.isArray(ALL_WORDS) ? ALL_WORDS : []);

  // Filter out already used words
  const availableWords = pool.filter(w => !usedWords.has(w.word));

  // If all words used, reset and start over
  let candidates = availableWords.length ? availableWords : pool;
  if (candidates.length === 0) {
    usedWords.clear();
    candidates = pool;
  }

  // Prefer a curated word so the category badge keeps meaning something.
  const curated = candidates.filter(w => w.src === 'curated');
  let choice;
  if (curated.length >= MIN_CURATED_STOCK && Math.random() < CURATED_PREFERENCE) {
    choice = curated[Math.floor(Math.random() * curated.length)];
  } else {
    choice = candidates[Math.floor(Math.random() * candidates.length)];
  }
  if (!choice) choice = { word: 'HANGMAN', cat: 'Games' };

  currentWord = String(choice.word || '').toUpperCase();
  currentCategory = String(choice.cat || 'Games');
  revealedWord = currentWord;
  usedWords.add(currentWord); // Track this word as used
  
  prepareMasked(currentWord);
  renderWordRow();
  buildKeyboard();
  updateHangmanParts();
  updateLives();
  updateCategoryDisplay();
  checkWinLose();
}

function updateCategoryDisplay() {
  const categoryEl = document.getElementById('word-category');
  if (categoryEl) {
    categoryEl.textContent = currentCategory;
  }
}

// WebSocket connection for multiplayer
let ws = null;
const streamerNamespace = getStreamerNamespace();

// Next-game vote card. The overlay is a passive viewer of the vote: rows are not
// clickable on stream (viewers vote in chat), so `interactive` stays false.
const voteCard = (function () {
  const slot = document.getElementById('vote-slot');
  if (!slot || !window.HangStreamVoteCard) return null;
  try {
    return window.HangStreamVoteCard.create(slot, { interactive: false });
  } catch (e) {
    console.warn('vote card failed to mount', e);
    return null;
  }
})();

function connectWebSocket() {
  if (!streamerNamespace) return; // Only connect in multiplayer mode

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}`;

  ws = new WebSocket(url);
  ws.addEventListener('open', () => {
    console.log('Overlay WebSocket connected');
    // Join the streamer's channel. `platform: both` with explicit channels is
    // how the other pages subscribe; the plain `channel` form alone does not
    // register a watcher, so the vote updates would never arrive.
    ws.send(JSON.stringify({
      type: 'watch',
      platform: 'both',
      owner: streamerNamespace,
      twitchChannel: streamerNamespace,
      tiktokChannel: streamerNamespace
    }));
    // Request current game state
    ws.send(JSON.stringify({ type: 'requestGameState', owner: streamerNamespace }));
    // Ask for the current vote surface so a reload mid-vote is instantly correct.
    ws.send(JSON.stringify({ type: 'game-vote-state', owner: streamerNamespace }));
  });

  ws.addEventListener('message', (ev) => {
    try {
      const data = JSON.parse(ev.data || '{}');
      if (data && data.type === 'guess') {
        // Handle guess from chat
        const letter = data.letter ? data.letter.toUpperCase() : '';
        if (letter && isLetter(letter)) {
          let found = false;
          maskedChars.forEach(m => {
            if (!m.revealed && m.char === letter) {
              m.revealed = true;
              found = true;
            }
          });
          handleGuess(letter, found);
        }
      } else if (data && data.type === 'newGame') {
        // Handle new game event from streamer - sync the word
        if (data.word) {
          currentWord = String(data.word || '').toUpperCase();
          currentCategory = String(data.category || 'Games');
          revealedWord = currentWord;
          prepareMasked(currentWord);
          renderWordRow();
          buildKeyboard();
          updateHangmanParts();
          updateLives();
          updateCategoryDisplay();
          checkWinLose();
        }
      } else if (data && data.type === 'gameOver') {
        // Handle game over event - show correct word
        if (data.word) {
          revealedWord = String(data.word || '').toUpperCase();
          wrongCount = MAX_WRONG;
          // Reveal all letters in the word display
          maskedChars.forEach(m => {
            m.revealed = true;
          });
          renderWordRow();
          updateHangmanParts();
          checkWinLose(); // This will update the game-status display
        }
      } else if (data && data.type === 'gameState') {
        // Handle current game state response
        if (data.word) {
          currentWord = String(data.word || '').toUpperCase();
          currentCategory = String(data.category || 'Games');
          revealedWord = currentWord;
          prepareMasked(currentWord);
          renderWordRow();
          buildKeyboard();
          updateHangmanParts();
          updateLives();
          updateCategoryDisplay();
        }
      } else if (data && data.type === 'leaderboard' && data.scores) {
        // Handle leaderboard events
        showLeaderboard(data.scores);
      } else if (data && data.type === 'game-vote-update') {
        // Full vote surface on every change, so the card just re-renders.
        if (voteCard) voteCard.render(data.vote || null);
      } else if (data && data.type === 'game-vote-action' && data.action === 'vote') {
        // The overlay never votes, but the ack confirms the ballot is live.
        console.debug('game vote ack', data);
      }
    } catch (e) { console.warn('Invalid WS message', e); }
  });

  ws.addEventListener('close', () => {
    console.log('Overlay WebSocket disconnected, reconnecting in 5s...');
    setTimeout(connectWebSocket, 5000);
  });

  ws.addEventListener('error', (e) => {
    console.warn('Overlay WebSocket error', e);
    ws.close();
  });
}

// Leaderboard functions
function showLeaderboard(scores) {
  const overlay = document.getElementById('leaderboard-overlay');
  const list = document.getElementById('leaderboard-list');
  
  if (!overlay || !list) return;
  
  // Sort by score (descending)
  const sortedScores = scores.sort((a, b) => b.score - a.score).slice(0, 5);
  
  list.innerHTML = '';
  
  sortedScores.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'leaderboard-item';
    div.innerHTML = `
      <div class="leaderboard-rank rank-${index + 1}">${index + 1}</div>
      <div class="leaderboard-name">${item.name}</div>
      <div class="leaderboard-score">${item.score} pts</div>
    `;
    list.appendChild(div);
  });
  
  overlay.classList.add('visible');
  
  // Auto-hide after 8 seconds
  setTimeout(() => {
    hideLeaderboard();
  }, 8000);
}

function hideLeaderboard() {
  const overlay = document.getElementById('leaderboard-overlay');
  if (overlay) {
    overlay.classList.remove('visible');
  }
}

// Initialize
loadCustomWordsFile().then(() => {
  setTimeout(() => {
    // Only start a local game if not in multiplayer mode
    if (!streamerNamespace) {
      newGame();
      // No channel to watch, so poll the public vote surface directly. This
      // covers an overlay opened without a streamer namespace during setup.
      pollPublicVote();
    } else {
      // In multiplayer mode, connect to WebSocket and wait for streamer's word
      connectWebSocket();
    }
  }, 500);
});

// Fallback used only when the overlay has no streamer namespace: the ws updates
// need a channel, so read the public snapshot on a slow timer instead.
function pollPublicVote() {
  if (!voteCard) return;
  const tick = () => {
    fetch('/games/api/vote/state?owner=public', { cache: 'no-store' })
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => { if (data) voteCard.render(data.vote || null); })
      .catch(() => {});
  };
  tick();
  setInterval(tick, 5000);
}
</script>
</body>
</html>
