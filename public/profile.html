<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile - HangStream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0e12;
      --bg-elevated: #0b0b0f;
      --bg-alt: #0b0b0f;
      --card: #1a1a22;
      --card-border: #2a2a35;
      --panel: #1a1a22;
      --panel-border: #2a2a35;
      --text: #f0ede8;
      --text-muted: #92a0af;
      --muted: #92a0af;
      --accent: #ff4d6d;
      --accent-2: #7c5cff;
      --accent-3: #7c5cff;
      --good: #25c27a;
      --warning: #ffbe55;
      --bad: #ff4d4d;
      --danger: #ff4d4d;
      --glass: rgba(255,255,255,0.05);
      --radius: 24px;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --bg-elevated: #ffffff;
      --bg-alt: #ffffff;
      --card: #ffffff;
      --card-border: #e2e8f0;
      --panel: #ffffff;
      --panel-border: #e2e8f0;
      --text: #0f1724;
      --text-muted: #64748b;
      --muted: #64748b;
      --glass: rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 77, 109, 0.15), transparent 28%),
        radial-gradient(circle at top right, rgba(124, 92, 255, 0.12), transparent 24%),
        radial-gradient(circle at bottom left, rgba(37, 194, 122, 0.08), transparent 20%),
        linear-gradient(180deg, color-mix(in srgb, var(--bg) 95%, #000), var(--bg));
    }

    [data-theme="light"] body {
      background:
        radial-gradient(circle at top left, rgba(255, 77, 109, 0.08), transparent 28%),
        radial-gradient(circle at top right, rgba(124, 92, 255, 0.06), transparent 24%),
        radial-gradient(circle at bottom left, rgba(37, 194, 122, 0.04), transparent 20%),
        linear-gradient(180deg, #f8fafc, #ffffff);
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-left h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 0.02em;
    }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .back-link:hover { color: var(--text); }

    .profile-header {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 40px;
      margin-bottom: 30px;
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }

    .profile-avatar-large {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
      position: relative;
    }

    .profile-avatar-large.donor {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 30px var(--accent), 0 0 60px var(--accent-2);
      animation: donorGlow 2s ease-in-out infinite alternate;
    }

    @keyframes donorGlow {
      0% {
        box-shadow: 0 0 30px var(--accent), 0 0 60px var(--accent-2);
      }
      100% {
        box-shadow: 0 0 40px var(--accent), 0 0 80px var(--accent-2), 0 0 100px var(--accent);
      }
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .profile-id {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .linked-accounts {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .linked-account {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
    }

    .linked-account-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .linked-account-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .linked-account-icon.google {
      background: #DB4437;
    }

    .linked-account-icon.tiktok {
      background: #000000;
    }

    .linked-account-icon.twitch {
      background: #9146FF;
    }

    .linked-account-details {
      display: flex;
      flex-direction: column;
    }

    .linked-account-name {
      font-weight: 600;
      font-size: 14px;
    }

    .linked-account-status {
      font-size: 12px;
      color: var(--text-muted);
    }

    .linked-account-actions {
      display: flex;
      gap: 8px;
    }

    .btn-link {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-link-primary {
      background: var(--accent);
      color: white;
    }

    .btn-link-primary:hover {
      background: var(--accent-2);
    }

    .btn-link-secondary {
      background: var(--panel-border);
      color: var(--text);
    }

    .btn-link-secondary:hover {
      background: var(--card-border);
    }

    .btn-link-danger {
      background: var(--bad);
      color: white;
    }

    .btn-link-danger:hover {
      background: #d43d3d;
    }

    .badge.viewer {
      background: color-mix(in srgb, var(--accent-2) 15%, transparent);
      border: 1px solid var(--accent-2);
      color: var(--accent-2);
    }

    .badge.streamer {
      background: color-mix(in srgb, var(--good) 15%, transparent);
      border: 1px solid var(--good);
      color: var(--good);
    }

    .badge.donor {
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .badge.tiktok {
      background: color-mix(in srgb, #000000 15%, transparent);
      border: 1px solid #666;
      color: #ccc;
    }

    .badge.twitch {
      background: color-mix(in srgb, #9146FF 15%, transparent);
      border: 1px solid #9146FF;
      color: #9146FF;
    }

    .badge.hidden { display: none; }

    .donor-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      border: 1px solid var(--accent);
      border-radius: 12px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .donor-badge.hidden { display: none; }

    .section {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 30px;
    }

    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      margin-bottom: 20px;
    }

    .bio-section {
      position: relative;
    }

    .bio-text {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
      min-height: 60px;
    }

    .bio-text.empty {
      color: var(--text-muted);
      font-style: italic;
    }

    .edit-bio-btn {
      position: absolute;
      top: 0;
      right: 0;
      padding: 8px 16px;
      background: var(--bg-alt);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .edit-bio-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .bio-edit {
      display: none;
      margin-top: 16px;
    }

    .bio-edit.show { display: block; }

    .bio-textarea {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: var(--bg-alt);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: vertical;
      margin-bottom: 12px;
    }

    .bio-textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .bio-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 77, 109, 0.4);
    }

    .btn-secondary {
      background: var(--bg-alt);
      border: 1px solid var(--card-border);
      color: var(--text);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
    }

    .themes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .theme-card {
      background: var(--bg-alt);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .theme-card:hover:not(.locked) {
      border-color: var(--accent);
      transform: translateY(-4px);
    }

    .theme-card.locked {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .theme-card.active {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }

    .theme-name {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .theme-preview {
      height: 60px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .theme-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .theme-badge.donor {
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .lock-icon {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 18px;
    }

    .not-signed-in {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }

    .not-signed-in h2 {
      font-size: 28px;
      margin-bottom: 16px;
      color: var(--text);
    }

    .btn-large {
      padding: 14px 28px;
      font-size: 16px;
    }

    @media (max-width: 768px) {
      .profile-header {
        flex-direction: column;
        text-align: center;
      }

      .profile-avatar-large {
        margin: 0 auto;
      }

      .edit-bio-btn {
        position: static;
        margin-top: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <a href="/" class="back-link">← Back to Games</a>
        <h1>Profile</h1>
      </div>
    </div>

    <div id="signed-in-content" style="display:none;">
      <div class="profile-header">
        <div class="profile-avatar-large" id="profile-avatar">?</div>
        <div class="profile-info">
          <div class="profile-name" id="profile-name">User</div>
          <div class="profile-id" id="profile-id">ID: unknown</div>
          <div class="badges">
            <span class="badge viewer" id="viewer-badge">👁️ Viewer</span>
            <span class="badge streamer hidden" id="streamer-badge">🎬 Streamer</span>
            <span class="badge donor hidden" id="donor-badge">❤️ Donor</span>
          </div>
        </div>
      </div>

      <div class="section bio-section">
        <div class="section-title">Bio</div>
        <div class="bio-text" id="bio-text">No bio yet. Click Edit to add one!</div>
        <button class="edit-bio-btn" onclick="toggleBioEdit()">Edit Bio</button>
        <div class="bio-edit" id="bio-edit">
          <textarea class="bio-textarea" id="bio-textarea" placeholder="Tell us about yourself..."></textarea>
          <div class="bio-actions">
            <button class="btn btn-primary" onclick="saveBio()">Save</button>
            <button class="btn btn-secondary" onclick="toggleBioEdit()">Cancel</button>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Linked Accounts</div>
        <div class="linked-accounts" id="linked-accounts">
          <!-- Linked accounts will be loaded here -->
        </div>
      </div>

      <div class="section">
        <div class="section-title">Themes</div>
        <div class="themes-grid" id="themes-grid">
          <!-- Themes will be loaded here -->
        </div>
      </div>
    </div>

    <div id="not-signed-in" class="not-signed-in">
      <h2>You're not signed in</h2>
      <p style="margin-bottom: 24px;">Sign in with Google to view and edit your profile.</p>
      <button class="btn btn-primary btn-large" onclick="window.location.href='/'">Sign in with Google</button>
    </div>
  </div>

  <script>
    const PROFILE_KEY = 'hangstream-viewer-profile';
    let profile = null;
    let isDonor = false;
    let isStreamer = false;

    // Theme definitions
    const themes = [
      { id: 'dark', name: 'Dark Mode', bg: '#0e0e12', donor: false },
      { id: 'light', name: 'Light Mode', bg: '#f8fafc', donor: false },
      { id: 'neon', name: 'Neon Glow', bg: '#1a0a2e', donor: true },
      { id: 'sunset', name: 'Sunset', bg: '#2d1b4e', donor: true },
      { id: 'ocean', name: 'Ocean Blue', bg: '#0a1628', donor: true },
      { id: 'forest', name: 'Forest Green', bg: '#0a1f0a', donor: true },
    ];

    function loadProfile() {
      try {
        const saved = localStorage.getItem(PROFILE_KEY);
        if (saved) {
          profile = JSON.parse(saved);
          if (profile && profile.name) {
            document.getElementById('signed-in-content').style.display = 'block';
            document.getElementById('not-signed-in').style.display = 'none';
            renderProfile();
            loadThemes();
            // Load linked accounts from server
            loadProfileFromServer();
            return true;
          }
        }
      } catch (e) {
        console.error('Error loading profile:', e);
      }
      document.getElementById('signed-in-content').style.display = 'none';
      document.getElementById('not-signed-in').style.display = 'block';
      return false;
    }

    function loadProfileFromServer() {
      if (!profile || !profile.id) return;
      fetch(`/viewer/profile?id=${encodeURIComponent(profile.id)}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.linkedAccounts) {
            profile.linkedAccounts = data.linkedAccounts;
            try {
              localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
            } catch (e) {
              console.error('Error saving profile:', e);
            }
            loadLinkedAccounts();
            updateBadges();
          }
        })
        .catch(e => {
          console.error('Error loading profile from server:', e);
        });
    }

    function renderProfile() {
      if (!profile) return;

      const avatar = document.getElementById('profile-avatar');
      const name = document.getElementById('profile-name');
      const id = document.getElementById('profile-id');
      const bioText = document.getElementById('bio-text');

      if (avatar) avatar.textContent = profile.name.charAt(0).toUpperCase();
      if (name) name.textContent = profile.name;
      if (id) id.textContent = `ID: ${profile.id || 'unknown'}`;

      // Check donor and streamer status (these will update badges automatically)
      checkDonorStatus();
      checkStreamerStatus();

      // Load bio
      loadBio();

      // Load linked accounts
      loadLinkedAccounts();

      // Update badges with linked accounts
      updateBadges();
    }

    function loadLinkedAccounts() {
      const container = document.getElementById('linked-accounts');
      if (!container) return;

      const linkedAccounts = profile.linkedAccounts || {};

      // Always show Google (primary account)
      let html = `
        <div class="linked-account">
          <div class="linked-account-info">
            <div class="linked-account-icon google">G</div>
            <div class="linked-account-details">
              <div class="linked-account-name">Google</div>
              <div class="linked-account-status">${profile.name} (Primary)</div>
            </div>
          </div>
          <div class="linked-account-actions">
            <span style="color: var(--good); font-size: 12px; font-weight: 600;">✓ Connected</span>
          </div>
        </div>
      `;

      // TikTok
      if (linkedAccounts.tiktok) {
        html += `
          <div class="linked-account">
            <div class="linked-account-info">
              <div class="linked-account-icon tiktok">🎵</div>
              <div class="linked-account-details">
                <div class="linked-account-name">TikTok</div>
                <div class="linked-account-status">@${linkedAccounts.tiktok.username || 'Connected'}</div>
              </div>
            </div>
            <div class="linked-account-actions">
              <button class="btn-link btn-link-danger" onclick="unlinkAccount('tiktok')">Unlink</button>
            </div>
          </div>
        `;
      } else {
        html += `
          <div class="linked-account">
            <div class="linked-account-info">
              <div class="linked-account-icon tiktok">🎵</div>
              <div class="linked-account-details">
                <div class="linked-account-name">TikTok</div>
                <div class="linked-account-status">Not connected</div>
              </div>
            </div>
            <div class="linked-account-actions">
              <button class="btn-link btn-link-primary" onclick="linkTikTok()">Connect</button>
            </div>
          </div>
        `;
      }

      // Twitch
      if (linkedAccounts.twitch) {
        html += `
          <div class="linked-account">
            <div class="linked-account-info">
              <div class="linked-account-icon twitch">📺</div>
              <div class="linked-account-details">
                <div class="linked-account-name">Twitch</div>
                <div class="linked-account-status">${linkedAccounts.twitch.username || 'Connected'}</div>
              </div>
            </div>
            <div class="linked-account-actions">
              <button class="btn-link btn-link-danger" onclick="unlinkAccount('twitch')">Unlink</button>
            </div>
          </div>
        `;
      } else {
        html += `
          <div class="linked-account">
            <div class="linked-account-info">
              <div class="linked-account-icon twitch">📺</div>
              <div class="linked-account-details">
                <div class="linked-account-name">Twitch</div>
                <div class="linked-account-status">Not connected</div>
              </div>
            </div>
            <div class="linked-account-actions">
              <button class="btn-link btn-link-primary" onclick="linkTwitch()">Connect</button>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function updateBadges() {
      const badgesContainer = document.getElementById('badges');
      if (!badgesContainer) return;

      const linkedAccounts = profile.linkedAccounts || {};
      let badgesHtml = '';

      // Viewer badge (always shown if signed in)
      badgesHtml += `<span class="badge viewer">👤 Viewer</span>`;

      // Donor badge
      if (isDonor) {
        badgesHtml += `<span class="badge donor">❤️ Donor</span>`;
      }

      // Streamer badge
      if (isStreamer) {
        badgesHtml += `<span class="badge streamer">🎥 Streamer</span>`;
      }

      // TikTok badge
      if (linkedAccounts.tiktok) {
        badgesHtml += `<span class="badge tiktok">🎵 TikTok</span>`;
      }

      // Twitch badge
      if (linkedAccounts.twitch) {
        badgesHtml += `<span class="badge twitch">📺 Twitch</span>`;
      }

      badgesContainer.innerHTML = badgesHtml;
    }

    function linkTikTok() {
      // Open TikTok OAuth in a popup with viewer-specific redirect
      const width = 500;
      const height = 600;
      const left = (window.screen.width - width) / 2;
      const top = (window.screen.height - height) / 2;
      const authUrl = '/oauth?redirect_uri=' + encodeURIComponent(window.location.origin + '/auth/tiktok/callback');
      window.open(authUrl, 'tiktokAuth', `width=${width},height=${height},left=${left},top=${top}`);
    }

    function linkTwitch() {
      // Open Twitch OAuth in a popup with viewer-specific redirect
      const width = 500;
      const height = 600;
      const left = (window.screen.width - width) / 2;
      const top = (window.screen.height - height) / 2;
      const authUrl = '/oauth/twitch?redirect_uri=' + encodeURIComponent(window.location.origin + '/auth/twitch/callback');
      window.open(authUrl, 'twitchAuth', `width=${width},height=${height},left=${left},top=${top}`);
    }

    // Listen for account-linked messages from OAuth popups
    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin) return;
      if (event.data && event.data.type === 'account-linked') {
        console.log('Account linked:', event.data);
        // Reload profile to show linked account
        loadProfile();
      }
    });

    function unlinkAccount(platform) {
      if (!confirm(`Are you sure you want to unlink your ${platform} account?`)) return;

      if (!profile.linkedAccounts) {
        profile.linkedAccounts = {};
      }
      delete profile.linkedAccounts[platform];

      // Save to localStorage
      try {
        localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
      } catch (e) {
        console.error('Error saving profile:', e);
      }

      // Update server
      fetch('/viewer/linked-accounts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'unlink',
          platform
        })
      }).then(res => res.json())
        .then(data => {
          if (data.success) {
            loadLinkedAccounts();
            updateBadges();
          } else {
            alert('Failed to unlink account: ' + (data.error || 'Unknown error'));
          }
        })
        .catch(e => {
          console.error('Error unlinking account:', e);
          alert('Failed to unlink account');
        });
    }


    function checkDonorStatus() {
      // Fetch from server
      fetch('/viewer/is-donor')
        .then(res => res.json())
        .then(data => {
          isDonor = data.isDonor === true;
          // Update badge visibility
          const donorBadge = document.getElementById('donor-badge');
          const avatar = document.getElementById('profile-avatar');
          
          if (isDonor && donorBadge) {
            donorBadge.classList.remove('hidden');
          } else if (donorBadge) {
            donorBadge.classList.add('hidden');
          }

          // Add donor glow effect to avatar
          if (isDonor && avatar) {
            avatar.classList.add('donor');
          } else if (avatar) {
            avatar.classList.remove('donor');
          }
        })
        .catch(e => {
          console.error('Error checking donor status:', e);
        });
    }

    function checkStreamerStatus() {
      // Fetch from server
      fetch('/viewer/is-streamer')
        .then(res => res.json())
        .then(data => {
          isStreamer = data.isStreamer === true;
          // Update badge visibility
          const streamerBadge = document.getElementById('streamer-badge');
          if (isStreamer && streamerBadge) {
            streamerBadge.classList.remove('hidden');
          } else if (streamerBadge) {
            streamerBadge.classList.add('hidden');
          }
        })
        .catch(e => {
          console.error('Error checking streamer status:', e);
        });
    }

    function loadBio() {
      try {
        const bioData = localStorage.getItem('hangstream-bio');
        if (bioData) {
          const bio = JSON.parse(bioData);
          if (bio && bio[profile.id]) {
            const bioText = document.getElementById('bio-text');
            if (bioText) {
              bioText.textContent = bio[profile.id];
              bioText.classList.remove('empty');
            }
          }
        }
      } catch (e) {}
    }

    function toggleBioEdit() {
      const edit = document.getElementById('bio-edit');
      const textarea = document.getElementById('bio-textarea');
      const bioText = document.getElementById('bio-text');

      if (edit.classList.contains('show')) {
        edit.classList.remove('show');
      } else {
        textarea.value = bioText.textContent === 'No bio yet. Click Edit to add one!' ? '' : bioText.textContent;
        edit.classList.add('show');
        textarea.focus();
      }
    }

    function saveBio() {
      const textarea = document.getElementById('bio-textarea');
      const bioText = document.getElementById('bio-text');
      const bio = textarea.value.trim();

      try {
        let bioData = {};
        const saved = localStorage.getItem('hangstream-bio');
        if (saved) {
          bioData = JSON.parse(saved);
        }
        bioData[profile.id] = bio || '';
        localStorage.setItem('hangstream-bio', JSON.stringify(bioData));

        if (bio) {
          bioText.textContent = bio;
          bioText.classList.remove('empty');
        } else {
          bioText.textContent = 'No bio yet. Click Edit to add one!';
          bioText.classList.add('empty');
        }

        toggleBioEdit();
      } catch (e) {
        alert('Failed to save bio');
      }
    }

    function loadThemes() {
      const grid = document.getElementById('themes-grid');
      if (!grid) return;

      const currentTheme = localStorage.getItem('theme') || 'dark';

      grid.innerHTML = themes.map(theme => `
        <div class="theme-card ${theme.id === currentTheme ? 'active' : ''} ${theme.donor && !isDonor ? 'locked' : ''}"
             onclick="${theme.donor && !isDonor ? '' : `selectTheme('${theme.id}')`}">
          ${theme.donor && !isDonor ? '<span class="lock-icon">🔒</span>' : ''}
          <div class="theme-preview" style="background: ${theme.bg};"></div>
          <div class="theme-name">${theme.name}</div>
          ${theme.donor ? '<span class="theme-badge donor">Donor Only</span>' : ''}
        </div>
      `).join('');
    }

    function selectTheme(themeId) {
      localStorage.setItem('theme', themeId);
      document.documentElement.setAttribute('data-theme', themeId === 'light' ? 'light' : 'dark');
      loadThemes(); // Refresh to show active state
    }

    // Load profile on page load
    loadProfile();
  </script>
</body>
</html>
