<title>Wordle - HangStream</title>
<style id="inline-shared">
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap');

  :root {
    --bg: #0e0e12;
    --bg-elevated: #0b0b0f;
    --panel: #1a1a22;
    --panel-strong: #20202a;
    --text: #f0ede8;
    --text-muted: #888;
    --muted: #666;
    --border: #2a2a35;
    --accent: #ff4d6d;
    --accent-hover: #ff6b85;
    --good: #2ecc71;
    --bad: #ff7a7a;
    --secondary: #3a3a45;
    color-scheme: dark;
  }

  body[data-theme="light"] {
    --bg: #f5f0ea;
    --bg-elevated: #efe8e1;
    --panel: #ffffff;
    --panel-strong: #f8f2ec;
    --text: #1f1f28;
    --text-muted: #5c5c68;
    --muted: #6f6f7c;
    --border: #d7cfc6;
    --accent: #c93f5c;
    --accent-hover: #e15a76;
    --good: #1f8f53;
    --bad: #c74444;
    --secondary: #7b7681;
    color-scheme: light;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at top left, rgba(255, 77, 109, 0.10), transparent 28%),
      radial-gradient(circle at top right, rgba(124, 92, 255, 0.10), transparent 24%),
      linear-gradient(180deg, color-mix(in srgb, var(--bg) 90%, #000 10%), var(--bg));
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }

  .game-wrap {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    grid-template-rows: auto 1fr auto;
    min-height: 100vh;
    gap: 16px;
    padding: 20px;
  }

  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: color-mix(in srgb, var(--bg-elevated) 88%, transparent);
    backdrop-filter: blur(16px);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.14);
  }

  .logo {
    font-family: Inter, system-ui, sans-serif;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.16em;
    color: var(--accent);
  }

  .logo span { color: var(--text); }

  .score-display {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  .score-number {
    color: var(--accent);
    font-size: 24px;
  }

  .category-badge {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-muted);
    text-transform: uppercase;
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--panel) 80%, transparent);
  }

  .game-area {
    display: flex;
    min-width: 0;
  }

  .game-main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px 34px;
    gap: 24px;
    border: 1px solid var(--border);
    border-radius: 28px;
    background: color-mix(in srgb, var(--bg-elevated) 88%, transparent);
    backdrop-filter: blur(16px);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.14);
    min-width: 0;
    width: 100%;
  }

  /* ── BOARD ── */
  .board {
    display: flex;
    flex-direction: column;
    gap: 6px;
    user-select: none;
  }

  .board-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .tile {
    width: 62px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 34px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text);
    background: color-mix(in srgb, var(--panel) 85%, transparent);
    border: 2px solid var(--border);
    border-radius: 10px;
    transition: border-color 0.12s, background-color 0.12s, color 0.12s;
  }

  .tile.filled {
    border-color: var(--text-muted);
    animation: tile-pop 0.1s ease;
  }

  .tile.correct {
    background: var(--good);
    border-color: var(--good);
    color: #ffffff;
  }

  .tile.present {
    background: #f0b429;
    border-color: #f0b429;
    color: #1f1f28;
  }

  .tile.absent {
    background: var(--secondary);
    border-color: var(--secondary);
    color: var(--text-muted);
  }

  .tile.reveal {
    animation: tile-reveal 0.5s ease;
  }

  @keyframes tile-pop {
    0% { transform: scale(0.92); }
    100% { transform: scale(1); }
  }

  @keyframes tile-reveal {
    0% { transform: rotateX(0deg); }
    50% { transform: rotateX(90deg); }
    100% { transform: rotateX(0deg); }
  }

  .board.shake {
    animation: board-shake 0.4s ease;
  }

  @keyframes board-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  /* ── KEYBOARD ── */
  .keyboard {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    max-width: 520px;
    align-items: center;
  }

  .hint-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin: 10px 0;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(255, 77, 109, 0.3);
  }

  .hint-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(255, 77, 109, 0.4);
  }

  .hint-btn:active {
    transform: translateY(0);
  }

  .kb-row {
    display: flex;
    gap: 6px;
    width: 100%;
    justify-content: center;
  }

  .key {
    flex: 1;
    max-width: 44px;
    padding: 13px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.12s;
    user-select: none;
    -webkit-user-select: none;
  }

  .key:hover { border-color: var(--accent); color: var(--accent); }
  .key:active { transform: scale(0.94); }

  .key.wide {
    max-width: 70px;
    font-size: 11px;
    letter-spacing: 0.05em;
  }

  .key.state-correct {
    background: var(--good);
    border-color: var(--good);
    color: #ffffff;
  }

  .key.state-present {
    background: #f0b429;
    border-color: #f0b429;
    color: #1f1f28;
  }

  .key.state-absent {
    background: var(--secondary);
    border-color: var(--secondary);
    color: var(--text-muted);
    opacity: 0.75;
  }

  .instructions {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.5;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    border: 1px solid var(--border);
    border-radius: 28px;
    display: flex;
    flex-direction: column;
    background: color-mix(in srgb, var(--bg-elevated) 90%, transparent);
    backdrop-filter: blur(14px);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.14);
    min-width: 0;
    overflow: hidden;
  }

  .sidebar-head {
    padding: 18px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    letter-spacing: 2.2px;
    color: var(--muted);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  .twitch-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--muted);
  }

  .twitch-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
  }

  .twitch-dot.connected { background: var(--good); }

  .chat-feed {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: calc(100vh - 60px);
  }

  .chat-msg {
    font-size: 13px;
    line-height: 1.5;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .chat-user { color: var(--accent); font-weight: 700; }
  .chat-guess { color: color-mix(in srgb, var(--text) 94%, transparent); }
  .chat-system { color: var(--muted); font-style: italic; }
  .chat-correct { color: var(--good); }
  .chat-wrong { color: var(--bad); }

  .settings-btn {
    background: color-mix(in srgb, var(--panel) 80%, transparent);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 14px;
    font-family: Inter, system-ui, sans-serif;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.15s;
  }

  .settings-btn:hover { color: var(--text); border-color: var(--secondary); }

  .theme-btn {
    background: color-mix(in srgb, var(--panel) 80%, transparent);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 14px;
    font-family: Inter, system-ui, sans-serif;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.15s;
    min-width: 104px;
  }

  .theme-btn:hover { color: var(--text); border-color: var(--secondary); }

  .profile-dropdown {
    position: relative;
  }

  .profile-trigger {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    border-radius: 14px;
    background: color-mix(in srgb, var(--panel) 80%, transparent);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    font-size: 13px;
    font-weight: 600;
  }

  .profile-trigger:hover {
    color: var(--text);
    border-color: var(--secondary);
    background: color-mix(in srgb, var(--panel) 90%, transparent);
  }

  .profile-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: white;
  }

  .profile-avatar.donor {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 15px var(--accent), 0 0 30px var(--accent-2);
    animation: donorGlow 2s ease-in-out infinite alternate;
  }

  @keyframes donorGlow {
    0% {
      box-shadow: 0 0 15px var(--accent), 0 0 30px var(--accent-2);
    }
    100% {
      box-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent-2), 0 0 50px var(--accent);
    }
  }

  .profile-name {
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .profile-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px 0;
    min-width: 200px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: all 0.2s;
    z-index: 100;
  }

  .profile-menu.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .profile-menu-item {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: background 0.15s;
    color: var(--text);
    font-size: 13px;
    text-decoration: none;
  }

  .profile-menu-item:hover {
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }

  .profile-menu-item.danger {
    color: var(--bad);
  }

  .profile-menu-item.danger:hover {
    background: color-mix(in srgb, var(--bad) 10%, transparent);
  }

  .player-scores {
    margin: 12px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--bg-elevated);
    overflow: hidden;
  }

  .player-scores-head {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .player-scores-list {
    display: flex;
    flex-direction: column;
    max-height: 180px;
    overflow: auto;
  }

  .player-score-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    font-size: 12px;
  }

  .player-score-row:first-child { border-top: 0; }
  .player-score-name { color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player-score-points { color: var(--accent); font-weight: 700; }

  .message-box {
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 12px;
    text-align: center;
    font-size: 13px;
  }

  .message-box.success {
    background: color-mix(in srgb, var(--good) 15%, transparent);
    border: 1px solid var(--good);
    color: var(--good);
  }

  .message-box.error {
    background: color-mix(in srgb, var(--bad) 15%, transparent);
    border: 1px solid var(--bad);
    color: var(--bad);
  }

  .message-box.info {
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    border: 1px solid var(--accent);
    color: var(--accent);
  }

  body.overlay-mode .topbar,
  body.overlay-mode .sidebar,
  body.overlay-mode .settings-btn,
  body.overlay-mode .theme-btn {
    display: none !important;
  }

  body.overlay-mode .game-wrap {
    display: block;
  }

  body.overlay-mode .game-area {
    display: block;
  }

  body.overlay-mode .game-main {
    padding: 60px 34px;
  }

  /* Hide all ads on overlay for clean OBS stream */
  body.overlay-mode .adsbygoogle,
  body.overlay-mode ins.adsbygoogle {
    display: none !important;
  }

  @media (max-width: 640px) {
    body { overflow: auto; }
    .game-wrap { grid-template-columns: 1fr; grid-template-rows: auto auto auto; padding: 12px; gap: 12px; }
    .sidebar { border-left: 0; min-height: 260px; }
    .game-main { padding: 24px 18px; gap: 20px; }
    .topbar { flex-wrap: wrap; gap: 10px; }
    .category-badge { display: none; }
    .score-display { display: none; }
    .tile { width: 52px; height: 52px; font-size: 28px; }
    .key { max-width: 34px; padding: 11px 0; font-size: 12px; }
    .key.wide { max-width: 56px; font-size: 10px; }
  }
</style>

<script src="/wordle-words.js"></script>
<script>
// ── STATE VARS ──
let state = {
  viewerId: '',
  viewerName: '',
  viewerAvatar: '',
  streamerId: getStreamerNamespace(),
  gameMode: 'solo', // 'solo' or 'online'
  gameId: 'wordle',
};

let currentTheme = 'dark';
let playerScores = {};
let playerSessionId = null;
let chatWS = null;
let chatInterval = null;
let messageTimer = null;

// Wordle game state
let WORDS = [];
let answer = '';
let currentRow = 0;
let currentGuess = '';
let evaluations = []; // one entry per committed row: array of 5 states
let gameOver = false;
let keyStates = {}; // letter -> 'correct' | 'present' | 'absent'

const ROWS = 6;
const COLS = 5;
const GUESS_POINTS = [60, 50, 40, 30, 20, 10]; // points by row index (0-based)

const FAKE_USERS = ["xX_gamer99_Xx","streamer_fan","tiktok_live","chat_legend","just_vibing","pro_viewer","randomdude42","hyped_up_lol","lurker_no_more","gifted_sub","nochill_andy","pogchamp99"];

// ── UTILITY ──
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function getCookieValue(name) {
  const escaped = String(name || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const match = String(document.cookie || '').match(new RegExp('(?:^|; )' + escaped + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : '';
}

function getStreamerNamespace() {
  try {
    const cookieOwner = getCookieValue('owner');
    if (cookieOwner) return cookieOwner;
  } catch (e) {}
  try {
    const storedOwner = localStorage.getItem('hangstream-streamer-id') || '';
    if (storedOwner) return storedOwner;
  } catch (e) {}
  return 'default';
}

function getGameMode() {
  const path = window.location.pathname;
  if (path.includes('/online')) return 'online';
  if (path.includes('/solo')) return 'solo';
  return 'solo'; // default
}

function registerPlayer() {
  if (state.gameMode !== 'online') return;

  playerSessionId = Date.now().toString(36) + Math.random().toString(36).substr(2);

  fetch(`/game-join/${state.gameId}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId: playerSessionId })
  }).catch(() => {});
}

function unregisterPlayer() {
  if (state.gameMode !== 'online' || !playerSessionId) return;

  fetch(`/game-leave/${state.gameId}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId: playerSessionId })
  }).catch(() => {});

  playerSessionId = null;
}

function getThemeStorageKey() {
  return `hangstream-game-theme:${getStreamerNamespace()}`;
}

// ── THEME ──
function applyTheme(themeName) {
  currentTheme = themeName || 'dark';
  document.body.setAttribute('data-theme', currentTheme);
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = currentTheme === 'light' ? 'Light mode' : 'Dark mode';
  try { localStorage.setItem(getThemeStorageKey(), currentTheme); } catch (e) {}
}

function toggleTheme() {
  applyTheme(currentTheme === 'light' ? 'dark' : 'light');
}

// ── WORD LIST ──
function loadWordList() {
  try {
    // Top-level const in a classic script is a global lexical binding, not a window property
    if (typeof WORDLE_WORDS !== 'undefined' && Array.isArray(WORDLE_WORDS) && WORDLE_WORDS.length) {
      WORDS = WORDLE_WORDS.map((w) => String(w).toLowerCase());
    }
  } catch (e) {}
}

function isValidGuess(word) {
  const w = String(word || '').toLowerCase();
  if (WORDS.length) return WORDS.includes(w);
  return /^[a-z]{5}$/.test(w); // fallback: accept any 5 letters if list failed to load
}

function pickAnswer(randomize) {
  if (!WORDS.length) return 'crane';
  if (randomize) {
    let idx = Math.floor(Math.random() * WORDS.length);
    if (WORDS[idx].toUpperCase() === answer && WORDS.length > 1) {
      idx = (idx + 1) % WORDS.length;
    }
    return WORDS[idx].toUpperCase();
  }
  // Deterministic daily word
  const dayIndex = Math.floor(Date.now() / 86400000);
  return WORDS[((dayIndex % WORDS.length) + WORDS.length) % WORDS.length].toUpperCase();
}

// ── GAME LOGIC ──
function evaluateGuess(target, guess) {
  const result = Array(COLS).fill('absent');
  const counts = {};
  for (let i = 0; i < COLS; i++) {
    if (guess[i] === target[i]) {
      result[i] = 'correct';
    } else {
      counts[target[i]] = (counts[target[i]] || 0) + 1;
    }
  }
  for (let i = 0; i < COLS; i++) {
    if (result[i] === 'correct') continue;
    if (counts[guess[i]] > 0) {
      result[i] = 'present';
      counts[guess[i]]--;
    }
  }
  return result;
}

function renderBoard() {
  const board = document.getElementById('board');
  if (!board) return;
  board.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    const row = document.createElement('div');
    row.className = 'board-row';
    row.dataset.row = r;
    for (let c = 0; c < COLS; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.col = c;
      row.appendChild(tile);
    }
    board.appendChild(row);
  }
}

function renderCurrentRow() {
  const row = document.querySelector(`.board-row[data-row="${currentRow}"]`);
  if (!row) return;
  for (let c = 0; c < COLS; c++) {
    const tile = row.children[c];
    const letter = currentGuess[c] || '';
    tile.textContent = letter;
    tile.classList.toggle('filled', !!letter);
  }
}

function renderCommittedRow(rowIndex, word, result, animate) {
  const row = document.querySelector(`.board-row[data-row="${rowIndex}"]`);
  if (!row) return;
  for (let c = 0; c < COLS; c++) {
    const tile = row.children[c];
    tile.textContent = word[c];
    tile.classList.remove('filled');
    tile.classList.add(result[c]);
    if (animate) {
      tile.classList.add('reveal');
      tile.style.animationDelay = (c * 0.25) + 's';
    }
  }
}

function updateKeyboard() {
  const priority = { absent: 1, present: 2, correct: 3 };
  Object.keys(keyStates).forEach((letter) => {
    const keyEl = document.querySelector(`.key[data-key="${letter}"]`);
    if (!keyEl) return;
    const next = keyStates[letter];
    const current = keyEl.dataset.state || '';
    if (!current || priority[next] > priority[current]) {
      keyEl.dataset.state = next;
      keyEl.classList.remove('state-correct', 'state-present', 'state-absent');
      keyEl.classList.add('state-' + next);
    }
  });
}

function updateGuessCounter() {
  const el = document.getElementById('guess-count');
  if (el) el.textContent = currentRow;
}

function shakeBoard() {
  const board = document.getElementById('board');
  if (!board) return;
  board.classList.remove('shake');
  void board.offsetWidth;
  board.classList.add('shake');
}

function submitGuess(word, sourceUser) {
  const guess = String(word || '').toUpperCase();
  if (gameOver) return 'gameover';

  if (guess.length !== COLS) {
    shakeBoard();
    showMessage('Not enough letters', 'error');
    return 'invalid';
  }

  if (!isValidGuess(guess)) {
    shakeBoard();
    showMessage('Not in word list', 'error');
    return 'invalid';
  }

  if (evaluations.some((entry) => entry.word === guess)) {
    shakeBoard();
    showMessage('Already guessed', 'info');
    return 'duplicate';
  }

  const result = evaluateGuess(answer, guess);
  evaluations.push({ word: guess, result });
  renderCommittedRow(currentRow, guess, result, true);

  result.forEach((stateName, i) => {
    const letter = guess[i];
    const priority = { absent: 1, present: 2, correct: 3 };
    if (!keyStates[letter] || priority[stateName] > priority[keyStates[letter]]) {
      keyStates[letter] = stateName;
    }
  });

  currentRow++;
  currentGuess = '';
  updateGuessCounter();
  setTimeout(updateKeyboard, COLS * 250 + 250);

  if (guess === answer) {
    gameOver = true;
    const points = GUESS_POINTS[currentRow - 1] || 10;
    awardPlayerPoints(sourceUser || 'Viewer', points);
    showMessage(`Solved in ${currentRow} ${currentRow === 1 ? 'guess' : 'guesses'}! +${points} points — the word was ${answer}`, 'success');
    const instructions = document.getElementById('instructions');
    if (instructions) instructions.textContent = `Solved! The word was ${answer}. Press New Game to play again.`;
    return 'win';
  }

  if (currentRow >= ROWS) {
    gameOver = true;
    showMessage(`Out of guesses — the word was ${answer}`, 'error');
    const instructions = document.getElementById('instructions');
    if (instructions) instructions.textContent = `The word was ${answer}. Press New Game to try again.`;
    return 'lose';
  }

  return 'ok';
}

function handleKey(key) {
  if (gameOver || document.activeElement && document.activeElement.tagName === 'INPUT') return;

  if (key === 'Enter') {
    submitGuess(currentGuess, state.viewerName || 'You');
    renderCurrentRow();
    return;
  }

  if (key === 'Backspace' || key === 'Delete') {
    if (currentGuess.length > 0) {
      currentGuess = currentGuess.slice(0, -1);
      renderCurrentRow();
    }
    return;
  }

  if (/^[a-zA-Z]$/.test(key)) {
    if (currentGuess.length < COLS) {
      currentGuess += key.toUpperCase();
      renderCurrentRow();
    }
  }
}

function newGame(randomize) {
  answer = pickAnswer(randomize !== false);
  currentRow = 0;
  currentGuess = '';
  evaluations = [];
  gameOver = false;
  keyStates = {};

  renderBoard();
  updateGuessCounter();
  clearMessage();

  const instructions = document.getElementById('instructions');
  if (instructions) {
    instructions.textContent = state.gameMode === 'online'
      ? 'Guess the 5-letter word in 6 tries. Chat 5-letter guesses count in online mode.'
      : 'Guess the 5-letter word in 6 tries. Type or tap to enter your guess.';
  }
}

function buildKeyboard() {
  const keyboard = document.getElementById('keyboard');
  if (!keyboard) return;

  const rows = [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['ENTER','Z','X','C','V','B','N','M','⌫']
  ];

  keyboard.innerHTML = rows.map((row) => `
    <div class="kb-row">
      ${row.map((k) => {
        const isWide = (k === 'ENTER' || k === '⌫');
        const keyValue = (k === '⌫') ? 'Backspace' : k;
        return `<button type="button" class="key${isWide ? ' wide' : ''}" data-key="${keyValue}">${k}</button>`;
      }).join('')}
    </div>
  `).join('');

  keyboard.addEventListener('click', (e) => {
    const btn = e.target.closest('.key');
    if (!btn) return;
    handleKey(btn.dataset.key);
    renderCurrentRow();
  });
}

function showMessage(text, type) {
  const area = document.getElementById('message-area');
  if (!area) return;

  if (messageTimer) clearTimeout(messageTimer);
  area.innerHTML = `<div class="message-box ${type}">${escapeHtml(text)}</div>`;

  messageTimer = setTimeout(() => {
    area.innerHTML = '';
  }, 3200);
}

function clearMessage() {
  const area = document.getElementById('message-area');
  if (area) area.innerHTML = '';
  if (messageTimer) clearTimeout(messageTimer);
}

// ── PLAYER SCORES ──
function renderPlayerScores() {
  const list = document.getElementById('player-scores-list');
  if (!list) return;
  const entries = Object.entries(playerScores)
    .filter(([, points]) => Number(points) > 0)
    .sort((a, b) => Number(b[1]) - Number(a[1]) || a[0].localeCompare(b[0]));
  if (!entries.length) {
    list.innerHTML = '<div class="player-score-row"><span class="player-score-name">No points yet.</span><span class="player-score-points">0</span></div>';
    return;
  }
  list.innerHTML = entries.map(([name, points]) => {
    return `<div class="player-score-row"><span class="player-score-name">${escapeHtml(name)}</span><span class="player-score-points">${points}</span></div>`;
  }).join('');
}

function awardPlayerPoints(username, points) {
  const name = String(username || '').trim() || 'viewer';
  const current = Number(playerScores[name]) || 0;
  playerScores[name] = current + Math.max(0, Number(points) || 0);
  renderPlayerScores();
}

// ── CHAT INTEGRATION ──
function connectChatWebSocket() {
  if (chatWS) return;

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const wsUrl = `${proto}://${location.host}`;

  try {
    chatWS = new WebSocket(wsUrl);

    chatWS.addEventListener('open', () => {
      console.log('Chat WebSocket connected');
      // Subscribe to the streamer's channel if available
      if (state.streamerId && state.streamerId !== 'default') {
        chatWS.send(JSON.stringify({
          type: 'watch',
          platform: 'both',
          owner: state.streamerId,
          twitchChannel: state.streamerId,
          tiktokChannel: state.streamerId
        }));
      }
    });

    chatWS.addEventListener('message', (event) => {
      try {
        const data = JSON.parse(event.data);
        handleChatMessage(data);
      } catch (e) {
        console.error('Failed to parse chat message:', e);
      }
    });

    chatWS.addEventListener('close', () => {
      console.log('Chat WebSocket disconnected, reconnecting in 5s...');
      chatWS = null;
      setTimeout(connectChatWebSocket, 5000);
    });

    chatWS.addEventListener('error', () => {
      console.warn('Chat WebSocket error');
    });
  } catch (e) {
    console.error('Failed to create WebSocket connection:', e);
  }
}

function handleChatMessage(data) {
  // Update connection status
  const twitchDot = document.getElementById('twitch-dot');
  const twitchLabel = document.getElementById('twitch-label');
  if (twitchDot && twitchLabel) {
    if (data.type === 'chat' || data.type === 'status') {
      twitchDot.classList.add('connected');
      twitchLabel.textContent = 'CONNECTED';
    }
  }

  if (data.type === 'chat') {
    const user = data.user || 'viewer';
    const message = (data.message || '').trim().toUpperCase();

    // Chat guesses only count in online mode so solo play stays clean
    if (state.gameMode === 'online' && !gameOver && /^[A-Z]{5}$/.test(message)) {
      const outcome = submitGuess(message, user);
      if (outcome === 'invalid' || outcome === 'duplicate') {
        addChatMessage(user, message, 'wrong');
      } else if (outcome === 'win') {
        addChatMessage(user, message, 'correct');
      } else if (outcome === 'ok' || outcome === 'lose') {
        addChatMessage(user, message, 'normal');
      }
      renderCurrentRow();
    } else {
      addChatMessage(user, message, 'normal');
    }
  }

  // Add demo mode fake chat if no real streamer
  if (state.streamerId === 'default' && !chatInterval) {
    startDemoChat();
  }
}

// Demo mode chat simulation (feed only, does not play the board)
function startDemoChat() {
  if (chatInterval) return;

  chatInterval = setInterval(() => {
    const randomUser = FAKE_USERS[Math.floor(Math.random() * FAKE_USERS.length)];
    const randomWord = ['CRANE','SLATE','AUDIO','ROAST','PLEAD','STONE'][Math.floor(Math.random() * 6)];
    addChatMessage(randomUser, randomWord, 'normal');
  }, 5000); // Add a fake message every 5 seconds
}

// ── CHAT FEED ──
function addChatMessage(user, message, type = 'normal') {
  const feed = document.getElementById('chat-feed');
  if (!feed) return;

  const msg = document.createElement('div');
  msg.className = 'chat-msg';

  if (type === 'correct') {
    msg.innerHTML = `<span class="chat-user">${escapeHtml(user)}</span> solved <span class="chat-correct">${escapeHtml(message)}</span>`;
  } else if (type === 'wrong') {
    msg.innerHTML = `<span class="chat-user">${escapeHtml(user)}</span> tried <span class="chat-wrong">${escapeHtml(message)}</span>`;
  } else {
    msg.innerHTML = `<span class="chat-user">${escapeHtml(user)}</span>: <span class="chat-guess">${escapeHtml(message)}</span>`;
  }

  feed.appendChild(msg);
  feed.scrollTop = feed.scrollHeight;
}

// ── EVENT LISTENERS ──
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('theme-btn')
    .addEventListener('click', toggleTheme);

  document.getElementById('new-game-btn')
    .addEventListener('click', () => newGame(true));
});

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  handleKey(e.key);
});

// ── INIT ──
loadWordList();
state.gameMode = getGameMode();
applyTheme(localStorage.getItem(getThemeStorageKey()) || 'dark');

// Detect overlay mode and add body class
if (window.location.pathname.startsWith('/overlay')) {
  document.body.classList.add('overlay-mode');
}

buildKeyboard();
newGame(false);

if (state.gameMode === 'online') {
  registerPlayer();
}

// Connect to chat WebSocket for chat integration
connectChatWebSocket();

// Cleanup on page unload
window.addEventListener('beforeunload', () => {
  unregisterPlayer();
  if (chatInterval) {
    clearInterval(chatInterval);
    chatInterval = null;
  }
  if (chatWS) {
    chatWS.close();
    chatWS = null;
  }
});

// Storage sync
window.addEventListener('storage', (event) => {
  if (event.key === getThemeStorageKey()) applyTheme(event.newValue || 'dark');
});

// ── CHECK FOR OAUTH REDIRECT RESULT ──
(function() {
  try {
    const loginData = localStorage.getItem('hangstream-viewer-login');
    if (loginData) {
      const data = JSON.parse(loginData);
      if (data && data.id && data.name) {
        state.viewerId = data.id;
        state.viewerName = data.name;
        try {
          localStorage.setItem('hangstream-viewer-profile', JSON.stringify({ id: data.id, name: data.name, provider: data.provider || 'google' }));
        } catch (e) {}
        renderViewerProfile();
      }
      localStorage.removeItem('hangstream-viewer-login');
    }
  } catch (e) {
    console.error('Error checking OAuth redirect result:', e);
  }
})();

// ── VIEWER GOOGLE LOGIN ──
function renderViewerProfile() {
  const loginBtn = document.getElementById('viewer-login-btn');
  const profileDropdown = document.getElementById('profile-dropdown');
  const profileAvatar = document.getElementById('profile-avatar');
  const profileName = document.getElementById('profile-name');
  
  if (state.viewerName) {
    if (loginBtn) loginBtn.style.display = 'none';
    if (profileDropdown) profileDropdown.style.display = 'block';
    if (profileAvatar) {
      profileAvatar.textContent = state.viewerName.charAt(0).toUpperCase();
    }
    if (profileName) {
      profileName.textContent = state.viewerName;
    }
    checkDonorStatus();
  } else {
    if (loginBtn) loginBtn.style.display = 'block';
    if (profileDropdown) profileDropdown.style.display = 'none';
  }
}

function checkDonorStatus() {
  fetch('/viewer/is-donor')
    .then(res => res.json())
    .then(data => {
      const avatar = document.getElementById('profile-avatar');
      const hintBtn = document.getElementById('hint-btn');
      if (data.isDonor && avatar) {
        avatar.classList.add('donor');
      } else if (avatar) {
        avatar.classList.remove('donor');
      }
      // Show hint button for donors
      if (data.isDonor && hintBtn) {
        hintBtn.style.display = 'block';
      } else if (hintBtn) {
        hintBtn.style.display = 'none';
      }
    })
    .catch(e => {
      console.error('Error checking donor status:', e);
    });
}

function requestHint() {
  if (!gameWs || gameWs.readyState !== WebSocket.OPEN) {
    alert('Not connected to game server');
    return;
  }

  gameWs.send(JSON.stringify({
    type: 'hint',
    game: 'wordle'
  }));
}

function toggleProfileMenu() {
  const menu = document.getElementById('profile-menu');
  if (menu) {
    menu.classList.toggle('show');
  }
}

function closeProfileMenu() {
  const menu = document.getElementById('profile-menu');
  if (menu) {
    menu.classList.remove('show');
  }
}

function signOut() {
  state.viewerId = '';
  state.viewerName = '';
  state.viewerAvatar = '';
  try {
    localStorage.removeItem('hangstream-viewer-profile');
  } catch (e) {}
  renderViewerProfile();
  closeProfileMenu();
}

function goToProfile() {
  window.location.href = '/profile';
}

function goToLeaderboard() {
  window.location.href = '/leaderboard';
}

document.addEventListener('click', (e) => {
  const dropdown = document.getElementById('profile-dropdown');
  const menu = document.getElementById('profile-menu');
  if (dropdown && menu && !dropdown.contains(e.target)) {
    menu.classList.remove('show');
  }
});

function startGoogleAuth() {
  try {
    const w = window.open('/auth/google', 'hs_google_oauth', 'width=600,height=700');
    if (!w) {
      window.location.href = '/auth/google';
    } else {
      w.focus();
    }
  } catch (e) {
    console.error('Failed to open Google auth popup', e);
  }
}

const vLoginBtn = document.getElementById('viewer-login-btn');
if (vLoginBtn) {
  vLoginBtn.addEventListener('click', startGoogleAuth);
}

// Load saved viewer profile on page load
(function() {
  try {
    const saved = JSON.parse(localStorage.getItem('hangstream-viewer-profile') || '{}');
    if (saved && saved.name) {
      state.viewerId = saved.id || '';
      state.viewerName = saved.name || '';
      renderViewerProfile();
    }
  } catch (e) {}
})();

window.addEventListener('message', (ev) => {
  if (!ev || ev.origin !== location.origin) return;
  const data = ev.data || {};
  if (data && data.type === 'viewer-login') {
    const id = data.id || '';
    const name = data.name || '';
    if (id && name) {
      state.viewerId = id;
      state.viewerName = name;
      try {
        localStorage.setItem('hangstream-viewer-profile', JSON.stringify({ id, name, provider: data.provider || 'google' }));
      } catch (e) {}
      renderViewerProfile();
    }
  }
});
